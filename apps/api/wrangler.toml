name = "opencpa-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# Keep variables set in the Cloudflare dashboard (GITHUB_CLIENT_ID; see docs/accounts.md) when
# CI deploys. Without this, every deploy deletes any plain-text variable not listed under [vars].
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "opencpa"
database_id = "f6914d72-bf2d-41ee-9ada-2f3c0f7ef2c8"
migrations_dir = "migrations"

[vars]
# Comma-separated list of origins allowed to call the API.
ALLOWED_ORIGINS = "https://opencpa.pages.dev,https://*.opencpa.pages.dev,http://localhost:5173"
