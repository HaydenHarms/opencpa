id: bar-cvp-what-if-0001
type: mcq
blueprint:
  section: BAR
  area: Area I — Business Analysis
  topic: Budgeting, forecasting and projection
  skill: Analysis
review:
  status: reviewed
  references:
  - 'Cost-volume-profit analysis: sensitivity and what-if analysis'
  notes: BAR batch 01. Answers solved and every number and distractor computed in code (the goodwill and
    nonexchange revenue items moved from FAR batch 01).
stem: 'Carver Co. sells 30,000 units a year of one product at $50 per unit. Variable costs are $30 per
  unit and fixed costs are $400,000 a year. Management is choosing between two proposals. Proposal 1:
  raise the price to $54, which its market study says would cut unit sales by 10%. Proposal 2: keep the
  price at $50 and spend $60,000 a year more on advertising, which the study says would raise unit sales
  by 15%. Unit variable costs would not change under either proposal. Which proposal gives the higher
  operating income, and by how much?'
choices:
- id: A
  text: Proposal 1, by $18,000
  rationale: 'Correct. Proposal 1: 27,000 × $24 − $400,000 = $248,000. Proposal 2: 34,500 × $20 − $460,000
    = $230,000.'
- id: B
  text: Proposal 2, by $42,000
  rationale: Leaves out Proposal 2's $60,000 of extra advertising, a fixed cost the proposal adds.
- id: C
  text: Proposal 1, by $90,000
  rationale: Raises the price in Proposal 1 but ignores the expected 10% fall in unit sales ($320,000).
- id: D
  text: Proposal 2, by $90,000
  rationale: Applies Proposal 1's volume decline but keeps its old $20 margin ($140,000). The higher price
    raises the margin to $24.
answer: A
explanation: 'Proposal 1: units 30,000 × 90% = 27,000; contribution margin $54 − $30 = $24; operating
  income 27,000 × $24 − $400,000 = $248,000. Proposal 2: units 30,000 × 115% = 34,500; margin $20; fixed
  costs $460,000; operating income 34,500 × $20 − $460,000 = $230,000. Proposal 1 is higher by $18,000
  (current income is $200,000, so both improve it).'
