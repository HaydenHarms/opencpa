id: bar-budgetary-accounting-0001
type: mcq
blueprint:
  section: BAR
  area: Area III — State and Local Governments
  topic: Budgetary accounting
  skill: Application
review:
  status: reviewed
  references:
  - GASB Codification 1700 (budgetary accounting; encumbrances)
  - GASB Statement No. 54 (encumbrances within fund balance)
  notes: BAR batch 01. Answers solved and every number and distractor computed in code (the goodwill and
    nonexchange revenue items moved from FAR batch 01).
stem: A city's general fund, which records encumbrances, issues a purchase order for $40,000 of supplies.
  Which entry does it record when the order is issued?
choices:
- id: A
  text: Debit expenditures; credit vouchers payable, $40,000, and close the related appropriation
  rationale: The expenditure and liability are recorded when the supplies are received, not when the order
    is placed.
- id: B
  text: Debit encumbrances; credit budgetary fund balance — encumbrances, $40,000
  rationale: Correct. An encumbrance entry commits the appropriation when the order is issued.
- id: C
  text: Debit budgetary fund balance — encumbrances; credit encumbrances, $40,000
  rationale: Reverses an encumbrance. That entry is made when the supplies arrive or the order is cancelled,
    not when it is placed.
- id: D
  text: Debit supplies inventory; credit accounts payable, $40,000, at the purchase order price
  rationale: A full-accrual entry on receipt of goods; the order alone creates no asset or liability.
answer: B
explanation: When a purchase order is issued, a government using encumbrance accounting records Dr Encumbrances,
  Cr Budgetary fund balance — encumbrances, to track the commitment against the appropriation. When the
  goods arrive, it reverses the encumbrance and records the expenditure and liability at the actual amount.
