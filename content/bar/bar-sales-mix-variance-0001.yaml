id: bar-sales-mix-variance-0001
type: mcq
blueprint:
  section: BAR
  area: Area I — Business Analysis
  topic: Managerial and cost accounting
  skill: Analysis
review:
  status: reviewed
  references:
  - 'Sales variances: sales mix and sales quantity variances'
  notes: BAR batch 01. Answers solved and every number and distractor computed in code (the goodwill and
    nonexchange revenue items moved from FAR batch 01).
stem: Jory Co. budgeted sales of 6,000 units of Product A with a contribution margin of $10 per unit and
  4,000 units of Product B with a contribution margin of $20 per unit. It actually sold 8,400 units of
  A and 3,600 units of B, and actual contribution margins per unit equaled the budget. What is Jory's
  sales mix variance?
choices:
- id: A
  text: $12,000 favorable
  rationale: Gets the amount right but the direction wrong. The mix shifted toward A, the lower-margin
    product, which reduces contribution margin.
- id: B
  text: $12,000 unfavorable
  rationale: 'Correct. At actual total volume of 12,000 units, A''s share rose from 60% to 70% and B''s
    fell from 40% to 30%: 1,200 × $10 − 1,200 × $20.'
- id: C
  text: $16,000 favorable
  rationale: Computes the total sales volume variance (quantity $28,000 favorable less mix $12,000 unfavorable),
    not the mix variance alone.
- id: D
  text: $28,000 favorable
  rationale: 'Computes the sales quantity variance: 2,000 more units at the budgeted average margin of
    $14.'
answer: B
explanation: 'Budgeted mix: A 60%, B 40%; budgeted average contribution margin = $140,000 ÷ 10,000 = $14.
  Mix variance = actual total units × (actual mix − budgeted mix) × budgeted margin: A 12,000 × 10% ×
  $10 = $12,000 F; B 12,000 × (−10%) × $20 = $24,000 U; net $12,000 unfavorable. The quantity variance
  is (12,000 − 10,000) × $14 = $28,000 favorable.'
