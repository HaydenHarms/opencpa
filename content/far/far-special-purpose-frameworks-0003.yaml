id: far-special-purpose-frameworks-0003
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Special Purpose Frameworks
  skill: Application
review:
  status: reviewed
  references:
  - AICPA special purpose frameworks (modified cash basis)
  - AU-C 800 (financial statements prepared under special purpose frameworks)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Dover Surveying prepares its financial statements on a modified cash basis: it capitalizes purchases
  of equipment and depreciates them, and it otherwise records revenues when cash is received and expenses
  when cash is paid. In Year 3 it collected $500,000 from clients and paid $320,000 of operating expenses.
  It also paid $60,000 for new equipment in January; depreciation on the equipment for Year 3 is $15,000.
  At year-end, employees had earned $12,000 of wages that Dover will pay in January, Year 4, and client
  receivables had increased by $30,000 during the year. What excess of revenues over expenses should Dover
  report in its Year 3 statement of revenues and expenses—modified cash basis?'
choices:
- id: A
  text: $120,000
  rationale: Expenses the $60,000 of equipment when paid. Dover's modified cash basis capitalizes equipment
    and depreciates it.
- id: B
  text: $165,000
  rationale: Correct. $500,000 − $320,000 − $15,000 depreciation.
- id: C
  text: $180,000
  rationale: Capitalizes the equipment but records no depreciation. The basis depreciates capitalized
    equipment.
- id: D
  text: $183,000
  rationale: Converts to the accrual basis by adding the $30,000 increase in receivables and accruing
    the $12,000 of wages. This basis doesn't record receivables or accrued expenses.
answer: B
explanation: Under Dover's modified cash basis, revenues are the $500,000 collected and expenses are the
  $320,000 paid, plus depreciation on the capitalized equipment ($15,000). The equipment purchase itself
  isn't an expense, and the unpaid wages and the increase in receivables aren't recorded. $500,000 − $320,000
  − $15,000 = $165,000.
