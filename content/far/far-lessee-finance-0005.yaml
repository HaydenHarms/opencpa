id: far-lessee-finance-0005
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: draft
  references:
  - ASC 842-20-25-4 to 25-6 (amortization of the right-of-use asset; purchase option reasonably certain)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Elmsworth Fabrication Co. leases a CNC machining center under a lease it classifies
  as a finance lease. The lease term is 5 years, but the equipment's total useful life is 10 years, and
  the lease grants Elmsworth an option to purchase the equipment at a price so far below its expected
  fair value at that date that Elmsworth is reasonably certain to exercise it. The lease liability at
  commencement is $320,000 (rounded), the annual payment of $78,000 is due each December 31, and the discount
  rate is 6.00%. Elmsworth amortizes the right-of-use asset straight-line. What total lease-related expense
  does Elmsworth recognize in Year 2?
choices:
- id: A
  text: $15,672
  rationale: Includes only interest. A finance lease also amortizes the right-of-use asset.
- id: B
  text: $32,000
  rationale: Includes only amortization. A finance lease also has interest expense.
- id: C
  text: $47,672
  rationale: Correct. Year 2 interest $15,672 on a $261,200 opening liability, plus $32,000 of amortization
    over the equipment's 10-year useful life.
- id: D
  text: $79,672
  rationale: Amortizes the right-of-use asset over the 5-year lease term, $320,000 ÷ 5 = $64,000. Because
    the purchase option is reasonably certain to be exercised, Elmsworth amortizes it over the equipment's
    10-year useful life instead (ASC 842-20-25-4 to 25-6).
answer: C
explanation: 'Because the purchase option is reasonably certain to be exercised, Elmsworth expects to
  own the equipment after the lease, so it amortizes the right-of-use asset over the equipment''s 10-year
  useful life rather than the 5-year lease term (ASC 842-20-25-4 to 25-6): $320,000 ÷ 10 = $32,000. Year
  1: interest $19,200, principal reduction $58,800, ending liability $261,200. Year 2 interest = $261,200
  × 6.00% = $15,672. Total Year 2 expense = $15,672 + $32,000 = $47,672.'
