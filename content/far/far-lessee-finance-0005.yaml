id: far-lessee-finance-0005
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: draft
  references:
  - 'ASC 842-10-30-5(c) (lease payments: purchase option reasonably certain to be exercised)'
  - ASC 842-20-30-5 (right-of-use asset; initial direct costs)
  - ASC 842-20-35-8 (amortization period of the right-of-use asset)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: On January 1, Year 1, Elmsworth Fabrication Co. leases a CNC machining center for 5 years and classifies
  the lease as a finance lease. Payments of $78,000 are due each December 31. The lease lets Elmsworth
  buy the machine at the end of Year 5 for $40,000; Elmsworth expects it to be worth about $150,000 then,
  and the machine, new at commencement, has a useful life of 10 years with no residual value. Elmsworth
  paid $15,000 of initial direct costs at commencement. The rate implicit in the lease isn't readily determinable,
  and Elmsworth's incremental borrowing rate is 6%; present value factors at 6% for 5 periods are 4.2124
  for an ordinary annuity and 0.7473 for a single sum. Elmsworth amortizes right-of-use assets straight-line.
  Rounding each computation to the nearest dollar, what interest expense and what amortization expense
  should Elmsworth recognize on the lease for Year 2?
choices:
- id: A
  text: $16,217 interest; $68,713 amortization
  rationale: Leaves the purchase option out of the lease payments, measuring the liability at $328,567,
    and so amortizes over the 5-year term. With the option priced far below the machine's expected value,
    exercise is reasonably certain, so the $40,000 price is a lease payment (ASC 842-10-30-5(c)) and the
    asset is amortized over its useful life.
- id: B
  text: $18,118 interest; $35,846 amortization
  rationale: Amortizes only the $358,459 lease liability, leaving the $15,000 of initial direct costs
    out of the right-of-use asset (ASC 842-20-30-5).
- id: C
  text: $18,118 interest; $37,346 amortization
  rationale: Correct. Interest $301,967 × 6% = $18,118; amortization ($358,459 + $15,000) ÷ 10 = $37,346.
- id: D
  text: $18,118 interest; $74,692 amortization
  rationale: Amortizes the right-of-use asset over the 5-year lease term, $373,459 ÷ 5. A $40,000 option
    on a machine expected to be worth $150,000 makes exercise reasonably certain, so the asset is amortized
    over the 10-year useful life (ASC 842-20-35-8).
answer: C
explanation: 'An option to buy for $40,000 an asset expected to be worth $150,000 gives Elmsworth a strong
  economic incentive to exercise, so exercise is reasonably certain and the price is a lease payment (ASC
  842-10-30-5(c)). Liability = $78,000 × 4.2124 + $40,000 × 0.7473 = $328,567 + $29,892 = $358,459. Year
  1 interest = $358,459 × 6% = $21,508, so the balance after the first payment is $358,459 + $21,508 −
  $78,000 = $301,967, and Year 2 interest = $301,967 × 6% = $18,118. The right-of-use asset is the liability
  plus initial direct costs, $373,459; because Elmsworth is reasonably certain to buy the machine, it
  is amortized over the 10-year useful life rather than the lease term (ASC 842-20-35-8): $373,459 ÷ 10
  = $37,346.'
