id: far-cash-flows-0011
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 230-10-45 (indirect method; classification)
  - 'ASC 230-10-45-21D (distributions from equity method investees: cumulative earnings approach)'
  - ASC 323-10 (equity method)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Kell Co.''s staff accountant prepared this draft operating section of the Year 2 statement of cash
  flows under the indirect method: net income $520,000; depreciation $88,000; amortization of premium
  on bonds payable $7,000; decrease in prepaid expenses ($12,000); increase in accounts receivable ($46,000);
  increase in accounts payable $21,000; increase in dividends payable $15,000; net cash provided by operating
  activities $593,000. Net income includes $64,000 of equity in the earnings of a 30%-owned investee accounted
  for by the equity method, which paid Kell cash dividends of $24,000 during Year 2; Kell classifies distributions
  from equity method investees using the cumulative earnings approach, and its cumulative distributions
  received have not exceeded its cumulative equity in earnings. After correcting the draft to comply with
  U.S. GAAP, what is Kell''s net cash provided by operating activities?'
choices:
- id: A
  text: $524,000
  rationale: Subtracts the whole $64,000 of equity in earnings. The $24,000 of dividends received is an
    operating inflow, so only the $40,000 of undistributed earnings is deducted.
- id: B
  text: $548,000
  rationale: Correct. $593,000 − 2 × $7,000 + 2 × $12,000 − $15,000 − $40,000.
- id: C
  text: $555,000
  rationale: Removes the $7,000 of premium amortization but doesn't subtract it. Amortizing a premium
    makes interest expense smaller than the interest paid, so it is deducted from net income.
- id: D
  text: $588,000
  rationale: Makes no adjustment for the equity method income. The $40,000 of earnings not received in
    cash is deducted from net income.
answer: B
explanation: 'Premium amortization reduces interest expense below the cash paid, so it is subtracted,
  not added: − 2 × $7,000. A decrease in prepaid expenses is added, not subtracted: + 2 × $12,000. Dividends
  payable relates to a financing activity: − $15,000. Equity in earnings is noncash except for the dividends
  received, which are a return on the investment (operating) under the cumulative earnings approach: −
  ($64,000 − $24,000) = − $40,000. $593,000 − $14,000 + $24,000 − $15,000 − $40,000 = $548,000.'
