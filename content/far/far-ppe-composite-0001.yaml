  notes: Batch 01. Adapted from legacy bank; answer re-solved, arithmetic checked in code, distractors
    rebuilt where needed.
stem: Montrose Industries depreciates its equipment using the composite method. During the year it retires
  equipment with an original cost of $180,000 and receives no proceeds. Which entry records the retirement?
choices:
- id: A
  text: Dr Loss on disposal $180,000; Cr Equipment $180,000
  rationale: Treats the asset as fully undepreciated and recognizes a loss, which the composite method
    does not do.
- id: B
  text: Dr Depreciation expense $180,000; Cr Equipment $180,000
  rationale: Expenses the cost directly instead of charging accumulated depreciation.
- id: C
  text: Dr Accumulated depreciation $180,000; Cr Equipment $180,000
  rationale: Correct. Under the composite method, no gain or loss is recognized on retirement; the difference
    goes to accumulated depreciation.
- id: D
  text: Dr Accumulated depreciation $162,000; Dr Loss $18,000; Cr Equipment $180,000
  rationale: Tracks depreciation for an individual asset, which the composite method does not do.
answer: C
explanation: Composite depreciation treats a group as one asset. On retirement, credit the asset for its
  cost and debit accumulated depreciation for cost minus any proceeds. No gain or loss is recognized.
