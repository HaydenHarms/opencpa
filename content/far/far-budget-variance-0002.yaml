id: far-budget-variance-0002
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Financial Statement Ratios and Performance Metrics
  skill: Application
review:
  status: reviewed
  references:
  - 'Budget-versus-actual analysis: static budget, flexible budget and sales-volume variances'
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: Camelford Tools Co.'s static budget for Year 2 was based on selling 40,000 units at $85 each, with
  variable manufacturing costs of $41 a unit, sales commissions of $7 a unit and fixed costs of $880,000.
  Camelford actually sold 36,500 units for total revenue of $3,212,000; its variable manufacturing costs
  were $1,551,250, sales commissions $255,500 and fixed costs $905,000. In its budget-to-actual report,
  what sales-volume variance for operating income should Camelford show?
choices:
- id: A
  text: $99,750 unfavorable
  rationale: Compares actual operating income ($500,250) with the static budget's ($600,000). That is
    the total static-budget variance, which combines the sales-volume variance with the flexible-budget
    variance.
- id: B
  text: $129,500 unfavorable
  rationale: Correct. (36,500 − 40,000) units × $37 budgeted contribution margin.
- id: C
  text: $154,000 unfavorable
  rationale: Uses a margin of $44 a unit, deducting only variable manufacturing costs. The $7 of variable
    selling costs a unit also changes with volume, so the budgeted contribution margin is $37.
- id: D
  text: $297,500 unfavorable
  rationale: Prices the change in units at the $85 selling price. That is the sales-volume variance for
    revenue; for operating income, each unit is worth its budgeted contribution margin of $37.
answer: B
explanation: The sales-volume variance is the difference between the flexible budget for the units actually
  sold and the static budget, which comes down to the change in units times the budgeted contribution
  margin per unit. Budgeted contribution margin = $85 − $41 − $7 = $37, because sales commissions vary
  with units too. Variance = (36,500 − 40,000) × $37 = $129,500 unfavorable. Flexible-budget operating
  income is $470,500 against the static budget's $600,000; actual operating income of $500,250 differs
  from the flexible budget by the flexible-budget variance, $29,750 favorable.
