id: far-consolidated-statements-0010
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Consolidated financial statements
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 810-10-45 (consolidation procedures: intra-entity balances)'
  - ASC 810-10 (noncontrolling interests)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Cracoe Corp. owns 80% of Aysgarth Inc. To prepare Cracoe''s draft December 31, Year 2, consolidated
  balance sheet, the staff added Cracoe''s current liabilities of $1,840,000 and Aysgarth''s of $760,000,
  then eliminated $118,000 for Aysgarth''s trade payable to Cracoe (the balance of Cracoe''s trade receivable
  from Aysgarth) and $90,000 for the dividend Aysgarth declared on December 20, payable January 15, Year
  3, reporting total current liabilities of $2,392,000. Supporting schedules show: Cracoe''s trade receivable
  from Aysgarth includes $26,000 for goods that Cracoe shipped FOB shipping point on December 30 and Aysgarth
  received and recorded on January 4; Aysgarth''s accrued liabilities include $21,000 of December management
  fees owed to Cracoe, which Cracoe has recorded in a separate management fees receivable, not in its
  trade receivable; and Aysgarth has no other balances with Cracoe. After any corrections needed, what
  total current liabilities should the consolidated balance sheet report?'
choices:
- id: A
  text: $2,389,000
  rationale: Leaves the elimination at the $118,000 on Cracoe's books. Aysgarth had recorded only $92,000
    of that payable at year-end, so eliminating $118,000 removed $26,000 of Aysgarth's liabilities to
    outsiders.
- id: B
  text: $2,397,000
  rationale: Eliminates all of Aysgarth's $90,000 dividend payable. Only Cracoe's 80% is owed within the
    group; the $18,000 owed to the noncontrolling shareholders is a liability of the consolidated entity.
- id: C
  text: $2,415,000
  rationale: Correct. $1,840,000 + $760,000 − $92,000 trade payable to Cracoe − $21,000 fees − $72,000
    dividend owed to Cracoe.
- id: D
  text: $2,436,000
  rationale: Leaves the $21,000 of management fees Aysgarth owes Cracoe in current liabilities. Balances
    owed within the group are eliminated.
answer: C
explanation: Only balances owed within the group are eliminated. Aysgarth's books show a trade payable
  to Cracoe of $118,000 − $26,000 in transit = $92,000, so that is the liability to eliminate; the in-transit
  goods are handled on the asset side. The $21,000 of management fees Aysgarth owes Cracoe is also eliminated.
  Of the $90,000 dividend payable, 80% ($72,000) is owed to Cracoe and eliminated, while $18,000 is owed
  to the noncontrolling shareholders and stays a liability. $1,840,000 + $760,000 − $92,000 − $21,000
  − $72,000 = $2,415,000.
