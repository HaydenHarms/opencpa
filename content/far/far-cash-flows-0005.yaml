id: far-cash-flows-0005
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 230-10 (classification of cash receipts and payments; noncash investing and financing activities)
  notes: Batch 03. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Brenner Co.''s staff accountant prepared the investing section of the draft statement of cash flows:
  purchases of equipment $(250,000); proceeds from sales of available-for-sale debt securities $90,000;
  interest and dividends received $12,000; loan made to a supplier $(40,000); principal collected on that
  loan $10,000; purchases of debt securities bought and held principally to sell in the near term $(30,000);
  net cash used in investing activities $(208,000). Supporting documents show that $100,000 of the equipment
  was acquired by signing a note payable to the seller. After correcting the draft to comply with U.S.
  GAAP, what is net cash used in investing activities?'
choices:
- id: A
  text: $90,000
  rationale: Correct. −$150,000 cash paid for equipment + $90,000 AFS proceeds − $40,000 loan + $10,000
    collected.
- id: B
  text: $120,000
  rationale: Keeps the $30,000 of trading-security purchases in investing. Securities bought principally
    to sell in the near term are classified by their nature, as operating cash flows.
- id: C
  text: $190,000
  rationale: Keeps the $100,000 of equipment financed by the seller. Buying an asset with a note is a
    noncash investing and financing activity, disclosed but not in the cash flow totals.
- id: D
  text: $208,000
  rationale: Accepts the draft, which also counts interest and dividends received (operating under U.S.
    GAAP), the note-financed equipment, and the trading securities.
answer: A
explanation: 'Three corrections. (1) Only $150,000 of the equipment was paid in cash; the $100,000 financed
  by a note is a noncash activity disclosed separately. (2) Interest and dividends received are operating
  cash flows under U.S. GAAP. (3) Cash flows from securities acquired specifically for resale (trading)
  are operating. Investing: −$150,000 + $90,000 − $40,000 + $10,000 = −$90,000.'
