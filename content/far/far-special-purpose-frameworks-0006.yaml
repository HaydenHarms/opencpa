  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Lochinver Design Partners, a partnership, prepares its financial statements on a modified cash
  basis: the only departure from the pure cash basis is that it capitalizes the equipment it buys and
  depreciates it. At January 1, Year 2, it had cash of $48,000 and equipment that had cost $196,000, with
  accumulated depreciation of $71,000. During Year 2, it collected $612,000 from clients; paid $438,000
  of operating expenses, including $9,600 paid in December for insurance coverage in Year 3; paid $72,000
  for new equipment in March; borrowed $50,000 from a bank and repaid $12,000 of the principal; and the
  partners withdrew $95,000. Depreciation for Year 2 on all of the equipment is $27,000. At December 31,
  clients owed Lochinver $41,000 for services performed in Year 2, and Lochinver owed employees $8,500
  of wages. What total assets should Lochinver report in its December 31, Year 2, statement of assets,
  liabilities, and equity—modified cash basis?'
choices:
- id: A
  text: $263,000
  rationale: Correct. Cash $48,000 + $612,000 − $438,000 − $72,000 + $50,000 − $12,000 − $95,000 = $93,000;
    equipment $268,000 − $98,000 = $170,000.
- id: B
  text: $272,600
  rationale: Reports the $9,600 paid for Year 3 insurance as a prepaid asset. Prepaid expenses are an
    accrual-basis item outside Lochinver's one modification, so the payment is an expense when paid.
- id: C
  text: $304,000
  rationale: Includes the $41,000 that clients owe. Revenue is recorded when cash is collected, and Lochinver's
    only modification is for equipment, so receivables are not recognized.
- id: D
  text: $335,000
  rationale: Doesn't deduct the $72,000 paid for equipment from cash, so the purchase is counted in both
    cash and equipment. Cash at year-end is $93,000.
answer: A
explanation: On this modified cash basis the assets are cash and equipment, net of depreciation. Cash
  = $48,000 + $612,000 collected − $438,000 operating payments (the Year 3 insurance included) − $72,000
  equipment + $50,000 borrowed − $12,000 repaid − $95,000 withdrawn = $93,000. Equipment = $268,000 cost
  − $98,000 accumulated depreciation = $170,000. Receivables, prepaid insurance and unpaid wages are accrual
  items that Lochinver's one modification doesn't cover. Total assets = $263,000.
