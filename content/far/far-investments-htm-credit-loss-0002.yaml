id: far-investments-htm-credit-loss-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments (Financial assets at amortized cost)
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 326-20 (current expected credit losses: pooled measurement, write-offs, accrued interest elections)'
  - ASC 320-10 (held-to-maturity debt securities)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: Askrigg Corp., a public business entity, holds a portfolio of unsecured corporate bonds classified
  as held to maturity. It measures expected credit losses on the portfolio as a pool, by applying a loss
  rate to amortized cost. Ignore interest in this question. The allowance for credit losses was $46,000
  at January 1, Year 2. In June, the issuer of one bond, with an amortized cost of $60,000, filed for
  bankruptcy; in October it paid $24,000 in final settlement, and Askrigg wrote off the rest. At December
  31, Year 2, the remaining bonds have an amortized cost of $4,800,000 and a fair value $135,000 below
  it, mostly because market interest rates rose. Based on historical losses adjusted for current conditions
  and reasonable and supportable forecasts, Askrigg expects 1.2% of the amortized cost of the remaining
  bonds not to be collected over their lives. What credit loss expense should Askrigg recognize for Year
  2?
choices:
- id: A
  text: $11,600
  rationale: Ignores the $36,000 write-off, which used up part of the beginning allowance. The allowance
    before adjustment was $10,000.
- id: B
  text: $47,600
  rationale: Correct. $57,600 required − ($46,000 − $36,000) remaining.
- id: C
  text: $57,600
  rationale: Records the whole required allowance of $57,600 as expense. Expense is the amount needed
    to bring the existing allowance ($10,000 after the write-off) up to $57,600.
- id: D
  text: $135,000
  rationale: Records the $135,000 by which fair value is below amortized cost. Held-to-maturity securities
    are carried at amortized cost less an allowance for expected credit losses; declines in fair value
    from changes in interest rates aren't credit losses.
answer: B
explanation: 'The allowance at December 31 must equal expected credit losses over the bonds'' lives: 1.2%
  × $4,800,000 = $57,600. The write-off is the part of the defaulted bond not collected: $60,000 − $24,000
  = $36,000, charged against the allowance, which leaves $46,000 − $36,000 = $10,000. Credit loss expense
  = $57,600 − $10,000 = $47,600. The decline in fair value caused by rising interest rates doesn''t affect
  held-to-maturity securities carried at amortized cost.'
