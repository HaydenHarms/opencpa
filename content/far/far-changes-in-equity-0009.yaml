id: far-changes-in-equity-0009
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of changes in equity
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 505-20-25 (a stock dividend of 20-25% or more is accounted for like a split, at par value, not
    fair value)
  - ASC 505-30-30 (gains on treasury stock transactions credited to additional paid-in capital)
  - 'ASC 250-10-45 (correction of an error in previously issued financial statements: restate beginning
    retained earnings)'
  notes: Batch 14. Written from scratch; answers solved and every number and distractor computed in code.
stem: Ashcombe Corp.'s draft Year 2 statement of changes in equity reports ending retained earnings of
  $961,000, built from beginning retained earnings of $900,000 (as previously reported), plus net income
  of $310,000, less cash dividends of $85,000, less a 30% stock dividend recorded at its $180,000 fair
  value (par value $12,000), plus a $16,000 gain on reissuing treasury shares, credited to retained earnings.
  It reports ending additional paid-in capital of $818,000, made up of a beginning balance of $650,000
  plus the $168,000 excess of the stock dividend's fair value over par. During the review, the controller
  finds that $25,000 of Year 1 advertising expense, properly incurred that year, was never recorded in
  any period. What should Ashcombe's corrected ending retained earnings and ending additional paid-in
  capital be?
choices:
- id: A
  text: $920,000; $834,000
  rationale: 'Keeps the stock dividend at its $180,000 fair value, crediting $168,000 to additional paid-in
    capital. A dividend of 30% of the shares outstanding is large enough that ASC 505-20 treats it like
    a stock split effected in dividend form: retained earnings is reduced only by the $12,000 par value
    of the new shares, with no additional paid-in capital.'
- id: B
  text: $936,000; $818,000
  rationale: Keeps the stock dividend at its $180,000 fair value and keeps the $16,000 treasury-stock
    gain in retained earnings, correcting only the advertising-expense error. Both the stock dividend
    and the treasury gain still need correcting, as in the other wrong answers above.
- id: C
  text: $1,088,000; $666,000
  rationale: 'Correct retained earnings: $900,000 − $25,000 + $310,000 − $85,000 − $12,000 = $1,088,000.
    Correct additional paid-in capital: $650,000 + $16,000 = $666,000.'
- id: D
  text: $1,104,000; $650,000
  rationale: Keeps the $16,000 gain on reissuing the treasury shares in retained earnings. Gains on treasury
    stock transactions are credited to additional paid-in capital, not retained earnings.
answer: C
explanation: 'The 30% stock dividend is large enough to be accounted for like a stock split in dividend
  form (ASC 505-20-25): retained earnings is reduced only by the $12,000 par value of the new shares,
  and no additional paid-in capital is recognized, so the draft''s $168,000 addition to additional paid-in
  capital is reversed. The $16,000 gain on reissuing treasury stock belongs in additional paid-in capital,
  not retained earnings. The unrecorded $25,000 of Year 1 advertising expense is a correction of an error,
  reducing beginning retained earnings. Corrected retained earnings = $1,088,000; corrected additional
  paid-in capital = $666,000.'
