id: far-debt-covenant-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Debt (Debt covenant compliance)
  skill: Application
review:
  status: reviewed
  references:
  - 'Debt covenant compliance: leverage ratio as defined in the loan agreement'
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Kilburn Corp.'s loan agreement requires its ratio of funded debt to EBITDA to be no more than 3.00
  at each year-end. The agreement defines funded debt as borrowed money plus finance lease liabilities,
  excluding operating lease liabilities, and defines EBITDA as net income plus interest, income taxes,
  and depreciation and amortization, excluding gains and losses on sales of long-lived assets. For Year
  1, Kilburn reports net income of $1,200,000, which includes a $250,000 gain on the sale of a building;
  interest expense of $400,000; income tax expense of $300,000; and depreciation and amortization of $700,000.
  At December 31, Kilburn has a term loan of $5,500,000, finance lease liabilities of $900,000, operating
  lease liabilities of $1,200,000, and accounts payable of $800,000. What is Kilburn's ratio of funded
  debt to EBITDA for the covenant test, rounded to two decimal places?
choices:
- id: A
  text: '2.34'
  rationale: Leaves out the $900,000 of finance lease liabilities, which the agreement includes in funded
    debt.
- id: B
  text: '2.46'
  rationale: Leaves the $250,000 gain on the building sale in EBITDA. The agreement excludes gains on
    sales of long-lived assets.
- id: C
  text: '2.72'
  rationale: Correct. ($5,500,000 + $900,000) ÷ $2,350,000.
- id: D
  text: '3.23'
  rationale: Includes the $1,200,000 of operating lease liabilities, which the agreement excludes from
    funded debt.
answer: C
explanation: EBITDA as defined = $1,200,000 + $400,000 + $300,000 + $700,000 − $250,000 gain on the building
  = $2,350,000. Funded debt = term loan $5,500,000 + finance lease liabilities $900,000 = $6,400,000;
  operating lease liabilities and accounts payable are excluded. Ratio = $6,400,000 ÷ $2,350,000 = 2.72.
