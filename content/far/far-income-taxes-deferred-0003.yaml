id: far-income-taxes-deferred-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: reviewed
  references:
  - ASC 740-10-25 (temporary differences; permanent differences such as tax-exempt interest)
  - ASC 740-10-30 (measurement at the enacted rate)
  - ASC 740-10-45 (deferred taxes presented as one net noncurrent amount per jurisdiction)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
  asOf: U.S. GAAP (ASC 740) and federal tax law in effect for 2026; the rate is as stated in the stem
stem: Constantine Corp. is measuring its deferred taxes at December 31, Year 2. Its equipment has a carrying
  amount of $1,840,000 and a tax basis of $1,236,000. Its warranty liability was $58,000 at January 1,
  Year 2; during Year 2 it recognized warranty expense of $94,000 and paid claims of $71,000, and warranty
  costs are deductible for tax when paid. It holds equity securities, measured at fair value through net
  income, that cost $210,000 and have a fair value of $286,000; gains are taxable when the securities
  are sold. Year 2 income also includes $40,000 of interest on municipal bonds, which is exempt from tax.
  The enacted tax rate is 25% for all years, Constantine expects ample future taxable income, and it combines
  its deferred tax accounts into a single net amount. What net deferred tax liability should Constantine
  report at December 31, Year 2?
choices:
- id: A
  text: $130,750
  rationale: Leaves out the $76,000 unrealized gain on the equity securities. The gain is in book income
    now and taxable when the shares are sold, so it is a taxable temporary difference.
- id: B
  text: $146,500
  rationale: Measures the deductible difference by the Year 2 warranty expense of $94,000. The deferred
    tax asset comes from the warranty liability at year-end, $58,000 + $94,000 − $71,000 = $81,000, which
    has a tax basis of zero.
- id: C
  text: $149,750
  rationale: Correct. ($604,000 + $76,000 − $81,000) × 25%.
- id: D
  text: $170,000
  rationale: Reports the deferred tax liabilities without netting the $20,250 deferred tax asset on the
    warranty liability. Constantine presents deferred taxes as one net amount.
answer: C
explanation: 'Taxable temporary differences: equipment $1,840,000 − $1,236,000 = $604,000, and the unrealized
  gain on the securities, $286,000 − $210,000 = $76,000. Deductible temporary difference: the warranty
  liability at year-end, $58,000 + $94,000 − $71,000 = $81,000, whose tax basis is zero. The municipal
  interest is a permanent difference. Net deferred tax liability = ($604,000 + $76,000 − $81,000) × 25%
  = $149,750; no valuation allowance is needed because Constantine expects ample taxable income.'
