id: far-payables-reconciliation-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Payables and accrued liabilities
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 405-10 (liabilities)
  - ASC 440-10 (purchase commitments are not liabilities until performance)
  - Subsidiary ledger and control account reconciliation practice (voided checks; trade discounts; misposted
    payments)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Okehampton Builders Supply Co.''s accounts payable subledger totals $723,420, and
  its general ledger accounts payable control account shows $718,880. The controller''s review finds:
  a $38,500 purchase order issued on December 28, for goods the supplier will ship FOB shipping point
  in mid-January, was entered as an invoice in both records; a $12,640 check to a supplier, recorded as
  a payment in both records on December 27, was voided on December 30 because it was made out for the
  wrong amount, and the void was posted to the supplier''s subledger account but not to the general ledger;
  an invoice for goods received on December 20 was posted to the supplier''s subledger account at its
  net amount of $45,900, after a 15% trade discount, but to the general ledger at its list price of $54,000;
  and a $6,275 payment to Lydford Timber was posted to Tavistock Fixings''s subledger account. What amount
  should Okehampton report as accounts payable at December 31?'
choices:
- id: A
  text: $672,280
  rationale: Leaves the $12,640 voided check as a payment. The check was cancelled, so the supplier is
    still owed; the void reinstates the payable.
- id: B
  text: $684,920
  rationale: Correct. Subledger $723,420 − $38,500; control account $718,880 − $38,500 + $12,640 − $8,100.
- id: C
  text: $693,020
  rationale: Uses the $54,000 list price. A trade discount reduces the invoice price itself; the amount
    owed is $45,900.
- id: D
  text: $723,420
  rationale: Keeps the $38,500 purchase order. Okehampton owes nothing until the supplier ships the goods
    (FOB shipping point), so an order is a commitment, not a liability.
answer: B
explanation: 'The purchase order is in both records but isn''t a liability until the goods ship: − $38,500
  from both. The voided check means the supplier is still owed; the subledger has reinstated the payable,
  the control account must too (+ $12,640). A trade discount is a reduction of price, so the invoice is
  owed at $45,900; the control account is overstated by $8,100. The misposted payment moves an amount
  between two supplier accounts. Subledger: $723,420 − $38,500 = $684,920. Control account: $718,880 −
  $38,500 + $12,640 − $8,100 = $684,920.'
