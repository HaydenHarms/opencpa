id: far-notes-0003
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Notes to financial statements
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 855-10 (stock splits after the balance sheet date)
  - ASC 260-10 (retroactive adjustment of EPS)
  - ASC 740-10 (income tax disclosures)
  - ASC 842-20 (lease maturity disclosures)
  notes: Batch 05. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Galton Co.''s draft Year 1 income statement reports net income of $600,000 and basic earnings per
  share of $3.00 on 200,000 weighted-average shares, the number Galton had outstanding throughout Year
  1 before any split; the statements will be issued on March 10, Year 2. The draft balance sheet reports
  property and equipment, net, of $1,500,000 and operating lease liabilities of $180,000. You compare
  four draft note excerpts with the statements. Income taxes: income tax expense of $159,600 on pretax
  income of $759,600, an effective rate of 21.0%. Property and equipment: cost of $2,400,000 less accumulated
  depreciation of $900,000. Leases: undiscounted lease payments of $195,000, less imputed interest of
  $15,000. Subsequent events: on February 1, Year 2, Galton effected a 2-for-1 stock split, and all share
  and per-share amounts have been adjusted for it. Which note reveals that the draft financial statements
  must be corrected?'
choices:
- id: A
  text: The income tax note
  rationale: Consistent. $759,600 − $159,600 = $600,000 of net income, and $159,600 ÷ $759,600 is 21.0%.
- id: B
  text: The subsequent events note
  rationale: Correct. A split before issuance is applied retroactively, so EPS should be $1.50 on 400,000
    shares, not $3.00 on 200,000.
- id: C
  text: The property and equipment note
  rationale: Consistent. $2,400,000 − $900,000 = $1,500,000.
- id: D
  text: The lease note
  rationale: Consistent. $195,000 − $15,000 = $180,000, the liability on the balance sheet.
answer: B
explanation: A stock split after the balance sheet date but before the statements are issued is reflected
  retroactively in EPS and share data. The note says the per-share amounts were adjusted, but the draft
  still shows $3.00 on 200,000 shares; restated EPS is $600,000 ÷ 400,000 = $1.50. The other three notes
  agree with the statements.
