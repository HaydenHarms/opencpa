id: far-ppe-replacement-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Application
review:
  status: reviewed
  references:
  - ASC 360-10-30-1
  - ASC 360-10-40
  notes: Batch 01. Adapted from legacy bank; answer re-solved, arithmetic checked in code, distractors
    rebuilt where needed.
stem: Bellview Corp. replaces its warehouse roof. The old roof, recorded as a separate component, cost
  $95,000 and has accumulated depreciation of $75,000. The new roof costs $180,000 and extends the building's
  useful life. How should Bellview account for the replacement?
choices:
- id: A
  text: Expense $180,000 as repairs and maintenance.
  rationale: Ordinary repairs maintain an asset; a replacement that extends useful life is capitalized.
- id: B
  text: Capitalize $180,000, remove the old roof's $20,000 carrying amount, and recognize a $20,000 loss.
  rationale: Correct. The replaced component is derecognized, and the new component is capitalized.
- id: C
  text: Capitalize $180,000 and leave the old roof on the books.
  rationale: Would double-count the roof. The replaced component's cost and accumulated depreciation must
    be removed.
- id: D
  text: Capitalize $180,000 and reduce accumulated depreciation by $20,000.
  rationale: Removes neither the old cost nor its full accumulated depreciation, so the asset records
    stay wrong.
answer: B
explanation: When the replaced part's cost and depreciation are known, remove them ($95,000 cost and $75,000
  accumulated depreciation), recognize a $20,000 loss on the carrying amount written off, and capitalize
  the new roof at $180,000.
