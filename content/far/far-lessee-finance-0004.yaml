id: far-lessee-finance-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: draft
  references:
  - ASC 842-10-15-30 to 15-35 (lease payments; residual value guarantees)
  - ASC 842-20-30 (initial measurement of the right-of-use asset)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Tredinnick Fabrication Co. leases a forging press, which has no alternative
  use to the lessor at the end of the term, for 5 years and classifies the lease as a finance lease. Payments
  of $60,000 are due each December 31. An insurance company unrelated to Tredinnick — not Tredinnick itself
  and not a party related to Tredinnick — has separately guaranteed the lessor a residual value of $30,000
  for the equipment at lease end. Tredinnick paid $9,000 at commencement, an incremental cost of obtaining
  the lease. The rate implicit in the lease isn't readily determinable, and Tredinnick's incremental borrowing
  rate is 7%. What amount should Tredinnick initially recognize as its right-of-use asset?
choices:
- id: A
  text: $246,012
  rationale: Leaves out the $9,000 of initial direct costs, which Tredinnick adds to the right-of-use
    asset.
- id: B
  text: $255,012
  rationale: Correct. $60,000 × 4.1002 = $246,012, + $9,000 of initial direct costs.
- id: C
  text: $272,232
  rationale: Discounts the payments as an annuity due. Payments are due at the end of each year, so the
    ordinary annuity factor applies.
- id: D
  text: $276,402
  rationale: Adds $30,000 × 0.7130 = $21,390 for the insurer's residual value guarantee. A residual value
    guarantee by a party unrelated to Tredinnick isn't a lease payment, no matter how likely it is to
    be paid (ASC 842-10-15-30 to 15-35); only a guarantee by the lessee or a party related to the lessee
    is included.
answer: B
explanation: 'Lease payments include an amount probable of being owed under a residual value guarantee
  only when the lessee or a party related to the lessee made the guarantee; a guarantee by an unrelated
  third party, such as the insurer here, isn''t a lease payment at all (ASC 842-10-15-30 to 15-35), whatever
  its amount or probability. The lease liability is the present value of the payments: $60,000 × 4.1002
  = $246,012. The right-of-use asset adds the $9,000 of initial direct costs Tredinnick paid: $246,012
  + $9,000 = $255,012.'
