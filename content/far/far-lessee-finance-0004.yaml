id: far-lessee-finance-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: draft
  references:
  - 'ASC 842-10-30-5(f) (lease payments: residual value guarantees owed by the lessee)'
  - ASC 842-20-30-5 (initial measurement of the right-of-use asset; initial direct costs)
  - 'ASC 842-10-30-9 to 30-10 (initial direct costs: incremental costs only)'
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: On January 1, Year 1, Tredinnick Fabrication Co. leases a forging press for 5 years and classifies
  the lease as a finance lease. Payments of $60,000 are due each December 31. The lessor separately bought
  residual value insurance from Harbor Mutual, which guarantees the lessor $30,000 for the equipment at
  lease end. Tredinnick paid a $9,000 commission, payable on signing, to the broker who found the press,
  and $6,500 of legal fees for negotiating the lease terms. The rate implicit in the lease isn't readily
  determinable, and Tredinnick's incremental borrowing rate is 7%; present value factors at 7% for 5 periods
  are 4.1002 for an ordinary annuity, 4.3872 for an annuity due and 0.7130 for a single sum. What amount
  should Tredinnick initially recognize as its right-of-use asset?
choices:
- id: A
  text: $255,012
  rationale: Correct. $60,000 × 4.1002 = $246,012, + $9,000 of initial direct costs.
- id: B
  text: $261,512
  rationale: Also adds the $6,500 of legal fees for negotiating the lease. Tredinnick would have owed
    those fees whether or not the lease was signed, so they aren't initial direct costs (ASC 842-10-30-9
    to 30-10); they are expensed.
- id: C
  text: $272,232
  rationale: Discounts the payments as an annuity due ($60,000 × 4.3872 = $263,232) and adds the $9,000
    commission. Payments are due at the end of each year, so the ordinary annuity factor applies.
- id: D
  text: $276,402
  rationale: Adds $30,000 × 0.7130 = $21,390 for Harbor Mutual's residual value guarantee. Lease payments
    include only amounts probable of being owed by the lessee under a residual value guarantee (ASC 842-10-30-5(f));
    Tredinnick owes nothing under insurance the lessor bought from an unrelated insurer.
answer: A
explanation: 'Lease payments include amounts probable of being owed by the lessee under a residual value
  guarantee (ASC 842-10-30-5(f)). The guarantee here is insurance the lessor bought from Harbor Mutual;
  Tredinnick isn''t a party to it and owes nothing under it, so it isn''t a lease payment, whatever its
  amount. The lease liability is the present value of the payments, due at year-end: $60,000 × 4.1002
  = $246,012. The right-of-use asset adds the $9,000 commission, an initial direct cost because it is
  owed only because the lease was signed (ASC 842-20-30-5; ASC 842-10-30-9). The legal fees for negotiating
  the terms would have been incurred even if the lease hadn''t been signed, so they are expensed. Right-of-use
  asset = $246,012 + $9,000 = $255,012.'
