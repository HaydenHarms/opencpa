id: far-accounting-errors-0010
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: draft
  references:
  - ASC 250-10-45-23 (correction of an error in the period discovered)
  - ASC 606-10-55 (estimated sales returns)
  - ASC 350-40-25 (capitalized costs of internal-use software)
  - ASC 350-40-35 (amortization of capitalized software costs)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Before issuing its Year 2 financial statements, Westerham Devices Co.'s controller finds two errors
  made during Year 2. First, Westerham recorded $85,000 of customer sales in December without estimating
  the returns customers were expected to make under its standard return policy; no allowance for returns
  was recorded. Second, on September 1, Year 2, Westerham placed into service new internal-use software
  that cost $270,000 to develop, which it recorded entirely as Year 2 expense; Westerham amortizes capitalized
  software costs straight-line over 3 years, beginning when the software is placed in service. Westerham's
  draft Year 2 net income, before correcting these errors, is $2,400,000, and its weighted-average common
  shares outstanding for the year are 600,000. Ignore income taxes. What corrected basic earnings per
  share should Westerham report for Year 2?
choices:
- id: A
  text: $3.86
  rationale: Corrects only the sales returns, leaving the $270,000 software cost fully expensed instead
    of capitalized and amortized.
- id: B
  text: $4.16
  rationale: Correct. Corrected net income ($2,400,000 − $85,000 + $180,000) ÷ 600,000 shares.
- id: C
  text: $4.30
  rationale: Corrects only the capitalized software cost, leaving the $85,000 of unrecorded sales returns
    in revenue.
- id: D
  text: $4.31
  rationale: Capitalizes the full $270,000 software cost with no amortization in Year 2, even though the
    software was placed in service on September 1, Year 2, and Westerham amortizes capitalized software
    straight-line over 3 years.
answer: B
explanation: 'The unrecorded sales returns overstated revenue and net income by $85,000; correcting it
  reduces net income by that amount. The software cost meets the criteria for capitalization and should
  be amortized over 3 years from September 1, Year 2: only $90,000 of Year 2 amortization belongs in expense,
  so $180,000 of the $270,000 expensed is added back. Corrected net income = $2,400,000 − $85,000 + $180,000
  = $2,495,000. Basic EPS = $2,495,000 ÷ 600,000 shares = $4.16.'
