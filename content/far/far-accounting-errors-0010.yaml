id: far-accounting-errors-0010
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: draft
  references:
  - ASC 606-10-55-22 to 55-29 (sales with a right of return)
  - ASC 360-10-30-1 (cost of property includes costs to bring it to its intended use)
  - ASC 606-10-45-2 (contract liabilities)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Westerham Devices Co.'s draft Year 2 income statement reports net income of $640,000. Before the
  statements are issued, the controller reviews three entries in the supporting records. In December,
  Westerham sold goods for $180,000 under a policy that lets customers return them within 60 days for
  a full refund; from experience, Westerham expects 10% of those goods to come back in resalable condition,
  and the goods cost 60% of their selling price. The entry recorded the full $180,000 as revenue and the
  cost of all of the goods as cost of goods sold. On September 1, Year 2, Westerham placed in service
  a packaging machine recorded at its $270,000 purchase price; the $9,000 paid to ship it and the $51,000
  paid to install it were charged to repairs and maintenance expense. Westerham depreciates equipment
  straight-line over 5 years with no salvage value, starting in the month an asset is placed in service,
  and the draft includes that depreciation on the $270,000. On December 20, a customer paid a $25,000
  deposit on goods to be delivered in January, Year 3, and Westerham recorded it as a liability. Ignore
  income taxes. What net income should Westerham report for Year 2?
choices:
- id: A
  text: $678,000
  rationale: Reverses the $18,000 of revenue on goods expected to be returned but not the $10,800 cost
    of those goods. The goods come back to inventory, so a return asset reduces cost of goods sold, and
    income falls only by the $7,200 margin.
- id: B
  text: $680,800
  rationale: Depreciates the $60,000 of freight and installation for a full year. The machine was placed
    in service on September 1, so Year 2 bears 4 months of depreciation ($4,000).
- id: C
  text: $688,800
  rationale: Correct. $640,000 − $7,200 return margin + $60,000 capitalized − $4,000 depreciation.
- id: D
  text: $713,800
  rationale: Also moves the $25,000 December deposit into revenue. The goods won't be delivered until
    January, Year 3, so the deposit is correctly a liability.
answer: C
explanation: 'Sales with a right of return are recognized only for the goods not expected to be returned,
  with a refund liability for the rest and an asset for the right to recover the returned goods, which
  reduces cost of goods sold (ASC 606-10-55-22 to 55-29): revenue falls by 10% × $180,000 = $18,000, cost
  of goods sold by 60% × $18,000 = $10,800, and income by $7,200. Freight and installation are costs of
  bringing the machine to its working condition and location and are capitalized (ASC 360-10-30-1): $9,000
  + $51,000 = $60,000 comes out of expense, and depreciation from September 1 adds $60,000 ÷ 5 × 4/12
  = $4,000. The deposit on goods not yet delivered is a contract liability, as recorded (ASC 606-10-45-2).
  Corrected net income = $640,000 − $7,200 + $60,000 − $4,000 = $688,800.'
