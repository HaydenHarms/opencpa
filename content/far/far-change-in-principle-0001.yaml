id: far-change-in-principle-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 250-10 (change in accounting principle: retrospective application)'
  notes: Batch 02. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At the start of Year 3, Tate Co. changes its inventory method from weighted-average cost to FIFO
  because FIFO better reflects its flow of goods. It can determine the effects for all prior periods.
  Inventory under each method was: December 31, Year 1 — weighted-average $400,000, FIFO $450,000; December
  31, Year 2 — weighted-average $460,000, FIFO $540,000. Apply a 25% tax rate to every effect. Tate issues
  comparative statements for Years 2 and 3. Compared with the amounts originally reported, by how much
  do Year 2 net income and December 31, Year 2, retained earnings change in those statements?'
choices:
- id: A
  text: $0 net income; $0 retained earnings
  rationale: Applies the change prospectively from Year 3. A change in accounting principle is applied
    retrospectively, so Year 2 is restated.
- id: B
  text: $22,500 net income; $37,500 retained earnings
  rationale: Carries only the January 1, Year 2, adjustment ($50,000 × 75%) to year-end retained earnings,
    leaving out the restated Year 2 income.
- id: C
  text: $22,500 net income; $60,000 retained earnings
  rationale: Correct. Year 2 income rises by ($80,000 − $50,000) × 75% = $22,500; year-end retained earnings
    rises by $80,000 × 75% = $60,000.
- id: D
  text: $30,000 net income; $80,000 retained earnings
  rationale: Ignores the 25% tax effect of the change.
answer: C
explanation: 'A change in accounting principle is applied retrospectively. The cumulative effect on periods
  before the earliest period presented adjusts the opening retained earnings of Year 2: ($450,000 − $400,000)
  × 75% = $37,500 increase. Year 2 is restated: FIFO raises ending inventory by $80,000 versus $50,000
  at the start, so cost of goods sold falls by $30,000 and net income rises by $30,000 × 75% = $22,500.
  December 31, Year 2, retained earnings rises by $37,500 + $22,500 = $60,000 (the $80,000 year-end difference,
  net of tax).'
