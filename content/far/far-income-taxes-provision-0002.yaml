id: far-income-taxes-provision-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: reviewed
  references:
  - ASC 740-10 (current and deferred tax expense; deferred tax assets and liabilities)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
  asOf: U.S. GAAP (ASC 740) and federal tax law in effect for 2026; rates are as stated in the stem
stem: Lathom Corp. records its income tax provision in a single year-end journal entry, using separate
  deferred tax asset and deferred tax liability accounts. Its Year 2 taxable income is $480,000, and the
  enacted tax rate is 25% for all years. At January 1, Year 2, cumulative tax depreciation exceeded book
  depreciation by $120,000, and Lathom had an accrued warranty liability of $40,000; warranty costs are
  deductible when paid. At December 31, Year 2, those amounts are $180,000 and $64,000. Lathom has no
  other temporary differences and expects ample future taxable income. In its Year 2 entry, what amount
  should Lathom debit to income tax expense?
choices:
- id: A
  text: $120,000
  rationale: Debits only the $120,000 of current tax. The entry also records deferred tax expense for
    the net change in the deferred tax accounts.
- id: B
  text: $129,000
  rationale: Correct. Current $120,000 + $15,000 increase in the liability − $6,000 increase in the asset.
- id: C
  text: $141,000
  rationale: Adds the $6,000 increase in the deferred tax asset to expense. An increase in a deferred
    tax asset is a deferred tax benefit, which reduces expense.
- id: D
  text: $149,000
  rationale: Uses the December 31 deferred tax balances instead of the year's changes. The January 1 balances
    were already recorded in earlier years.
answer: B
explanation: 'The entry is: debit income tax expense and the deferred tax asset; credit income taxes payable
  and the deferred tax liability. Current tax = $480,000 × 25% = $120,000. The deferred tax liability
  increases by ($180,000 − $120,000) × 25% = $15,000. The deferred tax asset increases by ($64,000 − $40,000)
  × 25% = $6,000, a deferred benefit. Income tax expense = $120,000 + $15,000 − $6,000 = $129,000.'
