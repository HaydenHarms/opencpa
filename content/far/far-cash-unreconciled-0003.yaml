id: far-cash-unreconciled-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (unreconciled differences; recording errors; unrecorded bank charges;
    omitted outstanding checks)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Knarsdale Co.''s bookkeeper reconciled the September 30 bank statement as follows: bank balance
  $94,360, plus deposits in transit $8,420, less outstanding checks $15,730, gives $87,050. The general
  ledger showed $89,730, so the bookkeeper recorded the $2,680 difference as miscellaneous expense, bringing
  the ledger to $87,050. The controller reverses that entry and investigates. She finds: check no. 6118,
  a $2,760 payment to a supplier that cleared the bank in September, was entered in the cash receipts
  journal instead of the cash disbursements journal; a customer''s $4,850 check, deposited and credited
  by the bank on September 14, was recorded in the cash receipts journal as $4,085; check no. 6194 for
  $3,915, issued and recorded on September 28, is missing from the bookkeeper''s list of outstanding checks
  and hasn''t cleared the bank; and on September 30 the bank deducted a $1,840 monthly loan payment under
  Knarsdale''s automatic payment arrangement, which Knarsdale hasn''t recorded. What cash balance should
  Knarsdale report at September 30?'
choices:
- id: A
  text: $81,605
  rationale: Deducts the $765 difference on the deposit. It was recorded at $4,085 but was $4,850, so
    the books understate cash.
- id: B
  text: $83,135
  rationale: Correct. $94,360 + $8,420 − ($15,730 + $3,915) = $89,730 − $5,520 + $765 − $1,840.
- id: C
  text: $85,895
  rationale: 'Corrects the check entered as a receipt by only $2,760. Recording a $2,760 payment as a
    receipt overstated cash by twice its amount: the receipt must be removed and the payment recorded.'
- id: D
  text: $87,050
  rationale: Accepts the ledger after the plug. That balance only matches the bookkeeper's adjusted bank
    balance, which leaves out check no. 6194 for $3,915, still outstanding.
answer: B
explanation: 'Bank side: the omitted outstanding check is deducted: $94,360 + $8,420 − $15,730 − $3,915
  = $83,135. Book side, after reversing the plug: $89,730 − $5,520 (remove the $2,760 recorded as a receipt
  and record it as a payment) + $765 (the deposit was $4,850, not $4,085) − $1,840 loan payment = $83,135.
  The $2,680 plug hid these four items.'
