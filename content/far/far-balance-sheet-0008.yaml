id: far-balance-sheet-0008
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Balance sheet
  skill: Application
review:
  status: reviewed
  references:
  - ASC 210-10-45 (current liabilities; customer credit balances)
  - ASC 505-20 (stock dividends distributable reported in equity)
  - ASC 842-20-45 (lessee presentation of lease liabilities)
  - ASC 740-10-45 (deferred taxes classified as noncurrent)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Alnmouth Co. is preparing a classified balance sheet at December 31, Year 2. Its adjusted trial
  balance and supporting schedules show: accounts payable $412,000; interest payable $18,500; accounts
  receivable of $524,200, which is the net of customer accounts with debit balances of $536,000 and customer
  accounts with credit balances of $11,800 from overpayments; common stock dividend distributable of $75,000,
  for a 5% stock dividend declared on December 15 and to be distributed on January 20, Year 3; operating
  lease liabilities of $264,000, of which the lease payments due in Year 3 will settle $58,000; an estimated
  liability for product warranties of $96,000, of which $41,000 relates to claims expected to be settled
  in Year 3; unearned service revenue of $37,500 for services to be performed by June, Year 3; and a deferred
  tax liability of $88,000. What total current liabilities should Alnmouth report?'
choices:
- id: A
  text: $520,800
  rationale: Reports all of the operating lease liabilities as noncurrent. The $58,000 that the Year 3
    lease payments will settle is a current liability.
- id: B
  text: $537,800
  rationale: Reports all of the warranty liability as noncurrent. The $41,000 of claims expected to be
    settled in Year 3 is a current liability.
- id: C
  text: $567,000
  rationale: Leaves the $11,800 of customer credit balances netted against accounts receivable. Amounts
    Alnmouth owes customers are liabilities, reported among current liabilities; receivables are reported
    at the $536,000 of debit balances.
- id: D
  text: $578,800
  rationale: Correct. $412,000 + $18,500 + $11,800 + $58,000 + $41,000 + $37,500.
answer: D
explanation: 'Current liabilities are obligations expected to be settled with current assets (or by creating
  other current liabilities) within a year. They are accounts payable $412,000, interest payable $18,500,
  the $11,800 of customer credit balances (amounts owed to customers, reclassified out of receivables),
  the $58,000 current portion of the operating lease liabilities, the $41,000 of warranty claims expected
  to be settled in Year 3, and the $37,500 of unearned revenue for services due within the year: $578,800
  in all. The stock dividend distributable is equity, because it will be settled in shares, and the deferred
  tax liability is noncurrent.'
