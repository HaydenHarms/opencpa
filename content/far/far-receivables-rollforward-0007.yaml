id: far-receivables-rollforward-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: draft
  references:
  - ASC 310-10 (receivables; credit balances in customer accounts)
  - ASC 326-20-35 (write-offs and recoveries)
  - ASC 606-10-25 (cutoff for sales returns)
  notes: Batch 15, revision 2 (blind verifier and gate findings applied). Written from scratch; answers
    solved and every number and distractor computed in code.
stem: All of Flushing Yacht Supply Co.'s sales are on credit. Its accounts receivable control account
  began Year 2 at $480,000; credit sales for the year were $2,920,000, cash collected from customers was
  $2,865,000, and $24,000 of accounts were written off, which a staff accountant used to arrive at a preliminary
  December 31 figure of $511,000. That figure agrees with the aged subledger, which lists customer debit
  balances of $526,000 and customer credit balances, from overpayments and returns, of $15,000. Examining
  the figure, the internal auditor notes that a $9,000 credit memo for goods a customer returned on December
  29, logged by the receiving dock that day, wasn't entered in the accounting records until the memo was
  processed in January, and that a $6,000 recovery of an account written off in an earlier year, paid
  in cash by the customer in December, was recorded as a direct credit to bad debt expense and isn't included
  in the cash collected figure. For Flushing, what should corrected accounts receivable, before any allowance,
  be at December 31, Year 2?
choices:
- id: A
  text: $502,000
  rationale: Reports receivables net of the $15,000 of customer credit balances. Credit balances, from
    overpayments and returns, are amounts Flushing owes customers; they are a liability, not a reduction
    of other customers' debit balances.
- id: B
  text: $517,000
  rationale: Correct. Customer debit balances of $526,000 less the $9,000 December return.
- id: C
  text: $523,000
  rationale: Adds the $6,000 recovery of a previously written-off account to receivables. The recovery
    was recorded directly as a credit to bad debt expense, and the cash collected figure excludes it,
    so it never passed through accounts receivable and needs no correction here.
- id: D
  text: $526,000
  rationale: Leaves out the $9,000 credit memo for goods a customer returned on December 29. The return
    is a Year 2 event, so receivables are reduced in Year 2 even though the memo was entered in January.
answer: B
explanation: The preliminary $511,000 is the subledger's debit balances of $526,000 less its $15,000 of
  credit balances. Credit balances are amounts owed to customers, a liability, so receivables are the
  gross debit balances (+ $15,000). The December 29 return is a Year 2 event and reduces Year 2 receivables
  (− $9,000). The recovery was recorded as a direct credit to bad debt expense rather than by reinstating
  the account and then recording its collection, and the cash collected figure excludes it, so it never
  touched accounts receivable and needs no correction here. Corrected balance = $511,000 + $15,000 − $9,000
  = $517,000.
