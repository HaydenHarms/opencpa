id: far-receivables-rollforward-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: draft
  references:
  - ASC 310-10 (receivables; credit balances in customer accounts are liabilities; notes receivable reported
    separately)
  - ASC 606-10-25-30 (control passes at shipment under FOB shipping point terms)
  - ASC 606-10-25 (cutoff for sales returns)
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'All of Flushing Yacht Supply Co.''s sales are on credit. Its accounts receivable control account
  began Year 2 at $480,000; credit sales for the year were $2,920,000, cash collected from customers was
  $2,865,000, $24,000 of accounts were written off, and $12,000 was credited to a customer''s account
  in December when the customer signed a 90-day note in settlement of its overdue balance. From these
  a staff accountant arrived at a preliminary December 31 figure of $499,000, which agrees with the aged
  subledger: customer debit balances of $514,000 and customer credit balances, from overpayments and returns,
  of $15,000. Examining the figure, the internal auditor notes that a $9,000 credit memo for goods a customer
  returned on December 29, logged by the receiving dock that day, wasn''t entered until January; that
  customer''s debit balance was well above the memo amount. The auditor also finds that goods sold to
  another customer for $21,000 on account, shipped FOB shipping point on December 30, weren''t invoiced
  or recorded until January. What amount should Flushing report as accounts receivable, before any allowance,
  in its December 31, Year 2 balance sheet?'
choices:
- id: A
  text: $505,000
  rationale: Leaves out the $21,000 sale shipped on December 30. Control passed when the goods were shipped
    FOB shipping point, so Flushing had a receivable at December 31 even though the invoice was entered
    in January.
- id: B
  text: $511,000
  rationale: Reports receivables net of the $15,000 of customer credit balances, which is the corrected
    control-account balance. Credit balances, from overpayments and returns, are amounts Flushing owes
    customers; they are reported as a liability, not netted against other customers' debit balances.
- id: C
  text: $526,000
  rationale: Correct. Customer debit balances of $514,000 − $9,000 December return + $21,000 December
    sale; the $15,000 of credit balances is a liability.
- id: D
  text: $535,000
  rationale: Leaves out the $9,000 credit memo for goods a customer returned on December 29. The return
    is a Year 2 event, so it reduces that customer's debit balance at December 31 even though the memo
    was entered in January.
answer: C
explanation: The preliminary $499,000 is the subledger's debit balances of $514,000 less its $15,000 of
  credit balances. Credit balances are amounts owed to customers, a liability, so the asset starts from
  the gross debit balances. The December 29 return is a Year 2 event and reduces the returning customer's
  debit balance (− $9,000). The goods shipped FOB shipping point on December 30 passed to the customer
  that day, so the sale and the receivable belong in Year 2 (+ $21,000). The $12,000 note is a note receivable,
  not an account receivable, so the credit to the customer's account was correct and needs no change.
  Accounts receivable = $514,000 − $9,000 + $21,000 = $526,000.
