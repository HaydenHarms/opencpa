id: far-income-taxes-deferred-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: reviewed
  references:
  - ASC 740-10-25 (temporary differences)
  - ASC 740-10-30-5 (valuation allowance)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
  asOf: U.S. GAAP (ASC 740) and federal tax law in effect for 2026; the rate is as stated in the stem
stem: 'Saltburn Corp. is measuring its deferred taxes at December 31, Year 2. It has a taxable temporary
  difference of $180,000 from an installment sale: it recognized the full gross profit for books in the
  year of sale, but for tax the gross profit is taxed only as collected. It has also accrued a $260,000
  loss contingency from pending litigation, deductible for tax only when paid; of that accrual, Saltburn
  expects to pay $220,000 within the next year and the rest later. The enacted tax rate is 25% for all
  years. Based on its forecast of future taxable income, Saltburn''s management concludes that it is more
  likely than not that $8,000 of the resulting deferred tax asset will not be realized. What net deferred
  tax asset should Saltburn report at December 31, Year 2?'
choices:
- id: A
  text: $12,000
  rationale: Correct. ($260,000 − $180,000) × 25% = $20,000, less the $8,000 valuation allowance.
- id: B
  text: $20,000
  rationale: Omits the $8,000 valuation allowance. Management has concluded it is more likely than not
    that $8,000 of the deferred tax asset won't be realized (ASC 740-10-30-5).
- id: C
  text: $28,000
  rationale: Adds the $8,000 allowance to the asset instead of deducting it. A valuation allowance reduces
    a deferred tax asset to the amount more likely than not to be realized.
- id: D
  text: $57,000
  rationale: Leaves out the deferred tax liability on the installment sale. Its untaxed gross profit is
    a taxable temporary difference that offsets part of the litigation accrual's deferred tax asset.
answer: A
explanation: 'The installment sale gives a taxable temporary difference ($180,000), a deferred tax liability
  of $180,000 × 25%; the full litigation accrual gives a deductible temporary difference ($260,000), a
  deferred tax asset of $260,000 × 25%, regardless of when the cash will be paid (deferred taxes are never
  classified as current). Net deferred tax asset before considering realization = ($260,000 − $180,000)
  × 25% = $20,000. A valuation allowance reduces it by the $8,000 management concludes is not more likely
  than not to be realized (ASC 740-10-30-5): $20,000 − $8,000 = $12,000.'
