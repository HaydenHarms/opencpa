id: far-income-taxes-deferred-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: draft
  references:
  - ASC 740-10-25 (temporary differences)
  - ASC 740-10-30-5 (measuring deferred taxes; valuation allowance)
  - ASC 740-10-45-4 (deferred taxes classified as noncurrent)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
  asOf: U.S. GAAP (ASC 740) and federal tax law in effect for 2026; the rate is as stated in the stem
stem: Saltburn Corp. keeps separate deferred tax asset and deferred tax liability accounts in its ledger
  and is measuring them at December 31, Year 2. In Year 1 it sold land on installment terms, recognizing
  the whole gain in its books; $180,000 of that gain hasn't yet been collected and will be taxed as it
  is. In Year 2 it accrued a $260,000 loss for a lawsuit it expects to settle; the loss is deductible
  when paid, and Saltburn expects to pay $220,000 of it in Year 3 and the rest in Year 4. The enacted
  tax rate is 25% for all years. Weighing its recent losses against its forecasts, Saltburn concludes
  that it needs a valuation allowance of $8,000 against its deferred tax asset. At December 31, Year 2,
  what amounts should Saltburn carry in its deferred tax asset account, net of the allowance, and in its
  deferred tax liability account?
choices:
- id: A
  text: $47,000 asset; $45,000 liability
  rationale: Bases the deferred tax asset on only the $220,000 of the accrual Saltburn expects to pay
    in Year 3. A deferred tax asset arises on the whole $260,000 deductible temporary difference; deferred
    taxes aren't split into current and noncurrent parts (ASC 740-10-45-4).
- id: B
  text: $57,000 asset; $0 liability
  rationale: Records no deferred tax liability on the $180,000 of gain not yet taxed. Gain recognized
    in the books but taxed when collected is a taxable temporary difference (ASC 740-10-25-20).
- id: C
  text: $57,000 asset; $45,000 liability
  rationale: Correct. Asset $260,000 × 25% = $65,000, less the $8,000 allowance; liability $180,000 ×
    25%.
- id: D
  text: $65,000 asset; $45,000 liability
  rationale: Doesn't deduct the $8,000 valuation allowance from the deferred tax asset.
answer: C
explanation: 'The uncollected installment gain is a taxable temporary difference: deferred tax liability
  = $180,000 × 25% = $45,000. The litigation accrual is a deductible temporary difference in full, whenever
  it will be paid: deferred tax asset = $260,000 × 25% = $65,000. The valuation allowance reduces the
  asset to the amount expected to be realized (ASC 740-10-30-5(e)): $65,000 − $8,000 = $57,000. Net of
  the allowance, the asset account carries $57,000 and the liability account $45,000.'
