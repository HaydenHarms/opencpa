id: far-cash-flows-0014
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 230-10-45-15 (financing outflows, including debt prepayment and extinguishment costs, as amended
    by ASU 2016-15)
  - 'ASC 842-20-45-5 (finance lease payments: principal in financing, interest in operating)'
  - ASC 230-10-50-3 (noncash investing and financing activities)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Acklington Co.''s draft Year 2 statement of cash flows reports net cash provided by operating activities
  of $684,000, net cash used in investing activities of $1,362,000 (purchases of equipment $412,000 and
  purchase of an office building $950,000), and net cash provided by financing activities of $1,154,000
  (proceeds from bonds issued, net of issue costs paid, $1,470,000; repayment of a term loan ($600,000);
  payments on finance lease obligations ($96,000); dividends paid ($140,000); and mortgage loan on office
  building $520,000), for a net increase in cash of $476,000. The supporting documents show: the seller
  of the building received $430,000 in cash, and Acklington assumed the seller''s $520,000 mortgage for
  the rest of the price; besides the $600,000 of principal, Acklington paid the term lender an $18,000
  prepayment penalty, which net income includes as a loss on extinguishment and which the operating section
  does not adjust; and the finance lease payments consisted of $75,000 of principal and $21,000 of interest.
  Under U.S. GAAP, what should the corrected statement report as net cash provided by financing activities?'
choices:
- id: A
  text: $616,000
  rationale: Keeps all $96,000 of finance lease payments in financing activities. The $21,000 interest
    portion is an operating outflow; only the principal portion is financing.
- id: B
  text: $637,000
  rationale: Correct. $1,154,000 − $18,000 + $21,000 − $520,000.
- id: C
  text: $655,000
  rationale: Leaves the $18,000 prepayment penalty out of financing activities. Cash paid for debt prepayment
    or extinguishment costs is a financing outflow, so the operating section adds it back and the financing
    section reports it.
- id: D
  text: $1,157,000
  rationale: 'Keeps the $520,000 mortgage assumed on the building as a financing inflow. No cash was borrowed:
    assuming the seller''s mortgage is a noncash investing and financing activity, disclosed rather than
    reported in the statement.'
answer: B
explanation: Three items in the financing section need correcting. The mortgage was assumed, not borrowed,
  so the $520,000 inflow is removed (and the building's cash purchase price falls to $430,000); the assumption
  is disclosed as a noncash activity. The $18,000 prepayment penalty is a cash outflow for debt extinguishment
  costs, which ASC 230-10-45-15 classifies as financing, so it moves out of operating activities (where
  it is added back) into financing. Of the $96,000 paid on finance leases, the $21,000 of interest is
  operating (ASC 842-20-45-5), so financing outflows fall by $21,000. The bond proceeds, net of the issue
  costs paid, are correctly financing. Corrected financing = $1,154,000 − $520,000 − $18,000 + $21,000
  = $637,000.
