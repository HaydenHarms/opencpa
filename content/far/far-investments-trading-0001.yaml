id: far-investments-trading-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments
  skill: Application
review:
  status: reviewed
  references:
  - ASC 320-10-35-1(a)
  notes: Batch 01. Adapted from legacy bank; answer re-solved, arithmetic checked in code, distractors
    rebuilt where needed.
stem: On January 1, Atlas Corp. buys $500,000 of 4% corporate bonds at par. Management intends to profit
  from short-term price changes. By December 31, the bonds' fair value is $522,000, and Atlas has earned
  $20,000 of interest. How much related to these bonds is included in Atlas's net income for the year?
choices:
- id: A
  text: $20,000
  rationale: Excludes the unrealized gain, which is the treatment for available-for-sale or held-to-maturity
    securities.
- id: B
  text: $20,000, with the $22,000 unrealized gain in other comprehensive income
  rationale: That split is the available-for-sale treatment.
- id: C
  text: $22,000
  rationale: Ignores interest income, which is always recognized in net income.
- id: D
  text: $42,000
  rationale: Correct. For trading securities, interest income and unrealized holding gains both go to
    net income.
answer: D
explanation: 'Bonds held for short-term profit are trading securities. Unrealized holding gains and losses
  on trading securities are included in earnings: $20,000 interest + ($522,000 − $500,000) $22,000 unrealized
  gain = $42,000.'
