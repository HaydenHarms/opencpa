id: far-cash-flows-0010
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Application
review:
  status: reviewed
  references:
  - ASC 230-10-45 (classification of cash receipts and payments)
  - ASC 230-10-50 (noncash investing and financing activities)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Lavery Co.''s draft Year 2 statement of cash flows reports net cash provided by financing activities
  of $355,000: proceeds from long-term borrowing $500,000; repayment of long-term debt ($180,000); dividends
  paid ($120,000); interest paid ($45,000); and common stock issued on conversion of bonds $200,000. The
  controller identifies these errors: the dividends line shows the $120,000 of dividends declared in Year
  2, although dividends payable increased by $30,000 during the year; interest paid is reported in financing
  activities; the conversion, in which bondholders exchanged bonds with a carrying amount of $200,000
  for common shares, is reported as a cash inflow; and $85,000 paid to buy treasury shares is reported
  in investing activities. Lavery follows U.S. GAAP. What net cash provided by financing activities should
  the corrected statement report?'
choices:
- id: A
  text: $100,000
  rationale: Leaves the $45,000 of interest paid in financing activities. Under U.S. GAAP, interest paid
    is an operating cash flow.
- id: B
  text: $115,000
  rationale: Keeps dividends declared as the outflow. Dividends payable rose by $30,000, so cash paid
    was $90,000.
- id: C
  text: $145,000
  rationale: Correct. $500,000 borrowed − $180,000 repaid − $90,000 dividends paid − $85,000 treasury
    shares.
- id: D
  text: $230,000
  rationale: Leaves the $85,000 treasury share purchase out of financing activities. Buying back the company's
    own shares is a financing outflow.
answer: C
explanation: Dividends paid = $120,000 declared − $30,000 increase in dividends payable = $90,000. Interest
  paid moves to operating activities. The conversion is a noncash financing activity, disclosed rather
  than reported as a cash flow. The treasury share purchase is a financing outflow. Net cash provided
  by financing activities = $500,000 − $180,000 − $90,000 − $85,000 = $145,000.
