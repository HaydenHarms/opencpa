id: far-ppe-lump-sum-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 360-10-30 (initial measurement of property, plant and equipment: costs to acquire and prepare
    for use)'
  - 'ASC 805-50-30 (asset acquisitions: cost allocated to the assets acquired on the basis of relative
    fair values)'
  - ASC 360-10-35 (depreciation)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 10, Year 1, Lucker Co. paid $2,400,000 for land and a building on it, and paid $48,000
  of legal fees and title costs to complete the purchase. An independent appraisal valued the land at
  $780,000 and the building at $1,820,000; the local property tax assessments were $900,000 for the land
  and $1,100,000 for the building. Lucker spent $186,000 renovating the building before moving in, and
  placed it in service as its head office on April 1, Year 1. It depreciates the building straight-line
  over 30 years with a residual value of $120,000, taking depreciation for each month the building is
  in service and rounding Year 1 depreciation to the nearest dollar. What carrying amount should Lucker
  report for the building at December 31, Year 1?
choices:
- id: A
  text: $1,497,090
  rationale: Allocates the purchase cost using the property tax assessments. A lump-sum purchase price
    is allocated on the relative fair values of the assets, from the appraisal.
- id: B
  text: $1,822,350
  rationale: Leaves the $48,000 of legal fees and title costs out of the cost of the property. Costs needed
    to acquire the assets are part of their cost and are allocated with the price.
- id: C
  text: $1,855,110
  rationale: Correct. $1,899,600 cost − $44,490 depreciation.
- id: D
  text: $1,899,600
  rationale: Records no depreciation in Year 1. Depreciation begins when the building is placed in service,
    on April 1.
answer: C
explanation: 'The $2,400,000 price plus the $48,000 of acquisition costs ($2,448,000) is allocated on
  relative appraised fair values: building = $2,448,000 × $1,820,000 / $2,600,000 = $1,713,600. The renovation
  before use is added: cost = $1,899,600. Depreciation for the 9 months from April 1 = ($1,899,600 − $120,000)
  ÷ 30 × 9/12 = $44,490. Carrying amount = $1,899,600 − $44,490 = $1,855,110.'
