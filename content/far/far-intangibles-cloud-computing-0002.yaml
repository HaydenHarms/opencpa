id: far-intangibles-cloud-computing-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Intangible assets
  skill: Application
review:
  status: draft
  references:
  - ASC 350-40 (internal-use software; implementation costs of a hosting arrangement that is a service
    contract; amortization over the term of the hosting arrangement from each module's ready-for-use date)
  - ASU 2018-15 (customer's accounting for implementation costs in a cloud computing arrangement)
  - ASU 2025-06 (targeted improvements to internal-use software; same result here)
  - ASC 720-45 (business process reengineering costs expensed)
  notes: Batch 15, revision 2 (blind verifier and gate findings applied). Written from scratch; answers
    solved and every number and distractor computed in code.
stem: On January 1, Year 1, Perrancombe Logistics Co. signs a noncancellable 4-year contract, running
  from that date, for access to a vendor's cloud-hosted warehouse management system. Perrancombe has no
  right to take the software onto its own servers. The contract lets Perrancombe extend it for 2 more
  years at the vendor's list prices at that time, and management hasn't decided whether it will. After
  the board approved and funded the project, Perrancombe paid consultants $36,000 to redesign its receiving
  and picking processes before configuration began, $225,000 to configure and test the inventory module,
  which was ready for its intended use on April 1, Year 1, and $117,000 to configure and test the shipping
  module, ready on October 1, Year 1. Each module works independently of the other. Perrancombe amortizes
  capitalized implementation costs straight-line by month. What amount should Perrancombe report as capitalized
  implementation costs, net of accumulated amortization, at December 31, Year 1?
choices:
- id: A
  text: $273,600
  rationale: Starts amortizing both modules on April 1, when the first one went live. Because the modules
    work independently, each is amortized from its own ready-for-use date, and the second wasn't ready
    until October 1.
- id: B
  text: $288,000
  rationale: Correct. ($225,000 − $45,000) + ($117,000 − $9,000).
- id: C
  text: $292,499
  rationale: Spreads each module's costs over the full 4-year term starting at its go-live date, so amortization
    would run past the contract's end on December 31, Year 4. Implementation costs are amortized over
    the hosting arrangement's term, which by then has only 45 and 39 months left.
- id: D
  text: $307,081
  rationale: Includes the 2-year renewal in the amortization period. Management hasn't decided whether
    to renew, so the renewal isn't reasonably certain and the term is the 4-year noncancellable period.
answer: B
explanation: 'A hosting arrangement Perrancombe can''t take possession of is a service contract, and its
  implementation costs follow ASC 350-40, as amended by ASU 2018-15. Configuring and testing each module
  is capitalized; redesigning business processes ($36,000) is expensed as incurred. (ASU 2025-06, which
  replaces the project stages with a probable-to-complete threshold that this funded project meets, gives
  the same result.) The costs are amortized straight-line over the term of the hosting arrangement, the
  4-year noncancellable period ending December 31, Year 4; the renewal is excluded because management
  hasn''t decided to exercise it. Each module''s amortization starts when that module is ready for its
  intended use and runs over the term remaining at that date. Inventory module: $225,000 × 9/45 = $45,000.
  Shipping module: $117,000 × 3/39 = $9,000. Net asset = $342,000 − $45,000 − $9,000 = $288,000.'
