id: far-intangibles-cloud-computing-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Intangible assets
  skill: Application
review:
  status: reviewed
  references:
  - ASC 350-40 (internal-use software; implementation costs of a hosting arrangement that is a service
    contract)
  - ASU 2018-15 (customer's accounting for implementation costs in a cloud computing arrangement)
  - ASU 2025-06 (targeted improvements to internal-use software; same result here)
  notes: Batch 15. Written from scratch; answers solved and every number and distractor computed in code.
stem: Perrancombe Logistics Co. runs its inventory management entirely through a vendor's cloud platform
  under a 4-year contract that began January 1, Year 1; Perrancombe never takes possession of the underlying
  software, and management is confident Perrancombe will exercise the contract's renewal option for another
  2 years once the initial term ends, since switching platforms would be disruptive. Perrancombe did not
  begin using the system until July 1, Year 1, once setup was finished; getting there cost $22,000 to
  compare and select a vendor, $216,000 to configure the system and build and test its interfaces, $30,000
  to clean up and load historical data, and $16,000 to train staff on the new system. Perrancombe amortizes
  capitalized implementation costs straight-line over the period it benefits from the arrangement. What
  amount should Perrancombe report as its capitalized cloud computing implementation asset, net of amortization,
  at December 31, Year 1?
choices:
- id: A
  text: $180,000
  rationale: Amortizes a full year's amount, $36,000, instead of the 6 months since the software became
    ready for its intended use on July 1, Year 1.
- id: B
  text: $189,000
  rationale: Amortizes the implementation costs only over the 4-year initial term, ignoring the 2-year
    renewal. Because Perrancombe is reasonably certain to renew, the amortization period is the 6-year
    combined term, the same period used to decide the arrangement isn't a lease.
- id: C
  text: $198,000
  rationale: Correct. $216,000 − ($36,000 × 6/12).
- id: D
  text: $225,500
  rationale: Capitalizes the $30,000 of data conversion costs along with the implementation costs. Data
    conversion costs are expensed as incurred, not capitalized, under ASC 350-40.
answer: C
explanation: 'Under ASC 350-40, as amended by ASU 2018-15, only the costs of configuring, coding and testing
  the hosting arrangement''s interfaces are capitalized; selecting a vendor ($22,000) is a preliminary-stage
  cost and training ($16,000) and data conversion ($30,000) are expensed as incurred, whether or not the
  project is likely to succeed. (ASU 2025-06''s revisions to internal-use software capitalization give
  the same result for a hosting arrangement like this one.) The capitalized $216,000 is amortized over
  the 6-year period Perrancombe benefits from the arrangement, the initial 4-year term plus the 2-year
  renewal Perrancombe is reasonably certain to exercise, straight-line from July 1: $36,000 a year, or
  $18,000 for the 6 months remaining in Year 1. Net asset = $216,000 − $18,000 = $198,000.'
