id: far-cash-flows-0013
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Application
review:
  status: reviewed
  references:
  - ASC 230-10-50-2 (supplemental disclosure of income taxes paid under the indirect method)
  - ASC 740-10-45 and 740-20-45 (deferred tax expense; tax effects allocated to other comprehensive income)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: Harbottle Inc. reports income tax expense of $486,000 in its Year 2 income statement. Its balance
  sheets show income taxes payable of $42,000 at January 1, Year 2, and $57,000 at December 31; a deferred
  tax liability of $118,000 and $171,000; and a deferred tax asset, with no valuation allowance, of $36,000
  and $41,000. Of the increase in the deferred tax liability, $19,000 arose from unrealized holding gains
  on available-for-sale debt securities and was charged to other comprehensive income. Harbottle has no
  other tax balances and made no other tax entries. What amount should Harbottle disclose as income taxes
  paid for Year 2 in its statement of cash flows, which uses the indirect method?
choices:
- id: A
  text: $423,000
  rationale: Treats the whole $53,000 increase in the deferred tax liability as deferred tax expense.
    $19,000 of it was charged to other comprehensive income with the unrealized gains on available-for-sale
    securities, so it isn't part of income tax expense.
- id: B
  text: $432,000
  rationale: Adds the $5,000 increase in the deferred tax asset to deferred tax expense. An increase in
    a deferred tax asset is a deferred tax benefit, which reduces deferred tax expense.
- id: C
  text: $442,000
  rationale: Correct. $486,000 − $29,000 deferred = $457,000 current; $457,000 − $15,000 increase in taxes
    payable.
- id: D
  text: $472,000
  rationale: Adds the $15,000 increase in income taxes payable. A rise in the payable means less was paid
    than the current tax expense.
answer: C
explanation: 'Deferred tax expense is the change in deferred tax balances that runs through income: the
  deferred tax liability rose by $53,000, of which $19,000 was charged to OCI, leaving $34,000; less the
  $5,000 increase in the deferred tax asset, a benefit: $34,000 − $5,000 = $29,000. Current tax expense
  = $486,000 − $29,000 = $457,000. Income taxes payable rose by $15,000, so less was paid than the current
  expense: taxes paid = $457,000 − $15,000 = $442,000. ASC 230-10-50-2 requires an entity using the indirect
  method to disclose income taxes paid.'
