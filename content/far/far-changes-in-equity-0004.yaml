id: far-changes-in-equity-0004
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of changes in equity
  skill: Application
review:
  status: reviewed
  references:
  - ASC 505-10 (equity; issuance of shares)
  - ASC 505-20 (stock dividends; large stock dividends)
  - ASC 505-30 (treasury stock; cost method)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Hallam Corp.''s draft Year 2 statement of changes in equity reports additional paid-in capital
  of $2,150,000 at December 31. The controller identifies these errors: (1) in February, Hallam issued
  40,000 shares of $1 par common stock for $14 per share and credited the entire proceeds to common stock;
  (2) in March, Hallam reissued treasury shares, which it carries at cost, for $18,000 more than their
  cost and credited the excess to a gain in net income; (3) in May, Hallam distributed a 30% stock dividend
  of 36,000 shares when the market price was $16 per share and recorded it at the market price; state
  law requires par value to be capitalized for stock dividends; and (4) in November, it reissued other
  treasury shares for $7,000 less than their cost and charged the shortfall to retained earnings. Before
  Year 2, Hallam had no paid-in capital from treasury stock transactions. What additional paid-in capital
  should the corrected statement report at December 31, Year 2?'
choices:
- id: A
  text: $2,130,000
  rationale: Leaves the $18,000 excess on reissuing treasury shares in income, so it finds no paid-in
    capital from treasury stock and leaves the $7,000 shortfall in retained earnings. A company doesn't
    report gains on its own shares; the excess is paid-in capital from treasury stock, and the shortfall
    is charged against it.
- id: B
  text: $2,141,000
  rationale: Correct. $2,150,000 + $520,000 − $540,000 + $18,000 − $7,000.
- id: C
  text: $2,148,000
  rationale: Leaves the $7,000 shortfall in retained earnings. Under the cost method a shortfall is charged
    first to paid-in capital from treasury stock, which the March reissuance had credited with $18,000.
- id: D
  text: $2,681,000
  rationale: Keeps the stock dividend at market price. For a dividend this large (30%), Hallam capitalizes
    only the par value that state law requires, so the $540,000 credited to APIC is reversed.
answer: B
explanation: '(1) The excess over par on the share issuance is APIC: 40,000 × ($14 − $1) = $520,000. (2)
  The $18,000 excess on the March reissuance is paid-in capital from treasury stock, not a gain. (3) A
  30% stock dividend is a large stock dividend; with state law requiring only par, Hallam transfers par
  value from retained earnings to common stock, so the draft''s 36,000 × ($16 − $1) = $540,000 credit
  to APIC is reversed. (4) The November shortfall of $7,000 is charged against that $18,000 balance before
  any is charged to retained earnings, so it reduces APIC. APIC = $2,150,000 + $520,000 − $540,000 + $18,000
  − $7,000 = $2,141,000.'
