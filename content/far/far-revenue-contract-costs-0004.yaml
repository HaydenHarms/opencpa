id: far-revenue-contract-costs-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - ASC 340-40-15-3 (scope exclusion for costs within the scope of another Topic)
  - ASC 340-40-25-1 to 25-8 (incremental costs of obtaining a contract; costs to fulfill a contract)
  - ASC 340-40-35-1 (amortization)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Trebarwith Systems Co. signed a three-year contract on January 10, Year 1, to provide outsourced
  logistics services beginning March 1, Year 1; no renewal is expected. Four amounts went on Trebarwith''s
  books because of this engagement: a $54,000 commission the salesperson earned only by closing the deal;
  $72,000 paid for labor configuring the customer''s shipment-tracking workflows — work tied specifically
  to this contract, built to be used for as long as Trebarwith serves this customer, and priced into the
  fees Trebarwith will collect; $38,000 for forklifts that Trebarwith will dedicate to this customer for
  now but redeploy to other jobs once the contract ends; and $9,000 for packing materials that will be
  used up in delivering the services. Each capitalized cost is written off evenly by the month, over the
  span it benefits. What should Trebarwith carry as its contract cost assets under ASC 340-40 at December
  31, Year 1?'
choices:
- id: A
  text: $91,000
  rationale: Correct. ($54,000 + $72,000) × 26/36.
- id: B
  text: $100,000
  rationale: Capitalizes the $9,000 of packing materials as a contract cost asset. Materials and supplies
    to be consumed in performing the services are inventory within the scope of ASC 330 until used, not
    a contract cost asset.
- id: C
  text: $126,000
  rationale: Reports the full $126,000 capitalized, without amortization. Both the commission and the
    setup labor are amortized consistent with the transfer of the services to which they relate.
- id: D
  text: $129,000
  rationale: Capitalizes the $38,000 of forklifts as a contract cost asset. Property, plant and equipment
    is within the scope of ASC 360, not ASC 340-40 (ASC 340-40-15-3), even though Trebarwith bought it
    only for this contract.
answer: A
explanation: 'The commission is an incremental cost of obtaining the contract, and the configuration labor
  meets the criteria for a cost to fulfill a contract (ASC 340-40-25-1 to 25-8); both are capitalized
  and amortized from March 1, when the related services begin, over the 36-month term: ($54,000 + $72,000)
  × 26/36 = $91,000. The forklifts is property, plant and equipment Trebarwith will use beyond this contract,
  within the scope of ASC 360 (ASC 340-40-15-3), and the packing materials is inventory within the scope
  of ASC 330 until consumed; neither is a contract cost asset under ASC 340-40, even though both relate
  to this contract.'
