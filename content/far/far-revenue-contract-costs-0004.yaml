id: far-revenue-contract-costs-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - ASC 340-40-15-3 (costs within the scope of another Topic)
  - ASC 340-40-25-1 to 25-8 (incremental costs of obtaining a contract; costs to fulfill a contract)
  - ASC 340-40-35-1 (amortization)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: On January 1, Year 1, Trebarwith Systems Co. signed a three-year contract to run a customer's outbound
  logistics, with services beginning March 1, Year 1, and running 36 months; renewal isn't expected. On
  signing, Trebarwith paid its salesperson a $54,000 commission on the contract. Before services began,
  it spent $72,000 on technician labor configuring the customer's shipment-tracking workflows on Trebarwith's
  platform; the setup gives the customer nothing it can use on its own, and the monthly fees are priced
  to recover it. Trebarwith also bought $36,000 of forklifts that it will use on this customer's account
  and move to other jobs when the contract ends, and $7,200 of packing materials that will be used up
  in providing the services. Trebarwith amortizes any capitalized contract cost straight-line by month
  over the period of the services it relates to. What amortization of contract cost assets should Trebarwith
  recognize for Year 1?
choices:
- id: A
  text: $15,000
  rationale: Amortizes only the commission, expensing the $72,000 of configuration labor as incurred.
    That labor relates directly to this contract, sets up the resources Trebarwith uses to serve the customer,
    and is recovered through the fees, so it is a capitalized cost to fulfill the contract (ASC 340-40-25-5).
- id: B
  text: $35,000
  rationale: Correct. ($54,000 + $72,000) × 10/36.
- id: C
  text: $42,000
  rationale: 'Amortizes from the January 1 signing date, 12 months, instead of from March 1, when services
    began. A contract cost asset is amortized as the services it relates to are transferred (ASC 340-40-35-1),
    so amortization starts with the services: 10 months.'
- id: D
  text: $45,000
  rationale: Adds the $36,000 of forklifts to the contract cost asset and amortizes it over the contract.
    Equipment Trebarwith will redeploy after the contract is property, plant and equipment within ASC
    360, outside ASC 340-40 (ASC 340-40-15-3), and is depreciated, not amortized as a contract cost.
answer: B
explanation: 'The commission is an incremental cost of obtaining the contract, and the configuration labor
  is a cost to fulfill it: it relates directly to the contract, creates resources Trebarwith will use
  to provide the services, and is recovered through the fees (ASC 340-40-25-1 to 25-8). Both are capitalized,
  $54,000 + $72,000 = $126,000, and amortized over the 36 months of services starting March 1 (ASC 340-40-35-1):
  $126,000 × 10/36 = $35,000. The forklifts are property, plant and equipment within ASC 360 and the packing
  materials are inventory within ASC 330, so neither is a contract cost asset (ASC 340-40-15-3), even
  though both were bought for this contract.'
