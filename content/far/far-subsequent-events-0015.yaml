id: far-subsequent-events-0015
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Application
review:
  status: draft
  references:
  - 'ASC 855-10-25-1 and 855-10-55-1 (recognized subsequent events: a customer''s bankruptcy from deterioration
    before year-end)'
  - ASC 855-10-25-3 (nonrecognized subsequent events)
  - ASC 326-20-30 (expected credit losses)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Marrowbrook Supply Co.'s draft Year 1 income before income taxes is $1,860,000. Its allowance for
  credit losses at December 31, Year 1, includes $30,000 for the $220,000 owed by Hollins Retail, a customer
  that had reported losses in each quarter of Year 1 and had paid its last three invoices of the year
  more than 90 days late. On January 17, Year 2, Hollins Retail filed for bankruptcy, and Marrowbrook
  now expects to collect $44,000 of the balance. On February 8, Year 2, Marrowbrook's board declared a
  cash dividend of $90,000. The statements will be issued in March, Year 2, and Marrowbrook has not elected
  the ASU 2025-05 practical expedient for current receivables. Ignore income taxes. What income before
  income taxes should Marrowbrook report for Year 1?
choices:
- id: A
  text: $1,624,000
  rationale: Also deducts the $90,000 dividend declared in February. A dividend declared after year-end
    is a Year 2 distribution, not a Year 1 expense; it is disclosed.
- id: B
  text: $1,670,000
  rationale: Writes off the whole $220,000 balance, ignoring the $44,000 Marrowbrook still expects to
    collect from the bankruptcy estate.
- id: C
  text: $1,684,000
  rationale: Charges the full $176,000 expected shortfall to Year 1 income without counting the $30,000
    already provided for this customer in the year-end allowance.
- id: D
  text: $1,714,000
  rationale: Correct. $1,860,000 − ($220,000 − $44,000 expected recovery − $30,000 already allowed).
answer: D
explanation: 'The bankruptcy resulted from financial difficulties that existed at December 31, so it is
  evidence about the year-end allowance and is recognized (ASC 855-10-55-1; ASC 326-20-30): expected loss
  on the balance = $220,000 − $44,000 = $176,000, of which $30,000 is already in the allowance, so Year
  1 credit loss expense rises by $146,000. The dividend, declared after year-end, is a nonrecognized subsequent
  event, disclosed but not reflected in Year 1 (ASC 855-10-25-3); a dividend isn''t an expense in any
  case. Income before income taxes = $1,860,000 − $146,000 = $1,714,000.'
