id: far-subsequent-events-0015
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Application
review:
  status: draft
  references:
  - 'ASC 855-10-25-1 (recognized subsequent events: better evidence of amounts arising from conditions
    at year-end)'
  - ASC 855-10-25-3 (nonrecognized subsequent events)
  - ASC 606-10-55-65 (sales-based royalties recognized as the licensee's sales occur)
  - ASC 705-20-25 (vendor rebates reduce the cost of purchases)
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'Marrowbrook Instruments Co.''s draft Year 1 income before income taxes is $1,860,000; the statements
  will be issued on March 9, Year 2. The draft includes $128,000 of royalty revenue that Marrowbrook estimated
  at year-end under a license that pays it 5% of a licensee''s sales of products made with Marrowbrook''s
  technology. It also includes, as a reduction of cost of goods sold, a $36,000 volume rebate Marrowbrook
  estimated it had earned on its Year 1 purchases from its main supplier; all of the goods bought from
  that supplier in Year 1 were sold during the year. Before the statements are issued: on January 24,
  the licensee''s annual royalty report showed Year 1 sales of $2,840,000 of the licensed products; on
  January 29, the supplier''s final statement fixed the Year 1 rebate at $51,000, paid in February; and
  on February 11, the licensee announced that it will stop selling the licensed products in April, Year
  2, which Marrowbrook expects to reduce its Year 2 royalties by $95,000. Ignore income taxes. What income
  before income taxes should Marrowbrook report for Year 1?'
choices:
- id: A
  text: $1,794,000
  rationale: Also deducts the $95,000 fall in expected Year 2 royalties. The licensee's decision came
    after year-end and affects only royalties on its Year 2 sales, which Marrowbrook recognizes only as
    those sales occur; it is a nonrecognized subsequent event.
- id: B
  text: $1,875,000
  rationale: Keeps the $128,000 royalty estimate. The licensee's report shows what its Year 1 sales actually
    were, a condition that existed at year-end, so Year 1 royalty revenue is adjusted to 5% × $2,840,000
    = $142,000.
- id: C
  text: $1,889,000
  rationale: Correct. $1,860,000 + $14,000 royalty true-up + $15,000 rebate true-up; the Year 2 royalty
    decline isn't recognized.
- id: D
  text: $1,925,000
  rationale: Adds the whole $51,000 final rebate without removing the $36,000 already accrued, counting
    part of the rebate twice.
answer: C
explanation: The royalty report and the rebate statement give better evidence of amounts that arose from
  Year 1 activity, conditions that existed at December 31, so both are recognized subsequent events (ASC
  855-10-25-1). A sales-based royalty is recognized as the licensee's sales occur (ASC 606-10-55-65),
  so Year 1 royalty revenue is 5% × $2,840,000 = $142,000, a change of +$14,000 from the $128,000 estimate.
  A vendor rebate reduces the cost of the purchases that earned it (ASC 705-20-25); the goods were all
  sold, so the $51,000 − $36,000 = $15,000 increase reduces Year 1 cost of goods sold. The licensee's
  decision to stop selling arose after year-end and affects only Year 2 royalties; it is a nonrecognized
  subsequent event, disclosed if material (ASC 855-10-25-3). Income before income taxes = $1,860,000 +
  $14,000 + $15,000 = $1,889,000.
