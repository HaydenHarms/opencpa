id: far-subsequent-events-0015
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Application
review:
  status: draft
  references:
  - ASC 855-10-25 (subsequent event confirming a condition that existed at the balance sheet date)
  - 'ASC 855-10-50 (nonrecognized subsequent events: dividend declarations)'
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Marrowbrook Supply Co.'s draft Year 1 income before income taxes is $1,860,000, which reflects a
  $140,000 accrual for a lawsuit over a Year 1 incident at one of Marrowbrook's facilities. Before the
  financial statements are issued, Marrowbrook settled the suit for $205,000. Separately, in February,
  Marrowbrook's board declared a $90,000 cash dividend. Ignore income taxes. What income before income
  taxes should Marrowbrook report for Year 1?
choices:
- id: A
  text: $1,655,000
  rationale: Deducts the full $205,000 settlement instead of only the $65,000 by which it exceeds the
    $140,000 already accrued.
- id: B
  text: $1,795,000
  rationale: Correct. $1,860,000 − ($205,000 − $140,000).
- id: C
  text: $1,860,000
  rationale: Leaves the draft $1,860,000 unchanged. The settlement confirms that Marrowbrook owed more
    than the $140,000 it had accrued for a condition that existed at year-end.
- id: D
  text: $1,925,000
  rationale: Adds the $65,000 instead of subtracting it. The suit settled for more than Marrowbrook had
    accrued, so the additional $65,000 is an additional expense.
answer: B
explanation: 'The settlement confirms conditions that existed at year-end and provides a better estimate
  of the liability, so it is recognized: the additional $205,000 − $140,000 = $65,000 of expense is recorded.
  The dividend declaration is a nonrecognized subsequent event, disclosed but not reflected in Year 1
  income. Corrected income before income taxes = $1,860,000 − $65,000 = $1,795,000.'
