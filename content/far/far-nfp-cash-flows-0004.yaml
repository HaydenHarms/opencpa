id: far-nfp-cash-flows-0004
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-230-55 (not-for-profit statement of cash flows)
  - ASC 230-10-45-14 and 45-21A (contributions restricted to long-lived assets; sales of donated financial
    assets)
  - ASC 230-10-50 (noncash investing and financing activities)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: During Year 1, Pinchbeck Research Institute, a not-for-profit entity, bought laboratory equipment
  for $420,000 in cash and bought marketable securities for its endowment for $650,000. It sold other
  investments, with a carrying amount of $230,000, for $275,000. It received $300,000 in cash from a donor
  who stipulated that the gift be used to buy equipment, and $38,000 of interest and dividends on its
  endowment investments, which the donors allowed Pinchbeck to spend for any purpose. A donor gave Pinchbeck
  shares of stock with no restrictions, and under its policy of converting donated securities into cash
  on receipt, Pinchbeck sold them four days later for $64,000. Another donor gave it land with a fair
  value of $500,000. What net cash used in investing activities should Pinchbeck report in its Year 1
  statement of cash flows?
choices:
- id: A
  text: $495,000
  rationale: Reports the $300,000 gift restricted to buying equipment as an investing inflow. Cash contributions
    restricted to acquiring long-lived assets are financing inflows.
- id: B
  text: $731,000
  rationale: Reports the $64,000 from selling the donated shares as an investing inflow. Donated securities
    received without restrictions and converted into cash almost immediately produce an operating cash
    inflow.
- id: C
  text: $757,000
  rationale: Reports the $38,000 of interest and dividends as an investing inflow. Investment income without
    donor restrictions is an operating cash flow.
- id: D
  text: $795,000
  rationale: Correct. $420,000 equipment + $650,000 endowment securities − $275,000 proceeds from investments
    sold.
answer: D
explanation: 'Investing activities: equipment bought (− $420,000), endowment securities bought (− $650,000)
  and proceeds from investments sold (+ $275,000), for net cash used of $795,000. The gift restricted
  to buying equipment is a financing inflow. Interest and dividends that can be spent for any purpose
  are operating inflows, and so is the $64,000 from donated shares that came without restrictions and
  were sold almost at once. The donated land is a noncash transaction, disclosed rather than reported
  in the statement.'
