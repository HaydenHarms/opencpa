id: far-changes-in-equity-0003
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of changes in equity
  skill: Application
review:
  status: reviewed
  references:
  - ASC 505-10 (equity)
  - ASC 505-20 (stock dividends)
  - ASC 505-30 (treasury stock)
  - ASC 220-10 (other comprehensive income)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Marston Inc.'s total stockholders' equity was $2,400,000 at January 1, Year 2. During Year 2, Marston
  reported net income of $350,000; declared cash dividends of $90,000, of which $60,000 had been paid
  by December 31; distributed a 10% stock dividend when the shares distributed had a fair value of $150,000;
  bought treasury shares for $120,000 and later reissued treasury shares that had cost $60,000 for $75,000;
  reported other comprehensive income of $25,000, net of tax, from an unrealized holding gain on available-for-sale
  debt securities; and issued new common shares for $180,000 in cash. What total stockholders' equity
  should Marston report at December 31, Year 2?
choices:
- id: A
  text: $2,670,000
  rationale: Subtracts the $150,000 stock dividend. A stock dividend moves amounts from retained earnings
    to paid-in capital and doesn't change total equity.
- id: B
  text: $2,795,000
  rationale: Leaves out the $25,000 of other comprehensive income. It isn't in net income, but it increases
    accumulated other comprehensive income, part of equity.
- id: C
  text: $2,820,000
  rationale: Correct. $2,400,000 + $350,000 − $90,000 − $120,000 + $75,000 + $25,000 + $180,000.
- id: D
  text: $2,850,000
  rationale: Subtracts only the $60,000 of dividends paid. Equity falls by the full $90,000 declared;
    the unpaid part is a liability.
answer: C
explanation: Total equity rises by net income ($350,000), other comprehensive income ($25,000), the $180,000
  share issuance and the $75,000 received on reissuing treasury shares. It falls by dividends declared
  ($90,000; whether paid doesn't matter) and the $120,000 treasury share purchase. The stock dividend
  only reclassifies amounts within equity. $2,400,000 + $350,000 − $90,000 − $120,000 + $75,000 + $25,000
  + $180,000 = $2,820,000.
