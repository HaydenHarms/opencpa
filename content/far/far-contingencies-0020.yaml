id: far-contingencies-0020
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 450-20 (loss contingencies: recognition and measurement)'
  notes: Batch 18. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Marchwood Fabrication Co.''s attorney believes it is probable that Marchwood Fabrication Co. will
  have to pay damages to a former customer in a pending lawsuit, and estimates three possible outcomes:
  a 20% chance of $200,000, a 50% chance of $350,000 and a 30% chance of $500,000. No settlement offer
  has been made. What amount should Marchwood Fabrication Co. accrue for this loss contingency?'
choices:
- id: A
  text: $200,000
  rationale: Accrues the smallest amount in the range of possible outcomes. A single amount, $350,000,
    is more likely than any other single amount, so Marchwood Fabrication Co. accrues that amount rather
    than the range minimum.
- id: B
  text: $350,000
  rationale: Correct. Marchwood Fabrication Co.'s attorney believes it is probable that Marchwood Fabrication
    Co. will have to pay a former customer, and $350,000 is the single most likely amount, with a 50%
    likelihood against 20% for $200,000 and 30% for $500,000. When a loss is probable and a single amount
    within a range of possible outcomes is a better estimate than any other, Marchwood Fabrication Co.
    accrues that amount rather than a probability-weighted average of the outcomes (ASC 450-20).
- id: C
  text: $365,000
  rationale: Accrues the probability-weighted expected value of the three outcomes (20% × $200,000 + 50%
    × $350,000 + 30% × $500,000 = $365,000) rather than the single most likely amount. GAAP does not use
    a probability-weighted average to measure a loss contingency; it accrues the single amount within
    a range that is a better estimate than any other, or, when no amount is a better estimate, the range
    minimum.
- id: D
  text: $500,000
  rationale: Accrues the largest amount in the range of possible outcomes. A single amount, $350,000,
    is more likely than any other single amount, so Marchwood Fabrication Co. accrues that amount rather
    than the range maximum.
answer: B
explanation: Correct. Marchwood Fabrication Co.'s attorney believes it is probable that Marchwood Fabrication
  Co. will have to pay a former customer, and $350,000 is the single most likely amount, with a 50% likelihood
  against 20% for $200,000 and 30% for $500,000. When a loss is probable and a single amount within a
  range of possible outcomes is a better estimate than any other, Marchwood Fabrication Co. accrues that
  amount rather than a probability-weighted average of the outcomes (ASC 450-20).
