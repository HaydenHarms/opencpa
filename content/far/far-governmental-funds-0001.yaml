id: far-governmental-funds-0001
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: State and local government concepts
  skill: Remembering and Understanding
review:
  status: reviewed
  references:
  - GASB Statement No. 34
  - GASB Codification 1800
  notes: Batch 01, revised after independent quality review. Adapted from legacy bank; answers re-solved,
    arithmetic checked in code, distractors rebuilt where needed.
stem: Riverside County issues $5,000,000 of general obligation bonds and uses the proceeds to build a
  courthouse. How is this reported in the governmental fund statements versus the government-wide statements?
choices:
- id: A
  text: 'Governmental funds: a long-term liability and a capitalized courthouse. Government-wide: an other
    financing source and a capital outlay expenditure.'
  rationale: Reverses the two measurement focuses.
- id: B
  text: 'Governmental funds: bond proceeds as revenue and the bonds as a fund liability. Government-wide:
    the same treatment, with depreciation added.'
  rationale: Bond proceeds are never revenue, and general long-term debt is not a governmental fund liability.
- id: C
  text: 'Governmental funds: an other financing source and capital outlay. Government-wide: a long-term
    liability and a depreciable capital asset.'
  rationale: Correct. Funds use the current financial resources focus; government-wide statements use
    the economic resources focus and full accrual.
- id: D
  text: 'Governmental funds: an other financing source and the bonds as a fund liability. Government-wide:
    the courthouse is expensed when completed.'
  rationale: Governmental funds do not report general long-term debt, and government-wide statements capitalize
    capital assets.
answer: C
explanation: Governmental funds (modified accrual, current financial resources) report the proceeds as
  an other financing source and construction as capital outlay expenditures; neither the debt nor the
  asset appears in the fund. Government-wide statements (full accrual, economic resources) report the
  bonds as a long-term liability and the courthouse as a depreciable capital asset.
