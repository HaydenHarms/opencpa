id: far-receivables-credit-losses-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 326-20 (current expected credit losses: loss-rate method by aging; write-offs and recoveries)'
  - 'ASU 2025-05 (practical expedient for current accounts receivable and contract assets: conditions
    at the balance sheet date assumed to persist; elected here)'
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Falstone Supply Corp., a public business entity, has adopted ASU 2025-05 and elects its practical
  expedient for current trade receivables. Its allowance for credit losses had a credit balance of $52,000
  at January 1, Year 2. During Year 2, Falstone wrote off $31,000 of customer accounts and collected $4,500
  on an account it had written off in Year 1. Its December 31, Year 2, aging of trade receivables, all
  due within 60 days of sale, with loss rates based on its historical loss experience adjusted for conditions
  at year-end, is: not yet due, $1,240,000 (0.8%); 1 to 30 days past due, $386,000 (3%); 31 to 90 days
  past due, $142,000 (12%); more than 90 days past due, $58,000 (45%). Its economists'' reasonable and
  supportable forecast calls for a recession in Year 3 that would add 1 percentage point to each loss
  rate. What credit loss expense should Falstone recognize for Year 2?'
choices:
- id: A
  text: $39,140
  rationale: Correct. $64,640 required − ($52,000 − $31,000 + $4,500).
- id: B
  text: $43,640
  rationale: Ignores the $4,500 recovery. Collecting an account written off earlier reinstates it and
    credits the allowance, which reduces the expense needed.
- id: C
  text: $57,400
  rationale: Adds the forecast increase of 1 percentage point to each rate. Under the practical expedient
    Falstone elected, it assumes the conditions at the balance sheet date continue for the receivables'
    remaining lives, so it adjusts historical losses for current conditions only.
- id: D
  text: $64,640
  rationale: Records the whole required allowance of $64,640 as expense. Expense is the amount needed
    to bring the existing balance ($25,500) up to $64,640.
answer: A
explanation: 'Required allowance: $9,920 + $11,580 + $17,040 + $26,100 = $64,640. With the ASU 2025-05
  practical expedient, Falstone assumes the conditions at the balance sheet date persist over the receivables''
  remaining lives, so the recession forecast isn''t added to the rates. Allowance before adjustment =
  $52,000 − $31,000 write-offs + $4,500 recovery = $25,500. Credit loss expense = $64,640 − $25,500 =
  $39,140.'
