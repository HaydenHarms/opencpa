id: far-ppe-reconciliation-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 360-10 (property, plant and equipment; retirements; repairs and maintenance)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Pryor Co.''s fixed-asset subledger shows total equipment cost of $3,262,000, while
  the general ledger equipment account shows $3,400,000. The controller''s investigation finds: a fully
  depreciated machine that cost $75,000 was scrapped in June and removed from the subledger, but no entry
  was made in the general ledger; $18,000 of routine maintenance was debited to the equipment account
  in the general ledger; and a machine costing $45,000, placed in service on December 28, was recorded
  in the general ledger but hasn''t yet been added to the subledger. What should the corrected equipment
  cost balance be at December 31?'
choices:
- id: A
  text: $3,262,000
  rationale: Uses the subledger as recorded. It still lacks the $45,000 machine placed in service on December
    28.
- id: B
  text: $3,307,000
  rationale: Correct. $3,400,000 − $75,000 scrapped machine − $18,000 maintenance, which equals the subledger
    $3,262,000 + $45,000.
- id: C
  text: $3,325,000
  rationale: Removes the scrapped machine but leaves the $18,000 of routine maintenance, which is an expense.
- id: D
  text: $3,382,000
  rationale: Removes the maintenance but not the scrapped machine. Retiring a fully depreciated asset
    removes its $75,000 cost from the account.
answer: B
explanation: 'General ledger: $3,400,000 − $75,000 cost of the scrapped machine (its accumulated depreciation
  is removed too) − $18,000 maintenance, which is expense = $3,307,000. Subledger: $3,262,000 + $45,000
  new machine = $3,307,000. The records now agree.'
