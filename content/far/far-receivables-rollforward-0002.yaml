id: far-receivables-rollforward-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 326-20 (allowance for credit losses; write-offs and recoveries)
  - ASC 310-10 (receivables)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Linwood Co. is preparing rollforwards of its trade receivables and its allowance for credit losses
  for Year 2. Per the aged subledger, accounts receivable were $400,000 at January 1 and $436,000 at December
  31. Credit sales were $2,000,000. Cash collected from customers was $1,940,000, which includes $4,000
  received on accounts written off in earlier years; Linwood reinstates such an account before recording
  the collection. The allowance was $30,000 at January 1, and Linwood's expected credit loss estimate
  requires a balance of $36,000 at December 31. The year's write-offs are not separately recorded in the
  rollforward schedules. What credit loss expense should Linwood record for Year 2?
choices:
- id: A
  text: $26,000
  rationale: Leaves the reinstatements out of the receivables rollforward, so write-offs come out $4,000
    too low ($24,000).
- id: B
  text: $30,000
  rationale: Correct. Write-offs $28,000; expense = $36,000 − $30,000 + $28,000 − $4,000.
- id: C
  text: $34,000
  rationale: Ignores the $4,000 of recoveries in the allowance rollforward. Reinstating a written-off
    account credits the allowance.
- id: D
  text: $36,000
  rationale: Uses the required $36,000 ending allowance as the expense, ignoring the balance already in
    the allowance.
answer: B
explanation: 'Receivables rollforward: $400,000 + $2,000,000 credit sales + $4,000 reinstated − $1,940,000
  collected − write-offs = $436,000, so write-offs are $28,000. Allowance rollforward: $30,000 − $28,000
  write-offs + $4,000 recoveries + expense = $36,000, so credit loss expense is $30,000.'
