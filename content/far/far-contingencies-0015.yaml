id: far-contingencies-0015
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: draft
  references:
  - ASC 450-20-25-2 and 450-20-50-6 (accrual of loss contingencies, including unasserted claims)
  - 'ASC 450-20-30-1 (range of loss with no best estimate: accrue the minimum)'
  - ASC 250-10-45-17 (change in estimate)
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: At the start of the year, Oldcastle Mills Co. had a $180,000 liability for a customer's lawsuit
  over a defect in a product it sold two years ago. During the year, Oldcastle paid $70,000 toward the
  case under an interim agreement and, based on new evidence, revised its estimate of the suit's total
  cost upward by $55,000. In November, Oldcastle recalled a space heater model after reports that a faulty
  thermostat had damaged customers' property. No customer has filed a claim yet, but 312 customers have
  reported damage to Oldcastle's hotline, and in its two earlier recalls Oldcastle paid nearly every reported
  claim. Counsel's letter puts the total at between $60,000 and $140,000, with no amount in that range
  a better estimate than any other. What total liability for the lawsuit and the recall claims should
  Oldcastle report at year-end?
choices:
- id: A
  text: $165,000
  rationale: Accrues nothing for the recall claims because no customer has filed one yet. An unasserted
    claim is accrued when its assertion and an unfavorable outcome are both probable and the loss can
    be estimated, as counsel's letter indicates here.
- id: B
  text: $225,000
  rationale: Correct. Lawsuit $165,000 ($180,000 − $70,000 + $55,000) + recall claims at the $60,000 minimum.
- id: C
  text: $265,000
  rationale: Accrues the $100,000 midpoint of the range for the recall claims. When no amount in a range
    is a better estimate than another, the minimum, $60,000, is accrued (ASC 450-20-30-1).
- id: D
  text: $295,000
  rationale: Doesn't reduce the lawsuit accrual for the $70,000 already paid; those payments settle part
    of the liability.
answer: B
explanation: 'Lawsuit: the liability rolls forward from the opening $180,000, less the $70,000 paid, plus
  the $55,000 increase in the estimated total cost, a change in estimate recognized in the current year:
  $165,000. Recall claims: an unasserted claim is accrued when it is probable that the claim will be asserted
  and that the outcome will be unfavorable, and the loss can be reasonably estimated (ASC 450-20-25-2,
  450-20-50-6); customers are reporting damage and Oldcastle has paid nearly every reported claim in past
  recalls, so both are probable, and counsel''s range estimates the loss. With no best estimate in the
  range, the minimum, $60,000, is accrued and the possible additional loss is disclosed (ASC 450-20-30-1).
  Total liability = $165,000 + $60,000 = $225,000.'
