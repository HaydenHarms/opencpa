id: far-contingencies-0015
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 450-20-25 (loss contingencies: accrual when probable and estimable)'
  - ASC 460-10 (product warranties)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Oldcastle Mills Co. had accrued $180,000 at the start of the year for a lawsuit over a Year 1 defect
  in its products. During the year, Oldcastle paid $70,000 toward the case and, based on a revised assessment,
  increased its remaining estimate of the total cost by $55,000. Separately, Oldcastle sold $2,600,000
  of products during the year that carry a one-year warranty included in the price; based on experience,
  Oldcastle estimates warranty costs at 4% of sales, and it paid $38,000 of warranty claims on those sales
  during the year. What total liability for the litigation and the warranty should Oldcastle report at
  year-end?
choices:
- id: A
  text: $176,000
  rationale: Leaves out the $55,000 that Oldcastle must add to the litigation accrual because the case
    turned out to cost more than the $180,000 first estimated.
- id: B
  text: $231,000
  rationale: Correct. Litigation $165,000 + warranty $66,000.
- id: C
  text: $269,000
  rationale: Doesn't reduce the warranty estimate for the $38,000 of claims Oldcastle already paid during
    the year.
- id: D
  text: $301,000
  rationale: Doesn't reduce the litigation accrual for the $70,000 already paid toward the settlement
    during the year.
answer: B
explanation: Litigation liability = $180,000 beginning accrual − $70,000 paid + $55,000 added for the
  revised estimate = $165,000. Warranty liability = 4% × $2,600,000 of covered sales − $38,000 of claims
  already paid = $66,000. Total liability = $165,000 + $66,000 = $231,000.
