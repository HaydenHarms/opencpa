id: far-accounting-errors-0011
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: draft
  references:
  - 'ASC 450-20-25 (customer rebate programs: liability for amounts estimable on sales made)'
  - ASC 440-10 (purchase commitments not liabilities until performance)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Thistlewood Retail Co.'s draft December 31, Year 2, balance sheet reports total liabilities of $4,860,000.
  Reviewing the records before the statements are issued, the controller finds two errors. First, Thistlewood
  offers customers a cash rebate on store-brand appliances purchased during the year, redeemable through
  June of next year; Thistlewood can reasonably estimate that $84,000 of rebates will be claimed on Year
  2 sales, but nothing has been accrued. Second, the draft includes, as a recorded liability, a $52,000
  purchase order that Thistlewood issued on December 29 for replacement parts the supplier will ship FOB
  shipping point in mid-January. What total liabilities should Thistlewood's corrected balance sheet report
  at December 31, Year 2?
choices:
- id: A
  text: $4,808,000
  rationale: Leaves out the $84,000 customer rebate liability that Thistlewood never accrued, even though
    it owes the rebates on sales already made.
- id: B
  text: $4,828,000
  rationale: Subtracts the $84,000 rebate liability and adds the $52,000 purchase order, the opposite
    of the correction each error needs.
- id: C
  text: $4,892,000
  rationale: Correct. $4,860,000 + $84,000 − $52,000.
- id: D
  text: $4,944,000
  rationale: Leaves the $52,000 purchase order in the draft total. Thistlewood owes nothing until the
    supplier ships the goods, so a mere order is a commitment, not a liability.
answer: C
explanation: The rebate program obligates Thistlewood to pay amounts it can estimate on sales already
  made, so the $84,000 of expected rebates is accrued as a liability (ASC 450-20-25). The purchase order
  isn't a liability until the supplier performs by shipping the goods (FOB shipping point means that hasn't
  happened); it is removed. Corrected total liabilities = $4,860,000 + $84,000 − $52,000 = $4,892,000.
