id: far-accounting-errors-0011
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: draft
  references:
  - 'ASC 440-10 (purchase commitments: executory until performance)'
  - FASB Concepts Statement No. 8, chapter 4 (definition of a liability; dividends payable on declaration)
  - 'ASC 606-10-25-30 (transfer of control: shipping terms)'
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Thistlewood Retail Co.'s draft December 31, Year 2, balance sheet reports total liabilities of $1,860,000.
  Before the statements are issued, the controller questions three items. Accounts payable includes $52,000
  for a purchase order Thistlewood issued on December 29 for replacement parts that the supplier will
  ship, FOB shipping point, in mid-January. On December 18, Thistlewood's board declared a cash dividend
  of $0.60 a share on its common stock, payable January 20, Year 3; Thistlewood has 225,000 common shares
  issued, 15,000 of them held in treasury, and records dividends when it pays them. Accounts payable also
  includes a $38,000 supplier invoice for display racks that were shipped FOB destination and delivered
  to Thistlewood's store on December 30. What total liabilities should the corrected balance sheet report?
choices:
- id: A
  text: $1,808,000
  rationale: Leaves out the dividend. A cash dividend becomes a liability when the board declares it,
    so the $126,000 ($0.60 × 210,000 outstanding shares) is owed at December 31 even though it is paid
    in January.
- id: B
  text: $1,860,000
  rationale: Accepts the draft total. The purchase order isn't a liability, and the declared dividend
    is one.
- id: C
  text: $1,896,000
  rationale: Also removes the $38,000 invoice for the display racks. The display racks were shipped FOB
    destination and delivered on December 30, so Thistlewood owned them, and owed for them, at year-end.
- id: D
  text: $1,934,000
  rationale: Correct. $1,860,000 − $52,000 purchase order + $126,000 dividend payable.
answer: D
explanation: 'A purchase order is an executory contract: until the supplier performs by shipping the goods,
  Thistlewood has no present obligation, so the $52,000 comes out of accounts payable (ASC 440-10). A
  declared cash dividend is a present obligation from the declaration date (FASB Concepts Statement No.
  8, chapter 4), so $0.60 × 210,000 outstanding shares (treasury shares receive no dividend) = $126,000
  is added as a dividend payable. Goods shipped FOB destination transfer to the buyer on delivery; the
  display racks arrived on December 30, so that invoice is correctly in accounts payable. Corrected total
  liabilities = $1,860,000 − $52,000 + $126,000 = $1,934,000.'
