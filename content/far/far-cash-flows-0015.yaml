id: far-cash-flows-0015
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 230-10-45 (direct method: cash paid to suppliers)'
  - ASC 230-10-50-3 (noncash investing and financing activities)
  - ASC 330-10-35 (inventory write-down to net realizable value)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: Craster Trading Co. buys all of its merchandise on account. For Year 2 it reports cost of goods
  sold of $2,840,000, which includes a $46,000 write-down of obsolete goods to net realizable value at
  December 31. Inventory was $512,000 at January 1 and $578,000, after the write-down, at December 31.
  Accounts payable to suppliers was $294,000 at January 1 and $331,000 at December 31. In October, a supplier
  agreed to accept a two-year interest-bearing note payable in settlement of $85,000 that Craster owed
  it on account. What cash paid to suppliers should Craster report in the operating section of its Year
  2 statement of cash flows under the direct method?
choices:
- id: A
  text: $2,652,000
  rationale: Subtracts the $66,000 increase in inventory from cost of goods sold. Inventory rose, so purchases
    exceeded cost of goods sold.
- id: B
  text: $2,718,000
  rationale: Starts from cost of goods sold without adjusting for the $66,000 increase in inventory. Purchases
    = cost of goods sold + the increase in inventory.
- id: C
  text: $2,738,000
  rationale: Deducts the $46,000 write-down as a noncash part of cost of goods sold. Ending inventory
    is already net of the write-down, so cost of goods sold + ending inventory − beginning inventory gives
    purchases without any further adjustment.
- id: D
  text: $2,784,000
  rationale: Correct. Purchases $2,906,000 − $37,000 increase in payables − $85,000 settled by note.
answer: D
explanation: 'Purchases = cost of goods sold + ending inventory − beginning inventory = $2,840,000 + $578,000
  − $512,000 = $2,906,000. The write-down is in both cost of goods sold and the reduced ending inventory,
  so this identity already accounts for it. Accounts payable: $294,000 + $2,906,000 − payments − $85,000
  settled by the note = $331,000, so cash paid = $2,906,000 − $37,000 − $85,000 = $2,784,000. The note
  is a noncash financing activity.'
