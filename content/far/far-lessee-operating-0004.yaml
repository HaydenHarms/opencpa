id: far-lessee-operating-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: reviewed
  references:
  - ASC 842-20 (lessee initial measurement of the lease liability and right-of-use asset)
  - ASC 842-10 (initial direct costs; lease incentives)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Thornaby Co., a public business entity, signs an 8-year lease of office space,
  which begins that day and which Thornaby classifies as an operating lease. Annual payments of $50,000
  are due each January 1, beginning at commencement, and Thornaby made the first payment on January 1,
  Year 1. The rate implicit in the lease isn't readily determinable, and Thornaby's incremental borrowing
  rate is 7%. At commencement, Thornaby paid a leasing agent a $6,000 commission that was due only upon
  signing and paid $3,000 of outside legal fees for negotiating the lease terms, and the lessor paid Thornaby
  $10,000 in cash as an incentive to sign. Present value factors at 7% for 8 periods are 6.3893 for an
  annuity due and 5.9713 for an ordinary annuity. At what amount should Thornaby initially measure its
  right-of-use asset?
choices:
- id: A
  text: $269,465
  rationale: Reports the $269,465 lease liability. The right-of-use asset also includes the payment made
    at commencement and initial direct costs, less incentives received.
- id: B
  text: $309,465
  rationale: Leaves out the $6,000 commission. A commission owed only because the lease was signed is
    an initial direct cost, added to the right-of-use asset.
- id: C
  text: $315,465
  rationale: Correct. $50,000 × 6.3893 = $319,465, + $6,000 commission − $10,000 incentive.
- id: D
  text: $325,465
  rationale: Doesn't subtract the $10,000 incentive received from the lessor. Lease incentives received
    reduce the right-of-use asset.
answer: C
explanation: 'The lease liability is the present value of the payments not yet made: $50,000 × 6.3893
  = $319,465 for all 8 payments, less the $50,000 paid at commencement, = $269,465. The right-of-use asset
  = the liability + payments made at or before commencement + initial direct costs − lease incentives
  received = $269,465 + $50,000 + $6,000 − $10,000 = $315,465. The commission is an initial direct cost
  because it was owed only if the lease was signed; the legal fees for negotiating the terms are not,
  and are expensed.'
