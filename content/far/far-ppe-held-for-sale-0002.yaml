id: far-ppe-held-for-sale-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Application
review:
  status: reviewed
  references:
  - ASC 360-10-45 (long-lived assets classified as held for sale)
  - 'ASC 360-10-55 (implementation guidance: usual and customary terms)'
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Jolliffe Co. is preparing its December 31, Year 1, balance sheet, which will be issued on March
  1, Year 2. Each asset below has a fair value less cost to sell above its carrying amount. (1) A warehouse,
  carrying amount $640,000: in October, management with the authority to do so approved its sale; it is
  vacant and listed with a broker at a price in line with recent sales of similar warehouses, and a sale
  is expected by mid-Year 2. (2) Delivery trucks, $210,000: management approved their sale in December,
  but Jolliffe will keep using them until replacement trucks arrive in June, Year 2, and will list them
  then. (3) An office building, $1,150,000: approved for sale in September and listed since then at a
  price 40% above its appraised fair value; no offers have been received, and Jolliffe hasn''t lowered
  the price. (4) Packaging equipment, $175,000: idle since November; the board approved its sale, and
  Jolliffe began marketing it at a reasonable price, on January 15, Year 2. (5) Jolliffe''s headquarters
  building, $2,300,000: approved for sale in November and marketed at a price in line with comparable
  sales; a buyer''s offer was accepted in December and the sale should close in February, Year 2, and
  Jolliffe will vacate the building at closing, moving to leased offices that are already prepared. The
  plans are not expected to change. What total carrying amount should Jolliffe report as assets held for
  sale at December 31, Year 1?'
choices:
- id: A
  text: $640,000
  rationale: Leaves out the headquarters building because Jolliffe still occupies it. Staying only until
    a closing and then moving out within the usual time doesn't stop the building from being available
    for immediate sale.
- id: B
  text: $2,940,000
  rationale: Correct. Warehouse $640,000 + headquarters building $2,300,000.
- id: C
  text: $3,115,000
  rationale: Includes the packaging equipment. Its plan was approved and marketing began on January 15,
    Year 2; when the criteria are first met after the balance sheet date, the asset stays held and used
    at December 31.
- id: D
  text: $4,090,000
  rationale: Includes the office building. An asking price 40% above fair value, unchanged despite no
    offers, isn't a price reasonable in relation to fair value, so a sale within a year isn't probable.
answer: B
explanation: 'An asset is classified as held for sale when management with authority commits to a plan,
  the asset is available for immediate sale in its present condition (subject only to usual and customary
  terms), an active program to find a buyer has begun, the sale is probable within one year, the price
  is reasonable in relation to fair value, and the plan is unlikely to change. The warehouse ($640,000)
  qualifies. So does the headquarters building ($2,300,000): vacating it at closing is a usual and customary
  term. The trucks are still in use and not marketed; the office building''s asking price is unreasonable;
  and the packaging equipment met the criteria only after year-end, so it is held and used at December
  31. Total = $2,940,000.'
