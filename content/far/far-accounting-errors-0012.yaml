id: far-accounting-errors-0012
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: draft
  references:
  - ASC 340-10-25 (prepaid costs recognized as an asset until consumed)
  - 'ASC 606-10-25-30 (transfer of control: FOB shipping point)'
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Before Hartswell Logistics Co.'s Year 2 financial statements are issued, its controller finds two
  problems with the draft December 31, Year 2, balance sheet, which reports total assets of $7,840,000.
  On September 1, Year 2, Hartswell had paid $72,000 for a service contract covering the next three years
  and charged the entire payment to Year 2 expense, though two of the three years of that term remains
  unused at year-end, representing $48,000 of the payment. Also, $63,000 of merchandise that Hartswell
  had purchased FOB shipping point was in transit at year-end and was left out of both the physical count
  and the accounting records; it arrived in January. What total assets should Hartswell's corrected balance
  sheet report at December 31, Year 2?
choices:
- id: A
  text: $7,888,000
  rationale: Leaves out the $63,000 of goods Hartswell had purchased FOB shipping point and that were
    in transit, but not yet received, at year-end.
- id: B
  text: $7,903,000
  rationale: Leaves out the $48,000 of unexpired service-contract cost that Hartswell charged entirely
    to expense, even though two of the three years of the contract's term remains unused.
- id: C
  text: $7,951,000
  rationale: Correct. $7,840,000 + $48,000 + $63,000.
- id: D
  text: $7,999,000
  rationale: Adds back the full $72,000 paid for the service contract instead of only the $48,000 that
    is unexpired at year-end.
answer: C
explanation: 'The unexpired portion of the service contract is a prepaid asset, not an expense of the
  year it was paid: $48,000 of the $72,000 payment relates to two of the three years of coverage still
  to come and is added back. Title to goods shipped FOB shipping point passes when the carrier takes them,
  so the $63,000 of goods in transit belonged to Hartswell at year-end and are added to inventory. Corrected
  total assets = $7,840,000 + $48,000 + $63,000 = $7,951,000.'
