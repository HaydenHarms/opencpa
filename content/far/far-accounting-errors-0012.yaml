id: far-accounting-errors-0012
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Balance sheet
  skill: Analysis
review:
  status: draft
  references:
  - ASC 310-10 and ASC 835-30 (interest on notes receivable accrues as earned)
  - ASC 321-10-35-1 (equity securities measured at fair value through net income)
  - ASC 606-10-55-79 to 55-80 (consignment arrangements)
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: Hartswell Logistics Co.'s draft December 31, Year 2, balance sheet reports total assets of $2,360,000.
  Before the statements are issued, its controller traces three balances to their support. On September
  1, Year 2, Hartswell accepted from a customer a $600,000, 9-month note bearing simple interest at 9%
  a year, with principal and interest due at maturity; the draft reports the note at $600,000 and no interest
  receivable. The draft carries Hartswell's holding of a listed company's common shares, a small stake
  that gives Hartswell no influence over the company, at their $310,000 cost; the shares' quoted price
  at December 31 puts the holding at $270,000. And inventory includes, at their $63,000 cost, goods Hartswell
  shipped in December to a retailer that sells them for Hartswell on consignment; the retailer had sold
  none of them by year-end. Ignore income taxes. What total assets should the corrected balance sheet
  report?
choices:
- id: A
  text: $2,275,000
  rationale: Also removes the $63,000 of goods held by the consignee. Goods out on consignment remain
    the consignor's inventory until the consignee sells them, so they are correctly included.
- id: B
  text: $2,338,000
  rationale: Correct. $2,360,000 + $18,000 interest receivable − $40,000 fair value decrease.
- id: C
  text: $2,360,500
  rationale: Accrues the interest for the note's whole 9-month term. Only the 4 months through December
    31 have been earned.
- id: D
  text: $2,378,000
  rationale: Leaves the shares at their $310,000 cost. Equity securities with a readily determinable fair
    value are measured at fair value, here $270,000, with the change in net income.
answer: B
explanation: 'Interest on the note accrues from September 1: $600,000 × 9% × 4/12 = $18,000 of interest
  receivable, which the draft omits. Equity securities with a readily determinable fair value are measured
  at fair value, with changes in net income (ASC 321-10-35-1), so the shares are remeasured from $310,000
  to $270,000, a $40,000 loss. Goods on consignment remain the consignor''s inventory until the consignee
  sells them (ASC 606-10-55-79 to 55-80), so the $63,000 is correctly included. Corrected total assets
  = $2,360,000 + $18,000 − $40,000 = $2,338,000.'
