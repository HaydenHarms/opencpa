id: far-accounting-errors-0012
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Balance sheet
  skill: Analysis
review:
  status: draft
  references:
  - ASC 310-10 and ASC 835-30 (interest on notes receivable accrues as earned)
  - Prepayments for goods not yet received are assets
  - ASC 360-10-35 (property held for use carried at historical cost; no write-up to fair value)
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: Hartswell Logistics Co.'s draft December 31, Year 2, balance sheet reports total assets of $2,360,000.
  Before the statements are issued, its controller traces three balances to their support. On November
  1, Year 2, Hartswell accepted from a customer a $600,000, 9-month note bearing simple interest at 10%
  a year, with principal and interest due at maturity; the draft reports the note at $600,000 and no interest
  receivable. In December, Hartswell paid a supplier a $46,000 advance for goods to be delivered in February,
  Year 3, and charged the payment to cost of goods sold. And the draft carries land Hartswell bought as
  the site of a future warehouse at its $410,000 cost; an appraisal in December valued the land at $530,000.
  Ignore income taxes. What total assets should the corrected balance sheet report?
choices:
- id: A
  text: $2,370,000
  rationale: Leaves the $46,000 advance in cost of goods sold. The goods haven't been delivered, so the
    payment is a prepayment, an asset, until Hartswell receives them in February.
- id: B
  text: $2,416,000
  rationale: Correct. $2,360,000 + $10,000 interest receivable + $46,000 advance to the supplier; the
    land stays at cost.
- id: C
  text: $2,451,000
  rationale: Accrues the interest for the note's whole 9-month term. Only the 2 months through December
    31 have been earned.
- id: D
  text: $2,536,000
  rationale: Also writes the land up to its $530,000 appraised value. Land held for use is carried at
    cost; GAAP doesn't permit writing it up to a higher fair value.
answer: B
explanation: 'Interest on the note accrues from November 1: $600,000 × 10% × 2/12 = $10,000 of interest
  receivable, which the draft omits. The advance pays for goods Hartswell hasn''t yet received, so it
  is a prepayment (an asset), not cost of goods sold: $46,000 is added back to assets. Land held for use
  is carried at historical cost, with no write-up to an appraised value (ASC 360-10-35), so the land stays
  at $410,000. Corrected total assets = $2,360,000 + $10,000 + $46,000 = $2,416,000.'
