id: far-consolidated-statements-0011
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Consolidated financial statements
  skill: Application
review:
  status: reviewed
  references:
  - ASC 810-10-45-1 (intra-entity balances and transactions eliminated in full)
  - 'ASC 810-10-45 (consolidation procedures: intra-entity profit in inventory)'
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Lochcarron Corp. owns all of the common stock of Shieldaig Ltd., which it formed in Year 1. Shieldaig
  sells goods to Lochcarron at a gross margin of 25% of the selling price. Lochcarron''s draft December
  31, Year 2, consolidated balance sheet reports total current assets of $2,964,000. The controller identifies
  these errors: (1) Shieldaig''s $98,000 trade receivable from Lochcarron for goods sold in December,
  and Lochcarron''s matching payable, were not eliminated; (2) Lochcarron''s December 31 inventory includes
  goods it bought from Shieldaig for $160,000, and the draft eliminated the whole $160,000 from consolidated
  inventory; and (3) a dividend of $35,000 that Shieldaig declared on December 20, payable January 10,
  Year 3, is included in Lochcarron''s dividends receivable. What total current assets should the corrected
  consolidated balance sheet report?'
choices:
- id: A
  text: $2,831,000
  rationale: Leaves the draft's elimination of the whole $160,000. Only the unrealized profit, $160,000
    × 25% = $40,000, is eliminated; the goods stay in consolidated inventory at Shieldaig's cost, $120,000.
- id: B
  text: $2,951,000
  rationale: Correct. $2,964,000 − $98,000 + ($160,000 − $40,000) − $35,000.
- id: C
  text: $2,991,000
  rationale: Restores the full $160,000 without eliminating any profit. Shieldaig's $40,000 profit on
    goods still held by the group is unrealized and is removed.
- id: D
  text: $3,049,000
  rationale: Leaves the $98,000 intercompany receivable in consolidated current assets. Amounts the group
    owes itself are eliminated.
answer: B
explanation: '(1) The intercompany receivable is eliminated with the matching payable: − $98,000. (2)
  Goods bought within the group stay in consolidated inventory at the selling affiliate''s cost; only
  the unrealized profit is eliminated. Shieldaig''s profit is 25% of the $160,000 price, $40,000, so the
  draft''s $160,000 elimination is reversed and $40,000 eliminated: + $120,000. (3) The dividend receivable
  from the subsidiary is eliminated against its dividend payable: − $35,000. Corrected current assets
  = $2,964,000 − $98,000 + $120,000 − $35,000 = $2,951,000.'
