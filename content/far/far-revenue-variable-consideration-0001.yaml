id: far-revenue-variable-consideration-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: reviewed
  references:
  - ASC 606-10-32-8
  - ASC 606-10-32-11
  notes: Batch 01. Adapted from legacy bank; answer re-solved, arithmetic checked in code, distractors
    rebuilt where needed.
stem: Meridian Construction agrees to build a facility for $800,000 plus a $100,000 bonus if it finishes
  within 18 months. Meridian estimates an 85% chance of earning the bonus. Meridian uses the most likely
  amount method, and including the bonus is not constrained. What is the transaction price?
choices:
- id: A
  text: $885,000
  rationale: 'Uses the expected value method: 15% × $800,000 + 85% × $900,000.'
- id: B
  text: $800,000
  rationale: Excludes the variable consideration, which is only appropriate if the constraint applies.
- id: C
  text: $900,000
  rationale: Correct. The most likely outcome is that the bonus is earned, so the full $100,000 is included.
- id: D
  text: $850,000
  rationale: Includes half the bonus with no basis in either estimation method.
answer: C
explanation: 'The most likely amount method picks the single most likely outcome, which is best for binary
  outcomes like a bonus that is either earned or not. With an 85% likelihood, the bonus is included: $800,000
  + $100,000 = $900,000.'
