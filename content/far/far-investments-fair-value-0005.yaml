id: far-investments-fair-value-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments (Financial assets at fair value)
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 320-10-35-1 (available-for-sale debt securities: unrealized holding gains and losses in OCI)'
  - 'ASC 310-20-35 and ASC 835-30-35 (interest method: amortization of discount)'
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Dornoch Co. paid $478,938 for $500,000 face amount of 5-year, 5% bonds that
  pay interest each December 31; the price gives a yield of 6%. Dornoch classifies the bonds as available
  for sale and amortizes the discount by the effective interest method, rounding to the nearest dollar.
  It does not intend to sell the bonds and is not likely to be required to sell them before they recover
  in value, and it expects to collect all of their contractual cash flows. The bonds' fair value was $471,000
  at December 31, Year 1, and $493,000 at December 31, Year 2. In its December 31, Year 2, entry to adjust
  the bonds to fair value, what amount should Dornoch credit to other comprehensive income?
choices:
- id: A
  text: $6,366
  rationale: Records only the $6,366 by which fair value exceeds amortized cost at December 31, Year 2
    ($493,000 − $486,634), without reversing the $11,674 unrealized loss recorded in OCI for Year 1. The
    entry moves the fair value adjustment from an $11,674 credit balance to a $6,366 debit balance.
- id: B
  text: $11,674
  rationale: Reverses the $11,674 Year 1 unrealized loss but records none of the $6,366 by which fair
    value exceeds amortized cost at December 31, Year 2.
- id: C
  text: $14,062
  rationale: Compares the December 31, Year 2, fair value with the $478,938 purchase price. The comparison
    is with amortized cost, $486,634, and the Year 1 loss already in OCI is reversed.
- id: D
  text: $18,040
  rationale: Correct. ($493,000 − $486,634) − ($471,000 − $482,674) = $6,366 + $11,674.
answer: D
explanation: 'Amortized cost: Year 1 interest income $478,938 × 6% = $28,736, less the $25,000 coupon,
  amortizes $3,736, so amortized cost is $482,674; Year 2 interest income $482,674 × 6% = $28,960 amortizes
  $3,960, giving $486,634. At December 31, Year 1, fair value was $11,674 below amortized cost, an unrealized
  loss in OCI. At December 31, Year 2, it is $6,366 above. The Year 2 entry moves the fair value adjustment
  by $6,366 + $11,674 = $18,040, debiting the adjustment account and crediting OCI (an unrealized holding
  gain).'
