id: far-contingencies-0007
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: reviewed
  references:
  - ASC 410-30 (environmental obligations)
  - 'ASC 450-20 (loss contingencies: measurement within a range)'
  notes: Batch 07. Written from scratch; answers solved and every number and distractor computed in code.
stem: In Year 1, a state environmental agency designated Ostrander Chemical as a party responsible for
  cleaning up contamination at a site it formerly operated. At December 31, Year 1, Ostrander's engineers
  estimated the cleanup cost at between $600,000 and $1,000,000, with no amount in the range more likely
  than any other, and Ostrander recorded its liability in accordance with GAAP. During Year 2, Ostrander
  paid $250,000 of cleanup costs, charging them to the liability. At December 31, Year 2, an updated study
  estimates the remaining cost at between $500,000 and $1,100,000, with $720,000 the most likely amount.
  Ostrander has filed a $300,000 claim with its insurer, which disputes coverage and has paid nothing.
  The timing of future payments is not reliably determinable, so the liability is not discounted. What
  environmental remediation expense should Ostrander recognize for Year 2?
choices:
- id: A
  text: $120,000
  rationale: Leaves out the $250,000 charged against the liability in Year 2. Those payments used up part
    of the accrual, so the expense must restore it to $720,000.
- id: B
  text: $170,000
  rationale: Assumes the Year 1 accrual was the $800,000 midpoint. When no amount in a range is a better
    estimate, the minimum ($600,000) is accrued.
- id: C
  text: $370,000
  rationale: Correct. Ending liability $720,000 − ($600,000 − $250,000 paid) = $370,000.
- id: D
  text: $750,000
  rationale: Uses the $1,100,000 high end of the Year 2 range. The best estimate, $720,000, is accrued;
    the rest of the range is disclosed.
answer: C
explanation: At December 31, Year 1, no amount in the range was a better estimate, so Ostrander accrued
  the minimum, $600,000. Year 2 payments of $250,000 reduced the liability to $350,000. At December 31,
  Year 2, the best estimate of remaining costs is $720,000, so the liability is increased by $720,000
  − $350,000 = $370,000, charged to expense (debit remediation expense, credit environmental liability).
  The disputed insurance claim is not probable of recovery, so it is not recognized and is not netted
  against the expense.
