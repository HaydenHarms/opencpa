- stem: In Year 1, a state environmental agency designated Prendergast Coatings as a party responsible
    for cleaning up contamination at a site it formerly operated. At December 31, Year 1, Prendergast's
    engineers estimated the cleanup cost at between $450,000 and $790,000, with no amount in the range
    more likely than any other, and Prendergast recorded its liability in accordance with GAAP. During
    Year 2, Prendergast paid $180,000 of cleanup costs, charging them to the liability. At December 31,
    Year 2, an updated study estimates the remaining cost at between $380,000 and $800,000, with $520,000
    the most likely amount. Prendergast has filed a $150,000 claim with its insurer, which disputes coverage
    and has paid nothing. The timing of future payments is not reliably determinable, so the liability
    is not discounted. What environmental remediation expense should Prendergast recognize for Year 2?
  choices:
  - id: A
    text: $100,000
    rationale: Nets the $150,000 insurance claim against the expense. A recovery is recognized only when
      it is probable, and the insurer disputes coverage.
  - id: B
    text: $110,000
    rationale: Uses the $380,000 low end of the Year 2 range. When one amount in the range is the best
      estimate ($520,000), that amount is accrued.
  - id: C
    text: $180,000
    rationale: Expenses only the cleanup costs paid in Year 2. The liability is remeasured to the new
      best estimate, and the change is Year 2 expense.
  - id: D
    text: $250,000
    rationale: Correct. Ending liability $520,000 − ($450,000 − $180,000 paid) = $250,000.
  answer: D
