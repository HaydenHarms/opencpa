id: far-contingencies-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 450-20 (loss contingencies)
  - ASC 450-30 (gain contingencies)
  - ASC 460-10 (product warranties)
  - ASC 410-30 (environmental obligations)
  notes: Batch 03. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Knox Co. is preparing its Year 1 statements, which have not been issued. Its files show: (1) Knox
  is suing a competitor for patent infringement, and counsel expects Knox to be awarded about $500,000;
  (2) Knox''s Year 1 sales of $2,000,000 carry a one-year warranty, past experience shows warranty costs
  of 3% of sales, and Knox paid $25,000 of claims on these sales in Year 1; (3) the Environmental Protection
  Agency named Knox a potentially responsible party for a contaminated site, and engineers estimate Knox''s
  share of the cleanup at $300,000 to $700,000, with $450,000 the most likely amount; and (4) no one has
  asserted a claim over a minor chemical spill at one of Knox''s plants, and counsel believes a claim
  is unlikely to be asserted. By how much do these matters reduce Knox''s Year 1 pretax income?'
choices:
- id: A
  text: $10,000
  rationale: Offsets the expected $500,000 award against the losses. A gain contingency is not recognized
    until it is realized.
- id: B
  text: $360,000
  rationale: Accrues the $300,000 low end of the environmental range. When one amount in a range is the
    best estimate, that amount is accrued.
- id: C
  text: $485,000
  rationale: Uses the $35,000 warranty liability remaining at year-end instead of the $60,000 warranty
    expense.
- id: D
  text: $510,000
  rationale: Correct. Warranty expense of $60,000 (3% × $2,000,000) plus the $450,000 best estimate of
    the environmental obligation.
answer: D
explanation: 'Review each item. (1) The expected award is a gain contingency: disclosed, not recognized.
  (2) Warranty expense is recognized in the period of sale: 3% × $2,000,000 = $60,000 (the liability is
  $35,000 after claims paid). (3) The environmental loss is probable and estimable, and $450,000 is the
  best estimate within the range, so it is accrued. (4) An unasserted claim that is unlikely to be asserted
  requires neither accrual nor disclosure. Pretax income falls by $60,000 + $450,000 = $510,000.'
