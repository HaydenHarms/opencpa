id: far-debt-covenant-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Debt (Debt covenant compliance)
  skill: Application
review:
  status: draft
  references:
  - 'Debt covenant compliance: interest coverage as defined in the loan agreement'
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: St Columb Components Inc.'s loan agreement requires its ratio of earnings before interest and taxes
  to interest expense to be at least 4.00 at each year-end. For the covenant, earnings before interest
  and taxes start from net income, add back interest expense, income tax expense and restructuring charges,
  and remove the effect of any gain or loss on disposing of property and equipment. For Year 1, St Columb
  reports net income of $1,265,000, interest expense of $310,000 and income tax expense of $360,000. Net
  income includes an $85,000 gain on the sale of idle equipment, a $36,000 loss on the sale of a delivery
  truck, a $140,000 restructuring charge for closing an underperforming store, and a $120,000 impairment
  loss on a production line that St Columb continues to operate. With interest expense unchanged, by how
  much could St Columb's Year 1 earnings before interest and taxes, as the agreement defines them, have
  been lower without breaching the covenant?
choices:
- id: A
  text: $646,000
  rationale: Doesn't add back the $140,000 restructuring charge, which the agreement's definition adds
    back.
- id: B
  text: $750,000
  rationale: Leaves the $36,000 loss on the delivery truck in the figure. The agreement removes every
    gain or loss on disposing of property and equipment, losses as well as gains, so the loss is added
    back.
- id: C
  text: $786,000
  rationale: Correct. Defined earnings of $2,026,000 less the $1,240,000 minimum (4.00 × $310,000).
- id: D
  text: $906,000
  rationale: Adds back the $120,000 impairment loss as if the agreement excluded it. The agreement removes
    only gains and losses on disposals; the production line is still in use, so its impairment stays in
    earnings before interest and taxes.
answer: C
explanation: Earnings before interest and taxes, as defined = $1,265,000 + $310,000 + $360,000 − $85,000
  (gain on a disposal, removed) + $36,000 (loss on a disposal, removed) + $140,000 (restructuring, added
  back) = $2,026,000. The impairment loss isn't a gain or loss on a disposal, because the line is still
  in use, so it stays in the figure. The covenant needs at least 4.00 × $310,000 = $1,240,000. Cushion
  = $2,026,000 − $1,240,000 = $786,000.
