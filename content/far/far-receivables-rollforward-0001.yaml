id: far-receivables-rollforward-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 310-10 (receivables)
  - ASC 326-20 (write-offs and recoveries)
  notes: Batch 04. Written from scratch; answers solved and every number and distractor computed in code.
stem: Selby Co. is preparing a rollforward of its trade receivables to determine credit sales. Receivables
  were $200,000 at the start of the year and $260,000 at the end, per the aged subledger. Cash receipts
  from customers, per the cash receipts journal, were $1,180,000, which includes $5,000 collected on an
  account written off in an earlier year. Write-offs during the year were $18,000. All sales are on credit.
  What should credit sales for the year be?
choices:
- id: A
  text: $1,217,000
  rationale: Adds the write-offs instead of subtracting them. Write-offs reduce receivables, so more sales
    are needed to reach the ending balance.
- id: B
  text: $1,235,000
  rationale: Leaves out the $18,000 of write-offs.
- id: C
  text: $1,253,000
  rationale: Correct. $260,000 + $1,180,000 + $18,000 − $200,000 − $5,000 reinstated recovery.
- id: D
  text: $1,258,000
  rationale: Treats the $5,000 recovery as a collection of current sales. A recovery is first reinstated
    in receivables and then collected, so it is not a sale.
answer: C
explanation: 'Rollforward: beginning $200,000 + credit sales + $5,000 recovery reinstated − $1,180,000
  collections − $18,000 write-offs = ending $260,000. Credit sales = $260,000 + $1,180,000 + $18,000 −
  $200,000 − $5,000 = $1,253,000.'
