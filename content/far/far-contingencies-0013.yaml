id: far-contingencies-0013
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 450-20-25-2 (accrual of loss contingencies)
  - ASC 450-20-30-1 (best estimate within a range; minimum when no amount is better)
  - ASC 450-20-50 (disclosure of loss contingencies)
  - ASC 450-20 (no accrual for general or unspecified business risks)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: Kiltarlity Food Co.'s draft December 31, Year 1, balance sheet, for statements not yet issued, reports
  a liability for litigation and claims of $895,000, made up of $600,000 for a customer's suit over an
  injury caused by one of Kiltarlity's products, $175,000 for a former distributor's suit seeking that
  amount for breach of contract, and a $120,000 reserve for possible future accidents involving Kiltarlity's
  uninsured delivery trucks. Counsel's letter says counsel expects the jury to find against Kiltarlity
  in the customer's suit and puts the damages at $250,000 to $600,000, with $380,000 the most likely amount;
  on the distributor's suit, it says the law on the central question is unsettled and counsel can't predict
  the outcome. Kiltarlity's trucks have had no accidents that haven't been settled. On December 21, Kiltarlity
  signed an agreement to pay a supplier $65,000 on February 15, Year 2, to settle a dispute over a cancelled
  order, and Kiltarlity has not recorded it; Kiltarlity reports amounts owed under settled claims in its
  liability for litigation and claims. What liability for litigation and claims should the corrected balance
  sheet report?
choices:
- id: A
  text: $445,000
  rationale: Correct. $380,000 for the customer's suit + $65,000 for the signed settlement.
- id: B
  text: $565,000
  rationale: Keeps the $120,000 reserve for future truck accidents. No accident had happened, so no liability
    existed at year-end; GAAP doesn't allow general reserves for future losses.
- id: C
  text: $620,000
  rationale: Keeps the $175,000 accrual for the distributor's suit. Counsel can't predict the outcome,
    so a loss isn't probable; the suit is disclosed, not accrued.
- id: D
  text: $665,000
  rationale: Keeps the customer's suit at the top of the range, $600,000. When one amount in the range
    is a better estimate than any other, that amount, $380,000, is accrued; the possible excess is disclosed.
answer: A
explanation: 'The customer''s suit is a probable loss that can be estimated, and counsel names a most
  likely amount within the range, so $380,000 is accrued and the reasonably possible excess up to $600,000
  is disclosed. The distributor''s suit has an outcome counsel can''t predict, so it is disclosed but
  not accrued. A reserve for future accidents isn''t a liability: no event had occurred by year-end. The
  signed settlement is a liability for a fixed amount. Corrected liability = $380,000 + $65,000 = $445,000.'
