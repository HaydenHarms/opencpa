id: far-income-statement-0004
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Income statement
  skill: Application
review:
  status: reviewed
  references:
  - ASC 220-10 (income statement presentation)
  - ASC 205-20 (discontinued operations)
  - 'ASC 321-10 (equity securities: fair value changes in net income)'
  - 'ASC 320-10 (available-for-sale debt securities: unrealized holding gains in other comprehensive income)'
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Easby Corp.''s adjusted trial balance for Year 1 includes the following pretax amounts: sales $2,400,000;
  sales returns and allowances $60,000; cost of goods sold $1,380,000; selling expenses $240,000; general
  and administrative expenses $310,000; interest revenue $18,000; interest expense $45,000; gain on sale
  of equipment $22,000; unrealized gain on equity securities with readily determinable fair values $15,000;
  unrealized holding gain on available-for-sale debt securities $30,000; operating loss of the furniture
  division $90,000; and dividends declared $50,000. The furniture division was one of Easby''s three business
  segments; Easby sold it in November, Year 1, and no longer makes furniture. What amount should Easby
  report as income from continuing operations before income taxes in its Year 1 multi-step income statement?'
choices:
- id: A
  text: $330,000
  rationale: Subtracts the $90,000 loss of the furniture division. The division was a separate segment,
    and selling it took Easby out of the furniture business, a strategic shift, so its results are reported
    in discontinued operations, below income from continuing operations.
- id: B
  text: $370,000
  rationale: Subtracts the $50,000 of dividends declared. Dividends are distributions of equity, reported
    in the statement of changes in equity, not expenses.
- id: C
  text: $405,000
  rationale: Leaves out the $15,000 unrealized gain on the equity securities. Changes in the fair value
    of equity securities with readily determinable fair values are reported in net income.
- id: D
  text: $420,000
  rationale: Correct. Net sales $2,340,000 − $1,380,000 − $240,000 − $310,000 + $18,000 − $45,000 + $22,000
    + $15,000.
answer: D
explanation: 'Net sales = $2,400,000 − $60,000 = $2,340,000. Subtract cost of goods sold ($1,380,000),
  selling expenses ($240,000) and general and administrative expenses ($310,000) for operating income
  of $410,000. Other income and expense: + $18,000 interest revenue − $45,000 interest expense + $22,000
  gain on the equipment + $15,000 unrealized gain on equity securities, whose fair value changes go to
  net income. Income from continuing operations before income taxes = $420,000. The unrealized gain on
  available-for-sale debt securities is other comprehensive income; the division''s loss is reported in
  discontinued operations because its sale was a strategic shift out of a whole segment; dividends declared
  are not expenses.'
