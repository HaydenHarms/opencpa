id: far-contingencies-0006
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: reviewed
  references:
  - ASC 460-10 (product warranties)
  - 'ASC 606-10-55 (warranties: assurance-type versus service-type)'
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Corbett Appliances began selling a new appliance in Year 1 and sold 8,000 units that year. Each
  unit comes with a two-year warranty against defects, included in the price. Corbett estimates that 2%
  of the units will need repair within 12 months after sale and 4% in the second 12 months after sale,
  at an average cost of $150 per repair. Warranty repairs made in Year 1 cost $21,000, and Corbett's estimates
  have not changed. Corbett also sold 1,000 extended service plans for $60 each, which cover repairs in
  the third and fourth years after purchase. What estimated liability for warranty costs should Corbett
  report at December 31, Year 1?
choices:
- id: A
  text: $3,000
  rationale: Accrues only the first-year repairs ($24,000) less the $21,000 spent. The second-year repairs
    ($48,000) are also part of the warranty included in the price, so their cost is accrued at the sale
    too.
- id: B
  text: $51,000
  rationale: Correct. 8,000 × 6% × $150 = $72,000, less $21,000 paid.
- id: C
  text: $72,000
  rationale: Doesn't subtract the $21,000 of repairs made in Year 1.
- id: D
  text: $111,000
  rationale: Adds the $60,000 received for extended service plans. Those plans are a separate service,
    reported as a contract liability (unearned revenue), not as an accrued warranty cost.
answer: B
explanation: 'The two-year warranty is included in the price and covers defects, so its expected cost
  over both years is accrued when the units are sold: 8,000 × (2% + 4%) × $150 = $72,000. Repairs of $21,000
  in Year 1 reduce the liability to $51,000. The extended service plans are sold separately and give a
  service beyond the defect warranty, so the $60,000 received is a contract liability recognized as revenue
  over the coverage period.'
