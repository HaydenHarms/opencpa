id: far-inventory-rollforward-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10 (inventory cost; freight; purchase discounts)
  - ASC 606-10-55 (consignment arrangements)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: Firth Co. uses a periodic inventory system and records purchases at gross amounts. Its Year 2 records
  show beginning inventory of $265,000, purchases of $1,840,000, purchase discounts taken of $29,000,
  and freight of $58,000, of which $17,000 was paid to deliver goods to customers. In August, a warehouse
  fire destroyed goods costing $36,000; Firth reports casualty losses separately from cost of goods sold.
  The December 31 physical count, priced at cost, totals $298,000. It includes goods costing $22,000 that
  a supplier shipped to Firth in December to sell on the supplier's behalf on consignment; Firth has not
  recorded them as a purchase. What should Firth report as cost of goods sold for Year 2?
choices:
- id: A
  text: $1,783,000
  rationale: Leaves the $22,000 of consigned goods in ending inventory. They belong to the supplier, so
    they come out of the count; since they were never recorded as a purchase, nothing else changes.
- id: B
  text: $1,805,000
  rationale: Correct. $265,000 + $1,840,000 − $29,000 + $41,000 − $36,000 − ($298,000 − $22,000).
- id: C
  text: $1,834,000
  rationale: Ignores the $29,000 of purchase discounts taken, which reduce the cost of purchases.
- id: D
  text: $1,841,000
  rationale: Leaves the $36,000 of goods destroyed by fire in cost of goods sold. Firth reports casualty
    losses separately.
answer: B
explanation: 'Cost of goods available: $265,000 + $1,840,000 purchases − $29,000 discounts + freight-in
  ($58,000 − $17,000 freight-out, a selling expense) = $2,117,000, less the $36,000 destroyed by fire
  (reported as a separate loss). Ending inventory = $298,000 − $22,000 consigned goods, which belong to
  the supplier = $276,000. The consigned goods were never recorded as a purchase, so only the count changes.
  Cost of goods sold = $1,805,000.'
