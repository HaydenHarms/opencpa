id: far-cash-flows-0008
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Application
review:
  status: reviewed
  references:
  - ASC 230-10-50 (supplemental disclosure of interest paid, net of amounts capitalized)
  - ASC 835-20 (capitalization of interest)
  - ASC 835-30 (amortization of discount)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: Farndale Co.'s Year 1 income statement reports interest expense of $84,000, which includes $6,000
  of amortization of the discount on its bonds payable. During Year 1, Farndale also capitalized $16,000
  of interest as part of the cost of a warehouse it built for its own use. Interest payable was $9,000
  at January 1 and $14,000 at December 31. In the supplemental disclosures to its Year 1 statement of
  cash flows, what amount should Farndale report as interest paid, net of amounts capitalized?
choices:
- id: A
  text: $73,000
  rationale: Correct. $84,000 expense − $6,000 amortization − $5,000 increase in interest payable.
- id: B
  text: $78,000
  rationale: Ignores the $5,000 increase in interest payable. Interest paid is expense adjusted for the
    change in the payable.
- id: C
  text: $83,000
  rationale: Adjusts for the change in interest payable in the wrong direction. An increase in the payable
    means Farndale paid less than it incurred.
- id: D
  text: $89,000
  rationale: Reports all interest paid, $89,000, including the $16,000 capitalized. The disclosure is
    interest paid net of amounts capitalized; capitalized interest paid is part of the payments for the
    warehouse.
answer: A
explanation: Interest incurred = $84,000 expensed + $16,000 capitalized = $100,000. Cash paid for interest
  = $100,000 − $6,000 discount amortization (not paid in cash) − $5,000 increase in interest payable =
  $89,000. Net of the $16,000 capitalized, which is reported with the payments for the warehouse, the
  disclosure is $73,000.
