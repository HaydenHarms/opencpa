id: far-receivables-rollforward-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 310-10 (receivables)
  - 'ASC 860-10-40 (sales of financial assets: derecognition of receivables factored without recourse)'
  - 'ASC 606-10-45-2 (contract liabilities: payments received before performance)'
  - ASC 606-10-32-2A (sales taxes collected from customers excluded from revenue)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Delabole Slate Supply Co.''s staff prepared this Year 2 rollforward of the accounts receivable
  control account: January 1 balance $618,000; plus credit sales $4,250,000; less cash collected from
  customers $4,236,000; less accounts written off $29,000; December 31 balance $603,000. All of Delabole''s
  sales are on account. The controller compares the schedule with the supporting records. The credit sales
  figure is sales revenue from the income statement; every invoice also charged the customer 6% sales
  tax, which Delabole records as a liability until it remits it. The cash collected is the total of the
  customer receipts column, which includes $46,000 of deposits that customers paid in December on orders
  Delabole will ship in Year 3. In November, Delabole sold $180,000 of receivables to a factor without
  recourse, for $172,800 in cash, keeping no involvement with them; the factored accounts were closed
  in the subledger, but the general ledger recorded the cash as a short-term borrowing and left the receivables
  in the control account. What balance should the corrected rollforward show for accounts receivable,
  before any allowance, at December 31, Year 2?'
choices:
- id: A
  text: $469,000
  rationale: Leaves out the $255,000 of sales tax billed. Customers owe the tax along with the price,
    so the receivables include it, even though the tax is a liability, not revenue.
- id: B
  text: $603,000
  rationale: Accepts the draft's $603,000, which omits the sales tax billed, counts the deposits as collections
    and keeps the factored receivables.
- id: C
  text: $678,000
  rationale: Treats the $46,000 of deposits as collections of receivables. Advance payments for orders
    not yet shipped are contract liabilities; they don't reduce receivables.
- id: D
  text: $724,000
  rationale: Correct. $618,000 + $4,250,000 + $255,000 − ($4,236,000 − $46,000) − $29,000 − $180,000.
answer: D
explanation: 'Billings to customers include the sales tax: $4,250,000 × 6% = $255,000 is added. The deposits
  are contract liabilities, not collections of receivables, so collections fall to $4,190,000. The factored
  receivables were sold (a transfer without recourse with no continuing involvement), so the $180,000
  comes out of receivables; the $7,200 difference from the cash received is a loss, and the borrowing
  is reversed. Corrected balance = $618,000 + $4,505,000 − $4,190,000 − $29,000 − $180,000 = $724,000.'
