id: far-changes-in-equity-0007
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of changes in equity
  skill: Application
review:
  status: reviewed
  references:
  - ASC 505-10 (statement of changes in equity)
  - ASC 250-10-45-23 (prior-period adjustments)
  - ASC 845-10-30 (nonreciprocal transfers to owners measured at fair value)
  - ASC 505-20-30 (small stock dividends at fair value)
  - ASC 505-30 (treasury stock reissued below cost)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: Plockton Corp.'s Year 2 statement of changes in stockholders' equity begins with retained earnings
  of $3,410,000 at January 1, as previously reported. In Year 2, Plockton found that a computational error
  had overstated its Year 1 depreciation expense by $96,000; its income tax rate is 25% for all years.
  Year 2 net income, correctly computed and including the gain on the land distribution described below,
  was $692,000. During Year 2, the board declared cash dividends of $240,000, of which $180,000 had been
  paid by December 31; distributed to shareholders land that Plockton held as an investment, which had
  a carrying amount of $95,000 and a fair value of $160,000 on the distribution date; and declared and
  distributed a 5% stock dividend on its 400,000 outstanding $1 par common shares when their market price
  was $18 per share. Plockton accounts for treasury stock by the cost method. It also reissued treasury
  shares that had cost $84,000 for $61,000; before that sale, its paid-in capital from treasury stock
  transactions had a balance of $15,000. What retained earnings should Plockton report at December 31,
  Year 2?
choices:
- id: A
  text: $3,391,000
  rationale: Charges the whole $23,000 shortfall on the treasury shares to retained earnings. It is charged
    first against the $15,000 of paid-in capital from treasury stock transactions; only the remaining
    $8,000 reduces retained earnings.
- id: B
  text: $3,406,000
  rationale: Correct. $3,410,000 + $72,000 + $692,000 − $240,000 − $160,000 − $360,000 − $8,000.
- id: C
  text: $3,471,000
  rationale: Charges retained earnings with the land's $95,000 carrying amount. A property dividend is
    recorded at the fair value of the asset distributed, $160,000; the $65,000 gain on remeasuring the
    land is already in net income.
- id: D
  text: $3,746,000
  rationale: 'Charges retained earnings with only the $1 par value of the 20,000 shares distributed, $20,000.
    A 5% stock dividend is a small stock dividend, recorded at the shares'' market price: 20,000 × $18
    = $360,000.'
answer: B
explanation: 'Opening retained earnings are restated for the error, net of tax: $3,410,000 + $96,000 ×
  75% = $3,482,000. Add net income ($692,000, which already includes the gain on remeasuring the land).
  Deduct dividends when declared: cash $240,000; the property dividend at the land''s fair value, $160,000;
  and the small (5%) stock dividend at market price, 20,000 shares × $18 = $360,000. The $23,000 shortfall
  on the treasury shares is charged first to the $15,000 of paid-in capital from treasury stock, and the
  remaining $8,000 to retained earnings. Retained earnings at December 31 = $3,406,000.'
