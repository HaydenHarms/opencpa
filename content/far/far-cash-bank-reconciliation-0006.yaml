id: far-cash-bank-reconciliation-0006
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: draft
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (stop-payment orders, checks returned by the bank, processor fees)
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'Falmouth Marine Co.''s December 31 bank statement shows a balance of $52,400, and its general ledger
  cash account shows $48,160. The bookkeeper''s reconciliation lists deposits in transit of $5,800 and
  outstanding checks of $12,000. Reviewing the statement and the reconciliation, the accountant finds
  that a $1,360 check from a customer, deposited on December 20, was returned by the bank on December
  30 marked "account closed," and Falmouth hasn''t recorded the return; that a credit-card processor deposited
  a batch of card sales net of its $600 discount fee, while Falmouth recorded the deposit at the $24,000
  gross sale amount; and that the outstanding checks include check #498, for $2,850, on which Falmouth
  placed a stop-payment order after a vendor dispute. The bank has confirmed the stop-payment order, and
  Falmouth''s books still show the check as a disbursement. What net adjustment should Falmouth make to
  its general ledger cash balance at December 31?'
choices:
- id: A
  text: $1,960 decrease
  rationale: 'Treats check #498 as a valid payment, leaving its $2,850 disbursement in the books. The
    bank has stopped the check and will never pay it, so the disbursement is reversed (and the check comes
    off the outstanding list on the bank side).'
- id: B
  text: $890 increase
  rationale: 'Correct. + $2,850 (stopped check) − $1,360 (returned check) − $600 (processor fee). Check:
    $48,160 adjusted to $49,050 = $52,400 + $5,800 − ($12,000 − $2,850).'
- id: C
  text: $1,490 increase
  rationale: Leaves the card-sale deposit at its gross $24,000. The processor deposited only $23,400 after
    its $600 discount fee, which Falmouth hasn't recorded.
- id: D
  text: $2,250 increase
  rationale: Leaves out the $1,360 customer check the bank returned from a closed account. The bank deducted
    it from Falmouth's balance, so the receipt must be reversed in the books (the customer still owes
    the amount).
answer: B
explanation: 'Only items the books haven''t recorded adjust the general ledger; deposits in transit and
  outstanding checks are timing items on the bank side. The returned check came back from a closed account,
  so the receipt is reversed (− $1,360) and the amount goes back to accounts receivable. Only $23,400
  of the $24,000 card deposit reached the account, so the $600 processor fee is recorded (− $600). The
  stopped check will never clear, so its disbursement is reversed (+ $2,850). Net adjustment = $2,850
  − $1,360 − $600 = an increase of $890. Check against the bank side: the stopped check also comes off
  the outstanding list, leaving $12,000 − $2,850 = $9,150, so correct cash is $52,400 + $5,800 − $9,150
  = $49,050, and $48,160 adjusted by the net amount gives the same $49,050.'
