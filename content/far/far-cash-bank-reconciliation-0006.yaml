id: far-cash-bank-reconciliation-0006
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: draft
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (stop-payment orders, items collected by the bank)
  notes: Batch 15, revision 2 (blind verifier and gate findings applied). Written from scratch; answers
    solved and every number and distractor computed in code.
stem: 'Falmouth Marine Co.''s December 31 bank statement shows a balance of $52,400, and its general ledger
  cash account shows $39,160. The bookkeeper''s reconciliation lists deposits in transit of $5,800 and
  outstanding checks of $11,000. Reviewing the statement and the reconciliation, the accountant finds
  that the bank collected a note receivable for Falmouth, crediting the account with $8,000 of principal
  and $640 of interest, which Falmouth hasn''t recorded; that a credit-card processor deposited a batch
  of card sales net of its $600 discount fee, while Falmouth recorded the deposit at the $24,000 gross
  sale amount; and that the outstanding checks include check #498, for $1,850, on which Falmouth placed
  a stop-payment order after a vendor dispute. The bank has confirmed the stop-payment order, and Falmouth''s
  books still show the check as a disbursement. What is Falmouth''s correct cash balance at December 31?'
choices:
- id: A
  text: $40,410
  rationale: Leaves out the $8,640 the bank collected on Falmouth's note receivable ($8,000 of principal
    and $640 of interest), which the books haven't recorded.
- id: B
  text: $47,200
  rationale: 'Treats check #498 as a valid payment, either by leaving it on the outstanding list (bank
    side) or by leaving its $1,850 disbursement in the books (book side); both give this amount. The bank
    has stopped the check and will never pay it, so it comes off the outstanding list and the disbursement
    is reversed.'
- id: C
  text: $49,050
  rationale: 'Correct. Bank side: $52,400 + $5,800 − ($11,000 − $1,850) = $49,050. Book side: $39,160
    + $8,640 − $600 + $1,850 = $49,050.'
- id: D
  text: $49,650
  rationale: Leaves the card-sale deposit at its gross $24,000. The processor deposited only $23,400 after
    its $600 discount fee, which Falmouth hasn't recorded.
answer: C
explanation: 'Bank side: the stopped check will never clear, so it comes off the outstanding list, leaving
  $11,000 − $1,850 = $9,150 of checks outstanding: $52,400 + $5,800 − $9,150 = $49,050. Book side: add
  the $8,640 the bank collected on the note ($8,000 + $640); subtract the $600 processor fee, because
  only $23,400 of the $24,000 recorded was actually deposited; and add back the $1,850 disbursement for
  the stopped check, which never left the account: $39,160 + $8,640 − $600 + $1,850 = $49,050. Both sides
  agree at $49,050.'
