  notes: Batch 15. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'While preparing Perranporth Marine Co.''s December 31 bank reconciliation, the accountant finds
  that the bank collected a $1,350 note receivable on Perranporth''s behalf, including interest, which
  hasn''t been recorded in the cash account; that a $1,620 batch of credit-card sales was deposited by
  the processor net of its $90 discount fee, though Perranporth recorded the deposit at the full $1,620
  sale amount; and that check #498, for $420, on which Perranporth placed a stop-payment order after a
  vendor dispute, is still recorded as a disbursement even though the bank never paid it. The bank statement
  also lists deposits in transit of $5,800 and outstanding checks (other than #498) totaling $9,150. If
  the bank statement shows a balance of $52,400 and the general ledger cash account shows $47,370, what
  is Perranporth''s correct cash balance at December 31?'
choices:
- id: A
  text: $47,700
  rationale: Leaves out the $1,350 note receivable the bank collected for Perranporth, including interest,
    which the books haven't recorded.
- id: B
  text: $48,630
  rationale: Leaves the $420 stopped check recorded as a disbursement, even though the bank never paid
    it.
- id: C
  text: $49,050
  rationale: Correct. $52,400 + $5,800 − $9,150 (bank side) = $47,370 + $1,350 − $90 + $420 (book side).
- id: D
  text: $49,140
  rationale: Leaves the $1,620 card-sale deposit at its gross amount. The processor deposited only $1,530
    after its $90 discount fee, which Perranporth hasn't recorded.
answer: C
explanation: 'The bank side is $52,400 + $5,800 − $9,150 = $49,050. On the book side: the $1,350 note
  the bank collected is added; the card-sale deposit was recorded at $1,620 but only $1,530 was actually
  received, so cash is reduced by the $90 fee; and the stopped check never left the bank, so its $420
  disbursement is reversed (added back): $47,370 + $1,350 − $90 + $420 = $49,050.'
