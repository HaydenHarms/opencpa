id: far-receivables-credit-losses-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 326-20 (credit losses on financial instruments measured at amortized cost)
  notes: Batch 01, revised after independent quality review and a second pass to raise difficulty. Answers
    re-solved and every number and distractor computed in code.
stem: Orchard Supply Co. reports trade receivables of $1,000,000 at year-end. Of that amount, $150,000
  is owed by one customer that has filed for bankruptcy, and Orchard expects to collect 30% of that balance
  in the proceedings. The remaining $850,000 is owed by customers with similar credit profiles. Orchard's
  historical credit loss rate on such balances is 3%, and its reasonable and supportable forecast of economic
  conditions indicates expected losses on them will be 1 percentage point higher than the historical rate.
  Orchard has no other information bearing on expected credit losses. What should the ending balance in
  Orchard's allowance for credit losses be?
choices:
- id: A
  text: $40,000
  rationale: Applies a single 4% rate to all $1,000,000. The bankrupt customer's balance has different
    expected losses and is evaluated on its own.
- id: B
  text: $79,000
  rationale: Reserves the 30% Orchard expects to collect ($45,000) instead of the 70% it expects to lose
    ($105,000), then adds $34,000 for the pool.
- id: C
  text: $130,500
  rationale: Uses the 3% historical rate for the pool. Expected credit losses must reflect current conditions
    and reasonable and supportable forecasts, which raise the rate to 4%.
- id: D
  text: $139,000
  rationale: Correct. $150,000 × 70% = $105,000 for the bankrupt customer, plus $850,000 × 4% = $34,000
    for the pool.
- id: E
  text: $184,000
  rationale: Reserves the entire $150,000 from the bankrupt customer. Orchard expects to collect 30% of
    it, so the allowance covers only the expected 70% loss.
answer: D
explanation: 'Under the current expected credit loss model, balances that do not share risk characteristics
  with the pool are evaluated separately. The bankrupt customer: expected loss = $150,000 × (1 − 30%)
  = $105,000. The pool: the historical 3% is adjusted for forecast conditions to 4%, so $850,000 × 4%
  = $34,000. Ending allowance = $105,000 + $34,000 = $139,000.'
