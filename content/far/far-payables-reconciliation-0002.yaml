id: far-payables-reconciliation-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Payables and accrued liabilities
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 405-10 (liabilities)
  - Reconciliation of a subsidiary ledger to its general ledger control account
  notes: Batch 07. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Delacroix Supply''s accounts payable subledger (the trial balance of vendor accounts)
  totals $476,500, and its general ledger accounts payable control account shows $486,000. The controller''s
  investigation finds: (1) a $7,000 vendor credit memo for returned merchandise was posted to the vendor''s
  subledger account, but no general ledger entry was made; (2) the December purchases journal was footed
  at $214,000, but the invoices in it total $224,000; the journal total was posted to the general ledger,
  and each invoice was posted to its vendor''s account; (3) a $3,200 freight invoice was recorded in the
  general ledger but posted to the wrong vendor''s subledger account; (4) a $12,500 payment on December
  30 was correctly recorded in the cash disbursements journal but posted twice to the vendor''s subledger
  account; and (5) a $15,000 invoice for goods shipped FOB shipping point and received December 28 was
  found in the unmatched-invoice file and has not been recorded anywhere. What net adjustment should Delacroix
  make to its general ledger accounts payable control account?'
choices:
- id: A
  text: $3,000 net credit
  rationale: Leaves out the $15,000 unrecorded invoice because it isn't a difference between the two records.
    The goods were received December 28, so the liability belongs in both.
- id: B
  text: $5,500 net credit
  rationale: Also debits the control account for the $12,500 payment. The payment was recorded correctly
    in the general ledger; only the subledger posted it twice.
- id: C
  text: $8,000 net credit
  rationale: Ignores the $10,000 underfooting. The general ledger received the journal's wrong total,
    so the control account is understated.
- id: D
  text: $18,000 net credit
  rationale: Correct. Credit $10,000 underfooting + credit $15,000 unrecorded invoice − debit $7,000 credit
    memo.
answer: D
explanation: 'Correct each record separately. General ledger: $486,000 − $7,000 credit memo + $10,000
  underfooting + $15,000 unrecorded invoice = $504,000. Subledger: $476,500 + $12,500 duplicate payment
  posting reversed + $15,000 unrecorded invoice = $504,000. The two agree. The misposted freight invoice
  is corrected between vendor accounts and changes neither total. Net adjustment to the control account:
  $10,000 + $15,000 − $7,000 = $18,000 credit.'
