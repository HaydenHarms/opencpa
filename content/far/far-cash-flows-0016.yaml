id: far-cash-flows-0016
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 230-10-45-28 (indirect method: adjustments to reconcile net income)'
  - 'ASC 230-10-45-15 (financing outflows: dividends paid)'
  - ASC 835-30-35 (amortization of bond premium)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Applecross Co.''s draft Year 2 statement of cash flows, prepared by the indirect method, reports
  net cash provided by operating activities of $1,128,000. The controller identifies these errors in the
  operating section: (1) net income includes a $46,000 gain on the sale of equipment, which the draft
  doesn''t adjust for (the $131,000 of proceeds is correctly reported in investing activities); (2) accounts
  receivable increased by $74,000 during Year 2, and the draft adds the increase to net income; (3) the
  draft adds back $18,000 of amortization of the premium on Applecross''s bonds payable as a noncash expense;
  and (4) the draft deducts the $210,000 of dividends that Applecross paid to its shareholders. Applecross
  follows U.S. GAAP. What net cash provided by operating activities should the corrected statement report?'
choices:
- id: A
  text: $1,108,000
  rationale: Correct. $1,128,000 − $46,000 − 2 × $74,000 − 2 × $18,000 + $210,000.
- id: B
  text: $1,126,000
  rationale: 'Removes the $18,000 add-back but doesn''t deduct the premium amortization. Amortizing a
    premium makes interest expense less than the interest paid in cash, so it is subtracted from net income:
    the correction is 2 × $18,000.'
- id: C
  text: $1,154,000
  rationale: Leaves the $46,000 gain in operating activities. The gain is part of the sale proceeds reported
    in investing activities, so it is deducted from net income.
- id: D
  text: $1,182,000
  rationale: 'Removes the $74,000 that the draft added for receivables but doesn''t deduct the increase.
    An increase in receivables means cash collected was less than revenue, so it is subtracted: the correction
    is 2 × $74,000.'
answer: A
explanation: '(1) The gain is deducted, because the whole sale price is an investing inflow: − $46,000.
  (2) The increase in receivables should have been subtracted; reversing the addition and subtracting
  it: − 2 × $74,000. (3) Premium amortization reduces interest expense below the cash paid, so it is subtracted,
  not added: − 2 × $18,000. (4) Dividends paid are a financing outflow under ASC 230, so they come out
  of operating activities: + $210,000. Corrected net cash provided by operating activities = $1,128,000
  − $46,000 − $148,000 − $36,000 + $210,000 = $1,108,000.'
