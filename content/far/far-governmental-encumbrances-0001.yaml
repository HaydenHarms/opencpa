id: far-governmental-encumbrances-0001
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: State and local government concepts
  skill: Application
review:
  status: reviewed
  references:
  - GASB Codification 1700 (budgetary accounting and encumbrances)
  notes: Batch 01. Adapted from legacy bank; answer re-solved, arithmetic checked in code, distractors
    rebuilt where needed.
stem: Oakdale School District's general fund issues a purchase order for $90,000 of science equipment
  and records an encumbrance. The equipment arrives with an invoice for $92,000. What is recorded when
  the goods are received?
choices:
- id: A
  text: Keep the $90,000 encumbrance open and add a $2,000 encumbrance for the overrun.
  rationale: Encumbrances are closed out once goods are received and the liability is recorded.
- id: B
  text: Record the equipment as a $90,000 asset and a $2,000 expenditure for the variance.
  rationale: Governmental funds record capital outlay expenditures, not assets, and at the actual amount.
- id: C
  text: Reverse the $90,000 encumbrance; record a $92,000 expenditure and voucher payable.
  rationale: Correct. The encumbrance is reversed at the amount originally recorded, and the expenditure
    is recorded at the actual invoice amount.
- id: D
  text: Reverse the encumbrance at $92,000; record a $92,000 expenditure and voucher payable.
  rationale: The reversal must equal the amount originally encumbered ($90,000), not the invoice amount.
answer: C
explanation: When goods arrive, the encumbrance is reversed for the amount originally recorded ($90,000),
  and the expenditure and liability are recorded at the actual cost ($92,000).
