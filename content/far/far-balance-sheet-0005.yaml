id: far-balance-sheet-0005
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Balance sheet
  skill: Application
review:
  status: reviewed
  references:
  - ASC 210-10-45 (current assets and current liabilities)
  - ASC 740-10-45 (deferred taxes classified as noncurrent)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Hadley Co.''s adjusted trial balance at December 31, Year 3, includes these accounts: cash $120,000;
  cash held by a trustee under a bond indenture to retire long-term bonds in Year 6, $60,000; accounts
  receivable $250,000; allowance for credit losses $15,000; inventory $310,000; prepaid rent covering
  the next twelve months $24,000; equipment, net of depreciation, $900,000; accounts payable $180,000;
  accrued wages $30,000; a note payable of $400,000, repayable in equal annual installments of $100,000
  each July 1; dividends payable $20,000; unearned revenue for services to be performed in Year 4, $40,000;
  and a deferred tax liability of $35,000. Hadley is preparing a classified balance sheet. What is Hadley''s
  working capital at December 31, Year 3?'
choices:
- id: A
  text: $284,000
  rationale: Treats the $35,000 deferred tax liability as current. Deferred taxes are always classified
    as noncurrent.
- id: B
  text: $319,000
  rationale: Correct. Current assets $689,000 − current liabilities $370,000.
- id: C
  text: $379,000
  rationale: Counts the $60,000 held by the trustee as a current asset. Cash restricted to retiring long-term
    debt is noncurrent.
- id: D
  text: $419,000
  rationale: Classifies the whole note as noncurrent. The $100,000 installment due next July 1 is a current
    liability.
answer: B
explanation: 'Current assets: cash $120,000 + receivables net of the allowance $235,000 + inventory $310,000
  + prepaid rent $24,000 = $689,000. The trustee-held cash is restricted to retiring long-term debt, so
  it is noncurrent. Current liabilities: accounts payable $180,000 + accrued wages $30,000 + the note
  installment due next July 1 $100,000 + dividends payable $20,000 + unearned revenue $40,000 = $370,000.
  The rest of the note and the deferred tax liability are noncurrent. Working capital = $689,000 − $370,000
  = $319,000.'
