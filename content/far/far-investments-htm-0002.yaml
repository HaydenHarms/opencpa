id: far-investments-htm-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments (Financial assets at amortized cost)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 320-10-35 (held-to-maturity debt securities at amortized cost)
  - 'ASC 310-20-35 (interest method: amortization of premium)'
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: On July 1, Year 1, Thockrington Corp. paid $834,121 for $800,000 face amount of 5-year, 7% bonds
  issued that day, which pay interest each June 30 and December 31; the price gives a yield of 6% a year,
  compounded semiannually. Thockrington classifies the bonds as held to maturity and expects no credit
  losses on them, so it records no allowance. It amortizes the premium by the effective interest method,
  rounding each period's figures to the nearest dollar. At December 31, Year 2, the bonds' fair value
  is $839,500. At what amount should Thockrington report the investment at December 31, Year 2?
choices:
- id: A
  text: $824,921
  rationale: 'Correct. $834,121 less three periods of premium amortization: $2,976, $3,066, $3,158.'
- id: B
  text: $834,121
  rationale: Leaves the bonds at their $834,121 cost. The premium is amortized as an adjustment of interest
    income over the bonds' life.
- id: C
  text: $839,500
  rationale: Reports the bonds at their $839,500 fair value. Held-to-maturity securities are reported
    at amortized cost.
- id: D
  text: $843,321
  rationale: Adds the premium amortization to the carrying amount. Amortizing a premium reduces the carrying
    amount toward face value.
answer: A
explanation: Each semiannual coupon is $800,000 × 7% ÷ 2 = $28,000, and interest income is the carrying
  amount × 6% ÷ 2. $834,121 × 3% = $25,024 interest income, $28,000 − $25,024 = $2,976 amortized; $831,145
  × 3% = $24,934 interest income, $28,000 − $24,934 = $3,066 amortized; $828,079 × 3% = $24,842 interest
  income, $28,000 − $24,842 = $3,158 amortized. Carrying amount at December 31, Year 2 = $834,121 − $9,200
  = $824,921. Held-to-maturity securities are reported at amortized cost, so the fair value is not used.
