id: far-accounting-errors-0007
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 250-10-45-23 (correction of an error in previously issued financial statements: restatement)'
  - ASC 250-10-45-17 (change in accounting estimate applied prospectively)
  - ASC 606-10-25-23 (revenue recognized when control transfers; contract liabilities)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Ambleside Co. presents comparative financial statements for Years 2 and 3. Its Year 2 statements,
  already issued, reported net income of $1,284,000. While preparing its Year 3 statements, Ambleside
  finds: a $96,000 deposit received in December, Year 2, from a customer for goods delivered in February,
  Year 3, was recorded as Year 2 sales revenue, and the goods'' cost was correctly charged to Year 3;
  $28,000 of interest earned on a note receivable during Year 1 was never accrued and was recorded as
  interest revenue when collected in March, Year 2; and $60,000 of rent paid in December, Year 2, for
  January through June, Year 3, was charged to Year 2 rent expense. In Year 3, Ambleside also revised
  its warranty cost estimates on the basis of new claims experience; had the new estimates been used in
  Year 2, Year 2 warranty expense would have been $44,000 higher. Ambleside''s income tax rate is 25%
  for all years and all items. What net income should Ambleside report for Year 2 in its comparative statements?'
choices:
- id: A
  text: $1,203,000
  rationale: Applies the Year 3 revision of the warranty estimate to Year 2. A change in estimate is accounted
    for prospectively, in Year 3 and later; prior periods are not restated.
- id: B
  text: $1,220,000
  rationale: Restates by the pretax amounts. Each correction changes income tax expense too, so net income
    changes by 75% of each pretax amount.
- id: C
  text: $1,236,000
  rationale: Correct. $1,284,000 + 75% × (− $96,000 − $28,000 + $60,000).
- id: D
  text: $1,257,000
  rationale: Treats the interest as affecting Year 1 only. Recording it as revenue when collected in Year
    2 also overstated Year 2 income, so the Year 2 column is restated for it.
answer: C
explanation: 'The three errors are corrected by restating Year 2; the warranty revision is a change in
  estimate, applied prospectively. Pretax effects on Year 2: the deposit wasn''t revenue until the goods
  were delivered in Year 3 (− $96,000); the interest belonged to Year 1, so recording it on collection
  overstated Year 2 (− $28,000); the prepaid rent was Year 3 expense (+ $60,000). Net pretax effect =
  − $64,000; after tax, × 75% = − $48,000. Restated Year 2 net income = $1,236,000.'
