id: far-subsequent-events-0006
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Application
review:
  status: reviewed
  references:
  - ASC 855-10 (recognized and nonrecognized subsequent events; evaluation through the date the statements
    are issued)
  - ASC 450-20 (loss contingencies)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Caister Co.''s December 31, Year 1, financial statements were issued on March 10, Year 2. Its unadjusted
  trial balance reports accrued liabilities for claims and litigation of $230,000: $150,000 for a suit
  by a customer injured at one of Caister''s stores in September, Year 1, and $80,000 for a state agency''s
  claim over a chemical spill at Caister''s plant in Year 1, which was Caister''s best estimate at year-end
  and was still its best estimate when the statements were issued. After year-end: on January 8, a customer
  filed a claim over a defective shipment it received from Caister in December, and on February 2, Caister
  agreed to pay it $45,000; on January 22, one of Caister''s delivery trucks injured a pedestrian, who
  sued in February, and Caister''s counsel expects Caister to pay about $100,000; on February 12, Caister
  settled the customer injury suit for $190,000; and on March 20, Caister settled the state agency''s
  claim for $110,000. What total liability for claims and litigation should Caister report on its December
  31, Year 1, balance sheet?'
choices:
- id: A
  text: $230,000
  rationale: Makes no adjustment to the unadjusted balances.
- id: B
  text: $270,000
  rationale: Doesn't accrue the $45,000 for the defective December shipment. The defect existed at year-end;
    the January claim and February agreement are evidence of that liability.
- id: C
  text: $315,000
  rationale: Correct. $190,000 injury settlement + $45,000 shipment claim + $80,000 state agency claim.
- id: D
  text: $415,000
  rationale: Also accrues the $100,000 for the January truck accident. The accident happened after year-end,
    so it is disclosed, not recognized.
answer: C
explanation: 'Events before the statements are issued that give evidence about conditions existing at
  year-end are recognized. The injury suit arose in Year 1, so its accrual rises to the $190,000 settlement.
  The defective shipment was made in December, so the $45,000 agreed in February is accrued. The truck
  accident happened in January: disclose it, don''t accrue it. The state agency''s claim stays at $80,000,
  the best estimate when the statements were issued; the March 20 settlement came after issuance. Total
  = $190,000 + $45,000 + $80,000 = $315,000.'
