id: far-receivables-reconciliation-0006
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 310-10 (receivables)
  - 'ASC 606-10-25-30 (transfer of control: FOB shipping point)'
  - ASC 405-20 (extinguishment of a liability; settlement of a receivable against a payable by agreement)
  - Subsidiary ledger and control account reconciliation practice (unposted batches; journal coding errors)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Year 2, Golant Packaging Co.''s accounts receivable subledger totals $816,350,
  and the general ledger control account shows $857,050. The controller''s investigation finds: a $23,400
  invoice dated December 30 was recorded as a sale in both records, but the goods, sold FOB shipping point,
  were not shipped until January 3; the sales journal batch for December 29, totaling $64,250, was posted
  to the control account, but its invoices were never posted to the customers'' accounts; in December,
  Golant agreed with Tywardreath Mills, which is both a customer and a supplier, to settle $14,900 of
  Tywardreath Mills''s balance against an equal amount Golant owed it, and the general ledger recorded
  the settlement (debit accounts payable, credit accounts receivable) but the customer''s subledger account
  did not; and $8,650 of December cash sales was entered in the accounts receivable column of the cash
  receipts journal, so its total was credited to the control account. By what net amount must Golant change
  its subledger total so that it shows the correct balance?'
choices:
- id: A
  text: $14,750 decrease
  rationale: Gives the adjustment the control account needs (remove the $23,400 early invoice, restore
    the $8,650 wrongly credited), not the subledger's.
- id: B
  text: $25,950 increase
  rationale: Correct. − $23,400 + $64,250 − $14,900; the subledger becomes $842,300, which agrees with
    the corrected control account.
- id: C
  text: $34,600 increase
  rationale: Also adds the $8,650 of cash sales to the subledger. The cash sales were wrongly credited
    to the control account, but no customer account was touched, so only the general ledger needs that
    correction.
- id: D
  text: $49,350 increase
  rationale: Leaves the $23,400 invoice for goods shipped in January in the subledger. The goods hadn't
    left Golant's dock at December 31, so there was no sale or receivable in Year 2, and both records
    must remove it.
answer: B
explanation: 'The early invoice is in both records and must come out of both (− $23,400): the goods, sold
  FOB shipping point, hadn''t shipped, so control hadn''t passed. The December 29 batch is missing from
  the subledger (+ $64,250). The settlement against the payable is missing from the subledger (− $14,900).
  The cash sales error affects only the control account, which must be debited back $8,650. Subledger
  change = − $23,400 + $64,250 − $14,900 = $25,950 increase, to $842,300. Control account: $857,050 −
  $23,400 + $8,650 = $842,300, so the records agree.'
