id: far-investments-htm-credit-loss-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments (Financial assets at amortized cost)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 326-20 (current expected credit losses on held-to-maturity debt securities; discounted cash flow
    method)
  - ASC 320-10 (held-to-maturity classification)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Tanager Co. bought $500,000 face amount of bonds at par on January 1, Year 1, and classifies them
  as held to maturity. The bonds pay 6% interest each December 31 and mature on December 31, Year 5. On
  December 31, Year 3, after receiving that day's interest, Tanager learns that the issuer is in financial
  difficulty. Tanager now expects to receive the two remaining interest payments in full but only $400,000
  of the principal at maturity. The bonds' fair value is $381,500, and the market rate for similar bonds
  is 9%. Tanager measures expected credit losses by discounting expected cash flows at the bonds' effective
  interest rate, and it had recorded no allowance before. Present value factors for two periods are 1.8334
  (ordinary annuity) and 0.8900 (single sum) at 6%, and 1.7591 and 0.8417 at 9%. What credit loss expense
  should Tanager recognize for Year 3?
choices:
- id: A
  text: $88,998
  rationale: Correct. $500,000 amortized cost − $411,002 present value of expected cash flows at 6%.
- id: B
  text: $100,000
  rationale: Uses the undiscounted $100,000 principal shortfall. Expected cash flows are discounted.
- id: C
  text: $110,547
  rationale: Discounts the expected cash flows at the 9% market rate. Tanager's method discounts them
    at the bonds' 6% effective interest rate.
- id: D
  text: $118,500
  rationale: Writes the bonds down to their $381,500 fair value, as for an available-for-sale security.
    A held-to-maturity security's allowance reflects expected credit losses, not fair value.
answer: A
explanation: 'Under the current expected credit loss model, a held-to-maturity security carries an allowance
  equal to its amortized cost minus the present value of the cash flows expected, discounted here at the
  6% effective rate; fair value doesn''t enter. Expected cash flows: interest $30,000 × 1.8334 = $55,002,
  plus principal $400,000 × 0.8900 = $356,000, for $411,002. The bonds were bought at par, so amortized
  cost is $500,000. Allowance and expense = $88,998.'
