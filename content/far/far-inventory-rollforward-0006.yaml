  notes: Batch 15. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Pendeen''s perpetual inventory records show a Year 2 rollforward of beginning inventory $210,000,
  purchases $1,480,000, and cost of goods sold $1,395,000, for a draft December 31 balance of $295,000.
  Reviewing the count and the purchase records, the controller finds: the count includes $34,000 of goods
  a supplier shipped to Pendeen on consignment, which Pendeen may return unsold; $52,000 of Pendeen''s
  own inventory, pledged as collateral for a bank loan, was removed from the inventory account when the
  loan was obtained; and purchases are recorded under the net method, so $12,000 of discounts on invoices
  Pendeen paid after the discount period, and so never took, reduced the recorded cost of goods still
  on hand. What inventory should the corrected rollforward report at December 31, Year 2?'
choices:
- id: A
  text: $273,000
  rationale: Leaves out the $52,000 of inventory Pendeen pledged as collateral for a loan. Pledging goods
    as security doesn't transfer ownership, so they remain Pendeen's inventory.
- id: B
  text: $313,000
  rationale: Leaves purchases recorded net of the $12,000 of discounts Pendeen didn't take. Because Pendeen
    paid after the discount period, the $12,000 is a financing cost, not a permanent reduction of inventory
    cost.
- id: C
  text: $325,000
  rationale: Correct. $295,000 − $34,000 + $52,000 + $12,000.
- id: D
  text: $359,000
  rationale: Keeps the $34,000 of goods Pendeen holds on consignment from a supplier in inventory. Title
    to consigned-in goods stays with the consignor until Pendeen sells them; they aren't Pendeen's inventory.
answer: C
explanation: Goods held on consignment from a supplier aren't Pendeen's inventory until Pendeen sells
  them (ASC 606-10-55-80), so the $34,000 comes out. Pledging inventory as loan collateral doesn't change
  who owns it, so the $52,000 of pledged goods belongs back in inventory. Discounts lost because an invoice
  was paid late are a financing cost, not a reduction of inventory cost, so the $12,000 is restored. Corrected
  inventory = $295,000 − $34,000 + $52,000 + $12,000 = $325,000.
