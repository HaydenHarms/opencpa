id: far-inventory-rollforward-0006
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: draft
  references:
  - ASC 330-10-30 (cost of inventory; cash discounts)
  - ASC 606-10-55-79 to 55-80 (consignment arrangements)
  - 'Inventory cutoff: FOB shipping point and purchase returns'
  notes: Batch 15, revision 2 (blind verifier and gate findings applied). Written from scratch; answers
    solved and every number and distractor computed in code.
stem: Trewellard Hardware Co. uses a perpetual inventory system and records purchases net of cash discounts.
  Its staff's Year 2 inventory rollforward shows beginning inventory of $210,000, purchases (net of returns)
  of $1,480,000, cost of goods sold of $1,395,000 and ending inventory of $295,000; the purchases figure
  is the purchases journal total. Testing that figure, the controller finds that $34,000 of goods a supplier
  shipped to Trewellard on consignment, which Trewellard may return unsold, were entered as purchases
  when they arrived; that when Trewellard paid invoices after the discount period, it charged the $12,000
  of discounts it lost to purchases; that goods costing $21,000, which Trewellard shipped back to a supplier
  on December 18, weren't entered as a purchase return until the supplier's credit memo arrived in January;
  and that the journal includes $27,000 of goods a supplier shipped FOB shipping point on December 29,
  still in transit at year-end. What purchases (net of returns) should the corrected rollforward report
  for Year 2?
choices:
- id: A
  text: $1,386,000
  rationale: Removes the $27,000 of goods in transit at year-end. Shipped FOB shipping point, they became
    Trewellard's when the supplier shipped them on December 29, so they are properly in Year 2 purchases.
- id: B
  text: $1,413,000
  rationale: Correct. $1,480,000 − $34,000 − $12,000 − $21,000; the in-transit goods stay in.
- id: C
  text: $1,425,000
  rationale: Keeps the $12,000 of discounts lost in purchases. Under the net method, inventory is recorded
    at the discounted price, and discounts lost by paying late are a financing expense, not inventory
    cost.
- id: D
  text: $1,447,000
  rationale: Keeps the $34,000 of consigned goods in purchases. Title stays with the supplier until Trewellard
    sells them, so receiving them isn't a purchase.
answer: B
explanation: Consigned goods belong to the supplier until Trewellard sells them (ASC 606-10-55-79 to 55-80),
  so the $34,000 isn't a purchase. Under the net method, purchases are recorded at the discounted price
  and a discount lost by paying late is a financing expense, so the $12,000 comes out of purchases. The
  goods returned on December 18 reduce Year 2 purchases (− $21,000), whenever the credit memo arrives.
  Goods shipped FOB shipping point belong to Trewellard from the shipment date, so the $27,000 in transit
  is properly a Year 2 purchase and stays. Corrected purchases = $1,480,000 − $34,000 − $12,000 − $21,000
  = $1,413,000.
