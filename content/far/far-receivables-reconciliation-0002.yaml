id: far-receivables-reconciliation-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 310-10-45 (credit balances in receivables reported as liabilities)
  - ASC 606-10-55 (consignment arrangements)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Arlo Supply''s accounts receivable subledger shows a net balance of $598,500, which
  includes customer accounts with credit balances from overpayments totaling $3,000. The general ledger
  control account shows $604,800. The controller''s investigation finds: a $4,500 credit memo for returned
  goods was posted to the customer''s subledger account but not to the control account; the December 14
  sales journal total of $84,600 was posted to the control account as $86,400; and a $7,200 invoice was
  recorded in both records for goods shipped on December 30 to a dealer that holds them on consignment
  for Arlo. Before any allowance for credit losses, what amount should Arlo report as accounts receivable?'
choices:
- id: A
  text: $591,300
  rationale: Corrects both records but reports the net balance. The $3,000 of customer credit balances
    is a liability, so receivables are reported without netting it.
- id: B
  text: $594,300
  rationale: Correct. $598,500 − $7,200 consignment invoice + $3,000 of credit balances reclassified.
- id: C
  text: $598,500
  rationale: Uses the subledger balance as recorded.
- id: D
  text: $604,800
  rationale: Uses the control account as recorded, before correcting it.
answer: B
explanation: 'Control account: $604,800 − $4,500 credit memo − $1,800 posting error − $7,200 consignment
  invoice = $591,300. Subledger: $598,500 − $7,200 = $591,300. The records now agree. The $3,000 of credit
  balances is reclassified to liabilities, so accounts receivable is $591,300 + $3,000 = $594,300.'
