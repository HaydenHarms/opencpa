id: far-contingencies-0014
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 450-30-25-1 (gain contingencies not recognized before realization)
  - 'ASC 610-30 (involuntary conversions: insurance recoveries of recognized losses)'
  - ASC 310-10 (receivables)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Fortrose Textile Co. is preparing its December 31, Year 1, financial statements, which have not
  been issued. Its files show: (1) a November fire destroyed inventory that had cost $640,000, and Fortrose
  recognized a $640,000 loss; in December, its insurer accepted the claim in writing and will pay, in
  January, the inventory''s $610,000 replacement cost less the policy''s $25,000 deductible; (2) in December,
  a jury awarded Fortrose $900,000 in its patent suit against a competitor, which has appealed; (3) on
  December 18, a former supplier signed an agreement to pay Fortrose $86,000 by February 15, Year 2, to
  settle Fortrose''s claim over defective materials, and the supplier is financially sound; and (4) Fortrose
  has filed a $140,000 claim with a different insurer for business lost during the fire, and that insurer
  says its policy doesn''t cover the loss. What total receivables from these matters should Fortrose report
  at December 31, Year 1?'
choices:
- id: A
  text: $86,000
  rationale: Leaves out the $585,000 insurance recovery until the cash arrives. A recovery of a loss already
    recognized is recorded when it is probable, as it is once the insurer accepts the claim in writing.
- id: B
  text: $585,000
  rationale: Leaves out the $86,000 settlement because it is a gain. The supplier's signed agreement makes
    the amount realizable, so it is no longer a contingency and the receivable is recognized.
- id: C
  text: $671,000
  rationale: Correct. ($610,000 − $25,000) + $86,000.
- id: D
  text: $1,571,000
  rationale: Includes the $900,000 jury award. The competitor has appealed, so the award is a gain contingency,
    which isn't recognized until it is realized or realizable; it may be disclosed.
answer: C
explanation: 'The insurance recovery on the fire loss is probable, since the insurer has accepted the
  claim in writing, and it doesn''t exceed the $640,000 loss recognized, so a receivable is recognized
  for the amount to be paid: $610,000 − $25,000 = $585,000. The supplier''s signed settlement is realizable,
  so $86,000 is a receivable. The jury award under appeal is a gain contingency (ASC 450-30), not recognized
  until realized, and the disputed business-interruption claim isn''t probable of recovery. Total receivables
  = $671,000.'
