id: far-subsequent-events-0018
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: draft
  references:
  - ASC 855-10-25-1 and 25-3 (recognized versus nonrecognized subsequent events)
  - 'ASC 606-10-32-5 to 32-9 (variable consideration: penalties payable to a customer)'
  - SEC SAB Topic 4C (retroactive effect of later stock dividends, for SEC registrants only)
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: Hallowfield Textiles Co., a private company that is not an SEC filer, has a draft December 31, Year
  1, balance sheet that reports retained earnings of $1,240,000. That balance reflects a $140,000 penalty,
  recorded as a reduction of revenue, that Hallowfield expected to owe a customer under their contract
  for missing a Year 1 delivery deadline. The statements will be available to be issued on March 12, Year
  2. In January, Year 2, Hallowfield and the customer finished negotiating the penalty and fixed it at
  $95,000. In February, Year 2, Hallowfield's board declared a 5% stock dividend, recorded at $260,000.
  Hallowfield's tax rate is 25% for all effects. What retained earnings should Hallowfield report at December
  31, Year 1?
choices:
- id: A
  text: $1,013,750
  rationale: Also deducts $260,000 for the stock dividend declared in February. Hallowfield is a private
    company, so a stock dividend declared after year-end is recorded in Year 2 and doesn't change December
    31, Year 1, retained earnings; it is disclosed.
- id: B
  text: $1,206,250
  rationale: Subtracts the adjustment. The negotiated penalty is lower than the amount accrued at year-end,
    so the correction raises revenue and retained earnings, net of tax.
- id: C
  text: $1,273,750
  rationale: Correct. $1,240,000 + ($140,000 − $95,000) × 75%.
- id: D
  text: $1,285,000
  rationale: Adds the full pretax $45,000 reduction in the penalty, without its 25% tax effect.
answer: C
explanation: 'A penalty payable to a customer is variable consideration, which reduces revenue (ASC 606-10-32-5
  to 32-9). The negotiation, completed before the statements were available to be issued, fixes the amount
  of an obligation that existed at year-end, so it is a recognized subsequent event (ASC 855-10-25-1):
  the $140,000 accrual falls to $95,000, raising Year 1 revenue by $45,000, or $33,750 after the 25% tax.
  For a company that isn''t an SEC filer, a stock dividend declared after year-end is recorded when declared,
  in Year 2, and disclosed (ASC 855-10-25-3); only SEC registrants give such dividends retroactive effect
  in the balance sheet (SEC SAB Topic 4C). Retained earnings = $1,240,000 + $33,750 = $1,273,750.'
