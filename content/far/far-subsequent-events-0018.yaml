id: far-subsequent-events-0018
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 855-10-25 (subsequent event confirming a condition that existed at the balance sheet date)
  - ASC 855-10-50 (nonrecognized subsequent events, including later equity transactions)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Hallowfield Textiles Co.'s draft December 31, 1, balance sheet reports retained earnings of $5,240,000,
  which includes a $140,000 accrual for a penalty Hallowfield expected to owe a customer for missing a
  1 delivery deadline specified in their contract. The statements will be issued on March 12, 2. In January,
  Hallowfield and the customer finished negotiating the penalty and fixed it at $95,000. In February,
  Hallowfield's board also declared a 5% stock dividend, recorded at $260,000. Hallowfield's tax rate
  is 25% for all effects. What retained earnings should Hallowfield report at December 31, 1?
choices:
- id: A
  text: $5,013,750
  rationale: Also deducts $260,000 for the stock dividend the board declared in February. A stock dividend
    declared after year-end is recorded in 2; it doesn't change the December 31, 1, balance of retained
    earnings.
- id: B
  text: $5,206,250
  rationale: Subtracts the adjustment. The renegotiated penalty is lower than the amount accrued at year-end,
    so the correction raises retained earnings, net of tax.
- id: C
  text: $5,273,750
  rationale: Correct. $5,240,000 + ($140,000 − $95,000) × 75%.
- id: D
  text: $5,285,000
  rationale: Adds the full pretax $45,000 reduction in the penalty, without its 25% tax effect.
answer: C
explanation: 'The negotiated penalty confirms the amount of an obligation that existed at year-end, so
  the $140,000 accrual is adjusted down to $95,000: a $45,000 reduction in expense, net of tax at 75%
  = $33,750 increase to retained earnings. The stock dividend is declared and recorded in 2; it has no
  effect on the December 31, 1, balance. Corrected retained earnings = $5,240,000 + $33,750 = $5,273,750.'
