id: far-inventory-reconciliation-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10-30 (inventory cost, including inbound freight)
  - ASC 330-10 (ownership of goods held by others)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Winskill Co.''s perpetual inventory subledger totals $1,158,880, and its general
  ledger inventory account shows $1,175,480. The controller''s investigation finds: a December 18 receiving
  report for goods costing $14,600 was posted to the subledger twice; goods costing $37,800 that Winskill
  moved on December 20 to a public warehouse, which stores them for Winskill for a fee, were removed from
  the subledger as if sold, while the general ledger made no entry; Winskill paid $18,000 of inbound freight
  on a December 2 purchase of 5,000 units, 1,200 of which were still on hand at December 31, and the general
  ledger charged all of the freight to inventory, while the subledger recorded none of it and cost of
  goods sold entries, posted from the subledger''s costs, relieved none of it from the general ledger;
  and goods costing $24,600 that a customer returned on December 30 were restored to the subledger, but
  the general ledger entry was not posted. What amount should Winskill report as inventory at December
  31?'
choices:
- id: A
  text: $1,148,600
  rationale: Leaves out the $37,800 of goods in the public warehouse. Winskill still owns goods it stores
    with a third party.
- id: B
  text: $1,182,080
  rationale: Expenses all of the freight. Inbound freight is part of inventory cost, so the $4,320 on
    units still on hand stays in inventory.
- id: C
  text: $1,186,400
  rationale: Correct. Subledger $1,158,880 − $14,600 + $37,800 + $4,320 = ledger $1,175,480 − $13,680
    + $24,600.
- id: D
  text: $1,200,080
  rationale: Keeps all $18,000 of freight in inventory. Freight on the 3,800 units sold belongs in cost
    of goods sold; only $4,320 stays in inventory.
answer: C
explanation: 'Freight on the December 2 purchase is part of its cost: $18,000 × 1,200/5,000 = $4,320 belongs
  to units still on hand and $13,680 to units sold. Subledger: $1,158,880 − $14,600 duplicate posting
  + $37,800 goods in the public warehouse, which Winskill still owns, + $4,320 freight on hand = $1,186,400.
  General ledger: $1,175,480 − $13,680 freight on units sold + $24,600 customer return = $1,186,400. The
  records agree at $1,186,400.'
