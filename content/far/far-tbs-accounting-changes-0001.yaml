id: far-tbs-accounting-changes-0001
type: tbs
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 250-10-45-5 through 45-8 (retrospective application of a change in accounting principle)
  - ASC 250-10-45-17 through 45-20 (changes in accounting estimate, prospective)
  - ASC 250-10-45-23 and 45-24 (restatement for error corrections)
  - ASC 250-10-20 (adopting a principle for transactions that previously did not occur is not a change
    in accounting principle)
  - ASC 340-40-25-1 through 25-4 and 35-1 (incremental costs of obtaining a contract)
  notes: FAR simulations batch 04. Written from scratch; every number computed in code.
title: 'Year 3 comparative statements: a change, an error and an estimate'
scenario: Corrieside Supply Co. presents comparative income statements and statements of retained earnings
  for Years 2 and 3. Its Year 2 statements have been issued; its Year 3 statements have not. The controller's
  memo on four Year 3 matters is in Exhibit 1, inventory amounts are in Exhibit 2, and the staff's draft
  figures are in Exhibit 3. Corrieside's income tax rate is 25% for all years and all effects, including
  deferred taxes. Round every amount to the nearest dollar.
exhibits:
- title: 'Exhibit 1: Controller''s memo on Year 3 matters'
  body: '| Matter | Facts |

    |---|---|

    | Inventory method | Through Year 2, Corrieside costed inventory by FIFO. On January 1, Year 3, it
    adopted the weighted-average method for all inventory, because its new purchasing system tracks costs
    that way and management concluded that weighted-average better matches the way it prices its products.
    Corrieside''s records allow it to compute weighted-average inventory at every prior year end (Exhibit
    2). |

    | Sales commissions | On July 1, Year 2, Corrieside paid its sales staff commissions of $96,000 for
    signing three-year service contracts that run from July 1, Year 2, to June 30, Year 5. The commissions
    were paid only because the contracts were signed, and Corrieside expects to recover them from the
    contract margins. Corrieside charged them to Year 2 expense. Its policy for costs of obtaining contracts
    that must be capitalized is to amortize them straight-line over the contract term; the contracts are
    not expected to be renewed. |

    | Delivery fleet | Bought January 1, Year 1, for $1,350,000, depreciated straight-line over 10 years
    with no residual value. In January, Year 3, an engineering study based on two years of route data
    concluded that the fleet''s total useful life will be 6 years, with no residual value. |

    | Equipment leasing | In Year 3, Corrieside began leasing forklifts to customers, a business it had
    never been in, and adopted lessor accounting policies for those leases. |'
- title: 'Exhibit 2: Inventory at December 31'
  body: '| December 31 | FIFO | Weighted average |

    |---|---|---|

    | Year 1 | 812,000 | 776,000 |

    | Year 2 | 905,000 | 851,000 |

    | Year 3 | 968,000 | 930,000 |'
- title: 'Exhibit 3: Staff''s draft figures'
  body: '| Item | Amount |

    |---|---|

    | Year 2 net income, as originally reported | 1,180,000 |

    | Staff adjustment: capitalize the July 1, Year 2, commissions, less Year 2 amortization of $32,000,
    net of tax | 48,000 |

    | Staff adjustment: depreciation on the fleet under its revised 6-year life ($225,000 a year, against
    $135,000 reported), net of tax | (67,500) |

    | Year 2 net income, as adjusted by the staff | 1,160,500 |

    | Retained earnings, January 1, Year 2, as originally reported | 4,620,000 |

    | Dividends declared: Year 2 / Year 3 | 300,000 / 320,000 |

    | Year 3 net income, draft | 1,306,000 |


    The Year 3 draft uses weighted-average cost for Year 3 purchases and for ending inventory ($930,000).
    Its cost of goods sold starts from the December 31, Year 2, inventory as reported in the Year 2 balance
    sheet. It includes $32,000 of commission amortization and fleet depreciation of $270,000, computed
    on the fleet''s carrying amount at December 31, Year 2, as originally reported. The staff made no
    other adjustments. All net income and adjustment amounts in this exhibit are after income taxes.'
tasks:
- id: t1
  type: select
  points: 2
  prompt: For each matter in Exhibit 1, indicate how Corrieside should report it.
  options:
  - Retrospective application to prior periods presented
  - Restatement of prior periods presented
  - Prospective application, from Year 3
  - Not an accounting change or error correction
  rows:
  - id: r1
    label: Inventory method
    answer: Retrospective application to prior periods presented
  - id: r2
    label: Sales commissions
    answer: Restatement of prior periods presented
  - id: r3
    label: Delivery fleet
    answer: Prospective application, from Year 3
  - id: r4
    label: Equipment leasing
    answer: Not an accounting change or error correction
  explanation: 'FIFO to weighted average is a change in accounting principle, justified as preferable
    and with every period''s effect determinable, so it is applied retrospectively. Expensing commissions
    that must be capitalized (incremental, expected to be recovered, amortization period over one year,
    so the practical expedient is not available) was an error in GAAP: restate Year 2. The fleet''s life
    is an estimate revised for new information, so it is applied prospectively from Year 3; the staff''s
    Year 2 adjustment is wrong. Adopting a policy for transactions that did not occur before is not an
    accounting change.'
- id: t2
  type: numeric
  points: 2
  unit: cents
  tolerance: 100
  prompt: What net income should Corrieside report for Year 2 in its comparative statements?
  answer: 122650000
  explanation: 'Start from $1,180,000 as reported. Commissions: Year 2 expense should have been amortization
    of $96,000 × 6/36 = $16,000, not $96,000: + ($96,000 − $16,000) × 75% = $60,000 (the staff amortized
    a full year, $32,000, though the contracts began July 1, giving $48,000). Inventory: weighted average
    lowers December 31, Year 1, inventory by $36,000 and December 31, Year 2, inventory by $54,000, so
    Year 2 cost of goods sold rises by $54,000 − $36,000 = $18,000: − $18,000 × 75% = $13,500. The fleet
    change is prospective, so the staff''s $67,500 reduction is reversed. Year 2: $1,180,000 + $60,000
    − $13,500 = $1,226,500. Charging the whole Year 2 inventory difference to Year 2 gives $1,199,500.'
- id: t3
  type: numeric
  points: 1
  unit: cents
  tolerance: 100
  prompt: What retained earnings should Corrieside report at January 1, Year 2, as adjusted, in its comparative
    statements?
  answer: 459300000
  explanation: 'Only the inventory change reaches periods before Year 2: weighted average lowers December
    31, Year 1, inventory by $36,000, and so cumulative income before Year 2 by $36,000 × 75% = $27,000.
    $4,620,000 − $27,000 = $4,593,000. The commission error arose in Year 2, and the fleet change is prospective.'
- id: t4
  type: numeric
  points: 2
  unit: cents
  tolerance: 100
  prompt: What net income should Corrieside report for Year 3?
  answer: 134650000
  explanation: 'The draft''s Year 3 cost of goods sold starts from FIFO inventory of $905,000; under retrospective
    application, beginning inventory is the weighted-average $851,000. Cost of goods sold falls by $54,000,
    and net income rises by $54,000 × 75% = $40,500: $1,306,000 + $40,500 = $1,346,500. The draft''s commission
    amortization ($96,000 × 12/36 = $32,000) and fleet depreciation (($1,350,000 − 2 × $135,000) ÷ 4 remaining
    years = $270,000) are already correct.'
- id: t5
  type: numeric
  points: 1
  unit: cents
  tolerance: 100
  prompt: What retained earnings should Corrieside report at December 31, Year 3?
  answer: 654600000
  explanation: $4,593,000 + Year 2 net income $1,226,500 − dividends $300,000 + Year 3 net income $1,346,500
    − dividends $320,000 = $6,546,000.
