id: far-ppe-reconciliation-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 360-10 (property, plant and equipment: cost, derecognition)'
  - ASC 610-20 (gains and losses from the derecognition of nonfinancial assets)
  notes: Batch 01, revision 3 (2026 blueprint scope, four choices, Analysis items in the blueprint's task
    frames). Answers re-solved and every number and distractor computed in code.
stem: At year-end, Ashby Co.'s fixed-asset subledger shows total equipment cost of $2,450,000, while the
  general ledger equipment account shows $2,500,000. Ashby's draft pretax income is $400,000. Investigating
  the difference, the controller finds two items. First, in October Ashby sold a machine with a cost of
  $60,000 and accumulated depreciation of $48,000 for $15,000 in cash, after recording depreciation through
  the date of sale; the subledger removed the machine, and the general ledger entry debited cash and credited
  gain on sale for $15,000. Second, $10,000 of freight and installation for new equipment placed in service
  on December 31 is included in the subledger cost but was charged to repairs expense in the general ledger.
  Ignore depreciation on the new equipment for the year and income taxes. What is Ashby's corrected pretax
  income?
choices:
- id: A
  text: $350,000
  rationale: Removes the machine's $60,000 cost without its $48,000 of accumulated depreciation, turning
    the $15,000 gain into a $45,000 loss.
- id: B
  text: $388,000
  rationale: Corrects the sale but leaves the $10,000 of freight and installation in expense. Costs to
    bring equipment to its location and ready it for use are part of its cost.
- id: C
  text: $398,000
  rationale: 'Correct. The gain falls from $15,000 to $3,000 ($15,000 − $12,000 carrying amount), and
    the $10,000 of freight and installation is capitalized: $400,000 − $12,000 + $10,000.'
- id: D
  text: $413,000
  rationale: Adds the correct $3,000 gain on top of the $15,000 already recorded instead of replacing
    it.
answer: C
explanation: 'Reconcile first: the general ledger still carries the sold machine ($60,000) and is missing
  the capitalized freight and installation ($10,000), so $2,500,000 − $60,000 + $10,000 = $2,450,000 agrees
  with the subledger. Sale: the carrying amount was $60,000 − $48,000 = $12,000, so the gain is $15,000
  − $12,000 = $3,000, not $15,000; correcting it reduces income by $12,000 (Dr Accumulated depreciation
  $48,000, Dr Gain $12,000, Cr Equipment $60,000). Freight and installation are costs of getting the asset
  ready for use, so capitalizing them increases income by $10,000. Corrected pretax income: $400,000 −
  $12,000 + $10,000 = $398,000.'
