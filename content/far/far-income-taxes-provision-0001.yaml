id: far-income-taxes-provision-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: reviewed
  references:
  - ASC 740-10 (current and deferred tax expense; temporary and permanent differences)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Corliss Corp. reports pretax financial income of $600,000 for Year 1, its first year of operations,
  including $40,000 of interest on municipal bonds that is exempt from tax. Tax depreciation exceeds book
  depreciation by $70,000, and warranty expense accrued for books exceeds warranty claims paid by $30,000;
  warranty costs are deductible when paid. The enacted tax rate is 25% for all years, and Corliss expects
  ample future taxable income. During Year 1, Corliss paid estimated taxes of $100,000, which it recorded
  as prepaid income taxes. After the estimated payments are applied, what income taxes payable should
  Corliss report on its December 31, Year 1, balance sheet, and what total income tax expense should it
  report for Year 1?
choices:
- id: A
  text: $30,000 payable; $130,000 expense
  rationale: Records only current tax expense. The deferred tax liability and asset change deferred tax
    expense.
- id: B
  text: $30,000 payable; $140,000 expense
  rationale: Correct. Current tax $130,000 − $100,000 prepaid = $30,000 payable; expense $130,000 + $17,500
    − $7,500 = $140,000.
- id: C
  text: $40,000 payable; $150,000 expense
  rationale: Taxes the $40,000 of municipal bond interest. Tax-exempt interest is a permanent difference,
    excluded from taxable income and from tax expense.
- id: D
  text: $130,000 payable; $140,000 expense
  rationale: Reports the whole $130,000 of current tax as payable. The $100,000 of estimated payments
    already made is applied against it.
answer: B
explanation: Taxable income = $600,000 − $40,000 tax-exempt interest − $70,000 excess tax depreciation
  + $30,000 warranty accrual not yet deductible = $520,000. Current tax = $520,000 × 25% = $130,000; after
  applying the $100,000 of estimated payments recorded as prepaid income taxes, $30,000 remains payable.
  Deferred tax liability = $70,000 × 25% = $17,500; deferred tax asset = $30,000 × 25% = $7,500. Total
  expense = $130,000 + $17,500 − $7,500 = $140,000.
