id: far-exit-costs-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Payables and accrued liabilities
  skill: Application
review:
  status: draft
  references:
  - 'ASC 420-10-25-4 to 25-9 (one-time employee termination benefits: no future service required, or ratable
    recognition when service extends beyond the minimum retention period)'
  - ASC 420-10-25-11 (contract termination costs)
  - 'ASC 420-10-25-13 (costs that continue under a contract without economic benefit: recognized at the
    cease-use date)'
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: On November 1, Year 1, Penzance Contact Services Co.'s board approves a plan to close a regional
  call center on April 30, Year 2, and that day tells the center's 70 employees which positions will end,
  when, and what each employee will receive; Penzance doesn't expect to change the plan. Each employee
  will receive severance based on years of service, $840,000 in total, payable at termination whether
  the employee stays until the center closes or leaves earlier. Each of the center's 12 team leaders will
  also receive a $15,000 bonus, but only if he or she stays until the center closes, and all of them do.
  No law or agreement requires Penzance to give notice of termination. The center's cleaning contract,
  which isn't a lease, can be ended early for a $65,000 fee by written notice; Penzance sends the notice
  in March, Year 2, and uses the service until then. The center's telephone-service contract, which can't
  be cancelled, runs through September 30, Year 2, at $4,200 a month; Penzance stops using the service
  when the center closes. Treat each month as equal in length, and ignore discounting. What exit-cost
  expense should Penzance recognize in Year 2?
choices:
- id: A
  text: $141,000
  rationale: Leaves out the $65,000 fee to end the cleaning contract. A contract termination cost is recognized
    when the contract is terminated under its terms, by the written notice Penzance sends in March, Year
    2.
- id: B
  text: $206,000
  rationale: Correct. $120,000 remaining bonuses + $65,000 termination fee + $21,000 telephone fees after
    the cease-use date.
- id: C
  text: $266,000
  rationale: Charges the whole $180,000 of team-leader bonuses to Year 2, when they are paid. They are
    recognized ratably over the 6-month service period, so 2/6 ($60,000) was already recognized in Year
    1.
- id: D
  text: $1,046,000
  rationale: Also charges the $840,000 of severance to Year 2, when it is paid. Employees receive it whether
    they stay or leave early, so all of it was recognized when the plan was communicated in Year 1.
answer: B
explanation: 'Severance that employees receive without further service was recognized in full when the
  plan was communicated in Year 1 (ASC 420-10-25-4 and 25-8), so none of the $840,000 is Year 2 expense.
  The team-leader bonuses require service until the center closes, 6 months after communication and longer
  than the 60-day minimum retention period, so they are recognized ratably (ASC 420-10-25-9): 2/6 of $180,000
  = $60,000 in Year 1, leaving $120,000 for Year 2. The cleaning-contract fee is recognized when Penzance
  terminates the contract by giving notice in March, Year 2 (ASC 420-10-25-11): $65,000. The telephone
  fees due after the center closes, 5 × $4,200 = $21,000, continue without economic benefit and are recognized
  at the cease-use date (ASC 420-10-25-13). Year 2 exit-cost expense = $120,000 + $65,000 + $21,000 =
  $206,000.'
