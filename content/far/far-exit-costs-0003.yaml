id: far-exit-costs-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Payables and accrued liabilities
  skill: Application
review:
  status: draft
  references:
  - 'ASC 420-10-25-4 to 25-9 (one-time employee termination benefits: no future service required, or ratable
    recognition when service extends beyond the minimum retention period)'
  - ASC 420-10-25-11 (contract termination costs)
  - ASC 420-10-25-15 (other associated costs)
  notes: Batch 15, revision 2 (blind verifier and gate findings applied). Written from scratch; answers
    solved and every number and distractor computed in code.
stem: On November 1, Year 1, Penzance Contact Services Co.'s board approves a plan to close a regional
  call center on April 30, Year 2, and that day tells the center's 70 employees which positions will end,
  when, and what each employee will receive; Penzance doesn't expect to change the plan. Each employee
  will receive severance based on years of service, $840,000 in total, payable at termination whether
  the employee stays until the center closes or leaves earlier. Each of the center's 12 team leaders will
  also receive a $15,000 bonus, but only if he or she stays until the center closes, and Penzance expects
  all of them to stay. No law or agreement requires Penzance to give notice of termination. The center's
  cleaning contract, which isn't a lease, can be ended early for a $65,000 fee by written notice; Penzance
  plans to send the notice in March, Year 2, and will use the service until then. Penzance also expects
  to pay $38,000 in Year 2 to move retained employees to another office. Treat each month as equal in
  length. What liability for exit costs should Penzance report at December 31, Year 1?
choices:
- id: A
  text: $340,000
  rationale: Accrues only 2/6 of the $840,000 of severance, as though employees had to keep working to
    earn it. Employees receive it whether they stay or leave early, so all of it is recognized when the
    plan is communicated.
- id: B
  text: $900,000
  rationale: Correct. $840,000 of severance, recognized in full at the communication date, plus 2/6 ×
    $180,000 = $60,000 of team-leader bonuses.
- id: C
  text: $965,000
  rationale: Also accrues the $65,000 fee to end the cleaning contract early. A contract termination cost
    is recognized when the contract is terminated under its terms, here by written notice, which Penzance
    won't send until March, Year 2.
- id: D
  text: $1,020,000
  rationale: 'Accrues the whole $180,000 of team-leader bonuses at the communication date. The bonuses
    are paid only to those who stay until the center closes, a service period longer than 60 days, so
    they are recognized ratably over the 6 months: 2/6 by December 31.'
answer: B
explanation: 'One-time termination benefits that employees receive without rendering further service are
  recognized in full when the plan is communicated (ASC 420-10-25-4 and 25-8): the $840,000 of severance.
  The team-leader bonuses require service until the center closes, 6 months after the communication date,
  which is longer than the 60-day minimum retention period that applies when no law sets one, so they
  are recognized ratably over that service period (ASC 420-10-25-9): $180,000 × 2/6 = $60,000 by December
  31. A contract termination cost is recognized when the entity terminates the contract under its terms,
  for example by giving written notice (ASC 420-10-25-11); Penzance hasn''t given notice, so the $65,000
  fee isn''t a liability yet. Moving retained employees is an other associated cost, recognized when incurred
  (ASC 420-10-25-15). Liability = $840,000 + $60,000 = $900,000.'
