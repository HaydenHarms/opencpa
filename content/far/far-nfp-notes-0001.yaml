id: far-nfp-notes-0001
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Notes to financial statements (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-210-50 (liquidity and availability of financial assets)
  - ASC 958-205 (board-designated net assets)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Sparrow Hill Center, a not-for-profit entity, is preparing its note on the liquidity and availability
  of financial assets. At June 30, Year 2, it holds: cash of $250,000, including $90,000 that a donor
  restricted to constructing a new building over the next three years; contributions receivable without
  donor restrictions of $180,000, of which $60,000 is due after June 30, Year 3; and investments of $1,100,000,
  made up of a donor-restricted endowment of $700,000 whose original gift must be held in perpetuity,
  a quasi-endowment of $200,000 that the board designated for long-term investment and does not intend
  to spend from beyond amounts appropriated under its spending policy, and $200,000 of other investments.
  Under its spending policy, Sparrow will appropriate $35,000 of endowment return for general operations
  in the coming year. What amount should the note report as financial assets available to meet general
  expenditures within one year?'
choices:
- id: A
  text: $480,000
  rationale: Leaves out the $35,000 of endowment return appropriated for next year's general operations,
    which is available within one year.
- id: B
  text: $515,000
  rationale: Correct. Cash $160,000 + receivables due within one year $120,000 + other investments $200,000
    + endowment appropriation $35,000.
- id: C
  text: $575,000
  rationale: Includes the $60,000 of contributions receivable due in more than one year.
- id: D
  text: $715,000
  rationale: Includes the $200,000 quasi-endowment. The board has designated it for long-term investment,
    so it isn't available for general expenditure without a board action; that amount is disclosed separately.
answer: B
explanation: 'The note reports financial assets available for general expenditure within one year of the
  balance sheet date. Cash available: $250,000 − $90,000 restricted to the building = $160,000. Receivables
  due within one year: $180,000 − $60,000 = $120,000. Investments: the endowment corpus and the board-designated
  quasi-endowment are excluded, leaving $200,000; the $35,000 appropriated from the endowment for next
  year''s operations is added. Total = $515,000.'
