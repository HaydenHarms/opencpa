id: far-nfp-notes-0001
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Notes to financial statements (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-210-50 (liquidity and availability of financial assets; donor, contractual and time limits)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Sparrow Hill Center, a not-for-profit entity, is reviewing the draft of its note on the liquidity
  and availability of financial assets at June 30, Year 2. The draft reports $715,000 of financial assets
  available to meet general expenditures within one year, computed as total cash plus total contributions
  receivable plus other investments. The supporting records show: cash of $300,000, including $90,000
  that a donor restricted to constructing a new building over the next three years and $60,000 that a
  bond indenture requires Sparrow to hold in a debt service reserve until the bonds mature in Year 9;
  unconditional contributions receivable of $180,000, which donors did not restrict to any purpose, of
  which $50,000 is due after June 30, Year 3; other investments of $235,000, all readily marketable; and
  a donor-restricted endowment of $700,000 whose original gift must be held in perpetuity, which the draft
  excludes. Under its spending policy, Sparrow will appropriate $35,000 of endowment return for general
  operations in the coming year. What amount should the corrected note report as financial assets available
  to meet general expenditures within one year?'
choices:
- id: A
  text: $550,000
  rationale: Correct. $715,000 − $90,000 building cash − $60,000 debt service reserve − $50,000 long-term
    receivables + $35,000 appropriation.
- id: B
  text: $600,000
  rationale: Leaves in the $50,000 of contributions receivable due in more than one year.
- id: C
  text: $610,000
  rationale: Leaves in the $60,000 debt service reserve. The bond indenture requires that cash to be held
    until the bonds mature, a contractual limit that makes it unavailable for general expenditure.
- id: D
  text: $640,000
  rationale: Leaves in the $90,000 of cash restricted by a donor to building construction, which can't
    be used for general expenditure.
answer: A
explanation: 'The note reports financial assets available for general expenditure within one year of the
  balance sheet date, excluding amounts limited by donor restrictions, contracts or timing. Starting from
  the draft''s $715,000: subtract the $90,000 of cash restricted to the building and the $60,000 debt
  service reserve, which the indenture makes unavailable (a contractual limit); subtract the $50,000 of
  receivables not due within one year; and add the $35,000 appropriated from the endowment for next year''s
  operations, which the draft left out. The endowment corpus stays excluded. Corrected total = $550,000.'
