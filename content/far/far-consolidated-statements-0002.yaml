id: far-consolidated-statements-0002
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Consolidated financial statements
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 810-10 (consolidation procedures: intercompany profit elimination)'
  notes: Batch 02. Written from scratch; answers solved and every number and distractor computed in code.
stem: Holt Corp. owns 100% of Vale Inc. During Year 1, Holt sold inventory that cost it $150,000 to Vale
  for $200,000. By December 31, Vale had resold 70% of that inventory to outside customers and still held
  the rest. Holt reported sales of $1,000,000 and cost of goods sold of $600,000; Vale reported sales
  of $500,000 and cost of goods sold of $300,000. Holt's draft consolidated income statement for Year
  1 reports sales of $1,500,000 and cost of goods sold of $900,000. After any corrections needed, what
  is consolidated gross profit?
choices:
- id: A
  text: $400,000
  rationale: Eliminates the $200,000 of intercompany sales without eliminating the matching intercompany
    purchases from cost of goods sold.
- id: B
  text: $550,000
  rationale: Eliminates Holt's entire $50,000 profit on the intercompany sale. Only the profit in inventory
    Vale still holds (30%) is unrealized.
- id: C
  text: $585,000
  rationale: Correct. The draft's $600,000 less $15,000 of unrealized profit in Vale's ending inventory
    (30% × $50,000).
- id: D
  text: $600,000
  rationale: Accepts the draft. Eliminating intercompany sales and purchases leaves gross profit unchanged,
    but the profit in Vale's ending inventory must still be removed.
answer: C
explanation: 'The draft simply adds the two companies'' amounts. Eliminate the $200,000 intercompany sale
  from both sales and cost of goods sold (no effect on gross profit), then remove the unrealized profit
  in Vale''s ending inventory: Holt''s markup is $50,000 on $200,000 of goods, and 30% remains unsold,
  so $15,000 is deferred by increasing cost of goods sold. Consolidated sales $1,300,000 − cost of goods
  sold $715,000 = $585,000.'
