id: far-ppe-held-for-sale-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Application
review:
  status: reviewed
  references:
  - ASC 360-10-35-43 (asset held for sale measured at the lower of carrying amount and fair value less
    cost to sell; not depreciated)
  - ASC 360-10-35-40 (gain on a later increase in fair value less cost to sell limited to cumulative losses
    previously recognized)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: Bettyhill Printing Co. prepares quarterly financial statements. On May 1, Year 1, its board approved
  selling a warehouse that Bettyhill had been using; Bettyhill vacated it that day and listed it with
  a broker at a price close to its fair value. The warehouse had cost $1,200,000, its accumulated depreciation
  was $420,000 at January 1, Year 1, and Bettyhill depreciates it straight-line at $48,000 a year. Its
  fair value was $740,000 on May 1, $705,000 at June 30 and $800,000 at September 30, and the estimated
  costs to sell were $22,000 throughout. The warehouse was still unsold at September 30, and Bettyhill
  expects to sell it by March, Year 2. At what amount should Bettyhill report the warehouse in its September
  30, Year 1, balance sheet?
choices:
- id: A
  text: $683,000
  rationale: Keeps the warehouse at its June 30 fair value less cost to sell, $705,000 − $22,000. The
    increase in the third quarter is recognized as a gain, up to the $81,000 of losses recognized earlier.
- id: B
  text: $744,000
  rationale: 'Keeps depreciating the warehouse after it was classified as held for sale: $764,000 − $48,000
    × 5/12. A long-lived asset isn''t depreciated while it is classified as held for sale.'
- id: C
  text: $764,000
  rationale: Correct. $1,200,000 − $420,000 − $48,000 × 4/12 = $764,000; the September 30 fair value less
    cost to sell ($778,000) exceeds it, so the write-up stops at $764,000.
- id: D
  text: $778,000
  rationale: Writes the warehouse up to its $778,000 fair value less cost to sell. A later increase is
    recognized as a gain only up to the losses previously recognized, so the carrying amount can't exceed
    $764,000, its carrying amount when it was classified as held for sale.
answer: C
explanation: 'Depreciation stops when the warehouse is classified as held for sale on May 1: carrying
  amount = $1,200,000 − $420,000 − $48,000 × 4/12 = $764,000. It is then measured at the lower of that
  amount and fair value less cost to sell: $718,000 on May 1 (a loss of $46,000) and $683,000 at June
  30 (a further loss of $35,000). At September 30, fair value less cost to sell is $778,000. A gain is
  recognized for the increase, but only up to the $81,000 of losses recognized earlier (ASC 360-10-35-40),
  so the warehouse is reported at $764,000.'
