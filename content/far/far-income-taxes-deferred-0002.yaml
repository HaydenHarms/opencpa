id: far-income-taxes-deferred-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: reviewed
  references:
  - ASC 740-10 (measuring deferred tax assets and liabilities at enacted rates for the years the differences
    reverse)
  - ASC 740-10-45 (balance sheet presentation of deferred taxes)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: Hexham Corp. is measuring its deferred taxes at December 31, Year 2. At that date, cumulative tax
  depreciation exceeds book depreciation by $200,000; the difference will reverse by $80,000 in Year 3
  and $120,000 in Year 4. Hexham also has an accrued warranty liability of $50,000, deductible for tax
  when paid, which it expects to pay in Year 3. During Year 2, Hexham paid $30,000 of fines that are not
  deductible. Hexham's enacted tax rates are 20% for Year 2, 24% for Year 3, and 28% for Year 4 and later
  years. In December, Year 2, a bill was proposed, but not enacted, that would set the rate for Year 4
  and later years at 23%. Hexham expects ample future taxable income, files in a single tax jurisdiction,
  and presents its deferred taxes as one net amount. What net deferred tax liability should Hexham report
  at December 31, Year 2?
choices:
- id: A
  text: $34,800
  rationale: Uses the proposed 23% rate for Year 4. Only enacted rates are used; a bill that hasn't been
    enacted is ignored.
- id: B
  text: $40,800
  rationale: Correct. $80,000 × 24% + $120,000 × 28% − $50,000 × 24%.
- id: C
  text: $42,000
  rationale: Measures every difference at 28%, the rate for Year 4 and later. The differences reversing
    in Year 3 are measured at the Year 3 rate of 24%.
- id: D
  text: $52,800
  rationale: Leaves out the $12,000 deferred tax asset on the warranty liability. The warranty costs will
    be deducted when paid in Year 3.
answer: B
explanation: 'Deferred taxes are measured at the enacted rates expected to apply when the differences
  reverse; proposed legislation is ignored. Deferred tax liability: $80,000 × 24% = $19,200 plus $120,000
  × 28% = $33,600, for $52,800. Deferred tax asset: $50,000 × 24% = $12,000. The fines are a permanent
  difference and create no deferred tax. Net deferred tax liability = $52,800 − $12,000 = $40,800.'
