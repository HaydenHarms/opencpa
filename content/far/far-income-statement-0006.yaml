id: far-income-statement-0006
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Income statement
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 606-10-25 (transfer of control; contract liabilities)
  - ASC 330-10 (inventory; goods in transit)
  - 'ASC 321-10-35 (equity securities: fair value changes in net income)'
  - ASC 340-10 (prepaid expenses)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Thoralby Co.''s draft Year 2 income statement reports income before income taxes of $651,000, built
  up as follows: sales $3,840,000; cost of goods sold ($2,310,000); operating expenses ($905,000); and
  other income of $26,000, the increase in fair value of equity securities with readily determinable fair
  values that Thoralby held all year. Thoralby uses a periodic inventory system. Supporting documents
  show: sales include $82,000 received on December 15 from a customer as a deposit on machines from Thoralby''s
  standard catalog that it will deliver in March, Year 3; the December 31 physical count, used to compute
  cost of goods sold, left out goods costing $52,000 that a supplier shipped FOB shipping point on December
  28 and Thoralby received on January 3, although their purchase was recorded in December; and operating
  expenses include the $48,000 premium Thoralby paid on October 1, Year 2, for a one-year insurance policy
  beginning that day. What should Thoralby''s corrected income before income taxes be?'
choices:
- id: A
  text: $605,000
  rationale: Leaves ending inventory without the $52,000 of goods in transit. Shipped FOB shipping point
    on December 28, they were Thoralby's at year-end, and their purchase is already recorded, so the count
    understated inventory and overstated cost of goods sold.
- id: B
  text: $621,000
  rationale: Leaves the whole $48,000 premium in operating expenses. Only October through December has
    expired; the other nine months ($36,000) are a prepaid asset.
- id: C
  text: $631,000
  rationale: Removes the $26,000 fair value gain on the equity securities. Changes in the fair value of
    equity securities with readily determinable fair values are reported in net income.
- id: D
  text: $657,000
  rationale: Correct. $651,000 − $82,000 + $52,000 + $36,000.
answer: D
explanation: 'The deposit is a contract liability until Thoralby delivers the machines in Year 3: − $82,000.
  Goods shipped FOB shipping point belong to the buyer from shipment; the purchase is recorded, so adding
  them to ending inventory lowers cost of goods sold: + $52,000. Nine months of the insurance premium
  are prepaid at December 31: $48,000 × 9/12 = + $36,000. The fair value gain on equity securities is
  correctly in net income. $651,000 − $82,000 + $52,000 + $36,000 = $657,000.'
