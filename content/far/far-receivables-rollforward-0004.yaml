id: far-receivables-rollforward-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 310-10 (receivables)
  - ASC 326-20-35 (write-offs and recoveries)
  - 'ASC 606-10-55 (sales with a right of return: refund liability)'
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: Horton Co. is rolling forward its accounts receivable control account for Year 2 to test the aged
  subledger. Receivables were $462,000 at January 1. Year 2 sales on account were $3,180,000. The cash
  receipts journal shows $3,365,000 received, including $284,000 of cash sales and $7,000 collected on
  an account written off in Year 1. Accounts written off in Year 2 totaled $23,000. In November, a customer
  settled its $31,000 account by transferring to Horton a delivery van with a fair value of $31,000. During
  the year, Horton's refund liability for expected sales returns increased by $12,000. What balance should
  the rollforward show for accounts receivable, before any allowance, at December 31, Year 2?
choices:
- id: A
  text: $230,000
  rationale: Subtracts all $3,365,000 of cash received. The $284,000 of cash sales never passed through
    accounts receivable.
- id: B
  text: $502,000
  rationale: Also subtracts the $12,000 increase in the refund liability for expected returns. Expected
    returns are a liability, not a reduction of the amounts customers owe.
- id: C
  text: $507,000
  rationale: Treats the $7,000 received on the account written off in Year 1 as a collection of current
    receivables. That account was already out of receivables; collecting it reinstates and then clears
    it (or goes straight to the allowance), so it doesn't reduce the balance.
- id: D
  text: $514,000
  rationale: Correct. $462,000 + $3,180,000 − ($3,365,000 − $284,000 − $7,000) − $23,000 − $31,000.
answer: D
explanation: 'Collections that reduce current receivables exclude the $284,000 of cash sales and the $7,000
  recovery of an account written off in Year 1 (it is reinstated and collected, or credited to the allowance,
  with no net effect on receivables): $3,365,000 − $284,000 − $7,000 = $3,074,000. Ending receivables
  = $462,000 + $3,180,000 − $3,074,000 − $23,000 write-offs − $31,000 settled with the van = $514,000.
  The refund liability is a separate liability and doesn''t change receivables.'
