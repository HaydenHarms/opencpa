id: far-error-correction-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Application
review:
  status: draft
  references:
  - 'ASC 250-10-45-23 (correction of a prior-period error: retained earnings adjustment, net of tax)'
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Halloway Freight Co. borrowed $500,000 on a 7% note, with all interest and
  principal due at maturity in 5 years. Before closing its Year 2 books, Halloway's controller finds that
  Halloway has never recorded any interest on the note; no interest has been paid. This is the only error
  in Halloway's records, Halloway's tax rate is 25% for all effects, and it presents single-year financial
  statements. What adjustment should Halloway make to its January 1, Year 3, balance of retained earnings
  to correct this error?
choices:
- id: A
  text: $70,000 decrease
  rationale: Decreases retained earnings by the full pretax $70,000 of unaccrued interest. The correction
    is made net of the 25% tax rate.
- id: B
  text: $52,500 decrease
  rationale: Correct. $500,000 × 7% × 2 years = $70,000, × 75% after tax.
- id: C
  text: $26,250 decrease
  rationale: Accrues interest for only 1 year, not the full 2 years the note has been outstanding without
    an accrual.
- id: D
  text: $52,500 increase
  rationale: Increases retained earnings. Failing to accrue interest expense understated expenses and
    overstated retained earnings in each of the 2 years, so the correction decreases retained earnings.
answer: B
explanation: 'Unaccrued interest on an outstanding note understates interest expense, and so overstates
  net income and retained earnings, in every year it is missed. The error is corrected by adjusting the
  opening balance of retained earnings, net of tax (ASC 250-10-45-23). Unaccrued interest: $500,000 ×
  7% × 2 years = $70,000. After the 25% tax effect: $70,000 × 75% = $52,500 decrease.'
