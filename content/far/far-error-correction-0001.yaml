id: far-error-correction-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Application
review:
  status: draft
  references:
  - 'ASC 250-10-45-23 (correction of a prior-period error: adjustment to opening retained earnings, net
    of tax)'
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: On April 1, Year 1, Halloway Freight Co. borrowed $480,000 on a 4-year note bearing simple interest
  at 6% a year, with all interest and principal due at maturity. On May 1, Year 3, after its Year 2 financial
  statements had been issued, Halloway's controller found that no interest on the note had ever been recorded;
  none has been paid. Halloway has found no other errors, its tax rate is 25% for all effects, and it
  presents single-year financial statements. What adjustment should Halloway make to its January 1, Year
  3, balance of retained earnings?
choices:
- id: A
  text: $16,200 decrease
  rationale: Adjusts only for the Year 1 interest, as if Year 2 were still open. The Year 2 statements
    have been issued, so the Year 2 interest is also part of the adjustment to January 1, Year 3, retained
    earnings.
- id: B
  text: $37,800 decrease
  rationale: Correct. ($21,600 for Year 1 + $28,800 for Year 2) × 75% after tax.
- id: C
  text: $43,200 decrease
  rationale: Charges a full year of interest for Year 1. The note was signed on April 1, Year 1, so Year
    1 bore only 9 months of interest ($21,600).
- id: D
  text: $45,000 decrease
  rationale: Also includes the 4 months of Year 3 interest through May 1, Year 3. That interest is a Year
    3 expense, recorded in Year 3 income, not part of the adjustment to opening retained earnings.
answer: B
explanation: Interest accrues from the day the note is signed. Unrecorded interest expense in the issued
  Year 1 and Year 2 statements overstated those years' income, and the correction of a prior-period error
  adjusts the opening balance of retained earnings of the current year, net of tax (ASC 250-10-45-23).
  Year 1 interest = $480,000 × 6% × 9/12 = $21,600; Year 2 interest = $480,000 × 6% = $28,800; total $50,400,
  or $37,800 after the 25% tax effect ($50,400 × 75%). The 4 months of Year 3 interest through May 1 belong
  in Year 3 income. Adjustment = $37,800 decrease.
