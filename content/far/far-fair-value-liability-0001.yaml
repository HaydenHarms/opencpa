id: far-fair-value-liability-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Fair value measurements
  skill: Application
review:
  status: draft
  references:
  - 'ASC 820-10-35-16 (fair value of liabilities: transfer assumption)'
  - ASC 820-10-35-17 to 35-18 (nonperformance risk)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: Trewince Insurance Co. must measure, on the transfer basis ASC 820 requires, the fair value of a
  $500,000 obligation it owes a counterparty, payable in a lump sum in 5 years. The risk-free rate for
  a 5-year term is 4%. Market participants now price obligations of Trewince's credit standing at a 3%
  premium over the risk-free rate; before a recent credit downgrade, they priced them at 1%. A higher-rated
  insurer that might assume the obligation said it would price it at a 1.5% premium. Present value factors
  for a single sum due in 5 years are 0.8219 at 4%, 0.7835 at 5%, 0.7651 at 5.5% and 0.7130 at 7%. What
  is the fair value of Trewince's obligation?
choices:
- id: A
  text: $356,500
  rationale: Correct. $500,000 discounted 5 years at 7% (4% risk-free + 3% for Trewince's own nonperformance
    risk).
- id: B
  text: $382,550
  rationale: Uses the 1.5% premium the higher-rated insurer quoted ($500,000 × 0.7651). Fair value reflects
    Trewince's own nonperformance risk, assumed to be the same after a transfer, not a stronger transferee's
    credit standing.
- id: C
  text: $391,750
  rationale: Uses the 1% premium that applied before Trewince's downgrade ($500,000 × 0.7835). Nonperformance
    risk is measured at Trewince's credit standing as of the measurement date, not an earlier one.
- id: D
  text: $410,950
  rationale: Discounts at the 4% risk-free rate alone ($500,000 × 0.8219), leaving out Trewince's own
    nonperformance risk. Fair value of a liability includes the effect of the reporting entity's own credit
    standing (ASC 820-10-35-17).
answer: A
explanation: Fair value of a liability assumes transfer to a market participant of comparable credit standing
  (ASC 820-10-35-16) and includes the effect of the reporting entity's own nonperformance risk, including
  its own credit risk, measured as of the measurement date and assumed to be the same before and after
  the transfer (ASC 820-10-35-17 to 35-18) — not a stronger counterparty's credit standing and not a stale,
  pre-downgrade spread. The discount rate is 4% risk-free + 3% for Trewince's own current nonperformance
  risk = 7%. Fair value = $500,000 × 0.7130 = $356,500.
