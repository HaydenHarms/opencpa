id: far-fair-value-liability-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Fair value measurements
  skill: Application
review:
  status: draft
  references:
  - ASC 820-10-35-16 to 35-17A (fair value of liabilities; nonperformance risk)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: Trewince Insurance Co. must measure the fair value of a $500,000 obligation it owes a counterparty,
  payable in a lump sum in 5 years, assuming the obligation is transferred to a market participant of
  comparable credit standing. The risk-free rate for a 5-year term is 4%. Because of a recent downgrade,
  market participants would require a 3% premium for Trewince's own nonperformance risk as of the measurement
  date; before the downgrade, that premium was only 1%. A prospective buyer of Trewince with a stronger
  credit profile said it would need only a 1.5% premium for the same obligation, but Trewince itself hasn't
  transferred the obligation to that buyer. What is the fair value of Trewince's obligation?
choices:
- id: A
  text: $356,500
  rationale: Correct. $500,000 discounted 5 years at 7% (4% risk-free + 3% for Trewince's own nonperformance
    risk).
- id: B
  text: $382,550
  rationale: Uses the 1.5% premium a stronger prospective buyer of Trewince said it would need. Fair value
    reflects Trewince's own nonperformance risk as the obligor, not a third party's stronger credit standing,
    because Trewince hasn't transferred the obligation.
- id: C
  text: $391,750
  rationale: Uses the 1% premium that applied before Trewince's downgrade. Nonperformance risk is measured
    at Trewince's credit standing as of the measurement date, not an earlier one.
- id: D
  text: $410,950
  rationale: Discounts at the 4% risk-free rate alone, leaving out Trewince's own nonperformance risk.
    Fair value of a liability must include the effect of the reporting entity's own credit standing (ASC
    820-10-35-16 to 35-17A).
answer: A
explanation: Fair value of a liability assumes transfer to a market participant of comparable credit standing
  and must include the effect of the reporting entity's own nonperformance risk, including its own credit
  risk, measured as of the measurement date — not a stronger counterparty's credit standing and not a
  stale, pre-downgrade spread (ASC 820-10-35-16 to 35-17A). The discount rate is 4% risk-free + 3% for
  Trewince's own current nonperformance risk = 7%. Fair value = $500,000 × 0.7130 = $356,500.
