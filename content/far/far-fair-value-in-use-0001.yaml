id: far-fair-value-in-use-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Fair value measurements
  skill: Application
review:
  status: draft
  references:
  - ASC 820-10-35-10A to 35-10E (highest and best use; assets used in combination)
  - ASC 820-10-55-3D (cost approach)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: Pentire Bottling Co. owns a specialized capping machine that is part of an integrated bottling line.
  A market participant buying the whole line, installed and running, would pay about $1,150,000 for it;
  sold off one machine at a time, the line's machines would bring only about $700,000 in total, and the
  capping machine on its own would bring $85,000 from a dealer, for parts. No active market exists for
  secondhand capping machines like this one, so Pentire's appraiser estimates the current cost to construct
  a new substitute capping machine of comparable utility, $240,000, and reduces it by $38,000 of physical
  deterioration and $22,000 of functional obsolescence, because newer models run faster. What is the fair
  value of the capping machine under ASC 820?
choices:
- id: A
  text: $85,000
  rationale: Uses the $85,000 a dealer would pay for the capping machine on its own. That is its value
    on a standalone (in-exchange) basis, but the line is worth more installed and working ($1,150,000)
    than sold piece by piece ($700,000), so highest and best use is in combination with the line's other
    assets.
- id: B
  text: $180,000
  rationale: Correct. $240,000 − $38,000 − $22,000.
- id: C
  text: $202,000
  rationale: Deducts only physical deterioration. Functional obsolescence, the $22,000 newer models' extra
    speed is worth, is also deducted in a cost approach.
- id: D
  text: $218,000
  rationale: Deducts only functional obsolescence. Physical deterioration, $38,000, is also deducted in
    a cost approach.
answer: B
explanation: 'Fair value of a nonfinancial asset reflects its highest and best use by market participants,
  which may be in combination with other assets as a group rather than on a standalone basis (ASC 820-10-35-10A
  to 35-10E). Market participants would pay more for the working line ($1,150,000) than for its machines
  sold separately ($700,000), and they can acquire the complementary machines with it, so the capping
  machine''s highest and best use is in combination with the line. Its fair value is then measured assuming
  it is used with those assets, here with a cost approach (ASC 820-10-55-3D): $240,000 − $38,000 − $22,000
  = $180,000. The $85,000 standalone price would govern only if a standalone sale maximized its value.'
