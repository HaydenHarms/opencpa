id: far-fair-value-in-use-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Fair value measurements
  skill: Application
review:
  status: draft
  references:
  - ASC 820-10-35-10 to 35-14 (highest and best use; in-use versus in-exchange premise)
  - ASC 820-10-55 (cost approach)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: Pentire Bottling Co. owns a specialized capping machine that is part of an integrated production
  line; used together with the line's other equipment, which market participants could also acquire, the
  capping machine lets the whole line run at its highest and best use, generating far more value in combination
  than any single piece would generate alone. No active market exists for secondhand capping machines
  identical to this one, and sold apart from the line, for parts or scrap, it would bring only $85,000.
  Pentire's appraiser instead estimates what it would cost currently to construct a new substitute capping
  machine of comparable utility, $240,000, and reduces that amount by $38,000 of physical deterioration
  and $22,000 of functional obsolescence, because newer models run faster. What is the fair value of the
  capping machine?
choices:
- id: A
  text: $85,000
  rationale: Uses the $85,000 the capping machine would bring sold apart from the line, for parts or scrap.
    That is its value on an in-exchange (standalone) premise, which applies only if a standalone sale
    maximized its value; here using it within the line does.
- id: B
  text: $180,000
  rationale: Correct. $240,000 − $38,000 − $22,000.
- id: C
  text: $202,000
  rationale: Deducts only physical deterioration. Functional obsolescence, the $22,000 newer models' extra
    speed is worth, is also deducted in a cost approach.
- id: D
  text: $218,000
  rationale: Deducts only functional obsolescence. Physical deterioration, $38,000, is also deducted in
    a cost approach.
answer: B
explanation: 'Fair value of a nonfinancial asset reflects its highest and best use by market participants,
  which may be in combination with other assets as a group (an in-use premise) rather than on a standalone
  basis (in-exchange), when using it that way maximizes its value and the complementary assets are available
  to market participants (ASC 820-10-35-10 to 35-14). Because the capping machine is worth more used within
  the line, fair value is measured on the in-use premise, here estimated with a cost approach: $240,000
  − $38,000 − $22,000 = $180,000. The $85,000 standalone price is its in-exchange value, which would govern
  only if a standalone sale maximized its value instead.'
