id: far-tbs-consolidation-review-0001
type: tbs
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Consolidated financial statements
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 810-10 (consolidation procedures: intra-entity balances, transactions and profits)'
  - ASC 805-20 (acquisition-date fair values; subsequent amortization of the step-up through depreciation)
  notes: FAR simulations batch 02. Written from scratch; every number computed in code.
title: Reviewing a draft consolidation
scenario: Pomeroy Inc., a public business entity, owns 100% of Strand Co. A staff accountant has prepared
  a draft of Pomeroy's Year 3 consolidated statements. You are reviewing it before the controller signs
  off. Pomeroy accounts for its investment in Strand at cost in its own books. Ignore income taxes, and
  enter every amount in whole dollars.
exhibits:
- title: 'Exhibit 1: Separate financial statements of Pomeroy and Strand'
  body: 'Income statements for Year 3:


    |  | Pomeroy | Strand |

    |---|---|---|

    | Sales | 3,200,000 | 1,400,000 |

    | Cost of goods sold | (1,920,000) | (840,000) |

    | Depreciation expense | (150,000) | (90,000) |

    | Other operating expenses | (610,000) | (260,000) |

    | Interest income | 15,000 | 0 |

    | Dividend income | 80,000 | 0 |

    | Interest expense | (21,000) | (29,400) |

    | **Net income** | 594,000 | 180,600 |


    Selected balances at December 31, Year 3:


    |  | Pomeroy | Strand |

    |---|---|---|

    | Inventory | 410,000 | 260,000 |

    | Note receivable | 250,000 | 0 |

    | Investment in Strand | 1,500,000 | 0 |

    | Equipment, net | 1,300,000 | 700,000 |

    | Notes payable | 300,000 | 430,000 |

    | Retained earnings | 2,900,000 | 820,000 |'
- title: 'Exhibit 2: Draft consolidated statements prepared by the staff accountant'
  body: 'Consolidated income statement for Year 3 (draft):


    |  | Consolidated |

    |---|---|

    | Sales | 4,200,000 |

    | Cost of goods sold | (2,360,000) |

    | Depreciation expense | (240,000) |

    | Other operating expenses | (870,000) |

    | Dividend income | 80,000 |

    | Interest expense | (35,400) |

    | **Net income** | 774,600 |


    Selected consolidated balances at December 31, Year 3 (draft):


    |  | Consolidated |

    |---|---|

    | Inventory | 670,000 |

    | Note receivable | 0 |

    | Equipment, net | 2,200,000 |

    | Goodwill | 100,000 |

    | Notes payable | 730,000 |

    | Retained earnings | 3,720,000 |'
- title: 'Exhibit 3: Consolidation file notes'
  body: '| Topic | Note |

    |---|---|

    | Acquisition | Pomeroy bought all of Strand''s stock on January 1, Year 1, for $1,500,000 cash. Strand''s
    book equity then was $1,200,000 (common stock and paid-in capital $700,000, retained earnings $500,000).
    Book values equaled fair values except Strand''s equipment, whose fair value was $200,000 above book
    value; the equipment then had a 10-year remaining life with no residual value, is depreciated straight-line
    and is still in use. Any remaining excess is goodwill, which has not been impaired. |

    | Appraisal | An appraisal commissioned in December, Year 3, values Strand''s equipment at $950,000
    and Strand as a whole at $2,100,000. |

    | Merchandise | Strand sells goods to Pomeroy at a 20% gross margin on the selling price. Strand''s
    Year 3 sales to Pomeroy were $400,000. Pomeroy''s inventory included goods bought from Strand of $60,000
    at January 1, Year 3, and $100,000 at December 31, Year 3, at Pomeroy''s cost. Pomeroy sold the January
    1 goods to outside customers in Year 3. |

    | Loan | On January 1, Year 3, Pomeroy lent Strand $250,000 at 6%, interest paid each December 31.
    The rest of Strand''s notes payable is owed to its bank. |

    | Dividends | Strand declared and paid $80,000 of dividends in Year 3, all to Pomeroy. |'
tasks:
- id: t1
  type: select
  points: 3
  prompt: For each line of the draft consolidated statements in Exhibit 2, indicate whether the draft
    amount is correct, overstated or understated.
  options:
  - Correct as drafted
  - Overstated
  - Understated
  rows:
  - id: sales
    label: Sales
    answer: Correct as drafted
  - id: cogs
    label: Cost of goods sold
    answer: Understated
  - id: dep
    label: Depreciation expense
    answer: Understated
  - id: int_exp
    label: Interest expense
    answer: Correct as drafted
  - id: div_inc
    label: Dividend income
    answer: Overstated
  - id: inv
    label: Inventory
    answer: Overstated
  - id: equip
    label: Equipment, net
    answer: Overstated
  - id: goodwill
    label: Goodwill
    answer: Correct as drafted
  - id: note_rec
    label: Note receivable
    answer: Correct as drafted
  - id: notes_pay
    label: Notes payable
    answer: Overstated
  - id: re
    label: Retained earnings
    answer: Overstated
  explanation: 'Sales: the $400,000 of intra-entity sales were eliminated, so the draft is correct. Cost
    of goods sold: the draft eliminated $400,000 but not the profit in inventory; it must add the $20,000
    unrealized at year end and remove the $12,000 from January 1 that was realized in Year 3, so the draft
    is understated by $8,000. Depreciation: the $20,000 a year on the equipment step-up is missing (understated).
    Interest expense: only the $15,000 on the intra-entity loan was eliminated, which is correct. Dividend
    income: the $80,000 from Strand is intra-entity and must be eliminated (overstated). Inventory includes
    $20,000 of unrealized profit (overstated). Equipment includes the full $200,000 step-up with none
    of the $60,000 of depreciation for Years 1–3 (overstated). Goodwill = $1,500,000 − $1,200,000 − $200,000
    = $100,000, correct (a public business entity can''t elect to amortize goodwill). The note receivable
    from Strand was eliminated, which is correct. Notes payable still includes the $250,000 owed to Pomeroy
    (overstated). Retained earnings added all of Strand''s retained earnings, including the $500,000 earned
    before the acquisition (overstated).'
- id: t2
  type: numeric
  points: 1
  unit: cents
  tolerance: 100
  prompt: What amount should Pomeroy report as consolidated cost of goods sold for Year 3?
  answer: 236800000
  explanation: $1,920,000 + $840,000 − $400,000 intra-entity sales + $20,000 unrealized profit in ending
    inventory ($100,000 × 20%) − $12,000 profit in beginning inventory realized this year ($60,000 × 20%)
    = $2,368,000.
- id: t3
  type: numeric
  points: 2
  unit: cents
  tolerance: 100
  prompt: What amount should Pomeroy report as consolidated net income for Year 3?
  answer: 66660000
  explanation: Pomeroy $594,000 − $80,000 dividend from Strand + Strand $180,600 − $20,000 step-up depreciation
    − $20,000 ending unrealized profit + $12,000 beginning profit realized = $666,600. The intra-entity
    interest ($15,000) is income to Pomeroy and expense to Strand, so eliminating it doesn't change net
    income.
- id: t4
  type: numeric
  points: 1
  unit: cents
  tolerance: 100
  prompt: What amount should Pomeroy report as consolidated equipment, net, at December 31, Year 3?
  answer: 214000000
  explanation: $1,300,000 + $700,000 + $200,000 step-up − $60,000 accumulated step-up depreciation ($20,000
    × 3 years) = $2,140,000. The December appraisal is not recorded; equipment stays at cost less depreciation.
- id: t5
  type: numeric
  points: 2
  unit: cents
  tolerance: 100
  prompt: What amount should Pomeroy report as consolidated retained earnings at December 31, Year 3?
  answer: 314000000
  explanation: Pomeroy's retained earnings $2,900,000 (which already include the dividends it received
    from Strand) + Strand's growth in retained earnings since the acquisition, $820,000 − $500,000 = $320,000,
    − $60,000 step-up depreciation for Years 1–3 − $20,000 unrealized profit in ending inventory = $3,140,000.
    The profit in the January 1 inventory was realized in Year 3 and no longer affects retained earnings.
