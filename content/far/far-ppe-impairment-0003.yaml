id: far-ppe-impairment-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 360-10-35 (impairment of long-lived assets held and used: recoverability test and measurement
    at fair value)'
  - ASC 820-10 (fair value)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Rylstone Co. bought a bottling machine for $1,200,000, which it depreciates
  straight-line over 8 years with no residual value. At December 31, Year 3, after recording that year's
  depreciation, demand for the product the machine makes has fallen sharply. Rylstone now expects the
  machine to generate net cash inflows of $110,000 a year for its remaining 5 years, plus $60,000 from
  selling it at the end of that time. Dealers in similar used machines would pay $405,000 for it today,
  and selling it would cost $18,000. Discounted at Rylstone's 8% incremental borrowing rate, the expected
  cash flows are worth $480,000. Rylstone plans to keep using the machine. What impairment loss should
  Rylstone recognize at December 31, Year 3?
choices:
- id: A
  text: $345,000
  rationale: Correct. $750,000 carrying amount − $405,000 fair value.
- id: B
  text: $363,000
  rationale: Measures the loss against fair value less the $18,000 cost to sell. That is the measure for
    assets held for sale; Rylstone is keeping the machine, so the loss is carrying amount less fair value.
- id: C
  text: $495,000
  rationale: Tests the carrying amount before Year 3 depreciation ($900,000). Depreciation for the year
    is recorded first, then the machine is tested.
- id: D
  text: $795,000
  rationale: Measures the loss from the $1,200,000 cost, ignoring accumulated depreciation. The test uses
    the carrying amount, $750,000.
answer: A
explanation: 'Carrying amount = $1,200,000 − 3 × $150,000 = $750,000. Recoverability test: undiscounted
  cash flows of $110,000 × 5 + $60,000 = $610,000 are less than $750,000, so the carrying amount is not
  recoverable. For an asset held and used, the loss is the carrying amount less fair value: $750,000 −
  $405,000 = $345,000. Costs to sell are not deducted because the machine is not held for sale, and the
  present value of Rylstone''s own cash flows is not fair value.'
