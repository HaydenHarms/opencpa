id: far-cash-flows-0017
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 230-10-45-15 (financing activities: proceeds from issuing stock and treasury stock purchases)'
  - ASC 842-20-45-5 (a finance lease's principal payment is financing; interest is operating)
  notes: Batch 14. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'In its draft Year 2 statement of cash flows, Elberton Freight Co. reports net cash provided by
  financing activities totaling $320,000: proceeds from issuing bonds $600,000; repayment of a long-term
  note ($150,000); cash dividends paid ($90,000); proceeds from issuing common stock $80,000; and payments
  on a finance lease ($120,000), all of which was classified as financing. Supporting records show: of
  the $120,000 finance lease payment, $40,000 is interest and $80,000 is principal; Elberton paid $60,000
  during the year to reacquire its own shares as treasury stock, recorded only as a reduction of additional
  paid-in capital with no related cash flow statement entry; and $90,000 of proceeds from employees exercising
  stock options was included in the draft''s operating activities. By how much does Elberton''s net cash
  provided by financing activities change when these items are corrected?'
choices:
- id: A
  text: $30,000 increase
  rationale: Reports the full $120,000 finance lease payment as financing. Only the $80,000 principal
    portion is a financing outflow; the $40,000 interest portion is an operating outflow.
- id: B
  text: $70,000 increase
  rationale: Correct. + $40,000 lease interest reclassified to operating − $60,000 treasury purchase added
    − $90,000 option proceeds reclassified from operating = $70,000.
- id: C
  text: $90,000 increase
  rationale: Leaves the full $120,000 lease payment in financing with no split for the $40,000 interest
    portion, and leaves out the $60,000 treasury stock purchase entirely, while correctly moving the $90,000
    of option proceeds into financing.
- id: D
  text: $130,000 increase
  rationale: Leaves out the $60,000 payment to reacquire treasury stock, which was recorded directly against
    additional paid-in capital with no cash flow statement entry. Treasury stock purchases are financing
    outflows.
answer: B
explanation: Only the $80,000 principal portion of a finance lease payment is a financing outflow; the
  $40,000 interest portion is operating, so $40,000 moves back into financing. The $60,000 treasury stock
  purchase, a financing outflow, was omitted entirely and must be added. Proceeds from stock option exercises
  are financing inflows, so the $90,000 misclassified as operating moves into financing. Corrected financing
  activities = $320,000 + $40,000 − $60,000 + $90,000 = $390,000, a $70,000 increase.
