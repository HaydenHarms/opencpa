id: far-receivables-reconciliation-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 310-10 (receivables)
  - Subsidiary ledger and control account reconciliation practice (returned checks; cash discounts; conversion
    to notes receivable; posting errors)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Allendale Supply''s accounts receivable subledger totals $871,830, and the general
  ledger control account shows $897,700. The controller traces the difference and finds: a customer''s
  $4,600 check, returned by the bank in December marked NSF, was charged back to the customer''s subledger
  account, but the clerk''s journal entry recorded only the reduction of cash, debiting a suspense expense
  account rather than accounts receivable; customers took $7,350 of sales discounts in December, which
  were recorded in the discount column of the cash receipts journal and posted with its totals, while
  the clerk credited each customer''s subledger account only for the cash received; a customer''s $38,000
  past-due account was converted in December into a six-month note receivable, which the clerk recorded
  by closing the customer''s subledger account and opening a note receivable record, without a journal
  entry; and a $12,460 sales invoice was posted to the customer''s subledger account as $12,640. What
  net adjustment should Allendale make to its accounts receivable control account?'
choices:
- id: A
  text: $33,400 decrease
  rationale: Correct. − $38,000 note + $4,600 NSF check; the control account becomes $864,300.
- id: B
  text: $38,000 decrease
  rationale: Leaves out the $4,600 NSF check. Charging the customer's account back for a returned check
    increases receivables, and only the subledger recorded it, so the control account needs it too.
- id: C
  text: $40,750 decrease
  rationale: Also deducts the $7,350 of sales discounts from the control account. The discounts were posted
    to the control account through the cash receipts journal; it is the subledger that omitted them.
- id: D
  text: $42,600 decrease
  rationale: Deducts the $4,600 NSF check from the control account. A returned check reinstates the customer's
    balance, so it increases receivables.
answer: A
explanation: 'Work out which record each item affects. The NSF charge-back is in the subledger but not
  the control account: + $4,600. The discounts are in the control account but not the subledger: the subledger
  needs − $7,350. The note conversion is in the subledger but not the control account: − $38,000. The
  invoice error is in the subledger only: − $180. Control account: $897,700 + $4,600 − $38,000 = $864,300,
  a net decrease of $33,400. Subledger: $871,830 − $7,350 − $180 = $864,300, so the records agree.'
