id: far-subsequent-events-0014
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Application
review:
  status: draft
  references:
  - 'ASC 855-10-25 (recognized subsequent events: error corrections found before issuance)'
  - 'ASC 855-10-50 (nonrecognized subsequent events: disclosed, not reflected)'
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Harpenfield Supply Co.'s December 31, Year 1, physical inventory count, as first extended and priced,
  totaled $1,240,000. Before the financial statements were issued, Harpenfield's staff found that a clerk
  had multiplied the quantity of one item by the wrong unit cost on the count sheet, overstating the count
  by $37,000; a second count sheet for the same storage bin, filled out by a different counter that day,
  showed the same item at its correct cost and was discarded at the time as a duplicate. In February,
  after year-end, Harpenfield also received $600,000 from a new bank line of credit. What amount should
  Harpenfield report as inventory at December 31, Year 1?
choices:
- id: A
  text: $1,166,000
  rationale: Removes the $37,000 pricing error twice, once for the clerk's extension error and again because
    the same item also appeared on a separate recount sheet; the recount sheet was a duplicate copy of
    the same count, not a second error.
- id: B
  text: $1,203,000
  rationale: Correct. $1,240,000 − $37,000.
- id: C
  text: $1,240,000
  rationale: Leaves the $37,000 pricing error in the reported balance. It was found before the statements
    were issued and corrects the December 31 count.
- id: D
  text: $1,803,000
  rationale: Adds the $600,000 Harpenfield received from a new bank line of credit in February. That event
    arose after year-end and is disclosed, not reflected in the December 31 balance.
answer: B
explanation: 'An error found in the December 31 count before the statements are issued is corrected in
  the balance it misstated, here by removing the $37,000 pricing error: $1,240,000 − $37,000 = $1,203,000.
  The $600,000 Harpenfield received from a new bank line of credit is a condition that arose after year-end;
  it is disclosed, not reflected in the December 31 inventory balance.'
