id: far-subsequent-events-0014
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Application
review:
  status: draft
  references:
  - ASC 855-10-25-1 (recognized subsequent events)
  - ASC 855-10-25-3 (nonrecognized subsequent events)
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'Brockley Instruments Co.''s bonus plan pays employees a Year 1 bonus pool equal to 8% of Year 1
  income before the bonus and income taxes, as finally reported in the Year 1 financial statements. At
  December 31, Year 1, Brockley accrued $270,000 as its estimate of the pool. Its draft Year 1 income
  before the bonus and income taxes is $3,450,000. The statements will be issued on March 6, Year 2. Before
  then: on January 28, Brockley received the county''s final property tax bill for Year 1, which is $42,000
  higher than the amount Brockley accrued for Year 1; and on February 12, Brockley sold a warehouse at
  a gain of $380,000. What bonus expense should Brockley report for Year 1?'
choices:
- id: A
  text: $252,444
  rationale: Computes the bonus on income after deducting the bonus itself. The plan bases it on income
    before the bonus and income taxes.
- id: B
  text: $272,640
  rationale: Correct. 8% × ($3,450,000 − $42,000).
- id: C
  text: $276,000
  rationale: Computes the bonus on the draft $3,450,000. The final Year 1 property tax bill shows a Year
    1 expense $42,000 higher than accrued, a condition that existed at year-end, so Year 1 income and
    the bonus base fall by $42,000.
- id: D
  text: $303,040
  rationale: Adds the $380,000 gain on the February warehouse sale to the bonus base. That sale is a Year
    2 transaction; it isn't part of Year 1 income.
answer: B
explanation: 'The final property tax bill gives better evidence of a Year 1 expense, a condition that
  existed at December 31, so it is a recognized subsequent event (ASC 855-10-25-1): Year 1 income before
  the bonus and taxes becomes $3,450,000 − $42,000 = $3,408,000. The warehouse sale is a Year 2 transaction,
  a nonrecognized subsequent event (ASC 855-10-25-3), and doesn''t enter Year 1 income. The bonus is earned
  in Year 1, and its final amount, fixed after year-end by Year 1 results, adjusts the $270,000 accrual:
  8% × $3,408,000 = $272,640.'
