id: far-debt-noninterest-note-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Debt (Notes and bonds payable)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 835-30 (imputation of interest on notes exchanged for property)
  - ASC 835-30-35 (effective interest method)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: On April 1, Year 1, Cawthorne Corp. acquires a machine by issuing a $500,000 note that bears no
  stated interest and is due in full on March 31, Year 4. The machine has no reliably determinable cash
  price, the note has no market value, and Cawthorne's incremental borrowing rate for a similar note is
  8%, compounded annually. The present value of 1 for three periods at 8% is 0.7938. Cawthorne uses the
  effective interest method, computes interest for each year of the note's term, accrues it evenly within
  that year, and rounds to the nearest dollar at each step. What interest expense on the note should Cawthorne
  report for the calendar year Year 2?
choices:
- id: A
  text: $23,814
  rationale: Reports the interest for Year 1 (April through December). The question asks for Year 2.
- id: B
  text: $31,752
  rationale: Uses the first note year's interest (April, Year 1, to March, Year 2) for the whole calendar
    year. Nine months of Year 2 fall in the second note year, when the carrying amount is higher.
- id: C
  text: $33,657
  rationale: Correct. 3/12 × $31,752 + 9/12 × $34,292.
- id: D
  text: $40,000
  rationale: Applies the 8% rate to the $500,000 face amount. Interest is the rate times the note's carrying
    amount, which starts at its present value.
answer: C
explanation: 'With no stated interest and no reliable cash price, the note is recorded at its present
  value at the imputed 8% rate: $500,000 × 0.7938 = $396,900. Interest for the first note year (to March
  31, Year 2) = $396,900 × 8% = $31,752; for the second note year = ($396,900 + $31,752) × 8% = $34,292.
  Year 2 includes three months of the first note year and nine of the second: $31,752 × 3/12 = $7,938,
  plus $34,292 × 9/12 = $25,719, for $33,657.'
