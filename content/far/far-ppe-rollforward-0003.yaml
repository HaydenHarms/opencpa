  references:
  - ASC 360-10 (property, plant and equipment; depreciation; disposals)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: Nutter Co.'s equipment rollforward for Year 2 shows gross equipment of $3,400,000 at January 1 and
  $3,720,000 at December 31, and accumulated depreciation of $1,260,000 at January 1 and $1,395,000 at
  December 31. During Year 2, Nutter sold a machine that had cost $240,000 for $95,000 in cash and reported
  a $15,000 gain on the sale, and it scrapped fully depreciated equipment that had cost $60,000, receiving
  nothing. All other changes in the two accounts came from purchases of equipment and depreciation. What
  depreciation expense should Nutter report for Year 2?
choices:
- id: A
  text: $295,000
  rationale: Ignores the scrapped equipment. Removing it took its $60,000 of accumulated depreciation
    out of the account.
- id: B
  text: $325,000
  rationale: Adds the $15,000 gain to the proceeds to get the machine's carrying amount. A gain means
    the carrying amount was below the $95,000 proceeds.
- id: C
  text: $355,000
  rationale: Correct. $1,395,000 − $1,260,000 + $160,000 on the machine sold + $60,000 on the scrapped
    equipment.
- id: D
  text: $435,000
  rationale: Removes the machine's full $240,000 cost from accumulated depreciation. Only its $160,000
    of accumulated depreciation is removed.
answer: C
explanation: 'The machine sold had a carrying amount of $95,000 − $15,000 gain = $80,000, so its accumulated
  depreciation was $240,000 − $80,000 = $160,000. The scrapped equipment was fully depreciated, so $60,000
  of accumulated depreciation was removed with it. Accumulated depreciation: $1,260,000 + depreciation
  − $160,000 − $60,000 = $1,395,000, so depreciation expense = $355,000.'
