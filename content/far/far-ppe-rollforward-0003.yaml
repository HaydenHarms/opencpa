- stem: Riley Co.'s equipment rollforward for Year 2 shows gross equipment of $1,280,000 at January 1
    and $1,410,000 at December 31, and accumulated depreciation of $470,000 at January 1 and $520,000
    at December 31. During Year 2, Riley sold a machine that had cost $110,000 for $38,000 in cash and
    reported a $6,000 gain on the sale, and it scrapped fully depreciated equipment that had cost $24,000,
    receiving nothing. All other changes in the two accounts came from purchases of equipment and depreciation.
    What depreciation expense should Riley report for Year 2?
  choices:
  - id: A
    text: $50,000
    rationale: Uses only the net change in accumulated depreciation, ignoring the depreciation removed
      for the machine sold and the equipment scrapped.
  - id: B
    text: $128,000
    rationale: Ignores the scrapped equipment. Removing it took its $24,000 of accumulated depreciation
      out of the account.
  - id: C
    text: $146,000
    rationale: Ignores the $6,000 gain and takes the machine's carrying amount to be the $38,000 proceeds,
      which understates the accumulated depreciation removed by $6,000.
  - id: D
    text: $152,000
    rationale: Correct. $520,000 − $470,000 + $78,000 on the machine sold + $24,000 on the scrapped equipment.
  answer: D
  explanation: 'The machine sold had a carrying amount of $38,000 − $6,000 gain = $32,000, so its accumulated
    depreciation was $110,000 − $32,000 = $78,000. The scrapped equipment was fully depreciated, so $24,000
    of accumulated depreciation was removed with it. Accumulated depreciation: $470,000 + depreciation
    − $78,000 − $24,000 = $520,000, so depreciation expense = $152,000.'
