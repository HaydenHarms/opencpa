id: far-tbs-nfp-activities-0001
type: tbs
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of activities (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 958-605 (contributions: unconditional and conditional promises, contributed services, donor-imposed
    restrictions)'
  - ASC 958-205 (net asset classes; releases from restriction; long-lived asset policy)
  - ASC 958-225 (statement of activities)
  notes: FAR simulations batch 02. Written from scratch; every number computed in code.
title: Year 2 statement of activities
scenario: 'Wrenfield Community Clinic is a not-for-profit health clinic preparing its Year 2 statement
  of activities. Wrenfield''s policies: restrictions on gifts of long-lived assets, or of cash to buy
  them, expire when the asset is placed in service; donor-restricted contributions and investment returns
  are reported as increases in net assets with donor restrictions even when the restriction is met in
  the same year; and all expenses are reported as decreases in net assets without donor restrictions.
  Enter every amount in whole dollars, and enter a decrease as a negative number.'
exhibits:
- title: 'Exhibit 1: Development office log of Year 2 gifts'
  body: '| Date | Donor | Gift |

    |---|---|---|

    | Throughout Year 2 | Individuals and businesses | Cash gifts with no donor stipulations, $410,000
    |

    | April 2 | Hollin family | $250,000 cash, to be invested permanently, with the investment return
    used for nursing scholarships |

    | June 15 | Larkspur Foundation | Written promise of $100,000, to be paid only if Wrenfield raises
    $100,000 in new gifts from other donors by June 30, Year 3; $30,000 had been raised by December 31,
    Year 2 |

    | December 12 | Okafor Trust | Unconditional written promise of $60,000, payable in March, Year 3,
    with no purpose stated; collection is assured, and Wrenfield records it at the promised amount |

    | Throughout Year 2 | Volunteer physicians | 600 hours of patient care. Wrenfield would otherwise
    have paid contract physicians $45,000 for this work. |

    | Throughout Year 2 | Community volunteers | Staffing the reception desk and mailing appeals, valued
    at $18,000 at minimum wage |'
- title: 'Exhibit 2: Controller''s schedule of Year 2 activity'
  body: '| Item | Detail |

    |---|---|

    | Patient service revenue | $1,850,000, net of contractual adjustments |

    | Program services expenses | $1,980,000, including $50,000 spent on the diabetes education program,
    $9,000 of nursing scholarships and depreciation; excludes any donated services |

    | Management and general expenses | $290,000 |

    | Fundraising expenses | $85,000 |

    | Mobile clinic van | Bought for $95,000 in March, Year 2, with the van fund (Exhibit 3), and placed
    in service on March 20 |

    | Endowment | The Hollin endowment earned a return of $14,000 in Year 2. The board appropriated $9,000
    of it, which was paid out as nursing scholarships. |

    | Operating reserve | Investments with no donor restrictions had a net gain of $7,000. In December
    the board set aside $75,000 of these investments as a fund for future building repairs. |'
- title: 'Exhibit 3: Net assets with donor restrictions at January 1, Year 2'
  body: '| Purpose | Balance | Source |

    |---|---|---|

    | Mobile clinic van fund | $120,000 | Cash gift received in Year 1, restricted to buying and equipping
    a mobile clinic van; the donor''s agreement requires any unspent balance to be used for the van''s
    medical equipment |

    | Diabetes education program | $80,000 | Cash grant received in Year 1, restricted to that program
    |'
tasks:
- id: t1
  type: select
  points: 2
  prompt: Indicate whether Wrenfield should recognize each item as revenue, gains or other support in
    its Year 2 statement of activities, and if so in which net asset class.
  options:
  - Recognized — without donor restrictions
  - Recognized — with donor restrictions
  - Not recognized
  rows:
  - id: r1
    label: Larkspur Foundation promise
    answer: Not recognized
  - id: r2
    label: Okafor Trust promise
    answer: Recognized — with donor restrictions
  - id: r3
    label: Volunteer physicians' services
    answer: Recognized — without donor restrictions
  - id: r4
    label: Community volunteers' services
    answer: Not recognized
  - id: r5
    label: Hollin family gift
    answer: Recognized — with donor restrictions
  - id: r6
    label: Net gain on the operating reserve investments
    answer: Recognized — without donor restrictions
  explanation: The Larkspur promise depends on a barrier Wrenfield hasn't overcome (a matching requirement)
    with a right of release, so it is conditional and not recognized. The Okafor promise is unconditional;
    because the cash comes in a later period, it carries an implied time restriction and is revenue with
    donor restrictions. The physicians' services need specialized skills Wrenfield would otherwise buy,
    so they are recognized ($45,000) as revenue and as program expense. The reception and mailing work
    needs no specialized skills and doesn't create or enhance a nonfinancial asset, so it isn't recognized.
    The Hollin gift must be held in perpetuity, so it is with donor restrictions. The operating reserve
    gain has no donor stipulation; the board's December set-aside of $75,000 is an internal designation,
    not a donor restriction, so the gain stays without donor restrictions.
- id: t2
  type: numeric
  points: 2
  unit: cents
  tolerance: 100
  prompt: What is Wrenfield's change in net assets without donor restrictions for Year 2?
  answer: 6600000
  explanation: Patient service revenue $1,850,000 + cash gifts $410,000 + contributed physician services
    $45,000 + investment gain $7,000 + net assets released from restrictions $154,000 − expenses $2,400,000
    = $66,000. Expenses = program $1,980,000 + donated physician services $45,000 + management and general
    $290,000 + fundraising $85,000. The van is capitalized, so only its depreciation (already in program
    expenses) is an expense.
- id: t3
  type: numeric
  points: 2
  unit: cents
  tolerance: 100
  prompt: What is Wrenfield's change in net assets with donor restrictions for Year 2?
  answer: 17000000
  explanation: Okafor promise $60,000 + Hollin endowment gift $250,000 + endowment return $14,000 − net
    assets released $154,000 = $170,000. Under Wrenfield's policy the endowment return is reported with
    donor restrictions until appropriated and spent.
- id: t4
  type: numeric
  points: 1
  unit: cents
  tolerance: 100
  prompt: What total amount of net assets released from restrictions should Wrenfield report for Year
    2?
  answer: 15400000
  explanation: Van placed in service $95,000 (only the amount spent; the remaining $25,000 of the van
    fund stays restricted) + diabetes program spending $50,000 + endowment return appropriated and spent
    $9,000 = $154,000.
- id: t5
  type: numeric
  points: 1
  unit: cents
  tolerance: 100
  prompt: What total expenses should Wrenfield report for Year 2?
  answer: 240000000
  explanation: Program services $1,980,000 + donated physician services $45,000 + management and general
    $290,000 + fundraising $85,000 = $2,400,000. The van purchase is capitalized, and the unrecognized
    volunteer services create no expense.
