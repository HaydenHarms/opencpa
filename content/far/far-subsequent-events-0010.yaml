id: far-subsequent-events-0010
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 855-10-25 (recognized and nonrecognized subsequent events)
  - 'ASC 855-10-55 (examples: settlement of litigation; events after the balance sheet date)'
  - ASC 460-10 (product warranties)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Eskdale Homewares''s draft December 31, Year 1, balance sheet reports total liabilities of $3,460,000,
  including a $240,000 accrual for a customer''s suit over an injury at one of Eskdale''s stores in Year
  1. The statements will be issued on March 12, Year 2. After year-end: on January 22, Eskdale settled
  the injury suit for $185,000, payable in April; in February, testing found a defective part in all of
  the space heaters Eskdale sold in November and December, Year 1, and Eskdale estimates that repairing
  them under its standard one-year warranty will cost $72,000, none of which was in its year-end warranty
  accrual; on January 9, a shopper was injured in one of Eskdale''s stores, and counsel expects the resulting
  suit to cost Eskdale $60,000; on February 5, the board declared a cash dividend of $150,000, payable
  March 31; and on February 20, Eskdale borrowed $500,000 from its bank. What total liabilities should
  Eskdale report at December 31, Year 1?'
choices:
- id: A
  text: $3,292,000
  rationale: Removes the injury suit from liabilities altogether because it was settled. The $185,000
    settlement isn't payable until April, so it is still owed at December 31.
- id: B
  text: $3,405,000
  rationale: Leaves out the $72,000 of warranty repairs. The defect existed in units sold before year-end,
    so the February testing gives evidence about a liability that existed at December 31.
- id: C
  text: $3,477,000
  rationale: Correct. $3,460,000 − ($240,000 − $185,000) + $72,000.
- id: D
  text: $3,532,000
  rationale: Leaves the $240,000 accrual for the Year 1 injury suit unchanged. The settlement gives better
    evidence of the liability that existed at year-end, so the accrual is reduced to the $185,000 settlement.
answer: C
explanation: 'Events that give more evidence about conditions at December 31 are recognized: the settlement
  shows the Year 1 injury suit was worth $185,000, not $240,000 (− $55,000), and the defect existed in
  heaters sold before year-end, so the warranty liability rises by $72,000. The January injury, the dividend
  declaration and the new loan arise from events after year-end; they are disclosed if material but not
  recognized. Total liabilities = $3,460,000 − $55,000 + $72,000 = $3,477,000.'
