id: far-contingencies-0017
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: draft
  references:
  - ASC 450-20-25-2 (accrual of probable, estimable losses, including incurred-but-not-reported claims
    of a self-insured entity)
  - 'SEC SAB Topic 5Y (ASC 450-20-S99-1): discounting a liability whose amount and timing are fixed or
    reliably determinable'
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: Cranmoor Devices Co., an SEC registrant, settled a product-liability suit at year-end, agreeing
  to pay $120,000 within 30 days, $60,000 one year later and $50,000 two years later. Because the amounts
  and dates are fixed, Cranmoor discounts the two later installments, using 6%; present value factors
  at 6% are 0.9434 for one year and 0.8900 for two years. Cranmoor is also self-insured for injuries to
  its warehouse workers. Its actuary estimates that settling injuries that occurred during the year will
  cost $38,000 for claims already filed and unpaid and $26,000 for injuries that have occurred but haven't
  been reported yet, and expects injuries next year to cost $70,000. What total liability should Cranmoor
  report at year-end for the settlement and the injuries?
choices:
- id: A
  text: $259,104
  rationale: Accrues only the $38,000 for injuries already reported. The $26,000 for injuries that occurred
    during the year but haven't been reported is also a loss incurred by year-end and is accrued.
- id: B
  text: $285,104
  rationale: Correct. Settlement $120,000 + $101,104 ($60,000 × 0.9434 + $50,000 × 0.8900) + injuries
    $38,000 reported and $26,000 not yet reported.
- id: C
  text: $287,774
  rationale: Discounts both later installments for one year ($110,000 × 0.9434). The second is due in
    two years, so it is discounted with the two-year factor, 0.8900.
- id: D
  text: $355,104
  rationale: Also accrues the $70,000 the actuary expects next year's injuries to cost. No liability exists
    for injuries that haven't occurred, whatever the self-insurance arrangement.
answer: B
explanation: 'The settlement is a fixed obligation. When the amount and timing of payments are fixed or
  reliably determinable, an SEC registrant may discount the liability (SAB Topic 5Y, ASC 450-20-S99-1),
  and Cranmoor does: the $120,000 due within 30 days isn''t discounted, and each later installment is
  discounted for its own term: $60,000 × 0.9434 + $50,000 × 0.8900 = $101,104, so the settlement liability
  is $120,000 + $101,104 = $221,104. For self-insured risks, losses from injuries that occurred by year-end,
  both reported and incurred but not reported, are accrued when probable and estimable (ASC 450-20-25-2):
  $38,000 + $26,000 = $64,000. Injuries that haven''t happened create no liability, so next year''s $70,000
  is not accrued. Total liability = $221,104 + $64,000 = $285,104.'
