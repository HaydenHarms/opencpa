id: far-contingencies-0017
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: draft
  references:
  - ASC 450-20-25-2 (accrual of probable, estimable losses, including incurred-but-not-reported claims
    of a self-insured entity)
  - SEC SAB Topic 5Y and ASC 835-30 (discounting when the amount and timing of payments are fixed)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Cranmoor Devices Co. settled a product-liability suit at year-end, agreeing to pay $120,000 within
  30 days and $90,000 one year later; because the amounts and dates are fixed, Cranmoor's policy is to
  discount such payments, and it uses 6%. Cranmoor is also self-insured for injuries to its warehouse
  workers. Its actuary estimates that settling injuries that occurred during the year will cost $38,000
  for claims already filed and unpaid and $26,000 for injuries that have occurred but haven't been reported
  yet, and expects injuries next year to cost $70,000. What total liability should Cranmoor report at
  year-end for the settlement and the injuries?
choices:
- id: A
  text: $268,906
  rationale: Correct. Settlement $120,000 + $84,906 present value + injuries $38,000 reported and $26,000
    not yet reported.
- id: B
  text: $274,000
  rationale: Adds the $90,000 due in a year at its face amount. Cranmoor's policy is to discount fixed,
    scheduled settlement payments, so it is carried at present value, $84,906.
- id: C
  text: $279,400
  rationale: Compounds the deferred payment forward at 6% instead of discounting it back to present value.
- id: D
  text: $338,906
  rationale: Also accrues the $70,000 the actuary expects next year's injuries to cost. No liability exists
    for injuries that haven't occurred, whatever the self-insurance arrangement.
answer: A
explanation: 'The settlement is a fixed obligation; under Cranmoor''s discounting policy, which GAAP permits
  when the amount and timing of payments are fixed or reliably determinable (SEC SAB Topic 5Y; ASC 835-30),
  it is measured at $120,000 + $90,000 ÷ 1.06 = $120,000 + $84,906 = $204,906. For self-insured risks,
  losses from injuries that occurred by year-end, both reported and incurred but not reported, are accrued
  when probable and estimable (ASC 450-20-25-2): $38,000 + $26,000 = $64,000. Injuries that haven''t happened
  create no liability, so next year''s $70,000 is not accrued. Total liability = $204,906 + $64,000 =
  $268,906.'
