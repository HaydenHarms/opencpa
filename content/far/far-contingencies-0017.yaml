id: far-contingencies-0017
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: reviewed
  references:
  - ASC 450-20-30 (measurement of a settled or probable loss, including deferred payments at present value)
  - ASC 460-10 (product warranties)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Cranmoor Devices Co. settled a Year 1 product-liability suit at year-end, agreeing to pay $120,000
  within 30 days and $90,000 one year later; Cranmoor discounts deferred obligations like this one at
  6%. Cranmoor also offers a one-year warranty, included in the price of goods it sells; its Year 2 covered
  sales total $2,200,000, it estimates warranty cost at 4% of such sales based on claims history, and
  $34,000 of warranty claims on those sales have already been paid. What total liability should Cranmoor
  report at year-end for the settlement and the warranty?
choices:
- id: A
  text: $138,906
  rationale: Leaves out the $120,000 portion of the settlement due now.
- id: B
  text: $258,906
  rationale: Correct. Settlement $120,000 + PV $84,906 + warranty $54,000.
- id: C
  text: $264,000
  rationale: Adds the $90,000 due in a year at its face amount, without discounting it to present value.
- id: D
  text: $269,400
  rationale: Compounds the deferred payment forward by 6% instead of discounting it back to present value.
answer: B
explanation: 'The settlement liability is measured at the present value of the amounts owed: the $120,000
  due almost at once, plus the one-year-deferred $90,000 discounted at 6%, $90,000 ÷ 1.06 = $84,906, totaling
  $204,906. The warranty liability is 4% × $2,200,000 − $34,000 of claims paid = $54,000. Total liability
  = $204,906 + $54,000 = $258,906.'
