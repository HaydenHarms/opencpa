id: far-ppe-involuntary-conversion-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Application
review:
  status: reviewed
  references:
  - ASC 610-30 (gains and losses on involuntary conversions of nonmonetary assets to monetary assets)
  - ASC 360-10 (depreciation)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: Keld Co.'s warehouse, which cost $1,470,000 and had accumulated depreciation of $588,000 at January
  1, Year 4, was destroyed by fire on April 30, Year 4. Keld depreciates the warehouse straight-line at
  $58,800 a year and records depreciation up to the date of any disposal. In November, its insurer paid
  $1,060,000 in settlement of the claim, after deducting the policy's $25,000 deductible. In December,
  Keld used the proceeds and other cash to buy a replacement warehouse for $1,600,000. What gain should
  Keld recognize in Year 4 on the destruction of the warehouse?
choices:
- id: A
  text: $0
  rationale: Defers the gain because Keld reinvested the proceeds in a replacement warehouse. Under U.S.
    GAAP, a gain or loss on an involuntary conversion is recognized even when the proceeds are reinvested;
    deferral is a tax rule.
- id: B
  text: $178,000
  rationale: Leaves out depreciation from January 1 to the date of the fire ($19,600). Depreciation is
    recorded up to the date of an involuntary conversion, which lowers the carrying amount and raises
    the gain.
- id: C
  text: $197,600
  rationale: Correct. $1,060,000 − ($1,470,000 − $588,000 − $19,600).
- id: D
  text: $236,800
  rationale: Records a full year of depreciation ($58,800). The warehouse was destroyed on April 30, so
    only 4 months ($19,600) are recorded.
answer: C
explanation: 'An involuntary conversion is accounted for like any other disposal: depreciation is recorded
  to the date of the fire, and the difference between the insurance proceeds and the carrying amount is
  a gain or loss, whether or not the proceeds are reinvested. Depreciation for 4 months = $58,800 × 4/12
  = $19,600. Carrying amount = $1,470,000 − $588,000 − $19,600 = $862,400. Gain = $1,060,000 − $862,400
  = $197,600. The replacement warehouse is recorded at its $1,600,000 cost.'
