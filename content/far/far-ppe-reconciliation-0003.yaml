id: far-ppe-reconciliation-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 360-10 (property, plant and equipment; depreciation; repairs and maintenance)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Year 2, Sunderland Co.''s fixed-asset subledger shows equipment with a net carrying
  amount (cost less accumulated depreciation) of $2,669,500. The general ledger shows equipment cost of
  $4,860,000 and accumulated depreciation of $1,925,000. Sunderland''s policy is to depreciate equipment
  straight-line from the month it is placed in service. The controller''s investigation finds: a machine
  costing $240,000, placed in service on October 1, Year 2, with a five-year life and no residual value,
  was depreciated for a full year in the general ledger, while the subledger follows the policy; the general
  ledger equipment account includes $310,000 paid on November 15 for land for the new plant, on which
  no depreciation was recorded; and the subledger includes $8,500 spent on December 30 for routine repairs
  of a forklift, which the general ledger recorded as repairs expense. What net carrying amount of equipment
  should Sunderland report at December 31, Year 2?'
choices:
- id: A
  text: $2,589,000
  rationale: Adds the $36,000 excess depreciation to accumulated depreciation instead of removing it.
- id: B
  text: $2,625,000
  rationale: 'Keeps the general ledger''s full year of depreciation on the new machine. Under Sunderland''s
    policy it is depreciated from October, three months: the $36,000 excess is reversed.'
- id: C
  text: $2,661,000
  rationale: Correct. ($4,860,000 − $310,000) − ($1,925,000 − $36,000), which equals the subledger $2,669,500
    − $8,500.
- id: D
  text: $2,971,000
  rationale: Leaves the $310,000 of land in the equipment account. Land is a separate, nondepreciable
    asset, not equipment.
answer: C
explanation: 'General ledger: cost $4,860,000 − $310,000 land reclassified = $4,550,000. Depreciation
  on the new machine should be $240,000 ÷ 5 × 3/12 = $12,000, not $48,000, so accumulated depreciation
  falls by $36,000 to $1,889,000. Net = $4,550,000 − $1,889,000 = $2,661,000. Subledger: $2,669,500 −
  $8,500 repairs expensed = $2,661,000. The records agree.'
