id: far-change-in-principle-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 250-10-45-5 to 45-8 (change in accounting principle: retrospective application when practicable)'
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At the start of Year 3, Verity Hardware Co. changes its inventory cost-flow method from weighted-average
  to FIFO because FIFO better reflects the actual flow of its goods, and it can determine the effect on
  every prior period. Inventory under each method was: December 31, Year 1 -- weighted-average $480,000,
  FIFO $560,000; December 31, Year 2 -- weighted-average $520,000, FIFO $640,000. Verity''s tax rate is
  25% for all years and all effects, and it presents comparative statements for Year 2 and Year 3. What
  net-of-tax adjustment should Verity make to its January 1, Year 2, balance of retained earnings?'
choices:
- id: A
  text: $60,000 decrease
  rationale: Subtracts the FIFO amount from the weighted-average amount instead of the reverse. Fifo inventory
    of $560,000 exceeds weighted-average inventory of $480,000, raising retained earnings.
- id: B
  text: $60,000 increase
  rationale: Correct. ($560,000 − $480,000) × 75%.
- id: C
  text: $80,000 increase
  rationale: Reports the pretax $80,000 cumulative effect without its tax effect. The adjustment to opening
    retained earnings is net of the 25% tax rate.
- id: D
  text: $90,000 increase
  rationale: Uses the $120,000 difference between the two methods at December 31, Year 2, rather than
    at December 31, Year 1. The cumulative effect through the end of the earliest year presented, Year
    1, is what adjusts the January 1, Year 2, balance.
answer: B
explanation: 'A change in inventory cost-flow method is a change in accounting principle, applied retrospectively
  when the effect on every prior period can be determined (ASC 250-10-45-5). The cumulative effect on
  periods before the earliest period presented adjusts the opening balance of retained earnings for that
  period, net of tax: ($560,000 − $480,000) = $80,000 pretax, × 75% after-tax = $60,000. The December
  31, Year 2, difference is restated separately within the comparative Year 2 statements; it doesn''t
  change the January 1, Year 2, opening balance.'
