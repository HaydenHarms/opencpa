id: far-change-in-principle-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Application
review:
  status: draft
  references:
  - ASC 250-10-45-5 to 45-8 (retrospective application of a change in accounting principle; indirect effects)
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'At the start of Year 4, Verity Hardware Co. changes its inventory cost-flow method from FIFO to
  weighted-average because weighted-average better matches the cost of its interchangeable stock, and
  it can determine the effect on every prior period. Its year-end inventories under the two methods were:
  December 31, Year 1, FIFO $560,000 and weighted-average $500,000; December 31, Year 2, FIFO $640,000
  and weighted-average $555,000; December 31, Year 3, FIFO $700,000 and weighted-average $570,000. Verity
  pays employees a profit-sharing bonus equal to 10% of income before the bonus and income taxes. Verity''s
  Year 3 net income as originally reported was $620,000, and its tax rate is 25% for all years and all
  effects. In its comparative statements for Years 2, 3 and 4, what net income should Verity report for
  Year 3?'
choices:
- id: A
  text: $522,500
  rationale: Applies the whole $130,000 cumulative difference between the methods at December 31, Year
    3, net of tax, to Year 3 income. Year 3 income changes only by the change in that difference during
    Year 3; the effect of earlier years goes to opening retained earnings.
- id: B
  text: $586,250
  rationale: Correct. $620,000 − ($130,000 − $85,000) × 75% = $586,250; the bonus isn't recomputed.
- id: C
  text: $589,625
  rationale: Also recomputes the 10% profit-sharing bonus on the restated income. A change in the bonus
    is an indirect effect of the change in principle, and indirect effects aren't recognized in the restated
    prior periods (ASC 250-10-45-8).
- id: D
  text: $653,750
  rationale: Applies the Year 3 effect in the wrong direction. Weighted-average inventory moved from $85,000
    below FIFO at the start of Year 3 to $130,000 below FIFO at its end, so restated Year 3 cost of goods
    sold is higher and income lower.
answer: B
explanation: 'A change in inventory cost-flow method is a change in accounting principle, applied retrospectively
  when its effect on every prior period can be determined (ASC 250-10-45-5). Each prior year presented
  is restated as if weighted-average had always been used. Year 3 income changes by the change during
  Year 3 in the difference between the methods'' inventories: weighted-average inventory moved from $85,000
  below FIFO at the start of Year 3 to $130,000 below FIFO at its end, so restated Year 3 cost of goods
  sold is $45,000 higher and pretax income $45,000 lower, or $33,750 after the 25% tax. The profit-sharing
  bonus would have differed under weighted-average, but that is an indirect effect of the change: indirect
  effects aren''t included in the restated periods, and any actually incurred are recognized in the period
  of the change (ASC 250-10-45-8), so the bonus isn''t recomputed for Year 3. Restated Year 3 net income
  = $620,000 − $33,750 = $586,250.'
