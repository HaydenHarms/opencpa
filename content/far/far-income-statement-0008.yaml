id: far-income-statement-0008
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Income statement
  skill: Application
review:
  status: reviewed
  references:
  - ASC 220-10 (income statement)
  - ASC 606-10-55 (consignment arrangements)
  - 'ASC 321-10-35 (equity securities: changes in fair value in net income)'
  - ASC 505-20 (dividends are distributions, not expenses)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Balmacara Outfitting Co.''s draft Year 2 income statement reports income before income taxes of
  $946,000. The controller identifies these errors: (1) goods costing $38,500 that Balmacara had shipped
  to a dealer, who sells them on Balmacara''s behalf for a commission, were left out of Balmacara''s December
  31 inventory, so their cost was included in cost of goods sold; (2) a $27,000 increase during Year 2
  in the fair value of listed common shares that Balmacara holds, without significant influence over the
  issuer, was reported in other comprehensive income; (3) on December 1, Balmacara received $54,000 from
  a tenant as rent for warehouse space for December through May, Year 3, and credited the whole amount
  to rent revenue; and (4) cash dividends of $120,000 that Balmacara''s board declared in December were
  debited to an expense account. What corrected income before income taxes should Balmacara report for
  Year 2?'
choices:
- id: A
  text: $966,500
  rationale: Leaves the $120,000 of dividends among the expenses. Dividends are distributions of retained
    earnings to owners, not expenses, so they come out of the income statement.
- id: B
  text: $1,009,500
  rationale: Deducts the $38,500 of goods held by the dealer instead of adding them back. Goods out on
    consignment still belong to Balmacara, so ending inventory rises and cost of goods sold falls by $38,500.
- id: C
  text: $1,059,500
  rationale: Leaves the $27,000 fair value increase in other comprehensive income. Changes in the fair
    value of equity securities with readily determinable fair values are recognized in net income.
- id: D
  text: $1,086,500
  rationale: Correct. $946,000 + $38,500 + $27,000 − $45,000 + $120,000.
answer: D
explanation: '(1) Consigned goods remain the consignor''s inventory, so ending inventory rises and cost
  of goods sold falls: + $38,500. (2) Fair value changes on equity securities with readily determinable
  fair values go to net income: + $27,000. (3) One month of the six-month rent, $9,000, was earned in
  Year 2, so $45,000 is reclassified to unearned rent: − $45,000. (4) Dividends are distributions to owners,
  charged to retained earnings, not expenses: + $120,000. Corrected income before income taxes = $946,000
  + $38,500 + $27,000 − $45,000 + $120,000 = $1,086,500.'
