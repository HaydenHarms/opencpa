id: far-receivables-rollforward-0006
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: draft
  references:
  - ASC 310-10 (receivables)
  - ASC 860-10-40-5 (conditions for a transfer of financial assets to be a sale; otherwise a secured borrowing)
  - ASC 606-10-55-81 to 55-84 (bill-and-hold arrangements)
  - 'ASC 606-10-45-4 (receivables: unconditional right to consideration)'
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: Portreath Supply Co.'s accounts receivable control account began Year 2 at $520,000. Its Year 2
  postings were debits for sales of $3,150,000, credits for cash collected of $3,080,000, credits for
  accounts written off of $26,000, and a $72,000 credit on October 1, when Portreath transferred that
  amount of customer accounts to a bank for cash, leaving a December 31 balance of $492,000. Testing the
  postings, internal audit learns that Portreath must reimburse the bank for any transferred account that
  isn't collected, and that the transfer agreement forbids the bank from selling or pledging the accounts,
  so no one but Portreath and the bank will deal with Portreath's customers; none of the transferred accounts
  had been collected by December 31. The sales debits include a $48,000 invoice dated December 28 for
  goods a customer asked Portreath to hold until its new store opens in March; the goods sit with Portreath's
  other stock, are available to fill other orders, and are payable 30 days after delivery. Both the sales
  debits and the cash-collected credits include $94,000 of showroom cash sales, which Portreath's cashiers
  post through the receivables account on the day of each sale. What should Portreath report at December
  31, Year 2, as accounts receivable, before any allowance, and as its liability to the bank?
choices:
- id: A
  text: $422,000 receivables; $72,000 liability to the bank
  rationale: Removes the $94,000 of cash sales from the sales debits only. They were also posted as collections,
    so the debit and credit cancel and the year-end balance needs no correction for them.
- id: B
  text: $444,000 receivables; no liability to the bank
  rationale: Accepts the $72,000 credit for the transfer as a sale. Because the agreement bars the bank
    from selling or pledging the accounts, the transfer fails the conditions for sale accounting in ASC
    860-10-40-5; it is a secured borrowing, so the receivables stay in the control account and the cash
    is a liability.
- id: C
  text: $516,000 receivables; $72,000 liability to the bank
  rationale: Correct. $492,000 + $72,000 − $48,000; the cash sales were debited and credited to the account,
    so they net to zero. The $72,000 received from the bank is a liability, none of the accounts having
    been collected.
- id: D
  text: $564,000 receivables; $72,000 liability to the bank
  rationale: Keeps the $48,000 bill-and-hold invoice as a receivable. The goods sit with Portreath's other
    stock and can fill other orders, so control hasn't passed and there is no sale yet; payment isn't
    due until 30 days after delivery, so Portreath has no unconditional right to payment either.
answer: C
explanation: 'The transfer is a secured borrowing, not a sale: the agreement forbids the bank from selling
  or pledging the accounts, a constraint that benefits Portreath, so the transferee lacks the right to
  pledge or exchange them that sale accounting requires (ASC 860-10-40-5(b)). (The recourse by itself
  wouldn''t prevent sale accounting.) None of the accounts had been collected by December 31, so all of
  them are still Portreath''s receivables. The $72,000 goes back into receivables, and the cash received
  is a liability to the bank. The December 28 invoice is not a sale: the goods aren''t set apart as the
  customer''s and can be used to fill other orders, so control hasn''t passed (ASC 606-10-55-83), and
  with payment due only after delivery there is no unconditional right to payment; the $48,000 comes out.
  The showroom cash sales were debited and credited to the account for the same $94,000, so they leave
  the balance unchanged. Corrected receivables = $492,000 + $72,000 − $48,000 = $516,000, and the liability
  to the bank is the $72,000 received.'
