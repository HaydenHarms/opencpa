id: far-payables-reconciliation-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Payables and accrued liabilities
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 405-10 (liabilities)
  - ASC 210-10-45 (debit balances in payables reported as assets)
  - 'ASC 310-10 (cash discounts: net method)'
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Swinden Co.''s accounts payable subledger totals $516,500, and its general ledger
  control account shows $508,900. Swinden records purchases net of available cash discounts. The controller''s
  review finds: several vendor accounts have debit balances, totaling $12,400, from duplicate payments
  that the vendors have agreed to refund, and both totals are net of them; checks totaling $17,300, recorded
  as payments on December 31 in both records, were kept in the treasurer''s office and not mailed to the
  vendors until January 12; an invoice for $185,000 with terms 2/10, n/30, received on December 27, was
  posted to the vendor''s subledger account at its gross amount, while the general ledger recorded it
  correctly; and a $3,900 debit memo for goods returned to a vendor on December 29 was recorded in the
  general ledger but not in the subledger. What amount should Swinden report as accounts payable at December
  31?'
choices:
- id: A
  text: $516,500
  rationale: Uses the subledger as recorded. It nets the debit balances, treats the held checks as paid,
    carries the invoice at gross and lacks the $3,900 debit memo.
- id: B
  text: $521,300
  rationale: Treats the $17,300 of checks held in the office as paid. A check not delivered to the vendor
    by year-end hasn't settled the payable.
- id: C
  text: $526,200
  rationale: Leaves the vendor accounts with $12,400 of debit balances netted against payables. Amounts
    vendors owe Swinden are receivables, so accounts payable is the total of the credit balances.
- id: D
  text: $538,600
  rationale: Correct. Ledger $508,900 + $12,400 + $17,300 = subledger $516,500 + $12,400 + $17,300 − $3,700
    − $3,900.
answer: D
explanation: 'Accounts payable is the total of the amounts Swinden owes. Debit balances in vendor accounts
  are receivables, so the $12,400 netted in both records is added back. Checks still held at year-end
  haven''t paid anything, so the $17,300 is restored to both records. In the subledger, the invoice is
  reduced to its net amount (− $3,700) and the debit memo is posted (− $3,900). General ledger: $508,900
  + $12,400 + $17,300 = $538,600. Subledger: $516,500 + $12,400 + $17,300 − $3,700 − $3,900 = $538,600.
  The records agree at $538,600.'
