id: far-cash-flows-0002
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 230-10 (statement of cash flows: classification and indirect method)'
  notes: Batch 01, revision 3 (2026 blueprint scope, four choices, Analysis items in the blueprint's task
    frames). Answers re-solved and every number and distractor computed in code.
stem: 'Fenwick Ltd. reports net income of $140,000. During the year: depreciation $33,000; loss on early
  retirement of bonds $8,000; accounts receivable increased $19,000; unearned revenue increased $13,000;
  dividends paid $20,000. Under the indirect method and U.S. GAAP, what is net cash provided by operating
  activities?'
choices:
- id: A
  text: $155,000
  rationale: Subtracts the $20,000 of dividends paid. Under U.S. GAAP, dividends paid are a financing
    outflow, not an operating adjustment.
- id: B
  text: $159,000
  rationale: Subtracts the $8,000 loss instead of adding it back. A loss reduced net income without using
    operating cash.
- id: C
  text: $162,000
  rationale: Omits the unearned revenue increase. Cash collected in advance of earning revenue is an operating
    inflow.
- id: D
  text: $175,000
  rationale: Correct. $140,000 + $33,000 + $8,000 − $19,000 + $13,000.
answer: D
explanation: 'Add back depreciation and the loss on bond retirement (the cash paid to retire bonds is
  financing), subtract the receivables increase, and add the unearned revenue increase: $140,000 + $33,000
  + $8,000 − $19,000 + $13,000 = $175,000. Dividends paid are reported in financing activities.'
