id: far-cash-unreconciled-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: draft
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (errors by the bank and by the depositor)
  notes: Batch 15. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'St Mawes Marine Co.''s bank reconciliation shows an adjusted bank balance of $67,400 at October
  31. Its general ledger cash account shows $66,000, an unreconciled difference of $-1,400. Investigating,
  the controller finds: a $410 insurance premium that the bank auto-debited under a standing authorization
  has not been recorded; a $980 cash deposit was recorded in the cash disbursements journal instead of
  the cash receipts journal; and a $150 bill included in an earlier deposit turned out to be counterfeit,
  which the bank did not credit and which St has not yet written off. What is St''s correct cash balance
  at October 31?'
choices:
- id: A
  text: $66,420
  rationale: Adds back only the $980 deposit itself. Because the deposit was recorded in the disbursements
    journal instead of the receipts journal, cash was reduced when it should have been increased, a $1,960
    swing that must be corrected in full.
- id: B
  text: $67,400
  rationale: Correct. $66,000 + $410 − $1,960 + $150 = $67,400, agreeing with the adjusted bank balance.
- id: C
  text: $67,550
  rationale: Leaves the $150 counterfeit bill in the recorded deposit. The bank didn't credit it, and
    St hasn't yet written it off.
- id: D
  text: $67,810
  rationale: Leaves out the $410 insurance premium the bank auto-debited under a standing authorization,
    which St hasn't recorded.
answer: B
explanation: The $410 auto-debited premium reduces book cash and hasn't been recorded. Recording the $980
  deposit in the disbursements journal instead of the receipts journal reduced cash when it should have
  increased it, a $1,960 swing to correct. The $150 counterfeit bill was never real cash and must be written
  off. $66,000 + $410 − $1,960 + $150 = $67,400.
