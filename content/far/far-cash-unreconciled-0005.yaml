id: far-cash-unreconciled-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: draft
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (errors by the bank and by the depositor)
  notes: Batch 15, revision 2 (blind verifier and gate findings applied). Written from scratch; answers
    solved and every number and distractor computed in code.
stem: 'Internal audit is testing St Keverne Marine Co.''s October 31 cash. The bank statement shows $66,150,
  deposits in transit total $5,070, outstanding checks total $4,250, and the general ledger cash account
  shows $66,350; the bookkeeper''s reconciliation does not balance. The auditors find that the bank charged
  check #2217, written and recorded for $2,180, against the account at $2,810 and has agreed to correct
  the error; that a $410 insurance premium the bank deducted under St Keverne''s standing authorization
  hasn''t been recorded; that a $980 deposit of customer receipts was entered in the cash disbursements
  journal instead of the cash receipts journal; and that a $300 bill in an earlier deposit was counterfeit,
  so the bank didn''t credit it, and St Keverne hasn''t written it off. Before any correction, by what
  amount, and in which direction, is St Keverne''s general ledger cash balance misstated at October 31?'
choices:
- id: A
  text: $270 understated
  rationale: Corrects the misposted $980 deposit by only $980. Recording a receipt in the disbursements
    journal reduced cash by $980 when it should have increased it by $980, so the books are $1,960 too
    low on that item.
- id: B
  text: $620 understated
  rationale: 'Compares the ledger with the bank balance plus deposits in transit less outstanding checks,
    $66,970, without correcting the bank''s error: the bank charged check #2217 at $2,810 instead of the
    $2,180 written on it, so the bank side is $630 too low.'
- id: C
  text: $1,250 understated
  rationale: 'Correct. Correct cash is $66,150 + $5,070 − $4,250 + $630 = $67,600; the ledger''s $66,350
    is $1,250 lower. Book-side check: $66,350 − $410 + $1,960 − $300 = $67,600.'
- id: D
  text: $1,660 understated
  rationale: Leaves out the $410 insurance premium the bank deducted under a standing authorization, which
    St Keverne hasn't recorded.
answer: C
explanation: 'Correct cash comes from the bank side once the bank''s error is fixed: the bank charged
  $2,810 for a $2,180 check, so $630 goes back: $66,150 + $5,070 − $4,250 + $630 = $67,600. The book side
  confirms it: subtract the $410 premium; add $1,960 for the deposit entered as a disbursement (removing
  the wrong $980 reduction and recording the $980 receipt); and subtract the $300 counterfeit bill: $66,350
  − $410 + $1,960 − $300 = $67,600. The ledger shows $66,350, which is $1,250 below the correct $67,600,
  so it is understated by $1,250.'
