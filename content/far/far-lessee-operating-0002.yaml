id: far-lessee-operating-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: reviewed
  references:
  - ASC 842-20-25-6
  notes: Batch 01. Adapted from legacy bank; answer re-solved, arithmetic checked in code, distractors
    rebuilt where needed.
stem: Garland Inc. leases equipment for 5 years with payments of $30,000 at the end of each year. The
  discount rate is 7% (PV factor 4.1002), and the equipment's useful life is 7 years. The lease meets
  none of the finance lease criteria. What total lease expense does Garland recognize in Year 1?
choices:
- id: A
  text: $33,212
  rationale: 'Finance lease treatment: $24,601 amortization plus $8,610 interest.'
- id: B
  text: $30,000
  rationale: Correct. An operating lease recognizes a single straight-line lease cost; with level payments
    that equals the annual payment.
- id: C
  text: $24,601
  rationale: Only straight-line amortization of the right-of-use asset, with no interest component.
- id: D
  text: $26,183
  rationale: Amortizes the right-of-use asset over the 7-year useful life and adds interest, which is
    not how either lease type works here.
answer: B
explanation: 'Operating lease cost is recognized straight-line over the lease term: ($30,000 × 5) ÷ 5
  = $30,000 per year. The single lease cost combines interest on the liability and a plug amortization
  of the right-of-use asset.'
