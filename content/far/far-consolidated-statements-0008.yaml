    share is $45,000. (4) Eliminating the management fee removes equal revenue and expense and doesn''t
    change net income. Net income attributable to Penrith = $1,805,000 − $75,000 − $45,000 = $1,685,000.
    The noncontrolling interest''s share becomes $130,000 − $15,000 = $115,000.'
