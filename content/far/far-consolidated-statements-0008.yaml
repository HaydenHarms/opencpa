id: far-consolidated-statements-0008
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Consolidated financial statements
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 810-10 (consolidation procedures: intercompany eliminations; attribution of net income to the
    parent and the noncontrolling interest)'
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Gilmore Corp. has owned 80% of Holme Inc. since acquiring it at the beginning of Year 1. For Year
  2, Holme reports net income of $300,000 and pays dividends of $50,000. Gilmore''s draft Year 2 consolidated
  income statement reports net income attributable to Gilmore of $1,000,000 and net income attributable
  to the noncontrolling interest of $60,000. The controller has identified these errors in the draft:
  (1) Gilmore''s $40,000 of dividend income from Holme was included in consolidated net income; (2) the
  Year 2 amortization of $20,000 on the excess of the acquisition-date fair value of Holme''s equipment
  over its book value was not recorded; (3) unrealized profit of $15,000 in Gilmore''s ending inventory,
  on goods bought from Holme, was not eliminated; and (4) management fees of $30,000 that Holme paid Gilmore
  were not eliminated. Gilmore attributes the elimination of profit on Holme''s sales to Gilmore proportionately
  between the parent and the noncontrolling interest. After correcting the errors, what net income attributable
  to Gilmore should the consolidated income statement report?'
choices:
- id: A
  text: $902,000
  rationale: Also subtracts the $30,000 management fee. Eliminating it removes equal amounts of revenue
    and expense, so consolidated net income doesn't change.
- id: B
  text: $932,000
  rationale: Correct. $1,000,000 − $40,000 dividend income − 80% × ($20,000 + $15,000).
- id: C
  text: $948,000
  rationale: Doesn't record the $20,000 of amortization, whose 80% share ($16,000) reduces income attributable
    to Gilmore.
- id: D
  text: $972,000
  rationale: Leaves the $40,000 of dividend income in. Dividends from a consolidated subsidiary are intercompany
    and are eliminated.
answer: B
explanation: '(1) The $40,000 of dividend income is intercompany: eliminate it, all from Gilmore''s income.
  (2) and (3) The amortization and the unrealized profit on Holme''s upstream sales both reduce Holme''s
  income as consolidated, $20,000 + $15,000 = $35,000, shared 80% / 20%, so Gilmore''s share is $28,000.
  (4) Eliminating the management fee removes equal revenue and expense and doesn''t change net income.
  Net income attributable to Gilmore = $1,000,000 − $40,000 − $28,000 = $932,000. The noncontrolling interest''s
  share becomes $60,000 − $7,000 = $53,000.'
