id: far-lessee-operating-0005
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 842-20-25-6 (operating lease cost: straight-line single lease cost; variable lease payments recognized
    when incurred)'
  - 'ASC 842-20-25-2 (short-term lease election: cost recognized straight-line over the term)'
  - ASC 842-20-50-4 (total lease cost includes short-term and variable lease cost)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Botallack Outdoor Co. began a five-year lease of retail space, which it classifies
  as an operating lease. Rent is $14,500 a month, except that no rent is due for the first six months.
  Botallack also pays the landlord 3% of its annual sales at the location above $3,000,000; Year 1 sales
  there were $3,860,000. On May 1, Year 1, Botallack rented a forklift for eight months at $2,400 a month,
  and it has elected the short-term lease exemption for that class of asset. What total lease cost should
  Botallack recognize for Year 1?
choices:
- id: A
  text: $132,000
  rationale: 'Uses the $87,000 of rent paid in Year 1. An operating lease''s fixed payments, free months
    included, are recognized straight-line over the lease term: $783,000 ÷ 5 = $156,600 a year.'
- id: B
  text: $175,800
  rationale: Leaves out the $25,800 of percentage rent. Variable payments based on sales aren't in the
    lease liability, but they are lease cost in the period the obligation is incurred.
- id: C
  text: $182,400
  rationale: Leaves out the $19,200 of forklift rent. A short-term lease isn't on the balance sheet, but
    its cost is recognized straight-line over its term and is part of total lease cost.
- id: D
  text: $201,600
  rationale: Correct. $156,600 straight-line + $25,800 variable + $19,200 short-term.
answer: D
explanation: 'Operating lease cost for the fixed payments is recognized straight-line over the lease term
  (ASC 842-20-25-6): 54 months × $14,500 = $783,000 ÷ 5 = $156,600 a year, free months included. Variable
  payments based on sales are excluded from the lease liability and recognized as incurred: 3% × ($3,860,000
  − $3,000,000) = $25,800. The forklift is a short-term lease, recognized straight-line over its term:
  8 × $2,400 = $19,200. Total lease cost = $201,600.'
