id: far-ratios-0004
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Financial Statement Ratios and Performance Metrics
  skill: Application
review:
  status: reviewed
  references:
  - 'Financial statement analysis: solvency ratios'
  - ASC 480-10 (mandatorily redeemable financial instruments)
  - ASC 842-20-45 (lease liabilities presented on the balance sheet)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: At December 31, Ferris Corp.'s balance sheet reports total assets of $3,600,000. Its obligations
  are current liabilities of $400,000, including $50,000 of unearned revenue; long-term debt of $900,000;
  and operating lease liabilities of $300,000. Ferris also has $200,000 of preferred shares that it must
  redeem for cash on a fixed date in Year 6, which its draft balance sheet presents within stockholders'
  equity. After any correction needed, what is Ferris's total debt ratio (total liabilities divided by
  total assets), rounded to two decimal places?
choices:
- id: A
  text: '0.36'
  rationale: Leaves out both the operating lease liabilities and the mandatorily redeemable preferred
    shares.
- id: B
  text: '0.42'
  rationale: Leaves out the $300,000 of operating lease liabilities, which are liabilities on the balance
    sheet.
- id: C
  text: '0.44'
  rationale: Leaves the $200,000 of mandatorily redeemable preferred shares in equity. Shares the issuer
    must redeem for cash on a fixed date are liabilities.
- id: D
  text: '0.50'
  rationale: Correct. ($400,000 + $900,000 + $300,000 + $200,000) ÷ $3,600,000.
answer: D
explanation: Preferred shares that must be redeemed for cash on a fixed date are mandatorily redeemable
  financial instruments, reported as liabilities, so $200,000 moves out of equity. Operating lease liabilities
  and unearned revenue are liabilities too. Total liabilities = $400,000 + $900,000 + $300,000 + $200,000
  = $1,800,000; total assets are unchanged. $1,800,000 ÷ $3,600,000 = 0.50.
