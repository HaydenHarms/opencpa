id: far-subsequent-events-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 855-10 (recognized and nonrecognized subsequent events)
  - ASC 250-10 (errors discovered before issuance)
  notes: Batch 05. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Owen Co.''s December 31, Year 1, statements will be issued on March 10, Year 2. Between those dates:
  (1) on January 20, a fire destroyed the plant of a major customer, which filed for bankruptcy on January
  30, making its $60,000 December 31 receivable uncollectible; the customer had been in good financial
  condition at year-end; (2) on January 15, Owen settled for $90,000 a lawsuit over a Year 1 accident,
  for which it had accrued $50,000; (3) on February 20, Owen found that its December 31 inventory count
  had double-counted goods costing $25,000; and (4) on March 1, Owen''s board declared a cash dividend.
  Ignore income taxes. By how much should Owen reduce its Year 1 pretax income?'
choices:
- id: A
  text: $65,000
  rationale: Correct. $40,000 more for the lawsuit settlement plus the $25,000 inventory count error.
- id: B
  text: $115,000
  rationale: Charges the full $90,000 settlement instead of the $40,000 not yet accrued.
- id: C
  text: $125,000
  rationale: Also recognizes the $60,000 receivable loss. The customer's problems arose from a fire after
    year-end, so the loss is disclosed, not recognized.
- id: D
  text: $175,000
  rationale: Charges the full settlement and also recognizes the receivable loss.
answer: A
explanation: 'The settlement gives evidence about a Year 1 condition, so the accrual rises from $50,000
  to $90,000: $40,000. The inventory double count is an error in the Year 1 statements found before issuance:
  $25,000. The customer''s bankruptcy resulted from a fire after year-end, so it is a nonrecognized event
  (disclosed if material), as is the dividend. Reduction = $65,000.'
