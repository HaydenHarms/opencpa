id: far-inventory-rollforward-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10 (inventory; shrinkage)
  - 'ASC 606-10-25-30 (transfer of control: FOB destination shipments)'
  - ASC 606-10-55 (consignment arrangements)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Wark Outdoor Co. uses a perpetual inventory system. Its Year 1 inventory rollforward, taken from
  the perpetual records, shows beginning inventory of $684,000, purchases of $4,215,000, cost of goods
  sold of $4,128,000 and ending inventory of $771,000. The December 31 physical count, priced at cost,
  totals $659,300. Cutoff work finds: purchases include goods costing $38,000 that a supplier shipped
  on December 28, FOB destination, and that arrived on January 4; goods costing $26,500, shipped to a
  customer on December 30, FOB destination, and delivered on January 3, were recorded as a December sale
  and removed from the perpetual records; and goods costing $31,000 that Wark sent to a dealer in November
  to sell on Wark''s behalf were not counted. What inventory shrinkage should Wark recognize for Year
  1?'
choices:
- id: A
  text: $16,200
  rationale: Adds the $26,500 of goods in transit to the customer to the count but leaves them out of
    the perpetual records. The sale was recorded early, so the records also need the goods restored.
- id: B
  text: $42,700
  rationale: Correct. ($771,000 − $38,000 + $26,500) − ($659,300 + $26,500 + $31,000).
- id: C
  text: $73,700
  rationale: Leaves out the $31,000 of goods held by the consignee. Wark still owns consigned goods, so
    they are added to the count.
- id: D
  text: $80,700
  rationale: Leaves the $38,000 of goods shipped FOB destination in the perpetual records. They weren't
    Wark's until they arrived on January 4, so the purchase and the inventory are removed from Year 1.
answer: B
explanation: 'Corrected perpetual balance: $771,000 − $38,000 (goods shipped FOB destination belong to
  the seller until delivered) + $26,500 (goods shipped FOB destination to the customer are still Wark''s)
  = $759,500. Corrected count: $659,300 + $26,500 goods in transit to the customer + $31,000 consigned
  goods = $716,800. Shrinkage = $759,500 − $716,800 = $42,700. The goods in transit to the customer affect
  both sides equally.'
