id: far-nfp-contributions-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - ASC 958-605-25 (unconditional and conditional promises to give)
  - ASC 958-605-20 (definition of a contribution, including cancellation of a liability)
  - ASC 958-605-30 and ASC 958-310-35 (measuring contributions and promises to give)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: During Year 1, Perrin Community Clinic, a not-for-profit entity, had the following transactions.
  In December, a donor signed an unconditional promise to pay Perrin $45,000 within 60 days. A pharmaceutical
  distributor donated medical supplies for use in Perrin's patient-care programs, with a fair value of
  $18,000. A regional foundation pledged $60,000, which it will pay only if Perrin opens a satellite clinic
  by June 30, Year 2; construction of the clinic hasn't begun. In Year 0, a supporter had lent Perrin
  $25,000 at a market rate of interest; in December, Year 1, with all interest paid to date, she notified
  Perrin in writing that she was cancelling the loan. Perrin measures promises to give that are due within
  one year at the amount it expects to collect, and expects to collect this one in full. What total contribution
  revenue should Perrin recognize for Year 1?
choices:
- id: A
  text: $63,000
  rationale: Leaves out the $25,000 loan the donor forgave. A donor's voluntary cancellation of a liability
    is a contribution (ASC 958-605-20, definition of a contribution), recognized when the liability is
    cancelled.
- id: B
  text: $70,000
  rationale: Leaves out the $18,000 of donated medical supplies. Contributed nonfinancial assets are recognized
    at fair value when received (ASC 958-605-30).
- id: C
  text: $88,000
  rationale: Correct. $45,000 + $18,000 + $25,000; the conditional pledge isn't recognized.
- id: D
  text: $148,000
  rationale: Includes the $60,000 foundation pledge. The foundation pays only if Perrin opens the satellite
    clinic by June 30, Year 2, and has the right not to pay otherwise; until that barrier is overcome
    the promise is conditional and isn't recognized (ASC 958-605-25).
answer: C
explanation: 'The unconditional promise is recognized when received, at the $45,000 Perrin expects to
  collect, its stated measurement for promises due within one year (ASC 958-310-35; ASC 958-605-30). The
  supplies are contributed nonfinancial assets, recognized at fair value: $18,000. A donor''s cancellation
  of a liability is a contribution (ASC 958-605-20), so the forgiven loan adds $25,000. The foundation''s
  pledge depends on a barrier Perrin hasn''t overcome, opening the clinic, with a right for the foundation
  not to pay, so it is conditional and isn''t recognized until the condition is met (ASC 958-605-25).
  Contribution revenue = $45,000 + $18,000 + $25,000 = $88,000.'
