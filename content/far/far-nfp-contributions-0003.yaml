id: far-nfp-contributions-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-605-25 (conditional versus unconditional promises; measurable barriers)
  - ASC 958-605-30-7 (promises collectible currently; nonfinancial assets at fair value)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: During Year 1, Perrin Community Clinic, a not-for-profit entity, received the following. A donor
  signed an unconditional promise to pay Perrin $45,000 within 60 days, collectible in the ordinary course
  of Perrin's operations. A local pharmaceutical distributor donated medical supplies for Perrin to distribute
  to patients, with a fair value of $18,000. A regional foundation pledged $60,000, payable only if Perrin
  opens a satellite clinic by a specified date, a measurable barrier Perrin hasn't yet overcome. A donor
  gave Perrin a used van for transporting patients, with a fair value of $22,000, which was carried on
  the donor's own books at $9,000. What total contribution revenue should Perrin recognize for Year 1?
choices:
- id: A
  text: $72,000
  rationale: Records the van at the donor's $9,000 carrying amount. Contributed nonfinancial assets are
    measured at their fair value when received, $22,000.
- id: B
  text: $83,650
  rationale: Discounts the $45,000 promise by a present value factor even though it is due in 60 days,
    within Perrin's operating cycle. An unconditional promise collectible currently is recognized at the
    amount expected to be collected, without discounting (ASC 958-605-30-7).
- id: C
  text: $85,000
  rationale: Correct. $45,000 (not discounted) + $18,000 + $22,000.
- id: D
  text: $145,000
  rationale: Includes the $60,000 foundation pledge. It is conditioned on a measurable barrier, opening
    the satellite clinic, that Perrin hasn't yet overcome, so it isn't revenue yet.
answer: C
explanation: 'An unconditional promise to give that is collectible currently is recognized at the amount
  expected to be collected, with no present value discount (ASC 958-605-30-7): $45,000. The medical supplies
  and the van are contributed nonfinancial assets, measured at fair value when received rather than the
  donor''s carrying amount: $18,000 and $22,000. The foundation''s pledge depends on a measurable barrier
  Perrin hasn''t overcome, so it isn''t revenue until the barrier is met. Contribution revenue = $45,000
  + $18,000 + $22,000 = $85,000.'
