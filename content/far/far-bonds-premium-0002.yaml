id: far-bonds-premium-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Debt (Notes and bonds payable)
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 470-20-25 (debt issued with detachable stock warrants: relative fair value allocation)'
  - ASC 835-30 (interest method)
  notes: Batch 15. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Padstow Energy Corp. issues $1,000,000 face amount of ten-year, 5% bonds,
  paying interest each June 30 and December 31, together with detachable stock warrants, for total cash
  proceeds of $955,000. Immediately after issuance, the warrants trade separately at a total fair value
  of $50,000, and the bonds alone, without the warrants, would have sold to yield 7.4%, compounded semiannually,
  for $950,000. Padstow allocates the proceeds between the bonds and the warrants by relative fair value,
  uses the effective interest method for the bonds, and rounds to the nearest dollar at each step. What
  total interest expense should Padstow recognize on the bonds for Year 1?
choices:
- id: A
  text: $50,000
  rationale: Uses the two $25,000 stated interest payments with no discount amortization. Allocating part
    of the proceeds to the warrants creates a bond discount, which the effective interest method amortizes
    into interest expense.
- id: B
  text: $67,136
  rationale: Uses the $907,250 carrying amount for both semiannual periods. The carrying amount rises
    as the discount amortizes each period, to $915,818 for the second period, raising its interest.
- id: C
  text: $67,453
  rationale: Correct. $907,250 × 7.4%/2 + $915,818 × 7.4%/2.
- id: D
  text: $71,052
  rationale: Treats the full $955,000 of proceeds as the bonds' initial carrying amount. Because the warrants
    are detachable and trade separately, part of the proceeds, allocated by relative fair value, belongs
    to additional paid-in capital, not the bonds.
answer: C
explanation: 'Because the warrants are detachable, proceeds are allocated between the bonds and the warrants
  by relative fair value (ASC 470-20-25-2): bonds'' share = $955,000 × $950,000/($950,000 + $50,000) =
  $907,250, with the remaining $47,750 credited to additional paid-in capital for the warrants. The $25,000
  semiannual coupon is $50,000 a year on the face amount. First-period interest = $907,250 × 7.4%/2 =
  $33,568, increasing the carrying amount to $915,818; second-period interest = $915,818 × 7.4%/2 = $33,885.
  Total Year 1 interest expense = $33,568 + $33,885 = $67,453.'
