id: far-bonds-premium-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Debt (Notes and bonds payable)
  skill: Application
review:
  status: draft
  references:
  - 'ASC 470-20-25-2 (debt issued with detachable stock purchase warrants: allocation by relative fair
    value)'
  - ASC 835-30 (interest method)
  notes: Batch 15, revision 2 (blind verifier and gate findings applied). Written from scratch; answers
    solved and every number and distractor computed in code.
stem: On April 1, Year 1, St Germans Energy Corp. issues $1,000,000 face amount of ten-year, 6% bonds,
  paying interest each September 30 and March 31, together with detachable stock warrants, for total cash
  proceeds of $922,879. Immediately after issuance, the bonds trade without the warrants at a total fair
  value of $882,000, and the warrants trade at a total fair value of $60,000. Measured on the share of
  the proceeds that belongs to the bonds, the bonds' effective interest rate is 8%, compounded semiannually.
  St Germans applies the effective interest method, accrues interest at year-end and rounds each computation
  to the nearest dollar. How much bond interest expense should St Germans recognize for Year 1?
choices:
- id: A
  text: $34,564
  rationale: Stops at the September 30 payment. Interest from then to December 31 (3 months) also belongs
    in Year 1 and is accrued at year-end.
- id: B
  text: $45,000
  rationale: Uses only the stated interest, $30,000 for the first period and 3/6 of $30,000 accrued at
    year-end, with no discount amortization. The effective interest method applies the effective rate
    to the carrying amount.
- id: C
  text: $51,937
  rationale: Correct. $864,097 × 8%/2 = $34,564; then $868,661 × 8%/2 × 3/6 = $17,373.
- id: D
  text: $55,511
  rationale: 'Uses the full $922,879 of proceeds as the bonds'' carrying amount. Part of the proceeds
    belongs to the detachable warrants: the bonds get $922,879 × $882,000/$942,000 = $864,097, and the
    rest is credited to additional paid-in capital.'
answer: C
explanation: 'Detachable warrants are accounted for separately, and with both fair values known the proceeds
  are allocated in proportion to them (ASC 470-20-25-2): bonds = $922,879 × $882,000/($882,000 + $60,000)
  = $864,097, with the remaining $58,782 credited to additional paid-in capital. The 8% effective rate
  applies to that $864,097 carrying amount. First period, April 1 to September 30: $864,097 × 8%/2 = $34,564,
  against $30,000 of cash interest, so the carrying amount rises by $4,564 to $868,661. Accrual for the
  3 months to December 31: $868,661 × 8%/2 × 3/6 = $17,373. Year 1 interest expense = $34,564 + $17,373
  = $51,937.'
