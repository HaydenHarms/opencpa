id: far-payables-reconciliation-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Payables and accrued liabilities
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 830-20-35-1 (foreign-currency payables remeasured at the current rate; transaction gains and losses
    in income)
  - ASC 405-10 (liabilities)
  - Subsidiary ledger and control account reconciliation practice (unreversed accruals; unposted invoices;
    unrecorded liabilities)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Year 2, Clovelly Engineering Co.''s accounts payable subledger totals $757,050,
  and its general ledger control account shows $736,250. The controller''s review finds: an invoice from
  a German contractor for €150,000 of repair work done in December, payable in euros in February, was
  recorded in both records at $1.08 per euro, the rate on the invoice date, and the rate at December 31
  is $1.11; a $26,800 accrual for consulting services received in December, Year 1, recorded by a general
  ledger journal entry at December 31, Year 1 (debit consulting expense, credit accounts payable), was
  never reversed, and the consultant''s invoice was then recorded as consulting expense through accounts
  payable in both records in January, Year 2; a $47,600 invoice for a delivery van received on December
  30 and placed in service in January was posted to the dealer''s subledger account but not to the general
  ledger; and an $11,850 invoice for advertising that ran in December was found in the unmatched-invoice
  file and has not been recorded in either record. By how much does Clovelly''s Year 2 pretax income change
  when these findings are corrected?'
choices:
- id: A
  text: $10,450 increase
  rationale: Correct. − $4,500 transaction loss + $26,800 duplicate expense − $11,850 advertising.
- id: B
  text: $14,950 increase
  rationale: Leaves the euro invoice at the invoice-date rate. A payable in a foreign currency is remeasured
    at the year-end rate; the euro rose, so the payable grows by $4,500, a transaction loss.
- id: C
  text: $16,350 decrease
  rationale: Ignores the unreversed accrual. Because the Year 1 accrual stayed in the control account,
    recording the invoice in Year 2 charged consulting expense a second time; removing it raises Year
    2 income by $26,800.
- id: D
  text: $37,150 decrease
  rationale: Charges the $47,600 van to expense. The van is equipment; recording its invoice in the general
    ledger adds an asset and a payable, and it wasn't in service in Year 2, so no depreciation is due.
answer: A
explanation: 'The euro payable is remeasured at the year-end rate: €150,000 × ($1.11 − $1.08) = $4,500
  more owed, a foreign-currency transaction loss (ASC 830-20-35-1), in both records. The unreversed accrual
  left the Year 1 liability in the control account, so the January invoice charged consulting expense
  twice; removing the duplicate cuts Year 2 expense and the control account by $26,800. The van invoice
  is added to the control account with the van as equipment; no expense arises in Year 2. The advertising
  invoice is a Year 2 expense and payable in both records: − $11,850. Pretax income changes by − $4,500
  + $26,800 − $11,850 = $10,450 increase.'
