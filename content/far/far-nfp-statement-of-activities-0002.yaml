id: far-nfp-statement-of-activities-0002
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of activities (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-205 (endowment net assets; releases from restrictions)
  - ASC 958-225 (statement of activities; special events)
  - ASC 958-320 (investment return)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Alderbrook Food Bank, a not-for-profit entity, reports an increase in net assets without donor
  restrictions of $315,000 in its draft Year 1 statement of activities. The controller identifies these
  errors: (1) investment return of $42,000 on a donor-restricted endowment, whose donor requires the return
  to be spent on scholarships, is reported as revenue without donor restrictions, and none of the return
  has been appropriated for spending; (2) scholarships of $28,000 paid from donor-restricted scholarship
  gifts received in earlier years are reported as expenses, but no release from restrictions was recorded;
  (3) revenue from the annual gala is reported as $65,000, net of the $31,000 cost of the dinners served
  to attendees, instead of reporting the $96,000 gross and the cost of direct benefits to donors separately;
  and (4) a $17,000 unrealized loss on investments without donor restrictions was not recorded. What increase
  in net assets without donor restrictions should Alderbrook''s corrected statement of activities report?'
choices:
- id: A
  text: $253,000
  rationale: Subtracts the $31,000 cost of the dinners again. Reporting the gala gross raises revenue
    and expense by the same amount, so the change in net assets doesn't change.
- id: B
  text: $256,000
  rationale: Records no release for the $28,000 of scholarships. The expense is reported in net assets
    without donor restrictions, and meeting the donor's purpose releases the same amount from net assets
    with donor restrictions.
- id: C
  text: $284,000
  rationale: Correct. $315,000 − $42,000 endowment return + $28,000 release − $17,000 unrealized loss.
- id: D
  text: $301,000
  rationale: Leaves out the $17,000 unrealized loss. Investment return, including unrealized losses on
    investments without donor restrictions, is reported in the statement of activities.
answer: C
explanation: '(1) Return on a donor-restricted endowment stays in net assets with donor restrictions until
  appropriated: − $42,000. (2) The scholarships are expenses of net assets without donor restrictions,
  and spending on the donor''s purpose releases $28,000 into that class: + $28,000. (3) Presenting the
  gala gross adds $31,000 to both revenue and expenses, with no effect on the change in net assets. (4)
  The unrealized loss is investment return without donor restrictions: − $17,000. $315,000 − $42,000 +
  $28,000 − $17,000 = $284,000.'
