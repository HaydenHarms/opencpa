  references:
  - 'SEC Form 10-Q (quarterly report: condensed, unaudited interim financial statements)'
  - SEC Form 8-K (current report of specified events, not a periodic quarterly filing)
  notes: Batch 14. Written from scratch; answers solved and every number and distractor computed in code.
stem: A newly public company's controller is planning next year's SEC filing calendar. Which statement
  correctly describes one of Form 10-K, Form 10-Q or Form 8-K?
choices:
- id: A
  text: Form 10-Q's interim statements, for the first three fiscal quarters, need not be audited
  rationale: Correct. Form 10-Q is filed after each of the first three fiscal quarters and presents condensed
    interim financial statements that need not be audited.
- id: B
  text: Form 10-K's financial statements may be unaudited if the audit committee has reviewed them
  rationale: Form 10-K's annual financial statements must be audited by an independent registered public
    accounting firm; a review by the audit committee is not a substitute.
- id: C
  text: Form 8-K is filed on a quarterly schedule to update the registrant's management's discussion and
    analysis
  rationale: Form 8-K is an event-driven current report, filed when specified events occur, not on a quarterly
    schedule; MD&A updates between periodic reports are not its purpose.
- id: D
  text: Form 10-Q must be filed for the registrant's fourth fiscal quarter, covering the full fiscal year's
    results
  rationale: No Form 10-Q is filed for the fourth quarter; the full year's results are reported on the
    annual Form 10-K instead.
answer: A
explanation: Form 10-Q is the quarterly report, filed after each of a registrant's first three fiscal
  quarters, and its interim financial statements are condensed and need not be audited. Form 10-K is the
  annual report, with audited financial statements, and covers the full fiscal year, including what would
  otherwise be a fourth quarter. Form 8-K is a current report filed when specified events occur between
  periodic reports, not on a recurring schedule.
