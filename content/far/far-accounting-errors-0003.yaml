id: far-accounting-errors-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 250-10 (correction of an error in previously issued statements)
  notes: Batch 04. Written from scratch; answers solved and every number and distractor computed in code.
stem: In Year 1, Toft Co. capitalized $60,000 of routine repair costs as equipment and recorded $12,000
  of depreciation on it (5-year life). Before closing its Year 2 books, Toft discovers the error; it has
  already recorded another $12,000 of Year 2 depreciation on the capitalized amount. Toft's tax rate is
  25% for all effects, and it presents single-year statements. What are the effects of correcting the
  error?
choices:
- id: A
  text: $36,000 decrease to January 1, Year 2, retained earnings; $0 change to Year 2 net income
  rationale: Gets the prior-period adjustment right but leaves the $12,000 of Year 2 depreciation on the
    repairs in Year 2 expense.
- id: B
  text: $36,000 decrease to January 1, Year 2, retained earnings; $9,000 increase to Year 2 net income
  rationale: Correct. Year 1 was overstated by ($60,000 − $12,000) × 75%; reversing Year 2's $12,000 of
    depreciation raises Year 2 income by $9,000.
- id: C
  text: $45,000 decrease to January 1, Year 2, retained earnings; $0 change to Year 2 net income
  rationale: Ignores the Year 1 depreciation already recorded; the prior-period effect is net of it.
- id: D
  text: $48,000 decrease to January 1, Year 2, retained earnings; $12,000 increase to Year 2 net income
  rationale: Leaves out the 25% tax effect on both amounts.
answer: B
explanation: The repairs should have been expensed in Year 1. Year 1 income was overstated by $60,000
  − $12,000 = $48,000 before tax, $36,000 after tax, so January 1, Year 2, retained earnings is reduced
  by $36,000 as a prior-period adjustment. The $12,000 of Year 2 depreciation on the capitalized repairs
  is reversed, raising Year 2 pretax income by $12,000 and net income by $9,000.
