id: far-notes-0008
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Notes to financial statements
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 842-20-50 (lessee disclosures: maturity analysis of lease liabilities)'
  - ASC 842-20-25-2 (short-term lease election)
  - ASC 842-10-30-5 (lease payments exclude variable payments that depend on sales)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Torridon Retail Co.''s draft notes to its December 31, Year 1, financial statements include a maturity
  analysis of its operating lease liabilities, which reports total undiscounted lease payments of $1,072,813.
  The controller identifies these errors and omissions: (1) the total includes $27,000 of remaining payments
  on a ten-month equipment lease that began in September, Year 1, for which Torridon made the short-term
  lease election; (2) for its warehouse lease, which requires 4 more annual payments of $120,000 each
  December 31, the analysis lists the warehouse lease liability of $415,813 instead of the payments; (3)
  the analysis omits a store lease, classified as an operating lease, that began on December 1, Year 1,
  with 60 monthly payments of $6,500, the first paid on December 1; and (4) the total includes $18,000
  of estimated Year 2 rent that the store lease bases on a percentage of the store''s sales. What total
  undiscounted lease payments should the corrected maturity analysis report?'
choices:
- id: A
  text: $1,092,000
  rationale: Leaves out the store lease. It began on December 1, so its 59 remaining payments, $383,500,
    are part of the lease liabilities at year-end.
- id: B
  text: $1,411,313
  rationale: Keeps the warehouse lease at its $415,813 present value. The maturity analysis shows undiscounted
    payments, 4 × $120,000 = $480,000, and then reconciles them to the discounted lease liabilities.
- id: C
  text: $1,475,500
  rationale: Correct. $1,072,813 − $27,000 − $415,813 + $480,000 + $383,500 − $18,000.
- id: D
  text: $1,482,000
  rationale: Includes all 60 store payments, $390,000. The December 1 payment has been made, so 59 payments
    of $6,500, $383,500, remain.
answer: C
explanation: 'The maturity analysis of lease liabilities shows the undiscounted lease payments behind
  the recognized liabilities. (1) Leases under the short-term lease election have no lease liability,
  so their payments come out: − $27,000. (2) The warehouse lease belongs at its undiscounted payments,
  4 × $120,000 = $480,000, not its $415,813 present value. (3) The store lease commenced on December 1,
  so its 59 remaining payments are added: 59 × $6,500 = $383,500. (4) Variable payments based on sales
  are not lease payments: − $18,000. Corrected total = $1,072,813 − $27,000 − $415,813 + $480,000 + $383,500
  − $18,000 = $1,475,500.'
