id: far-nfp-cash-flows-0003
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 958-230 (NFP statement of cash flows: restricted contributions as financing)'
  - ASC 230-10 (indirect method; noncash activities)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Pine Ridge Shelter, a not-for-profit entity, prepares its statement of cash flows using the indirect
  method. Its draft reports net cash provided by operating activities of $710,000. The reconciliation
  starts with the change in total net assets, which includes: a $150,000 cash gift that the donor requires
  Pine to hold in perpetuity, which the draft leaves in operating activities; a $25,000 gain on the sale
  of investments, which the draft reconciliation adds to the change in net assets; land donated to Pine,
  with a fair value of $100,000, for which the draft reconciliation makes no adjustment; and $180,000
  of cash contributions without donor restrictions. After correcting the draft, what is Pine''s net cash
  provided by operating activities?'
choices:
- id: A
  text: $230,000
  rationale: Also moves the $180,000 of unrestricted contributions to financing activities. Only contributions
    restricted to long-term purposes are financing inflows.
- id: B
  text: $410,000
  rationale: Correct. $710,000 − $150,000 endowment gift − 2 × $25,000 gain − $100,000 donated land.
- id: C
  text: $435,000
  rationale: Removes the $25,000 gain from the reconciliation but doesn't subtract it. A gain on sale
    is subtracted from the change in net assets; the proceeds are an investing inflow.
- id: D
  text: $560,000
  rationale: Leaves the $150,000 endowment gift in operating activities. Cash contributions restricted
    to endowment are financing activities.
answer: B
explanation: 'The endowment gift is a financing inflow, so it comes out of operating activities: − $150,000.
  The gain was added instead of subtracted, so correcting it takes out twice the gain: − $50,000. The
  donated land is a noncash contribution, subtracted in the reconciliation: − $100,000. Unrestricted contributions
  stay in operating activities. $710,000 − $150,000 − $50,000 − $100,000 = $410,000.'
