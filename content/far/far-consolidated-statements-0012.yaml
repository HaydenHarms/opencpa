id: far-consolidated-statements-0012
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Consolidated financial statements
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 810-10-45-20 (unrealized intercompany profit eliminated before allocating subsidiary income between
    the parent and the noncontrolling interest)
  - ASC 810-10-45-1 (intercompany dividends eliminated in consolidation)
  - ASC 810-10-45-16 (allocating net income between the controlling and noncontrolling interests)
  notes: Batch 14. Written from scratch; answers solved and every number and distractor computed in code.
stem: Allendale Corp. owns 90% of Blanchland Inc.'s voting stock, acquired in an earlier year; Allendale
  Corp. does not use the equity method on its own books. For Year 2, Allendale Corp. reports net income
  from its own operations, including $36,000 of dividend income it received from Blanchland Inc., of $500,000;
  Blanchland Inc. reports net income of $300,000. During Year 2, Blanchland Inc. sold goods to Allendale
  Corp. for $120,000 that cost Blanchland Inc. $80,000, and Allendale Corp. still held 25% of those goods
  at year-end. Blanchland Inc. also sold equipment to Allendale Corp. in an earlier year at a gain, and
  Year 2 is the first year in which Allendale Corp.'s depreciation on that equipment, based on its cost
  to Allendale Corp., exceeds what consolidated depreciation should be (based on Blanchland Inc.'s original
  cost) by $8,000. What net income is attributable to Allendale's shareholders for Year 2?
choices:
- id: A
  text: $732,200
  rationale: Correct. $500,000 − $36,000 + 90% × ($300,000 − $10,000 + $8,000).
- id: B
  text: $741,200
  rationale: Leaves the $10,000 of unrealized profit on Blanchland Inc.'s upstream sale in Blanchland
    Inc.'s income before allocating it. The unrealized profit must be removed before splitting Blanchland
    Inc.'s income between Allendale and the noncontrolling interest.
- id: C
  text: $762,000
  rationale: Treats all of Blanchland Inc.'s adjusted income as Allendale's, allocating none of it to
    the 10% noncontrolling interest.
- id: D
  text: $768,200
  rationale: Keeps the $36,000 of dividend income Allendale recorded from Blanchland Inc.. An intercompany
    dividend is eliminated entirely against the investment account; it isn't part of either company's
    income in the consolidated statements.
answer: A
explanation: The $36,000 of intercompany dividend income is eliminated entirely; it isn't consolidated
  income. Blanchland Inc.'s income is reduced by the $10,000 unrealized profit on its upstream sale ($40,000
  gross profit × 25% unsold) and increased by the $8,000 of excess depreciation being eliminated this
  year, both before the income is split 90/10. Net income attributable to Allendale's shareholders = $500,000
  − $36,000 + 90% × ($300,000 − $10,000 + $8,000) = $732,200.
