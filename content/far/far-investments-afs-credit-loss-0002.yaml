id: far-investments-afs-credit-loss-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments (Financial assets at fair value)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 326-30 (credit losses on available-for-sale debt securities)
  notes: Batch 01, revision 3 (2026 blueprint scope, four choices, Analysis items in the blueprint's task
    frames). Answers re-solved and every number and distractor computed in code.
stem: Foxworth Inc. holds available-for-sale debt securities whose amortized cost was $100,000 at the
  end of both Year 1 and Year 2. At the end of Year 1, Foxworth recorded a $2,000 allowance for credit
  losses on them. At the end of Year 2, their fair value is $88,000, and the present value of the cash
  flows Foxworth expects to collect, discounted at the securities' effective interest rate, is $93,000.
  Foxworth does not intend to sell the securities, and it is not more likely than not that it will be
  required to sell them before recovering their amortized cost. What credit loss expense should Foxworth
  recognize in net income for Year 2?
choices:
- id: A
  text: $5,000
  rationale: Correct. The allowance must be $7,000 ($100,000 − $93,000); it already holds $2,000, so Year
    2 expense is $5,000.
- id: B
  text: $7,000
  rationale: Records the full credit loss as this year's expense and ignores the $2,000 already in the
    allowance.
- id: C
  text: $10,000
  rationale: Treats the whole $12,000 decline below amortized cost as a credit loss, less the existing
    allowance. The $5,000 of the decline not explained by expected cash flows goes to OCI.
- id: D
  text: $12,000
  rationale: Recognizes the whole decline in earnings, as if the securities were trading, and ignores
    the existing allowance.
answer: A
explanation: 'For an AFS debt security the holder neither intends nor is likely to be required to sell,
  the credit loss is amortized cost minus the present value of expected cash flows, limited to the amount
  by which fair value is below amortized cost: $100,000 − $93,000 = $7,000, within the $12,000 limit.
  The allowance is adjusted from $2,000 to $7,000, so Year 2 credit loss expense is $5,000. The remaining
  $5,000 of the decline ($12,000 − $7,000) is reported in other comprehensive income.'
