id: far-accounting-errors-0005
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 250-10 (change in accounting estimate effected by a change in accounting principle)
  - ASC 360-10 (depreciation)
  notes: Batch 07. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'On January 1, Year 1, Brisco Manufacturing bought a machine for $1,280,000, with an 8-year life
  and no salvage value, and depreciated it by the double-declining-balance method. On January 1, Year
  4, Brisco switched to the straight-line method for the machine because it better reflects how the machine''s
  benefits are now being consumed; the life and salvage value estimates are unchanged. Brisco''s draft
  Year 4 statement of retained earnings shows: January 1 balance as originally reported, $3,450,000; cumulative
  effect of change in depreciation method, net of tax, $195,000 (an increase); net income, $610,000; dividends,
  $180,000; December 31 balance, $4,075,000. Draft net income includes Year 4 depreciation on the machine
  of $160,000. Brisco''s tax rate is 25% for all effects. What December 31, Year 4, retained earnings
  should Brisco report?'
choices:
- id: A
  text: $3,880,000
  rationale: 'Removes the $195,000 cumulative-effect adjustment but keeps Year 4 depreciation of $160,000.
    Prospectively, the $540,000 book value at January 1, Year 4, is depreciated over the 5 remaining years:
    $108,000.'
- id: B
  text: $3,898,750
  rationale: Removes the adjustment but keeps double-declining-balance depreciation ($135,000) for Year
    4. The new straight-line method applies from January 1, Year 4.
- id: C
  text: $3,919,000
  rationale: Correct. $4,075,000 − $195,000 cumulative-effect adjustment + $39,000 after-tax reduction
    in Year 4 depreciation.
- id: D
  text: $3,932,000
  rationale: Removes the adjustment and recomputes Year 4 depreciation, but adds back the full $52,000
    reduction in depreciation. Lower depreciation raises income tax expense at 25%, so net income rises
    by only $39,000.
answer: C
explanation: 'A change in depreciation method is a change in accounting estimate effected by a change
  in accounting principle, so it is applied prospectively: no cumulative-effect adjustment, and no restatement.
  Book value at January 1, Year 4: $1,280,000 less three years of double-declining-balance depreciation
  ($740,000) = $540,000. Year 4 straight-line depreciation = $540,000 ÷ 5 remaining years = $108,000,
  not $160,000. Corrections to the draft: remove the $195,000 adjustment, and raise net income by ($160,000
  − $108,000) × (1 − 25%) = $39,000. $4,075,000 − $195,000 + $39,000 = $3,919,000.'
