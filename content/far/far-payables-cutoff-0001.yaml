id: far-payables-cutoff-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Payables and accrued liabilities
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 405-10 (liabilities)
  - ASC 330-10 (goods in transit)
  notes: Batch 05. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Kirk Co.''s draft December 31, Year 1, balance sheet reports accounts payable of $620,000; Kirk
  records all vendor bills, including utilities, in accounts payable. Searching for unrecorded liabilities,
  you examine January, Year 2, payments and invoices and find: (1) a $21,000 invoice for goods shipped
  FOB shipping point on December 22 and received December 29, not recorded until January; (2) a $9,000
  bill for December utilities, received and recorded in January; (3) a $25,000 invoice for goods shipped
  FOB destination on December 30 and received January 4; and (4) a $12,000 December supplier invoice that
  was entered twice in December. What amount should Kirk report as accounts payable at December 31, Year
  1?'
choices:
- id: A
  text: $608,000
  rationale: Removes the duplicate invoice but adds neither of the unrecorded December liabilities.
- id: B
  text: $629,000
  rationale: Adds the $21,000 of goods and removes the duplicate but omits the $9,000 of December utilities,
    a Year 1 liability.
- id: C
  text: $638,000
  rationale: Correct. $620,000 + $21,000 + $9,000 − $12,000. The FOB destination goods became Kirk's in
    January.
- id: D
  text: $663,000
  rationale: Also adds the $25,000 of goods shipped FOB destination. Title passed when they arrived in
    January, so they are a Year 2 purchase.
answer: C
explanation: 'Record the Year 1 liabilities found in the search: goods received in December ($21,000;
  title passed at shipment in any case) and December utilities ($9,000). Remove the duplicated $12,000
  invoice. Goods shipped FOB destination belong to the seller until they arrive, so the $25,000 is a Year
  2 purchase. Accounts payable = $620,000 + $21,000 + $9,000 − $12,000 = $638,000.'
