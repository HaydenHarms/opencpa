id: far-changes-in-equity-0001
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of changes in equity
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 505-20 (stock dividends)
  - ASC 505-30 (treasury stock)
  - ASC 250-10 (correction of an error in previously issued statements)
  notes: Batch 02. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Pruitt Inc.''s draft Year 2 statement of changes in equity reports ending retained earnings of
  $1,280,000, computed as beginning retained earnings of $1,000,000 (as previously reported), plus net
  income of $420,000, less cash dividends of $60,000, less a $10,000 stock dividend, less $70,000 for
  treasury stock. Supporting documents show: (1) the stock dividend was 10,000 shares of $1 par common
  stock (10% of the shares outstanding), distributed when the market price was $15 per share; (2) Pruitt
  paid $70,000 to reacquire its own shares and holds them in treasury under the cost method; and (3) in
  Year 2 Pruitt discovered that it had omitted $40,000 of depreciation in Year 1, an error with an after-tax
  effect of $30,000. Year 2 net income is correct. What is Pruitt''s corrected ending retained earnings
  for Year 2?'
choices:
- id: A
  text: $1,110,000
  rationale: Fixes the stock dividend and the prior-period error but still charges the treasury stock
    purchase to retained earnings. Under the cost method, treasury stock is a separate deduction from
    total equity.
- id: B
  text: $1,180,000
  rationale: Correct. $1,000,000 − $30,000 prior-period adjustment + $420,000 − $60,000 − $150,000 stock
    dividend at market value.
- id: C
  text: $1,210,000
  rationale: Omits the prior-period adjustment. The Year 1 error is corrected by restating beginning retained
    earnings, net of tax.
- id: D
  text: $1,320,000
  rationale: Records the stock dividend at par. A distribution of less than 20–25% of the shares outstanding
    is recorded at the shares' market value.
answer: B
explanation: '(1) A stock dividend of 10% is small, so retained earnings is charged at market value: 10,000
  × $15 = $150,000, not the $10,000 par. (2) Treasury stock under the cost method is shown as a deduction
  from total equity; buying it does not reduce retained earnings. (3) The omitted Year 1 depreciation
  is a prior-period error, corrected by reducing beginning retained earnings by its after-tax effect of
  $30,000. Corrected ending retained earnings = $1,000,000 − $30,000 + $420,000 − $60,000 − $150,000 =
  $1,180,000.'
