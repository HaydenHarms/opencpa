id: far-revenue-contract-costs-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: reviewed
  references:
  - ASC 340-40-25-1 to 25-4 (incremental costs of obtaining a contract)
  - ASC 340-40-25-5 to 25-8 (costs to fulfill a contract; wasted resources expensed)
  - ASC 340-40-35-1 (amortization consistent with the transfer of the goods or services, including anticipated
    contracts)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: On February 20, Year 1, Perranporth Systems Co. signed a five-year contract to host and support
  a customer's online ordering system, with services running from April 1, Year 1; Perranporth expects
  the customer to renew once, for three more years. Perranporth paid its salesperson a $96,000 commission
  owed only because the contract was signed, and will pay the salesperson a commission at the same rate
  on the renewal fees if the customer renews. Perranporth's sales director earned a $12,000 bonus based
  on the region's total sales for the quarter. Before services began, Perranporth spent $220,800 setting
  up the customer's platform, costs that relate directly to the contract, create resources Perranporth
  will use to serve the customer for as long as it remains a customer, and are expected to be recovered;
  $28,800 of that amount was for repeating a data migration that failed because of an error by Perranporth's
  staff, a cost not reflected in the contract price. Perranporth amortizes capitalized contract costs
  straight-line by month over the period to which they relate. What total contract cost assets should
  Perranporth report at December 31, Year 1?
choices:
- id: A
  text: $255,600
  rationale: Correct. Commission $96,000 × 51/60 + setup $192,000 × 87/96.
- id: B
  text: $261,000
  rationale: Amortizes the commission over the eight years Perranporth expects to serve the customer.
    Because the renewal will earn a commission at the same rate, the initial commission relates only to
    the five-year contract and is amortized over it; $14,400 is amortized in Year 1, not $9,000.
- id: C
  text: $265,800
  rationale: Capitalizes the sales director's $12,000 bonus with the commission and amortizes it over
    the same five years. A bonus based on total regional sales would have been earned without this contract,
    so it isn't an incremental cost of obtaining it.
- id: D
  text: $281,700
  rationale: Capitalizes the $28,800 cost of repeating the failed migration with the other setup costs,
    amortized over eight years. Costs of wasted labor and resources not reflected in the contract price
    are expensed as incurred.
answer: A
explanation: 'The commission is an incremental cost of obtaining the contract and is capitalized. The
  renewal commission is at the same rate, so it is commensurate with the initial one, and the initial
  commission is amortized over the five-year contract: $96,000 − $14,400 (9 months) = $81,600. The setup
  costs meet the criteria for capitalizing costs to fulfill a contract (ASC 340-40-25-5), except the $28,800
  of wasted labor, which is expensed (ASC 340-40-25-8). The $192,000 capitalized relates to services over
  the expected eight-year customer relationship: $192,000 − $18,000 = $174,000. The bonus based on total
  regional sales isn''t incremental to this contract and is expensed. Contract cost assets = $255,600.'
