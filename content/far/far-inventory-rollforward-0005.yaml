id: far-inventory-rollforward-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 330-10-30 (inventory cost: import duties; abnormal costs such as double freight expensed)'
  - ASC 330-10-35-1B (lower of cost and net realizable value for FIFO, as amended by ASU 2015-11)
  - 'ASC 606-10-25-30 (transfer of control: FOB shipping point)'
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Chacewater Imports Co., which uses FIFO and a perpetual inventory system, prepared this Year 2
  inventory rollforward from its perpetual records: January 1 balance $742,000; purchases $5,384,000;
  cost of goods sold ($5,291,000); December 31 balance $835,000. The controller''s review finds: customs
  duties of $26,400 paid on imported goods, all still on hand at December 31, were charged to expense;
  a supplier''s delivery went to the wrong city, and the $18,700 Chacewater paid to ship the goods a second
  time to its warehouse was added to their cost (the goods are on hand); goods costing $33,500, shipped
  by a supplier FOB shipping point on December 29 and received January 5, are not in the records; and
  the December 31 balance includes patio heaters costing $96,000, which Chacewater expects to sell for
  $88,000 after $7,200 of selling costs, whose current replacement cost is $64,500 and on which Chacewater''s
  normal profit margin is $11,000. What inventory should the corrected rollforward report at December
  31, Year 2?'
choices:
- id: A
  text: $827,500
  rationale: Leaves out the $33,500 of goods in transit. They were shipped FOB shipping point on December
    29, so Chacewater owned them at year-end.
- id: B
  text: $834,600
  rationale: Leaves the $26,400 of customs duties expensed. Import duties are part of the cost of acquiring
    the goods, and all the goods are still on hand.
- id: C
  text: $850,000
  rationale: Writes the patio heaters down to $69,800, net realizable value less the normal profit margin,
    the market floor under the lower of cost or market rule. A FIFO entity measures inventory at the lower
    of cost and net realizable value, $80,800, since ASU 2015-11.
- id: D
  text: $861,000
  rationale: Correct. $835,000 + $26,400 − $18,700 + $33,500 − $15,200.
answer: D
explanation: 'Duties are part of the cost of acquiring the goods (+ $26,400). Double freight is an abnormal
  cost, expensed (ASC 330-10-30-7) (− $18,700). Goods shipped FOB shipping point belong to Chacewater
  once shipped (+ $33,500). A FIFO entity measures inventory at the lower of cost and net realizable value:
  NRV = $88,000 − $7,200 = $80,800, so the patio heaters are written down by $96,000 − $80,800 = $15,200;
  replacement cost and the normal profit margin are irrelevant. Corrected inventory = $835,000 + $26,400
  − $18,700 + $33,500 − $15,200 = $861,000.'
