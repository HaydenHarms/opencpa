id: far-cash-bank-reconciliation-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 305-10 (cash)
  - Proof of cash (four-column bank reconciliation) practice
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Garnet Co. prepares a proof of cash for June. The bank statement shows June deposits and other credits
  of $85,000. Deposits in transit were $4,000 at May 31 and $6,500 at June 30. The June bank credits include
  $1,200 from a note receivable that the bank collected for Garnet, which Garnet hasn't recorded, and
  a $500 deposit of another company that the bank credited to Garnet's account in error. Garnet's cash
  receipts journal shows June receipts of $85,800. What are Garnet's correct cash receipts for June?
choices:
- id: A
  text: $82,000
  rationale: 'Reverses the deposit-in-transit adjustments: May''s deposit in transit is subtracted from
    June''s bank credits and June''s is added.'
- id: B
  text: $84,500
  rationale: Ignores the deposits in transit. May's $4,000 reached the bank in June but is a May receipt,
    and June's $6,500 is a June receipt the bank hasn't recorded.
- id: C
  text: $87,000
  rationale: Correct. $85,000 − $4,000 + $6,500 − $500, which equals $85,800 per books + $1,200 note collection.
- id: D
  text: $87,500
  rationale: Leaves in the $500 the bank credited in error. Another company's deposit is not Garnet's
    receipt.
answer: C
explanation: 'From the bank side: $85,000 of June credits − $4,000 May deposit in transit (a May receipt)
  + $6,500 June deposit in transit − $500 bank error = $87,000. From the book side: $85,800 recorded +
  $1,200 note collection not yet recorded = $87,000. The two sides agree.'
