review:
  status: reviewed
  references:
  - 'ASC 842-20 (lessee accounting: finance leases)'
  notes: Batch 01, revision 3 (2026 blueprint scope, four choices, Analysis items in the blueprint's task
    frames). Answers re-solved and every number and distractor computed in code.
stem: On January 1, Year 1, Reeves Corp. commences a 5-year finance lease. The lease liability at commencement
  is $200,000 (rounded), the annual payment of $50,000 is due each December 31, and the discount rate
  is 8%. The right-of-use asset is amortized straight-line over the lease term. What total lease-related
  expense does Reeves recognize in Year 2?
choices:
- id: A
  text: $40,000
  rationale: Includes only amortization. A finance lease also has interest expense.
- id: B
  text: $50,000
  rationale: Treats the cash payment as the expense.
- id: C
  text: $53,280
  rationale: Correct. Year 2 interest of $13,280 on a $166,000 opening liability, plus $40,000 of amortization.
- id: D
  text: $56,000
  rationale: Uses Year 1 interest ($16,000) without reducing the liability for the Year 1 principal payment.
answer: C
explanation: 'Year 1: interest $16,000, principal reduction $34,000, ending liability $166,000. Year 2:
  interest = $166,000 × 8% = $13,280. Amortization = $200,000 ÷ 5 = $40,000. Total Year 2 expense = $53,280.'
