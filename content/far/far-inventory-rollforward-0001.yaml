id: far-inventory-rollforward-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10 (inventory)
  notes: Batch 04. Written from scratch; answers solved and every number and distractor computed in code.
stem: Tobin Co. uses a perpetual inventory system. Its inventory rollforward for Year 1 shows beginning
  inventory of $120,000, purchases of $900,000 per the accounts payable subledger, purchase returns of
  $20,000, freight-in of $15,000, and cost of goods sold of $870,000 per the general ledger. A year-end
  physical count, priced at cost, totals $125,000. What inventory shrinkage should Tobin record?
choices:
- id: A
  text: $5,000
  rationale: Leaves the $15,000 of freight-in out of the rollforward. Freight-in is part of inventory
    cost.
- id: B
  text: $20,000
  rationale: Correct. Book inventory $120,000 + $900,000 − $20,000 + $15,000 − $870,000 = $145,000, less
    the $125,000 count.
- id: C
  text: $40,000
  rationale: Leaves the $20,000 of purchase returns out of the rollforward. Returned goods leave inventory.
- id: D
  text: $60,000
  rationale: Adds the purchase returns instead of subtracting them.
answer: B
explanation: Book (perpetual) inventory = beginning $120,000 + purchases $900,000 − returns $20,000 +
  freight-in $15,000 − cost of goods sold $870,000 = $145,000. The count shows $125,000, so $20,000 of
  inventory is missing and is recorded as shrinkage (usually in cost of goods sold).
