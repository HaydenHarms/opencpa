id: far-income-taxes-provision-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: reviewed
  references:
  - ASC 740-10 (deferred tax liabilities)
  - 'ASC 740-20 (intraperiod tax allocation: tax effects of items in other comprehensive income)'
  - ASC 320-10 (available-for-sale debt securities)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Pendle Corp. keeps separate deferred tax asset and deferred tax liability accounts and records
  all of its Year 2 income tax entries at December 31. The enacted tax rate is 21% for all years, and
  Pendle expects ample future taxable income. Its temporary differences were: cumulative tax depreciation
  in excess of book depreciation, $300,000 at January 1, Year 2, and $380,000 at December 31; unrealized
  holding gains on available-for-sale debt securities, which are taxed when the securities are sold, $40,000
  at January 1 and $100,000 at December 31; and accrued compensation that is deductible when paid, $50,000
  at January 1 and $70,000 at December 31. What total amount should Pendle credit to the deferred tax
  liability account for Year 2?'
choices:
- id: A
  text: $16,800
  rationale: Records only the deferred tax on depreciation. The $12,600 tax effect of the Year 2 unrealized
    gain on the available-for-sale securities is also credited to the deferred tax liability, with the
    debit to other comprehensive income.
- id: B
  text: $29,400
  rationale: Correct. ($380,000 − $300,000) × 21% + ($100,000 − $40,000) × 21%.
- id: C
  text: $37,800
  rationale: Records deferred tax on the whole $100,000 of December 31 unrealized gains. $40,000 of those
    gains arose before Year 2 and was tax-effected then.
- id: D
  text: $100,800
  rationale: Credits the whole December 31 liability. Only the change during Year 2 is recorded; the January
    1 balance is already on the books.
answer: B
explanation: 'Both taxable temporary differences grew during Year 2, and each increase is recorded in
  the deferred tax liability account. Depreciation: ($380,000 − $300,000) × 21% = $16,800, charged to
  deferred tax expense. Unrealized gains: ($100,000 − $40,000) × 21% = $12,600, charged to other comprehensive
  income, where the gain itself is reported (intraperiod tax allocation). Total credit = $29,400. The
  $4,200 increase in the deferred tax asset on accrued compensation is recorded in the separate asset
  account.'
