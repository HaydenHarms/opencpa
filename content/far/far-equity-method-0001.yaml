id: far-equity-method-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments (Equity method investments)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 323-10 (equity method investments)
  notes: Batch 01, revision 3 (2026 blueprint scope, four choices, Analysis items in the blueprint's task
    frames). Answers re-solved and every number and distractor computed in code.
stem: On January 1, Year 1, Pillar Corp. pays $1,500,000 for 30% of the common stock of Quarry Inc. and
  can significantly influence Quarry's operating decisions. Quarry's net assets have a book value of $4,000,000.
  Quarry's equipment, which has a 4-year remaining life and is depreciated straight-line, has a fair value
  $400,000 above its book value, and no other asset or liability has a fair value that differs from book
  value. For the year, Quarry reports net income of $600,000 and pays dividends of $200,000. During Year
  1, Pillar sold inventory to Quarry at a profit of $100,000. Quarry resold 60% of that inventory to outsiders
  during the year and holds the rest at year-end. Ignore income taxes, and assume Pillar has not elected
  the fair value option. What is the carrying amount of Pillar's investment in Quarry at December 31,
  Year 1?
choices:
- id: A
  text: $1,550,000
  rationale: Eliminates 100% of the unrealized profit ($40,000). Pillar eliminates only its 30% share
    ($12,000).
- id: B
  text: $1,578,000
  rationale: Correct. $1,500,000 + $180,000 share of income − $60,000 dividends − $30,000 equipment amortization
    − $12,000 unrealized profit.
- id: C
  text: $1,590,000
  rationale: Does not eliminate any of the unrealized profit on the inventory Quarry still holds.
- id: D
  text: $1,608,000
  rationale: Omits the $30,000 amortization of the equipment's basis difference.
answer: B
explanation: Excess of cost over share of book value = $1,500,000 − (30% × $4,000,000) = $300,000. Of
  that, 30% × $400,000 = $120,000 relates to the equipment (amortized over 4 years, $30,000 a year) and
  $180,000 is goodwill (not amortized). Carrying amount = $1,500,000 + 30% × $600,000 ($180,000) − 30%
  × $200,000 ($60,000 dividends) − $30,000 amortization − 30% × (40% × $100,000) = $12,000 unrealized
  profit = $1,578,000.
variants:
- stem: On January 1, Year 1, Rollins Corp. pays $2,400,000 for 25% of the common stock of Shasta Inc.
    and can significantly influence Shasta's operating decisions. Shasta's net assets have a book value
    of $8,000,000. Shasta's equipment, which has a 5-year remaining life and is depreciated straight-line,
    has a fair value $800,000 above its book value, and no other asset or liability has a fair value that
    differs from book value. For the year, Shasta reports net income of $1,000,000 and pays dividends
    of $400,000. During Year 1, Rollins sold inventory to Shasta at a profit of $160,000. Shasta resold
    75% of that inventory to outsiders during the year and holds the rest at year-end. Ignore income taxes,
    and assume Rollins has not elected the fair value option. What is the carrying amount of Rollins's
    investment in Shasta at December 31, Year 1?
  choices:
  - id: A
    text: $2,500,000
    rationale: Correct. $2,400,000 + $250,000 share of income − $100,000 dividends − $40,000 equipment
      amortization − $10,000 unrealized profit.
  - id: B
    text: $2,510,000
    rationale: Does not eliminate any of the unrealized profit on the inventory Shasta still holds.
  - id: C
    text: $2,540,000
    rationale: Omits the $40,000 amortization of the equipment's basis difference.
  - id: D
    text: $2,600,000
    rationale: Does not reduce the investment for Rollins's $100,000 share of dividends. Dividends from
      an equity-method investee are a return of the investment.
  answer: A
  explanation: Excess of cost over share of book value = $2,400,000 − (25% × $8,000,000) = $400,000. Of
    that, 25% × $800,000 = $200,000 relates to the equipment (amortized over 5 years, $40,000 a year)
    and $200,000 is goodwill (not amortized). Carrying amount = $2,400,000 + 25% × $1,000,000 ($250,000)
    − 25% × $400,000 ($100,000 dividends) − $40,000 amortization − 25% × (25% × $160,000) = $10,000 unrealized
    profit = $2,500,000.
- stem: On January 1, Year 1, Trent Corp. pays $900,000 for 20% of the common stock of Umpqua Inc. and
    can significantly influence Umpqua's operating decisions. Umpqua's net assets have a book value of
    $3,500,000. Umpqua's equipment, which has a 5-year remaining life and is depreciated straight-line,
    has a fair value $500,000 above its book value, and no other asset or liability has a fair value that
    differs from book value. For the year, Umpqua reports net income of $450,000 and pays dividends of
    $150,000. During Year 1, Trent sold inventory to Umpqua at a profit of $80,000. Umpqua resold 75%
    of that inventory to outsiders during the year and holds the rest at year-end. Ignore income taxes,
    and assume Trent has not elected the fair value option. What is the carrying amount of Trent's investment
    in Umpqua at December 31, Year 1?
  choices:
  - id: A
    text: $920,000
    rationale: Eliminates 100% of the unrealized profit ($20,000). Trent eliminates only its 20% share
      ($4,000).
  - id: B
    text: $928,000
    rationale: Eliminates 20% of the profit on the 75% Umpqua resold. That profit was realized in sales
      to outsiders; only the 25% still held is unrealized.
  - id: C
    text: $936,000
    rationale: Correct. $900,000 + $90,000 share of income − $30,000 dividends − $20,000 equipment amortization
      − $4,000 unrealized profit.
  - id: D
    text: $940,000
    rationale: Does not eliminate any of the unrealized profit on the inventory Umpqua still holds.
  answer: C
  explanation: Excess of cost over share of book value = $900,000 − (20% × $3,500,000) = $200,000. Of
    that, 20% × $500,000 = $100,000 relates to the equipment (amortized over 5 years, $20,000 a year)
    and $100,000 is goodwill (not amortized). Carrying amount = $900,000 + 20% × $450,000 ($90,000) −
    20% × $150,000 ($30,000 dividends) − $20,000 amortization − 20% × (25% × $80,000) = $4,000 unrealized
    profit = $936,000.
