    and $360,000 is goodwill (not amortized). Carrying amount = $3,000,000 + 40% × $900,000 ($360,000)
    − 40% × $300,000 ($120,000 dividends) − $40,000 amortization − 40% × (30% × $200,000) = $24,000 unrealized
