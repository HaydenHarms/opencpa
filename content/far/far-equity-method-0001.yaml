    from book value. For the year, Wasco reports net income of $900,000 and pays dividends of $300,000.
    During Year 1, Vinton sold inventory to Wasco at a profit of $200,000. Wasco resold 70% of that inventory
    to outsiders during the year and holds the rest at year-end. Ignore income taxes, and assume Vinton
    has not elected the fair value option. What is the carrying amount of Vinton's investment in Wasco
    at December 31, Year 1?
  choices:
  - id: A
    text: $3,140,000
    rationale: Eliminates 100% of the unrealized profit ($60,000). Vinton eliminates only its 40% share
      ($24,000).
  - id: B
    text: $3,176,000
    rationale: Correct. $3,000,000 + $360,000 share of income − $120,000 dividends − $40,000 equipment
      amortization − $24,000 unrealized profit.
  - id: C
    text: $3,200,000
    rationale: Does not eliminate any of the unrealized profit on the inventory Wasco still holds.
  - id: D
    text: $3,216,000
    rationale: Omits the $40,000 amortization of the equipment's basis difference.
  answer: B
  explanation: Excess of cost over share of book value = $3,000,000 − (40% × $6,000,000) = $600,000. Of
