id: far-inventory-rollforward-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10 (inventory cost; goods in transit and on consignment)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Tamsworth Co. uses a periodic inventory system. For Year 1, its records show beginning inventory
  of $180,000, purchases of $1,200,000 per the accounts payable subledger, freight-in of $25,000, and
  purchase returns of $40,000. The physical count, taken on the morning of December 31 and priced at cost,
  totals $210,000. Cutoff testing finds that: purchases include $30,000 of goods a supplier shipped FOB
  destination on December 30, which arrived January 5; goods costing $18,000 held by a consignee on Tamsworth''s
  behalf were not counted; and the count includes goods costing $12,000 that a customer''s carrier picked
  up that afternoon under FOB shipping point terms, recorded as a Year 1 sale. What is Tamsworth''s corrected
  cost of goods sold for Year 1?'
choices:
- id: A
  text: $1,107,000
  rationale: Leaves the $12,000 of goods sold FOB shipping point in ending inventory. Title passed to
    the customer when the carrier picked them up.
- id: B
  text: $1,119,000
  rationale: Correct. $180,000 + $1,170,000 + $25,000 − $40,000 − $216,000.
- id: C
  text: $1,137,000
  rationale: Leaves out the $18,000 of consigned goods, which Tamsworth still owns.
- id: D
  text: $1,149,000
  rationale: Leaves the $30,000 of goods in transit in purchases. Under FOB destination, title passes
    when the goods arrive in January.
answer: B
explanation: 'Purchases: $1,200,000 − $30,000 in transit under FOB destination = $1,170,000. Ending inventory:
  $210,000 + $18,000 on consignment − $12,000 sold and shipped = $216,000. Cost of goods sold = $180,000
  + $1,170,000 + $25,000 freight-in − $40,000 returns − $216,000 = $1,119,000.'
