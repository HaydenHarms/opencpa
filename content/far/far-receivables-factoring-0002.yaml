id: far-receivables-factoring-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Application
review:
  status: reviewed
  references:
  - ASC 860-10-40 (conditions for sale accounting)
  - ASC 860-20 (sales of financial assets; recourse obligations measured at fair value)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'On March 1, Year 1, Sedgwick Co. transfers $800,000 of trade receivables to a factor with recourse:
  Sedgwick must reimburse the factor for uncollectible accounts, up to $40,000. Legal counsel concludes
  that the receivables are beyond the reach of Sedgwick and its creditors, even in bankruptcy; the factor
  may sell or pledge them; and Sedgwick has no right or obligation to buy any of them back. The factor
  charges a fee of 3% of the receivables and holds back 10% of them to cover sales returns, payable to
  Sedgwick after the accounts are collected; Sedgwick expects no returns. The fair value of the recourse
  obligation is $14,000. What loss should Sedgwick recognize on the transfer?'
choices:
- id: A
  text: $0
  rationale: 'Treats the transfer as a secured borrowing because it is with recourse. Recourse doesn''t
    prevent sale accounting when Sedgwick has surrendered control: the receivables are isolated, the factor
    may sell or pledge them, and Sedgwick can''t reclaim them.'
- id: B
  text: $24,000
  rationale: Records only the $24,000 fee. The recourse obligation is a liability Sedgwick takes on in
    the sale, measured at its $14,000 fair value, which reduces the proceeds.
- id: C
  text: $38,000
  rationale: Correct. $24,000 fee + $14,000 recourse obligation.
- id: D
  text: $64,000
  rationale: Measures the recourse obligation at the $40,000 maximum. It is measured at its $14,000 fair
    value.
answer: C
explanation: Sedgwick has surrendered control (the receivables are legally isolated, the factor can pledge
  or sell them, and Sedgwick keeps no effective control), so the transfer is a sale even though it is
  with recourse. Proceeds are cash of $696,000 plus the $80,000 receivable from the factor, less the recourse
  obligation at its $14,000 fair value. Loss = $800,000 carrying amount − ($696,000 + $80,000 − $14,000)
  = $24,000 + $14,000 = $38,000.
