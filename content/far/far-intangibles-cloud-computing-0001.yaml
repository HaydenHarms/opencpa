id: far-intangibles-cloud-computing-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Intangible assets
  skill: Application
review:
  status: reviewed
  references:
  - ASC 350-40 (internal-use software; implementation costs of a hosting arrangement that is a service
    contract)
  - ASU 2018-15 (customer's accounting for implementation costs in a cloud computing arrangement)
  - ASU 2025-06 (targeted improvements to internal-use software; same result here)
  notes: 'Batch 01, revision 3 (2026 blueprint scope, four choices, Analysis items in the blueprint''s
    task frames). Answers re-solved and every number and distractor computed in code. Revision 4 (2026-10-05,
    batch 15 gate): the key now amortizes over the term remaining when the software is ready for use (54
    of 60 months), not a full five years from July 1.'
stem: 'On January 1, Year 1, Lark Co. signs a noncancellable 3-year contract, running from that date,
  to access a vendor''s cloud-hosted ERP software. Lark has no right to take possession of the software,
  and it is reasonably certain to exercise its option to renew the contract for 2 more years. Before the
  software became ready for its intended use on July 1, Year 1, Lark incurred these costs: $25,000 to
  evaluate vendors before selecting this one; $180,000 for configuration, coding, and testing of interfaces;
  $30,000 to convert and cleanse legacy data; and $20,000 to train employees. Lark amortizes capitalized
  costs straight-line. Excluding the hosting fees, what total expense should Lark recognize in Year 1
  related to these costs?'
choices:
- id: A
  text: $68,333
  rationale: Capitalizes the $30,000 of data conversion with the configuration costs ($25,000 + $20,000
    + $210,000 × 6/54). Data conversion costs are expensed as incurred.
- id: B
  text: $93,000
  rationale: Spreads the costs over a full 5 years starting July 1 ($180,000 ÷ 5 × ½), which runs six
    months past the end of the arrangement on December 31, Year 5. Only 54 months of the term remain when
    amortization begins.
- id: C
  text: $95,000
  rationale: Correct. $25,000 + $30,000 + $20,000 expensed as incurred, plus $180,000 × 6/54 months =
    $20,000 of amortization.
- id: D
  text: $111,000
  rationale: Amortizes over the 30 months left in the 3-year noncancellable term. The term includes renewal
    periods Lark is reasonably certain to exercise, so 54 months remain.
answer: C
explanation: 'A cloud computing arrangement without a right to take possession of the software is a service
  contract, and its implementation costs are capitalized or expensed as for internal-use software. Evaluating
  and selecting a vendor ($25,000) happens before the entity commits to a project, and data conversion
  ($30,000) and training ($20,000) are not costs of developing the software, so all three are expensed
  as incurred. (ASU 2025-06, which removes the project-stage model from ASC 350-40, does not change these
  conclusions.) Application-development costs (configuration, coding, and testing, $180,000) are capitalized
  and amortized straight-line over the term of the hosting arrangement, starting when the software is
  ready for its intended use. The term runs from January 1, Year 1, through the renewal Lark is reasonably
  certain to exercise (5 years in all, ending December 31, Year 5), so 54 months of it remain on July
  1: $180,000 × 6/54 = $20,000 for July through December. Total Year 1 expense: $25,000 + $30,000 + $20,000
  + $20,000 = $95,000.'
