id: far-investments-fair-value-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments (Financial assets at fair value)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 321-10-35 (equity securities at fair value)
  - ASC 320-10-35 (trading and available-for-sale debt securities at fair value)
  - 'ASC 326-30 (credit losses on available-for-sale debt securities: allowance)'
  - ASC 825-10-25 (fair value option, including for investments otherwise accounted for by the equity
    method)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Year 2, Helmsdale Corp. holds these investments, all bought during Year 2: 4% of
  the common shares of Brora Mills, a listed company, which cost $210,000 and are worth $246,000; debt
  securities that Helmsdale holds to collect interest but may sell if it needs cash or interest rates
  change, with an amortized cost of $500,000 and a fair value of $462,000, on which Helmsdale estimates
  an expected credit loss of $14,000 and which it neither intends to sell nor is likely to be required
  to sell before recovery; corporate bonds that its trading desk bought in December to resell within weeks,
  which cost $180,000 and are worth $171,500; and 25% of the common shares of Golspie Foods, a listed
  company over which Helmsdale has significant influence, for which Helmsdale elected the fair value option
  when it bought them for $1,350,000. Helmsdale''s share of Golspie''s net income since then is $180,000,
  Helmsdale has received dividends of $60,000 from it, and the shares are worth $1,412,000. What total
  carrying amount should Helmsdale report for these investments?'
choices:
- id: A
  text: $2,255,500
  rationale: Reports the Brora shares at their $210,000 cost. Equity securities with readily determinable
    fair values are measured at fair value, with changes in net income.
- id: B
  text: $2,277,500
  rationale: Deducts the $14,000 credit loss allowance from the debt securities' $462,000 fair value.
    Debt securities that may be sold before maturity are reported at fair value; the allowance and the
    unrealized loss in OCI together bridge amortized cost ($500,000) to fair value.
- id: C
  text: $2,291,500
  rationale: Correct. $246,000 + $462,000 + $171,500 + $1,412,000.
- id: D
  text: $2,349,500
  rationale: Reports the Golspie shares by the equity method, $1,350,000 + $180,000 − $60,000 = $1,470,000.
    Helmsdale elected the fair value option for this investment, so it is reported at fair value.
answer: C
explanation: All four are carried at fair value. The listed shares ($246,000) are equity securities with
  readily determinable fair values. The debt securities that may be sold are available for sale, reported
  at fair value ($462,000); the $14,000 credit loss is recorded through an allowance and net income, and
  the rest of the decline below amortized cost is in OCI, but the balance sheet amount is fair value.
  The bonds held for resale within weeks are trading securities at fair value ($171,500). The Golspie
  shares would otherwise be under the equity method, but Helmsdale elected the fair value option, so they
  are at fair value ($1,412,000). Total = $2,291,500.
