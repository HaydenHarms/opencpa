id: far-contingencies-0018
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 460-10-25 and 30 (guarantees recognized at inception fair value regardless of the likelihood of
    payment)
  - ASC 450-20-50 (disclosure of a loss contingency that cannot be estimated)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Minutes of Marrowfield Industries Co.'s board meeting on November 14 record two matters. First,
  directors discussed a patent-infringement suit a competitor filed against Marrowfield; the minutes note
  counsel's statement that defending the suit will be costly and that, at this stage, counsel cannot assess
  how the case is likely to come out or size any exposure. Second, the minutes record the board's approval,
  that same day and for a separate fee paid by Dunscar Co., an unrelated company, of Marrowfield's guarantee
  of Dunscar Co.'s $400,000 bank loan; Marrowfield's treasury staff estimated the guarantee's fair value
  at inception at $14,000, based on market rates for comparable guarantees. At year-end, a credit report
  in Marrowfield's files shows Dunscar Co. current on every loan payment and carrying an investment-grade
  rating. What liability should Marrowfield report at year-end for these two matters?
choices:
- id: A
  text: $0
  rationale: Records no liability for the guarantee, because Dunscar Co. is still current on its payments.
    A guarantee is recognized at its inception fair value when issued, regardless of whether a claim under
    it is likely.
- id: B
  text: $14,000
  rationale: Correct. Only the guarantee's $14,000 inception fair value is recognized.
- id: C
  text: $264,000
  rationale: Adds $250,000 for the patent suit. The minutes record only that defense costs will be substantial
    and that the board's own counsel could not yet size the exposure; with no estimate counsel will stand
    behind, nothing is accrued.
- id: D
  text: $400,000
  rationale: Uses the full $400,000 balance of the guaranteed loan. Marrowfield records the guarantee
    at its $14,000 inception fair value, not the amount it would have to pay only if Dunscar Co. defaulted.
answer: B
explanation: 'A guarantee is recognized at its fair value when issued (ASC 460-10-25 and 30), regardless
  of the likelihood that the guarantor will have to pay: Marrowfield recognizes the $14,000 inception
  fair value as a liability (with an offsetting asset or expense, depending on what Marrowfield received
  for giving it), and continues to carry it until the guarantee expires or Dunscar Co.''s performance
  is assessed under the contingency guidance. Dunscar Co.''s current payment history doesn''t change that
  initial recognition. The patent suit has no estimate counsel will support, so nothing is accrued for
  it; Marrowfield discloses its existence.'
