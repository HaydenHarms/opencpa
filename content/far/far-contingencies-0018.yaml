id: far-contingencies-0018
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Analysis
review:
  status: draft
  references:
  - ASC 450-20-25-2 and 450-20-50-6 (accrual of unasserted claims)
  - ASC 450-20-50-3 to 50-5 (disclosure of a loss contingency that cannot be estimated)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Marrowfield Industries Co.'s draft note on contingencies, for December 31 statements not yet issued,
  describes two matters and says no liability has been recorded for either. First, a state environmental
  agency inspection in November found that Marrowfield's plant had discharged wastewater above its permit
  limits on 14 separate days; the agency hasn't issued a penalty notice. Counsel's letter says that after
  every inspection with findings in the past ten years the agency has assessed penalties under its published
  schedule, which sets $9,500 for each day of violation found at a first inspection, though the statute
  allows up to $25,000 a day; this was Marrowfield's first inspection. Second, in October a competitor
  sued Marrowfield for patent infringement, demanding $1,200,000; counsel's letter says discovery hasn't
  begun and counsel can't yet assess the likely outcome or the amount of any loss. What total liability
  should Marrowfield accrue at December 31 for these two matters?
choices:
- id: A
  text: $0
  rationale: 'Accrues nothing because the agency hasn''t issued a penalty notice. An unasserted claim
    is accrued when assertion and an unfavorable outcome are both probable and the loss can be estimated:
    the agency has assessed scheduled penalties after every inspection with findings, and its schedule
    fixes the amount.'
- id: B
  text: $133,000
  rationale: Correct. 14 days × $9,500 scheduled penalty; nothing for the patent suit.
- id: C
  text: $350,000
  rationale: Uses the $25,000-a-day statutory maximum. The agency's published schedule, which it has applied
    in every case, sets $9,500 a day for a first inspection, so that is the best estimate.
- id: D
  text: $1,333,000
  rationale: Also accrues the competitor's $1,200,000 demand. Counsel can't yet assess the outcome or
    the amount of any loss, so the suit is disclosed, not accrued; a plaintiff's demand isn't an estimate
    of the loss.
answer: B
explanation: 'An unasserted claim is accrued when it is probable that it will be asserted and that the
  outcome will be unfavorable, and the loss can be reasonably estimated (ASC 450-20-25-2; ASC 450-20-50-6).
  The agency has assessed scheduled penalties after every inspection with findings, so a penalty is probable
  even though no notice has been issued, and its schedule estimates it: 14 days × $9,500 = $133,000. The
  statutory maximum isn''t the best estimate when the agency consistently applies its schedule. The patent
  suit can''t yet be assessed or estimated, so nothing is accrued; the note discloses it (ASC 450-20-50-3
  to 50-5). Liability = $133,000.'
