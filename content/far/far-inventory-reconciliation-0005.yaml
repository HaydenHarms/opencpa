id: far-inventory-reconciliation-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10 (inventory; goods in transit between locations; freight-out is a selling cost)
  - 'ASC 606-10-55-85 to 55-88 (customer acceptance: products delivered for trial or evaluation)'
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Summercourt''s staff accountant prepared a draft schedule reconciling the perpetual inventory subledger,
  $1,356,250 at December 31, to the general ledger inventory account, $1,420,900. The controller finds
  the draft: accepted both records'' treatment, as sold, of $48,200 of goods sent on December 22 to a
  customer that may examine them and return them by January 21 with no obligation to buy; didn''t pick
  up $21,850 of goods shipped on December 30 from Summercourt''s east warehouse to its west warehouse,
  arriving January 3, which the subledger had removed from the east warehouse''s records but not yet added
  to the west warehouse''s; omitted from the general ledger a December cycle count''s write-off of $18,460
  of goods found missing, which the subledger had already recorded; and left $24,340 of freight paid in
  December to deliver goods to customers debited to inventory in the general ledger. What amount should
  Summercourt report as inventory at December 31?'
choices:
- id: A
  text: $1,356,250
  rationale: Accepts the subledger's $1,356,250. It omits the goods in transit between warehouses and
    the goods on approval.
- id: B
  text: $1,378,100
  rationale: Treats the $48,200 of goods on approval as sold. The customer may return them with no obligation
    to buy, so control hasn't passed until it accepts them or the period ends; they are still Summercourt's
    inventory.
- id: C
  text: $1,404,450
  rationale: Leaves out the $21,850 of goods moving between Summercourt's own warehouses. They were removed
    from one location's records and not yet added to the other's, but Summercourt owns them.
- id: D
  text: $1,426,300
  rationale: Correct. Subledger $1,356,250 + $21,850 + $48,200; general ledger $1,420,900 + $48,200 −
    $18,460 − $24,340.
answer: D
explanation: 'Subledger: the goods between warehouses are still Summercourt''s (+ $21,850), and the goods
  on approval haven''t been sold, because the customer hasn''t accepted them and the return period hasn''t
  ended (+ $48,200): $1,356,250 + $21,850 + $48,200 = $1,426,300. General ledger: + $48,200 for the goods
  on approval, − $18,460 for the shrinkage and − $24,340 for the freight-out, a selling cost: $1,420,900
  + $48,200 − $18,460 − $24,340 = $1,426,300. Inventory = $1,426,300.'
