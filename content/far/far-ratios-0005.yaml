id: far-ratios-0005
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Financial Statement Ratios and Performance Metrics
  skill: Remembering and Understanding
review:
  status: reviewed
  references:
  - 'Financial statement analysis: choosing ratios (coverage, leverage, liquidity and profitability ratios)'
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: A bank is deciding whether to renew Calverley Co.'s term loan. Its credit officer wants to know
  how far Calverley's operating profit could fall before it would no longer cover the annual cost of its
  borrowings. Which measure best serves that purpose?
choices:
- id: A
  text: Debt-to-equity ratio
  rationale: Debt to equity measures how the company is financed (leverage), not whether its earnings
    cover the interest on that debt.
- id: B
  text: Times interest earned
  rationale: Correct. Times interest earned divides earnings before interest and taxes by interest expense,
    showing how many times earnings cover the interest charges, which is the margin the officer wants.
- id: C
  text: Operating cash flow to current liabilities
  rationale: 'This is a liquidity measure: it compares a year''s operating cash flow with obligations
    due within a year, not earnings with interest charges.'
- id: D
  text: Cash debt coverage (operating cash flow ÷ average total liabilities)
  rationale: Cash debt coverage compares a year's operating cash flow with all of the company's debt,
    which bears on its ability to repay principal, not on how many times profit covers the interest charge.
answer: B
explanation: Coverage ratios answer whether earnings can service debt. Times interest earned (earnings
  before interest and taxes ÷ interest expense) shows how many times earnings cover the year's interest,
  so a higher figure means a wider margin before a fall in earnings would leave interest unpaid. Leverage
  ratios such as debt to equity describe the capital structure, liquidity ratios compare resources with
  short-term obligations, and profitability ratios such as return on assets measure returns.
