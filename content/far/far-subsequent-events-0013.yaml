id: far-subsequent-events-0013
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 855-10-25-1 and 25-3 (recognized and nonrecognized subsequent events)
  - ASC 740-10-25-47 and 740-10-35-4 (effects of changes in tax laws or rates recognized at the enactment
    date)
  - ASC 740-10-45-6 (deferred tax liabilities and assets of one jurisdiction offset)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
  asOf: U.S. GAAP (ASC 740 and ASC 855) in effect for 2026; tax rates are as stated in the stem
stem: 'Morar Logistics Inc., a public company, will issue its December 31, Year 1, financial statements
  on March 8, Year 2. At December 31, its only temporary differences are the $1,480,000 by which the carrying
  amount of its depreciable assets exceeds their tax basis, and an accrued liability of $160,000 for a
  customer''s lawsuit over a Year 1 incident, which will be deductible for tax when paid. Under the tax
  law enacted at December 31, the tax rate for all future years is 25%, and Morar expects enough future
  taxable income to realize any deferred tax asset. Before the statements are issued: on January 20, Morar
  finds that Year 1 book depreciation of $64,000 on a machine placed in service in Year 1 had been recorded
  twice (the machine''s tax depreciation was deducted correctly); on February 4, it settles the lawsuit
  for $260,000, payable in April; and on February 25, the legislature enacts a law cutting the rate to
  21% for years after Year 1. All of Morar''s deferred taxes are in one tax jurisdiction. What net deferred
  tax liability should Morar report at December 31, Year 1?'
choices:
- id: A
  text: $269,640
  rationale: Measures the deferred taxes at the new 21% rate. Deferred taxes use the tax law enacted at
    the balance sheet date; the effect of a rate change enacted after year-end is recognized when it is
    enacted, in Year 2, and disclosed.
- id: B
  text: $289,000
  rationale: Deducts the $64,000 from the taxable difference. Removing duplicate book depreciation raises
    the carrying amount further above the tax basis, so the difference grows.
- id: C
  text: $305,000
  rationale: Leaves the duplicate $64,000 of depreciation in place. Reversing it raises the assets' carrying
    amount, so the taxable temporary difference rises to $1,544,000.
- id: D
  text: $321,000
  rationale: Correct. ($1,480,000 + $64,000 − $260,000) × 25%.
answer: D
explanation: 'The duplicate depreciation and the settlement are recognized subsequent events: reversing
  the duplicate raises the machine''s book carrying amount at year-end, so the taxable difference rises
  to $1,544,000, and the settlement shows the lawsuit liability, and so the deductible difference, was
  $260,000. The rate change was enacted after year-end, so deferred taxes at December 31 stay at the 25%
  rate enacted then (ASC 740-10-25-47); the change is recognized in Year 2. Net deferred tax liability
  = ($1,544,000 − $260,000) × 25% = $321,000.'
