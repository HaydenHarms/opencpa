id: far-ppe-exchange-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Application
review:
  status: reviewed
  references:
  - ASC 845-10 (nonmonetary transactions)
  notes: Batch 01, revision 3 (2026 blueprint scope, four choices, Analysis items in the blueprint's task
    frames). Answers re-solved and every number and distractor computed in code.
stem: Harwick Corp. exchanges old machinery (book value $180,000; fair value $210,000) plus $40,000 cash
  for new equipment with a fair value of $250,000. The old machinery stamped metal brackets for a product
  line Harwick is discontinuing; the new equipment will mold plastic housings for a different customer
  base, under three-year supply contracts at different volumes and prices. What gain does Harwick recognize,
  and at what amount is the new equipment recorded?
choices:
- id: A
  text: $0 gain; new equipment $220,000
  rationale: Carryover-basis treatment, which applies only when an exchange lacks commercial substance.
    Replacing a discontinued line with a different product sold under new contracts changes Harwick's
    future cash flows significantly.
- id: B
  text: $30,000 gain; new equipment $220,000
  rationale: 'Mixes the two methods: recognizes the gain but records the asset at carryover basis.'
- id: C
  text: $30,000 gain; new equipment $250,000
  rationale: 'Correct. The new equipment serves a different product, customers, and pricing, so Harwick''s
    future cash flows change significantly and the exchange has commercial substance: the gain is fair
    value minus book value of the asset given up, and the new asset is recorded at fair value.'
- id: D
  text: $70,000 gain; new equipment $250,000
  rationale: Compares the new asset's fair value to the old book value and ignores the $40,000 of cash
    paid.
answer: C
explanation: An exchange has commercial substance when the entity's future cash flows are expected to
  change significantly as a result of it. Here the new equipment makes a different product for different
  customers at different volumes and prices, so the risk, timing, and amount of its cash flows differ
  from the old machinery's. With commercial substance, the exchange is measured at fair value. Gain =
  $210,000 fair value − $180,000 book value = $30,000. The new equipment is recorded at $210,000 + $40,000
  cash = $250,000, which equals its fair value.
