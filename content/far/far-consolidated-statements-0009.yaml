id: far-consolidated-statements-0009
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Consolidated financial statements
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 810-10-45 (consolidation procedures: intra-entity profit; attribution to the noncontrolling interest)'
  - ASC 810-10 (noncontrolling interests)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: Aldous Corp. has owned 80% of Gisburn Inc. since acquiring it at the beginning of Year 1, when it
  measured the noncontrolling interest at fair value. For Year 3, Gisburn reports net income of $360,000.
  On January 1, Year 3, Gisburn sold equipment to Aldous for $160,000; its carrying amount on Gisburn's
  books was $120,000, and Aldous depreciates it straight-line over its remaining 5-year life with no residual
  value. Consolidation also records $15,000 a year of amortization of the acquisition-date excess of fair
  value over book value of Gisburn's building. During Year 3, Gisburn paid Aldous management fees of $24,000,
  and Aldous sold goods to Gisburn at a profit; Gisburn's December 31 inventory includes $25,000 of Aldous's
  profit on those goods. Aldous attributes the elimination of profit on Gisburn's sales to Aldous proportionately
  between the parent and the noncontrolling interest. What net income attributable to the noncontrolling
  interest should Aldous's Year 3 consolidated income statement report?
choices:
- id: A
  text: $57,600
  rationale: Also charges the NCI with 20% of the $25,000 of unrealized profit on Aldous's sales to Gisburn.
    Profit on a downstream sale is the parent's, so its elimination is attributed entirely to Aldous.
- id: B
  text: $61,000
  rationale: Eliminates the $40,000 gain but not the $8,000 of it realized in Year 3. Aldous depreciates
    the equipment on its $160,000 cost, so $40,000 ÷ 5 = $8,000 of the extra depreciation is added back.
- id: C
  text: $62,600
  rationale: Correct. 20% × ($360,000 − $40,000 + $8,000 − $15,000) = 20% × $313,000.
- id: D
  text: $69,000
  rationale: Leaves the $40,000 gain on Gisburn's sale of equipment to Aldous in Gisburn's income. Profit
    on a sale within the group isn't realized until the equipment is used up or sold outside the group,
    and Aldous attributes the elimination proportionately, so the NCI bears 20% of it.
answer: C
explanation: The NCI's share is 20% of Gisburn's income as adjusted in consolidation. Start with Gisburn's
  $360,000. The $40,000 gain on the upstream equipment sale is unrealized and eliminated, and the $8,000
  of it realized through Aldous's higher depreciation ($40,000 ÷ 5) is added back; under Aldous's policy
  these upstream eliminations are shared with the NCI. The $15,000 amortization of the building's fair
  value excess reduces Gisburn's income. The management fees eliminate without changing income, and the
  profit in Gisburn's inventory came from Aldous's (downstream) sales, so its elimination falls entirely
  on Aldous. 20% × ($360,000 − $40,000 + $8,000 − $15,000) = 20% × $313,000 = $62,600.
