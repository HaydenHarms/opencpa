id: far-cash-equivalents-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 305-10-20 (cash equivalents: original maturity of three months or less to the entity holding
    the investment)'
  - ASC 310-10 (receivables)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Year 1, Durness Freight Co.''s records show: a checking account balance of $186,400;
  shares of a money market fund, redeemable on demand at $1 per share, $75,000; commercial paper bought
  on November 15, Year 1, that matures on February 15, Year 2, $50,000; a six-month certificate of deposit
  bought on September 1, Year 1, that matures on February 28, Year 2, $40,000; a customer''s check dated
  January 10, Year 2, received in December, $6,200; a customer''s check that the bank returned in December
  marked NSF, $3,450; travel advances to employees, $4,800; and petty cash, $1,500. Durness treats as
  cash equivalents all investments that meet the GAAP definition of a cash equivalent. What amount should
  Durness report as cash and cash equivalents?'
choices:
- id: A
  text: $312,900
  rationale: Correct. $186,400 + $75,000 + $50,000 + $1,500.
- id: B
  text: $316,350
  rationale: Includes the $3,450 check returned NSF. A returned check is a claim against the customer,
    a receivable.
- id: C
  text: $319,100
  rationale: Includes the $6,200 postdated check. A check dated after year-end can't be deposited until
    then, so it is a receivable.
- id: D
  text: $352,900
  rationale: Includes the $40,000 certificate of deposit because it matures within three months of year-end.
    The test is the maturity when Durness bought it; it had six months to run, so it is a short-term investment.
answer: A
explanation: 'Cash includes the checking balance ($186,400) and petty cash ($1,500). Cash equivalents
  are short-term, highly liquid investments with an original maturity, to the holder, of three months
  or less: the money market fund ($75,000) and the three-month commercial paper ($50,000). The certificate
  of deposit had six months to run when bought, so it is a short-term investment even though it now matures
  within three months. The postdated check, the NSF check and the travel advances are receivables. Total
  = $312,900.'
