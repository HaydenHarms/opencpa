id: far-balance-sheet-0007
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Balance sheet
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 210-10-45 (current assets and current liabilities; cash restricted for noncurrent uses)
  - ASC 470-10-45 (current maturities of long-term debt)
  - ASC 606-10-55 (consignment arrangements)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Marske Co.''s staff computed working capital of $952,000 at December 31, Year 1, from its draft
  balance sheet: current assets of $1,480,000 (cash $318,000, accounts receivable, net $486,000, inventory
  $642,000 and prepaid expenses $34,000) less current liabilities of $528,000 (accounts payable $402,000
  and accrued liabilities $126,000). The year-end close file shows that cash includes $27,000 of customers''
  checks dated in January, Year 2, which Marske received in December and will deposit on their dates,
  and $150,000 of proceeds from a construction loan, held in a separate account that may be used only
  to pay the contractors building Marske''s new warehouse. Inventory excludes goods costing $58,000 that
  Marske shipped in December to dealers who sell them on its behalf and who still held them at year-end.
  A five-year term loan taken out on March 1, Year 1, reported entirely among noncurrent liabilities at
  $480,000, is repayable in five equal annual installments of $96,000 beginning March 1, Year 2. What
  working capital should Marske''s corrected balance sheet report?'
choices:
- id: A
  text: $706,000
  rationale: Leaves out the $58,000 of goods held by dealers. Goods Marske shipped on consignment remain
    its inventory until the dealers sell them.
- id: B
  text: $737,000
  rationale: Removes the $27,000 of postdated customer checks from current assets. They aren't cash until
    their dates, but they are receivables, so moving them from cash to accounts receivable leaves current
    assets unchanged.
- id: C
  text: $764,000
  rationale: Correct. $952,000 − $150,000 − $96,000 + $58,000.
- id: D
  text: $860,000
  rationale: Leaves the whole term loan in noncurrent liabilities. The $96,000 installment due on March
    1, Year 2, is a current liability.
answer: C
explanation: 'Postdated checks are receivables, not cash, so reclassifying the $27,000 leaves current
  assets unchanged. Cash restricted to paying for the construction of a noncurrent asset is not a current
  asset: − $150,000. Consigned goods still held by the dealers belong to Marske: + $58,000. The installment
  due March 1, Year 2, is a current liability: − $96,000. Working capital = $952,000 − $150,000 + $58,000
  − $96,000 = $764,000.'
