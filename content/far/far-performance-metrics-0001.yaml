- stem: Pardee Corp. reports net income of $3,000,000 for the year. It declared $500,000 of dividends
    on its preferred stock and $1,000,000 of dividends on its common stock. Weighted-average common shares
    outstanding were 1,250,000, and the common stock's market price at year-end is $36. Pardee computes
    the dividend payout ratio on earnings available to common shareholders. What are Pardee's price-to-earnings
    ratio and dividend payout ratio?
  choices:
  - id: A
    text: 15.0 P/E; 40% payout
    rationale: Computes EPS without deducting the $500,000 of preferred dividends ($2.40), which understates
      the P/E ratio.
  - id: B
    text: 18.0 P/E; 33.3% payout
    rationale: Gets the P/E ratio right but divides common dividends by total net income for the payout
      ratio.
  - id: C
    text: 18.0 P/E; 40% payout
    rationale: Correct. EPS = ($3,000,000 − $500,000) ÷ 1,250,000 = $2.00; P/E = $36 ÷ $2.00 = 18.0; payout
      = $1,000,000 ÷ $2,500,000 = 40%.
  - id: D
    text: 18.0 P/E; 60% payout
    rationale: Includes the $500,000 of preferred dividends in the payout ratio. The ratio covers dividends
      to common shareholders only.
  answer: C
  explanation: Earnings available to common = $3,000,000 − $500,000 preferred dividends = $2,500,000;
    EPS = $2.00. Price-to-earnings ratio = $36 ÷ $2.00 = 18.0. Dividend payout ratio = common dividends
    ÷ earnings available to common = $1,000,000 ÷ $2,500,000 = 40%.
