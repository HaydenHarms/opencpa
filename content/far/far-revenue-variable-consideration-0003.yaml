id: far-revenue-variable-consideration-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - ASC 606-10-32-11 to 32-13 (constraining estimates of variable consideration)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: On July 1, Year 1, Larkspur Sensors Co. begins shipping a newly developed sensor to a customer under
  a multi-year supply contract; the contract price is $40 a unit, and Larkspur expects to ship about 24,000
  units over the contract's life. In addition, Larkspur will earn a $6-a-unit bonus on every unit shipped
  in Year 1 if an industry standards board approves the sensor's new calibration method by December 31,
  Year 1 — a decision Larkspur's president calls a coin flip, because the board has never evaluated a
  method like this one and has given no indication which way it will rule. Larkspur shipped 8,000 units
  in Year 1. How much revenue should Larkspur recognize for the units shipped in Year 1?
choices:
- id: A
  text: $0
  rationale: Defers all Year 1 revenue until the board decides. The $40-a-unit base price isn't contingent
    on the board's decision and is unconditional revenue as the units ship; only the uncertain bonus is
    excluded.
- id: B
  text: $320,000
  rationale: Correct. 8,000 units × $40 base price; the uncertain bonus is excluded from the transaction
    price.
- id: C
  text: $368,000
  rationale: Includes the full $6-a-unit bonus, as if the board's approval were already certain. The outcome
    is highly uncertain and outside Larkspur's control, with no comparable experience to draw on, so the
    bonus is constrained out of the transaction price until the board decides.
- id: D
  text: $960,000
  rationale: Multiplies the price by the 24,000 units Larkspur expects to ship over the whole contract
    instead of the 8,000 units actually shipped in Year 1.
answer: B
explanation: 'The $40 base price is unconditional and is recognized as each unit ships: 8,000 × $40 =
  $320,000. The $6-a-unit bonus is variable consideration, but the board''s decision is highly susceptible
  to factors outside Larkspur''s influence and Larkspur has no relevant experience with a similar method,
  so including any part of it in the transaction price is excluded under the constraint on estimates of
  variable consideration (ASC 606-10-32-11 to 32-13) until the board rules. Revenue for Year 1 = $320,000.'
