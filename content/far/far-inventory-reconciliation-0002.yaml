id: far-inventory-reconciliation-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10 (inventory; LIFO reserve)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Kerrigan Co. keeps its perpetual inventory subledger at FIFO cost and reports inventory at LIFO,
  recording the difference in a LIFO reserve account. At December 31, the subledger totals $840,000, and
  the general ledger inventory account, which is also kept at FIFO, shows $803,000. The controller finds
  that goods costing $26,000 received on December 29 are in the subledger but the supplier's invoice was
  never posted to the general ledger, and that goods costing $11,000 returned to a supplier on December
  30 were recorded in the general ledger but not in the subledger. The LIFO reserve was $110,000 at January
  1, and Kerrigan's LIFO calculation requires a reserve of $135,000 at December 31. What amount should
  Kerrigan report as inventory at December 31?
choices:
- id: A
  text: $668,000
  rationale: Uses the general ledger balance without posting the $26,000 December 29 receipt.
- id: B
  text: $694,000
  rationale: Correct. ($840,000 − $11,000) − $135,000 LIFO reserve.
- id: C
  text: $705,000
  rationale: Doesn't remove the $11,000 of returned goods from the subledger amount.
- id: D
  text: $829,000
  rationale: Reports the corrected FIFO cost. The $135,000 LIFO reserve reduces it to LIFO.
answer: B
explanation: 'Corrected FIFO cost: subledger $840,000 − $11,000 return = $829,000; general ledger $803,000
  + $26,000 receipt = $829,000. The balance sheet reports LIFO: $829,000 − $135,000 reserve = $694,000.'
