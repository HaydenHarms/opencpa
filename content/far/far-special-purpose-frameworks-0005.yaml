  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Upcott Veterinary Clinic keeps its books on the cash basis. Its Year 2 cash receipts from clients
  exceeded its cash payments by $186,000. The payments include $48,000 paid in March for new imaging equipment,
  whose depreciation for Year 2 on the accrual basis is $6,000. Balances at January 1 and December 31,
  Year 2, were: client receivables, $21,000 and $33,000; accrued wages and other expenses payable, $9,000
  and $14,500; and prepaid insurance, $7,200 and $4,800. There are no other differences between the cash
  and accrual bases. What is Upcott''s Year 2 net income on the accrual basis?'
choices:
- id: A
  text: $208,100
  rationale: Subtracts the $12,000 increase in client receivables. Fees earned but not yet collected make
    accrual revenue larger than cash received.
- id: B
  text: $232,100
  rationale: Correct. $186,000 + $12,000 − $5,500 − $2,400 + $48,000 − $6,000.
- id: C
  text: $238,100
  rationale: Capitalizes the equipment but records no depreciation. The $6,000 of Year 2 depreciation
    is an accrual-basis expense.
- id: D
  text: $243,100
  rationale: Adds the $5,500 increase in accrued expenses. Expenses incurred but not yet paid make accrual
    expenses larger than cash paid, which lowers income.
answer: B
explanation: 'Start with the $186,000 excess of receipts over payments. Revenue: receivables rose by $12,000,
  so fees earned exceeded cash collected: + $12,000. Expenses: accrued expenses payable rose by $5,500,
  so expenses incurred exceeded cash paid: − $5,500; prepaid insurance fell by $2,400, so insurance expense
  exceeded the premiums paid: − $2,400. The equipment is an asset, not an expense (+ $48,000), and its
  depreciation is (− $6,000). Accrual net income = $232,100.'
