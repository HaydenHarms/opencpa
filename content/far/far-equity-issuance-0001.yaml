stem: Redford Corp. issues 8,000 shares of $2 par value common stock for $18 per share. What are the credits
  in the journal entry?
choices:
- id: A
  text: Common stock $144,000
  rationale: Credits all proceeds to common stock. Only par value goes to common stock.
- id: B
  text: Common stock $16,000; additional paid-in capital $128,000
  rationale: Correct. Par of 8,000 × $2 goes to common stock, and the excess over par goes to APIC.
- id: C
  text: Common stock $16,000; additional paid-in capital $144,000
  rationale: Credits total proceeds to APIC, so the entry would not balance with $144,000 of cash.
- id: D
  text: Common stock $128,000; additional paid-in capital $16,000
  rationale: Swaps the par and excess-over-par amounts.
answer: B
explanation: Cash of 8,000 × $18 = $144,000. Common stock is credited at par (8,000 × $2 = $16,000), and
  additional paid-in capital gets the excess (8,000 × $16 = $128,000).
