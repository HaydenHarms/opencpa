id: far-subsequent-events-0016
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: draft
  references:
  - 'ASC 855-10-25-1 (recognized subsequent events: conditions existing at the balance sheet date)'
  - 'ASC 855-10-25-3 and 855-10-55-2 (nonrecognized subsequent events: conditions arising after that date)'
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'Ellersby Components Co.''s draft December 31, Year 1, balance sheet reports current assets of $2,460,000
  and current liabilities of $1,180,000; the statements will be issued on March 10, Year 2. Between those
  dates: a warranty claim on units Ellersby sold before year-end, for which Ellersby had accrued $52,000,
  was settled for $81,000; on February 9, Year 2, a state audit of Ellersby''s Year 1 sales concluded
  that Ellersby had failed to collect sales tax on certain Year 1 sales and assessed $46,000, payable
  in April, for which Ellersby had accrued nothing; and Marbury Exports, a customer that owed $140,000
  at year-end, defaulted on its balance after an export-licensing regulation that the government announced
  and put into effect in January, Year 2, cut off its export business. Ellersby has not elected the ASU
  2025-05 practical expedient for current receivables. Ignore income taxes. What working capital (current
  assets minus current liabilities) should Ellersby report at December 31, Year 1?'
choices:
- id: A
  text: $1,065,000
  rationale: Also writes off the $140,000 owed by Marbury Exports. Its default came from a regulation
    that took effect after year-end, a condition that arose after the balance sheet date, so it is disclosed,
    not recognized.
- id: B
  text: $1,205,000
  rationale: Correct. $2,460,000 − ($1,180,000 + $29,000 warranty + $46,000 sales tax).
- id: C
  text: $1,234,000
  rationale: Leaves out the additional $29,000 owed on the warranty claim, which settled for more than
    the $52,000 accrued at year-end for units sold before then.
- id: D
  text: $1,251,000
  rationale: Leaves out the $46,000 sales-tax assessment. It arises from Year 1 sales, a condition that
    existed at year-end, so it is recognized even though the audit concluded after year-end.
answer: B
explanation: 'The warranty settlement and the sales-tax assessment both give evidence about conditions
  that existed at year-end (units already sold, Year 1 sales already made), so both are recognized (ASC
  855-10-25-1): current liabilities rise by $81,000 − $52,000 = $29,000 and by $46,000. Marbury Exports''
  default resulted from a regulation announced and effective after year-end, a condition arising after
  the balance sheet date, so it is disclosed, not recognized, and the receivable isn''t written down (ASC
  855-10-25-3, 855-10-55-2). Working capital = $2,460,000 − ($1,180,000 + $75,000) = $1,205,000.'
