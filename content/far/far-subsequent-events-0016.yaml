id: far-subsequent-events-0016
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: draft
  references:
  - 'ASC 855-10-25-1 and 25-3 (recognized subsequent events: conditions existing at the balance sheet
    date)'
  - 'ASC 855-10-50 (nonrecognized subsequent events: conditions arising after that date, disclosed)'
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Ellersby Components Co.''s draft December 31, 1, balance sheet reports current assets of $2,460,000
  and current liabilities of $1,180,000; the statements will be issued on March 10, 2. Between those dates:
  a warranty claim on units Ellersby sold before year-end, for which Ellersby had accrued $52,000, was
  settled for $81,000; a lawsuit over a 1 incident, for which Ellersby had accrued $160,000, was settled
  for $215,000; and Marbury Exports Ltd., a customer that owed $140,000 at year-end and was current and
  creditworthy then, defaulted on the balance after a new export-licensing regulation took effect in January,
  2, cutting off its export business. What working capital (current assets minus current liabilities)
  should Ellersby report at December 31, 1?'
choices:
- id: A
  text: $1,056,000
  rationale: Also writes down $140,000 of the receivable from Marbury Exports Ltd.. That customer was
    current and financially sound at year-end; its default resulted from the export-licensing regulation
    enacted in January, a condition that arose after year-end, so it is disclosed, not recognized.
- id: B
  text: $1,196,000
  rationale: Correct. $2,460,000 current assets − ($1,180,000 current liabilities + $84,000 additional
    accruals).
- id: C
  text: $1,225,000
  rationale: Leaves out the additional $29,000 Ellersby owes on the warranty claim, which settled for
    more than the $52,000 accrued at year-end for units sold before then.
- id: D
  text: $1,251,000
  rationale: Leaves out the additional $55,000 Ellersby owes on the lawsuit, which settled for more than
    the $160,000 accrued at year-end.
answer: B
explanation: 'The warranty and lawsuit settlements confirm conditions that existed at year-end and provide
  a better estimate of amounts already accrued, so both are recognized: current liabilities rise by $29,000
  and $55,000. Marbury Exports Ltd.''s default resulted from a regulation enacted after year-end, a condition
  arising after the balance sheet date, so it is disclosed, not recognized, and the receivable isn''t
  written down. Working capital = $2,460,000 − ($1,180,000 + $84,000) = $1,196,000.'
