id: far-subsequent-events-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 855-10 (recognized and nonrecognized subsequent events)
  - ASC 326-20 (credit losses)
  - ASC 450-20 (loss contingencies)
  notes: Batch 02. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Tamsin Co.''s December 31, Year 1, statements will be issued on March 15, Year 2. Between those
  dates: (1) on January 25, a customer that owed $80,000 at year-end filed for bankruptcy because of financial
  difficulties that had built up over Year 1; Tamsin now expects to collect $20,000, and its allowance
  included $10,000 for this customer; (2) on February 10, Tamsin settled for $150,000 a lawsuit over a
  Year 1 injury for which it had accrued $100,000; (3) on February 20, a fire destroyed an uninsured warehouse
  with a carrying amount of $300,000; and (4) on March 1, Tamsin issued $1,000,000 of bonds. What is the
  effect on Tamsin''s Year 1 pretax income, and which events require disclosure without adjustment?'
choices:
- id: A
  text: $0 decrease; disclose all four events
  rationale: Treats every event as nonrecognized. The bankruptcy and the settlement give evidence about
    conditions that existed at year-end, so they are recognized.
- id: B
  text: $50,000 decrease; disclose the fire and the bond issue
  rationale: Adjusts for only one of the two events that give evidence about conditions existing at year-end.
- id: C
  text: $100,000 decrease; disclose the fire only
  rationale: Omits the bond issue. A significant financing after year-end is a nonrecognized event that
    is disclosed.
- id: D
  text: $100,000 decrease; disclose the fire and the bond issue
  rationale: Correct. The customer's loss ($50,000 more allowance) and the settlement ($50,000 more accrual)
    are recognized; the fire and the bond issue are disclosed.
answer: D
explanation: 'Events that give evidence about conditions existing at the balance sheet date are recognized.
  The customer''s bankruptcy resulted from deterioration during Year 1, so the allowance for that customer
  rises from $10,000 to $60,000 ($80,000 − $20,000): a $50,000 charge. The settlement confirms a Year
  1 obligation at $150,000: $50,000 more than accrued. Year 1 pretax income falls by $100,000. The fire
  and the bond issue reflect conditions arising after year-end; they are disclosed, not recognized.'
