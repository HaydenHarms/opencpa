id: far-subsequent-events-0020
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Application
review:
  status: reviewed
  references:
  - ASC 855-10 (recognized and nonrecognized subsequent events; evaluation through the date the statements
    are issued)
  notes: Batch 18. Written from scratch; answers solved and every number and distractor computed in code.
stem: Oakhurst Fabrication Co.'s Year 1 financial statements, which report a specialized machine at its
  $460,000 carrying amount, will be issued on March 10, Year 2. At December 31, Year 1, Calder Industrial
  Group, the only customer for the machine's output, was past due on payments and had told Oakhurst Fabrication
  Co. that it intended to cancel their purchase contract once the contract's notice period ran, though
  Oakhurst Fabrication Co. had not yet received formal cancellation. On January 25, Year 2, before the
  statements are issued, Calder Industrial Group delivered the formal cancellation notice. With no other
  customer for the machine's specialized output, Oakhurst Fabrication Co. determines the machine's fair
  value is $150,000. What adjustment should Oakhurst Fabrication Co. make to the carrying amount of the
  machine in its December 31, Year 1, financial statements?
choices:
- id: A
  text: $0
  rationale: Treats Calder Industrial Group's cancellation as a nonrecognized subsequent event requiring
    disclosure only. Oakhurst Fabrication Co. already had notice of the condition causing the loss, Calder
    Industrial Group's intent to cancel, before year end, so the impairment is recognized.
- id: B
  text: $150,000
  rationale: Reports the machine's $150,000 fair value as the adjustment, rather than the loss needed
    to write the machine down to that amount.
- id: C
  text: $310,000
  rationale: 'Correct. This is a recognized subsequent event: Calder Industrial Group''s formal cancellation
    confirms a condition that existed at year end, Calder Industrial Group''s stated intent to cancel.
    Oakhurst Fabrication Co. writes the machine down from its $460,000 carrying amount to its confirmed
    $150,000 fair value, a $310,000 loss ($460,000 − $150,000).'
- id: D
  text: $460,000
  rationale: Writes the machine's entire $460,000 carrying amount off, as if it had no remaining value,
    when its confirmed fair value is $150,000.
answer: C
explanation: 'Correct. This is a recognized subsequent event: Calder Industrial Group''s formal cancellation
  confirms a condition that existed at year end, Calder Industrial Group''s stated intent to cancel. Oakhurst
  Fabrication Co. writes the machine down from its $460,000 carrying amount to its confirmed $150,000
  fair value, a $310,000 loss ($460,000 − $150,000).'
