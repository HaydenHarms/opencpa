id: far-revenue-allocation-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: reviewed
  references:
  - ASC 606-10 (identifying performance obligations; allocating a discount to fewer than all performance
    obligations)
  notes: Batch 01, revision 3 (2026 blueprint scope, four choices, Analysis items in the blueprint's task
    frames). Answers re-solved and every number and distractor computed in code.
stem: 'Harmon Technologies enters into a contract to sell a software license, implementation services,
  and one year of post-contract support for a total of $370,000. Harmon regularly sells each item separately
  at these standalone selling prices: license $240,000, implementation $100,000, and support $60,000.
  It also regularly sells the license and one year of support together, without implementation, for $270,000.
  The implementation is a standard installation that does not modify the software, and several other firms
  offer it. How much of the transaction price should Harmon allocate to the license?'
choices:
- id: A
  text: $210,000
  rationale: Assigns the entire $30,000 discount to the license. The discount belongs to the license-and-support
    bundle and is shared between those two in proportion to their standalone selling prices.
- id: B
  text: $216,000
  rationale: 'Correct. The $30,000 discount matches the regular license-and-support bundle, so it is allocated
    to those two only: $270,000 × $240,000 ÷ $300,000.'
- id: C
  text: $222,000
  rationale: Spreads the discount across all three obligations ($370,000 × $240,000 ÷ $400,000). Observable
    evidence shows the discount relates only to the license and support.
- id: D
  text: $240,000
  rationale: Uses the license's standalone selling price and ignores the discount.
answer: B
explanation: 'The implementation does not modify the software and is available from other firms, so the
  license, implementation, and support are distinct performance obligations. The contract''s discount
  is $400,000 − $370,000 = $30,000. Harmon regularly sells each item separately, and regularly sells the
  license and support together at the same $30,000 discount, which is observable evidence that the whole
  discount relates to those two. Implementation gets its $100,000 standalone selling price, and the remaining
  $270,000 is split between license and support by their standalone selling prices: $270,000 × $240,000
  ÷ $300,000 = $216,000.'
