id: far-investments-equity-securities-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments (Financial assets at fair value)
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 321-10 (equity securities without readily determinable fair values: measurement alternative and
    impairment)'
  notes: Batch 05. Written from scratch; answers solved and every number and distractor computed in code.
stem: In January, Iredale Co. pays $400,000 for 5% of the shares of a private company whose shares have
  no readily determinable fair value, and elects the measurement alternative. In June, the investee sells
  identical shares to an unrelated investor in an orderly transaction at a price implying that Iredale's
  shares are worth $460,000. In November, the investee loses its largest customer, which provided 40%
  of its revenue, and Iredale estimates the shares' fair value at $380,000. At what amount should Iredale
  report the investment at year-end?
choices:
- id: A
  text: $320,000
  rationale: Measures the impairment from cost ($400,000 − $80,000). The June observable price change
    had already raised the carrying amount to $460,000.
- id: B
  text: $380,000
  rationale: Correct. Adjusted up to $460,000 for the observable price change, then written down to its
    $380,000 fair value when impaired.
- id: C
  text: $400,000
  rationale: Keeps cost, ignoring both the observable price change and the impairment.
- id: D
  text: $460,000
  rationale: Records the June observable price change but not the November impairment.
answer: B
explanation: 'Under the measurement alternative, the investment is carried at cost less impairment, adjusted
  for observable price changes in orderly transactions for identical or similar securities. June: adjust
  to $460,000 (a $60,000 gain in net income). November: impairment indicators require measuring the investment
  at fair value, $380,000 (an $80,000 loss in net income). Year-end carrying amount = $380,000.'
