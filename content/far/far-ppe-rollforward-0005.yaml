id: far-ppe-rollforward-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 360-10-35 (depreciation: from the date placed in service; land not depreciated)'
  - ASC 842-20-35-12 (leasehold improvements amortized over the shorter of useful life and remaining lease
    term)
  - 'ASC 360-10-40 (derecognition: accumulated depreciation through the date of sale removed)'
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Kingsbridge Foods Co.''s staff prepared this Year 2 rollforward of accumulated depreciation: January
  1 balance $2,846,000; depreciation expense $612,000; disposals ($95,000); December 31 balance $3,363,000.
  The controller reviews the depreciation schedule and finds: a packaging line that cost $480,000, placed
  in service on October 1, Year 2, received a full year of depreciation over its 8-year life with no residual
  value; a building bought on January 2, Year 2, for $1,950,000, of which an appraisal assigned $550,000
  to the land, was depreciated on the whole $1,950,000 over 40 years with no residual value; improvements
  costing $270,000 that Kingsbridge made on January 2, Year 2, to a warehouse it leases, whose lease ends
  in 5 years with no renewal or purchase option, were depreciated over their 15-year physical life; and
  a truck that cost $150,000, depreciated straight-line over five years with no residual value, was sold
  on July 31, Year 2, and the disposal entry removed its accumulated depreciation at January 1 without
  recording any depreciation on it for Year 2. Kingsbridge depreciates straight-line by month. What accumulated
  depreciation should the corrected rollforward report at December 31, Year 2?'
choices:
- id: A
  text: $3,304,250
  rationale: Keeps the leasehold improvements on their 15-year physical life. Improvements to a leased
    asset are depreciated over the shorter of their useful life and the remaining lease term, 5 years
    here.
- id: B
  text: $3,340,250
  rationale: Correct. $3,363,000 − $45,000 − $13,750 + $36,000.
- id: C
  text: $3,357,750
  rationale: Records the $17,500 of Year 2 depreciation on the truck sold but removes only its January
    1 accumulated depreciation. The disposal must also remove that $17,500, so the two corrections cancel.
- id: D
  text: $3,385,250
  rationale: Keeps the full year of depreciation on the packaging line. It was placed in service on October
    1, so only 3 months ($15,000) are recorded.
answer: B
explanation: 'The packaging line is depreciated for 3 months, not 12: − $45,000. The land portion of the
  building isn''t depreciable: − $550,000 ÷ 40 = − $13,750. The leasehold improvements are depreciated
  over the 5-year remaining lease term: $270,000 ÷ 5 − $270,000 ÷ 15 = + $36,000. The truck needs $17,500
  of depreciation for 7 months, which increases accumulated depreciation, and the disposal must then remove
  that amount too, so the ending balance is unchanged (depreciation expense and the loss on sale change
  instead). Corrected balance = $3,363,000 − $45,000 − $13,750 + $36,000 = $3,340,250.'
