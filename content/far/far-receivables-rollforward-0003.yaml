  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Verity Co.''s staff accountant computed Year 2 cash collected on accounts receivable as $2,615,000:
  beginning receivables of $380,000, plus gross sales of $2,650,000, less ending receivables of $415,000,
  per the aged subledger, which agrees with the general ledger. Supporting records show: gross sales include
  $310,000 of cash sales; customers returned goods from credit sales for credits of $42,000; customers
  who paid within the discount period took $28,000 of sales discounts; $19,000 of accounts were written
  off; in October, a customer''s past-due account of $35,000 was converted into a 12-month interest-bearing
  note receivable; and the allowance for credit losses increased from $22,000 to $27,000. What cash did
  Verity collect on accounts receivable in Year 2?'
choices:
- id: A
  text: $2,176,000
  rationale: Also subtracts the $5,000 increase in the allowance for credit losses. The rollforward is
    of gross receivables; the allowance doesn't affect them.
- id: B
  text: $2,181,000
  rationale: Correct. $380,000 + ($2,650,000 − $310,000) − $42,000 − $28,000 − $19,000 − $35,000 − $415,000.
- id: C
  text: $2,216,000
  rationale: Treats the $35,000 account converted into a note as collected. The note replaced the account
    receivable; no cash was received.
- id: D
  text: $2,491,000
  rationale: Leaves the $310,000 of cash sales in the rollforward. Cash sales never pass through accounts
    receivable.
answer: B
explanation: 'Receivables rollforward: beginning $380,000 + credit sales ($2,650,000 − $310,000 cash sales
  = $2,340,000) − returns $42,000 − discounts $28,000 − write-offs $19,000 − account converted to a note
  $35,000 − collections = ending $415,000. Collections = $2,181,000. The allowance is a separate contra
  account and doesn''t enter the rollforward of gross receivables.'
