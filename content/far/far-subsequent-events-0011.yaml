id: far-subsequent-events-0011
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 855-10-25-1 and 25-3 (recognized and nonrecognized subsequent events)
  - 'ASC 855-10-55 (examples: events after the balance sheet date that are not recognized)'
  - ASC 855-10-25-1A (SEC filers evaluate subsequent events through the date the statements are issued)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Glenelg Instruments Inc., a public company that files with the SEC, will issue its December 31,
  Year 1, financial statements on March 9, Year 2. Its draft balance sheet reports total stockholders''
  equity of $6,240,000. After year-end: on January 14, internal auditors found that a cashier had stolen
  $86,000 from Glenelg from October through December, Year 1, hiding the thefts in the cash records, and
  Glenelg has no insurance or other way to recover the money; on February 2, Glenelg received an engineering
  firm''s invoice for $54,000 for work done in December, Year 1, which Glenelg had not accrued; on February
  10, the board declared a cash dividend of $180,000, payable March 31; during February, a broad market
  decline cut the fair value of Glenelg''s portfolio of listed equity securities by $210,000; and on March
  2, Glenelg issued common shares for $1,500,000 in cash. Ignore income taxes. What total stockholders''
  equity should Glenelg report at December 31, Year 1?'
choices:
- id: A
  text: $5,890,000
  rationale: Also deducts the $210,000 February decline in the securities' fair value. The decline reflects
    market conditions after year-end, so it is a nonrecognized subsequent event, disclosed if material.
- id: B
  text: $6,100,000
  rationale: Correct. $6,240,000 − $86,000 − $54,000.
- id: C
  text: $6,186,000
  rationale: Leaves out the $86,000 theft. The cash was already gone at December 31, so its discovery
    is evidence about conditions at year-end and is recognized.
- id: D
  text: $7,600,000
  rationale: Adds the $1,500,000 of shares issued on March 2. Shares issued after year-end don't change
    the December 31 balance sheet; the issuance is disclosed.
answer: B
explanation: 'An SEC filer evaluates subsequent events through the date its statements are issued. The
  theft and the December engineering work existed at year-end, so they are recognized subsequent events:
  cash falls by $86,000, and an expense and a liability of $54,000 are recorded, each reducing equity.
  The dividend declaration, the February market decline and the March share issuance arise from events
  after year-end; they are disclosed if material but not recognized. Equity = $6,240,000 − $86,000 − $54,000
  = $6,100,000.'
