id: far-notes-0001
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Notes to financial statements
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 470-10 (classification of debt callable because of a covenant violation)
  - ASC 855-10 (nonrecognized subsequent events)
  - ASC 330-10 (inventory)
  - ASC 842-20 (lessee presentation)
  notes: Batch 02. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Marlin Corp.''s draft December 31, Year 1, balance sheet reports inventory of $840,000, an operating
  lease right-of-use asset of $210,000, operating lease liabilities of $40,000 (current) and $185,000
  (noncurrent), and long-term debt of $900,000 (noncurrent). The statements will be issued on March 5,
  Year 2. You compare four draft note excerpts with the statements and supporting documents. Inventory
  note: inventories of $840,000 are stated at the lower of FIFO cost and net realizable value; a $12,000
  write-down was charged to cost of sales in Year 1, and although selling prices recovered in January,
  the write-down is not reversed. Lease note: the right-of-use asset is $210,000 and lease liabilities
  total $225,000, of which $40,000 is due within one year; the difference reflects straight-line rent
  accrued; operating lease cost of $48,000 is included in selling expenses. Debt note: long-term debt
  of $900,000 includes a $300,000 term loan due in Year 6; at December 31, Marlin did not meet the loan''s
  current-ratio covenant, which makes it payable on demand, and on January 20 the lender waived that right
  until September 30, Year 2. Subsequent events note: on February 12, Marlin agreed to buy a competitor
  for $2,000,000 in cash; no amounts are recognized in Year 1. Which note reveals that the draft financial
  statements must be corrected?'
choices:
- id: A
  text: The debt note
  rationale: Correct. A covenant violation that makes the loan callable at year-end requires current classification
    unless the lender waives the right for more than one year from the balance sheet date. The waiver
    runs only to September 30, Year 2, so the $300,000 is current.
- id: B
  text: The inventory note
  rationale: Consistent. The carrying amount matches the balance sheet, and a write-down to net realizable
    value is not reversed when prices later recover.
- id: C
  text: The subsequent events note
  rationale: 'Consistent. An agreement to acquire a business after year-end is a nonrecognized event:
    it is disclosed, not recognized in Year 1.'
- id: D
  text: The lease note
  rationale: Consistent. The liabilities ($40,000 + $185,000 = $225,000) and asset agree with the balance
    sheet; an operating lease right-of-use asset often differs from the liability because of accrued straight-line
    rent.
answer: A
explanation: Long-term debt that is callable by the creditor at the balance sheet date because of a covenant
  violation is classified as current unless the creditor waives or loses the right to demand repayment
  for more than one year from the balance sheet date (or the violation will probably be cured within a
  grace period). Marlin's waiver lasts only nine months, so the $300,000 term loan must be reclassified
  to current liabilities, and the note is inconsistent with the draft balance sheet. The other three notes
  agree with the statements and with GAAP.
