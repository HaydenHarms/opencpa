id: far-revenue-principal-agent-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: reviewed
  references:
  - ASC 606-10-55-36 to 55-40 (principal versus agent indicators)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: BrightRide Inc. operates a ride-hailing app. Drivers are independent contractors who own their vehicles,
  decide whether to accept each ride request, and are responsible for safely completing the trip and resolving
  any problem with it; BrightRide sets the fare for every ride with its own pricing algorithm and collects
  the fare from the rider, then pays the driver 80% of each fare and keeps the remaining 20%. During the
  month, riders paid total fares of $850,000. BrightRide also sells its own "Plus" subscription, a flat
  $15 a month for perks that BrightRide alone provides; 4,000 riders held active subscriptions during
  the month. What total revenue should BrightRide recognize for the month?
choices:
- id: A
  text: $170,000
  rationale: Omits the $60,000 of subscription revenue. BrightRide provides the subscription perks itself,
    with no third party involved, so that revenue is recognized gross.
- id: B
  text: $230,000
  rationale: Correct. Ride commission (20% × $850,000 = $170,000) as agent, plus subscription revenue
    ($15 × 4,000 = $60,000) as principal.
- id: C
  text: $740,000
  rationale: Recognizes the 80% of each fare paid to the driver instead of the 20% BrightRide keeps.
- id: D
  text: $910,000
  rationale: Reports the ride fares gross, $850,000. The drivers — not BrightRide — are responsible for
    safely completing each trip and bear the risk of a problem with it, so BrightRide is an agent for
    the fares despite setting the price, and recognizes only its 20% fee.
answer: B
explanation: 'An entity is a principal if it controls the good or service before it transfers to the customer;
  a key indicator is primary responsibility for fulfilling the promise. Here the drivers, not BrightRide,
  are responsible for completing each ride and bear the risk of a problem with it, so BrightRide is an
  agent for the ride fares even though it sets the price and collects the cash: it recognizes only its
  $170,000 fee (20% × $850,000). The subscription is BrightRide''s own service, with no other party involved,
  so it is recognized gross: $15 × 4,000 = $60,000. Total revenue = $230,000.'
