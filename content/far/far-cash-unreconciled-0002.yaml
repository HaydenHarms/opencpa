id: far-cash-unreconciled-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (unrecorded outstanding checks; errors in recording disbursements; bank
    collections and charges)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Austwick Co.''s bookkeeper could not reconcile the March 31 bank statement. The bank balance of
  $86,420, plus deposits in transit of $7,350 and less outstanding checks of $12,680, gave $81,090; the
  general ledger balance of $73,380, less an $840 customer check the bank returned for insufficient funds,
  plus the bank''s collection of a $6,000 note receivable with $180 of interest, less the bank''s $35
  collection fee, gave $78,685. The controller investigates the $2,405 difference and finds: check no.
  7214, for $4,385, issued and recorded on March 29, is missing from the list of outstanding checks and
  has not cleared the bank; check no. 7190, to a supplier, cleared the bank for $5,630, the amount written
  on it, but was recorded in the cash disbursements journal as $3,650; and a $3,215 deposit made on February
  28 was credited by the bank on March 2. What cash balance should Austwick report at March 31?'
choices:
- id: A
  text: $76,705
  rationale: Correct. Bank $86,420 + $7,350 − ($12,680 + $4,385) = book $73,380 − $840 + $6,000 + $180
    − $35 − $1,980.
- id: B
  text: $78,685
  rationale: Uses the bookkeeper's adjusted book balance. Check no. 7190 was paid at $5,630 but recorded
    at $3,650, so the books overstate cash by $1,980.
- id: C
  text: $81,090
  rationale: Uses the bookkeeper's adjusted bank balance. Check no. 7214 for $4,385 was issued and recorded
    but hasn't cleared, so it is outstanding.
- id: D
  text: $85,475
  rationale: Adds check no. 7214 to the adjusted bank balance. An outstanding check is deducted from the
    bank balance, because the bank hasn't yet paid it.
answer: A
explanation: 'Bank side: the omitted check is outstanding, so the correct balance is $86,420 + $7,350
  − $12,680 − $4,385 = $76,705. Book side: the check recorded at $3,650 was paid at $5,630, so the books
  need a further $1,980 deduction: $78,685 − $1,980 = $76,705. The February 28 deposit was in transit
  last month and is already in the March bank balance, so it is not a reconciling item. The $2,405 difference
  was $4,385 − $1,980, and both sides now agree at $76,705.'
