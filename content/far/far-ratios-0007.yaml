id: far-ratios-0007
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Financial Statement Ratios and Performance Metrics
  skill: Application
review:
  status: reviewed
  references:
  - 'Financial statement analysis: profitability ratios (return on total assets, with interest added back
    net of tax)'
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: Launceston Corp. reports net income of $1,140,000 for Year 2, after interest expense of $360,000
  and income taxes at 25% of pretax income. It declared and paid $150,000 of dividends on its preferred
  stock during the year. Its total assets were $11,600,000 at January 1 and $12,500,000 at December 31.
  Launceston measures return on assets independently of how the assets are financed, adding back interest
  expense net of its tax effect, and uses average total assets. What is Launceston's return on assets
  for Year 2, rounded to one decimal place?
choices:
- id: A
  text: 9.5%
  rationale: Uses net income alone, $1,140,000 ÷ $12,050,000. Launceston measures return on assets independently
    of financing, so the after-tax interest is added back.
- id: B
  text: 10.5%
  rationale: Deducts the $150,000 of preferred dividends. They are a distribution to one class of owners;
    return on total assets measures the return to all providers of capital.
- id: C
  text: 11.7%
  rationale: Correct. ($1,140,000 + $360,000 × (1 − 25%)) ÷ $12,050,000 = $1,410,000 ÷ $12,050,000.
- id: D
  text: 12.4%
  rationale: Adds back all $360,000 of interest expense. Interest reduced income taxes, so only the after-tax
    amount, $270,000, is added back.
answer: C
explanation: After-tax interest = $360,000 × (1 − 25%) = $270,000. Return before financing costs = $1,140,000
  + $270,000 = $1,410,000. Average total assets = ($11,600,000 + $12,500,000) ÷ 2 = $12,050,000. Return
  on assets = $1,410,000 ÷ $12,050,000 = 11.7%. Preferred dividends are a distribution of income, not
  an expense, and don't enter return on total assets.
