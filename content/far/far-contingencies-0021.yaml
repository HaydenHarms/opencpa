id: far-contingencies-0021
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 450-20 (loss contingencies: recognition and measurement)'
  notes: Batch 18. Written from scratch; answers solved and every number and distractor computed in code.
stem: Marchwood Fabrication Co. retains the risk for product-liability claims rather than carrying third-party
  insurance. At December 31, Year 1, it has received and not yet paid $180,000 of claims for incidents
  that occurred before year end, all deemed probable and reasonably estimable. Its claims actuary also
  estimates that $95,000 of additional claims will likely be filed for incidents that occurred before
  year end but had not yet been reported to Marchwood Fabrication Co. as of December 31, Year 1, an amount
  it judges probable and reasonably estimable. Marchwood Fabrication Co.'s board has separately approved
  setting aside an additional $65,000 general contingency reserve for unspecified future claims, as a
  matter of prudent risk management rather than for any claim incurred before year end. What amount should
  Marchwood Fabrication Co. accrue for product-liability claims at December 31, Year 1?
choices:
- id: A
  text: $95,000
  rationale: Accrues only the estimated $95,000 of claims incurred but not reported, leaving out the $180,000
    already reported and unpaid.
- id: B
  text: $180,000
  rationale: Accrues only the $180,000 of claims already reported and unpaid, leaving out the claims incurred
    before year end but not yet reported.
- id: C
  text: $275,000
  rationale: 'Correct. Marchwood Fabrication Co. retains the risk for product-liability claims instead
    of transferring it to an insurer, so it accrues claims the same way an insurer would reserve for them:
    the $180,000 already reported and unpaid, plus the $95,000 of claims incurred before year end but
    not yet reported, both judged probable and reasonably estimable, for $275,000. The board''s separate
    general contingency reserve for unspecified future claims is not accrued; GAAP does not permit a general
    reserve for risks not tied to a specific, probable, estimable loss.'
- id: D
  text: $340,000
  rationale: Adds the board's $65,000 general contingency reserve for unspecified future claims to the
    $275,000 of claims actually probable and estimable. GAAP prohibits accruing a general or unspecified
    business risk; Marchwood Fabrication Co. accrues only claims that are probable and reasonably estimable.
answer: C
explanation: 'Correct. Marchwood Fabrication Co. retains the risk for product-liability claims instead
  of transferring it to an insurer, so it accrues claims the same way an insurer would reserve for them:
  the $180,000 already reported and unpaid, plus the $95,000 of claims incurred before year end but not
  yet reported, both judged probable and reasonably estimable, for $275,000. The board''s separate general
  contingency reserve for unspecified future claims is not accrued; GAAP does not permit a general reserve
  for risks not tied to a specific, probable, estimable loss.'
