id: far-subsequent-events-0007
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 855-10 (recognized and nonrecognized subsequent events)
  - ASC 210-10 (current assets and current liabilities)
  - ASC 330-10 (lower of cost and net realizable value)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Garsdale Co.''s loan agreement requires a current ratio of at least 1.75 at each December 31. Before
  considering subsequent events, Garsdale''s draft December 31, Year 1, balance sheet reports current
  assets of $1,800,000 and current liabilities of $900,000, which include a $180,000 accrued liability
  for a suit over an injury at Garsdale''s plant in Year 1. The statements will be issued on March 5,
  Year 2. After year-end: on January 18, Garsdale settled the suit for $260,000, payable in April; on
  February 3, Garsdale sold inventory that had cost $150,000 for $90,000, net of selling costs, because
  a competitor''s product introduced in October, Year 1, had made it obsolete; on February 14, a flood
  destroyed uninsured inventory that had cost $240,000; and on February 25, the board declared a cash
  dividend of $100,000, payable March 20. After any adjustments required, what current ratio should Garsdale
  report at December 31, Year 1, rounded to two decimal places?'
choices:
- id: A
  text: '1.50'
  rationale: Adds the whole $260,000 settlement to current liabilities without removing the $180,000 already
    accrued.
- id: B
  text: '1.53'
  rationale: Also removes the $240,000 of inventory destroyed in the February flood, a condition that
    arose after year-end. It is disclosed, not recognized.
- id: C
  text: '1.61'
  rationale: Also adds the $100,000 dividend declared in February as a liability. A dividend is a liability
    only once declared, after year-end here.
- id: D
  text: '1.78'
  rationale: Correct. ($1,800,000 − $60,000) ÷ ($900,000 + $80,000) = $1,740,000 ÷ $980,000.
answer: D
explanation: 'Recognized: the settlement of a Year 1 injury suit raises the accrued liability by $260,000
  − $180,000 = $80,000, and the sale of inventory made obsolete in October shows a year-end net realizable
  value $60,000 below cost. Not recognized (disclosed): the February flood and the February dividend declaration.
  Current assets = $1,800,000 − $60,000 = $1,740,000; current liabilities = $900,000 + $80,000 = $980,000.
  Current ratio = $1,740,000 ÷ $980,000 = 1.78, below the 1.75 the loan agreement requires.'
