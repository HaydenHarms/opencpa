id: far-subsequent-events-0019
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Application
review:
  status: reviewed
  references:
  - ASC 855-10 (recognized and nonrecognized subsequent events; evaluation through the date the statements
    are issued)
  notes: Batch 18. Written from scratch; answers solved and every number and distractor computed in code.
stem: Firthway Appliances Co.'s December 31, Year 1, financial statements will be issued on March 15,
  Year 2. At year end, Firthway Appliances Co. carried a $340,000 trade receivable from Major Buyer Corp.,
  which it judged fully collectible based on information available at that date. Major Buyer Corp.'s finances
  had, in fact, been deteriorating since October, Year 1, and Major Buyer Corp. had stopped paying nearly
  all of its trade creditors by December, Year 1, though Firthway Appliances Co. did not learn this until
  Major Buyer Corp. filed for bankruptcy on February 10, Year 2. The bankruptcy filing disclosed this
  history and Firthway Appliances Co. now expects to collect only $90,000 of the receivable. What adjustment
  should Firthway Appliances Co. make to its December 31, Year 1, financial statements?
choices:
- id: A
  text: $90,000
  rationale: Reports the $90,000 Major Buyer Corp. is now expected to pay as the adjustment, rather than
    the amount of the write-down.
- id: B
  text: $170,000
  rationale: Writes the receivable down by half of its $340,000 balance instead of down to the $90,000
    Firthway Appliances Co. now expects to collect based on the bankruptcy filing.
- id: C
  text: $250,000
  rationale: 'Correct. This is a recognized subsequent event: the bankruptcy filing provides evidence
    about a condition, Major Buyer Corp.''s deteriorating finances, that already existed at year end.
    Firthway Appliances Co. writes the receivable down to the $90,000 it now expects to collect, a $250,000
    adjustment ($340,000 − $90,000).'
- id: D
  text: $340,000
  rationale: Writes off the entire $340,000 receivable, ignoring the $90,000 Firthway Appliances Co. still
    expects to collect from Major Buyer Corp..
answer: C
explanation: 'Correct. This is a recognized subsequent event: the bankruptcy filing provides evidence
  about a condition, Major Buyer Corp.''s deteriorating finances, that already existed at year end. Firthway
  Appliances Co. writes the receivable down to the $90,000 it now expects to collect, a $250,000 adjustment
  ($340,000 − $90,000).'
