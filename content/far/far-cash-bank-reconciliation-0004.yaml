id: far-cash-bank-reconciliation-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (certified checks; checks written but not mailed at year-end)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Pashley Co.''s December 31 bank statement shows a balance of $248,600, and its general ledger cash
  account shows $242,350. The bookkeeper''s reconciliation lists deposits in transit of $21,450 and outstanding
  checks of $38,720. Further work finds: the outstanding check list includes a $4,800 check that the bank
  certified for a supplier on December 22 at Pashley''s request; the list also includes check no. 8812,
  for $6,350, which was written and recorded on December 30 but was still in the controller''s desk, unmailed,
  on January 6; on December 31 the bank deducted a $9,400 loan payment, which Pashley hasn''t recorded;
  and the bank credited Pashley''s account with a $3,180 dividend wired by a company whose shares Pashley
  holds, which Pashley hasn''t recorded. What cash balance should Pashley report at December 31?'
choices:
- id: A
  text: $237,680
  rationale: Deducts the $4,800 certified check as outstanding. The bank deducted it from Pashley's account
    when it certified the check, so the bank balance already reflects it.
- id: B
  text: $239,300
  rationale: Leaves out the $3,180 dividend the bank received for Pashley. It is cash Pashley hasn't recorded
    yet, so it is added to the book balance.
- id: C
  text: $242,480
  rationale: Correct. Bank $248,600 + $21,450 − $27,570 outstanding checks = book $242,350 + $6,350 −
    $9,400 + $3,180.
- id: D
  text: $251,880
  rationale: Leaves out the $9,400 loan payment the bank deducted. Pashley records it, reducing its book
    balance.
answer: C
explanation: 'Bank side: the certified check was deducted by the bank when certified, and the unmailed
  check hasn''t been issued, so true outstanding checks are $38,720 − $4,800 − $6,350 = $27,570. Correct
  balance = $248,600 + $21,450 − $27,570 = $242,480. Book side: $242,350 + $6,350 unmailed check restored
  − $9,400 loan payment + $3,180 dividend received = $242,480. The two sides agree.'
