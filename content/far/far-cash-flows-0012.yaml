id: far-cash-flows-0012
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 230-10-45-13 (cash flows from investing activities)
  - ASC 230-10-50-3 (noncash investing and financing activities)
  - ASC 360-10 (derecognition of equipment)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: Hetton Co.'s comparative balance sheets show equipment of $2,840,000 at January 1, Year 2, and $3,175,000
  at December 31, and accumulated depreciation on equipment of $1,120,000 and $1,205,000. Year 2 depreciation
  expense on equipment was $248,000. During Year 2, Hetton sold equipment that had cost $290,000 and reported
  a gain of $17,000 on the sale; it acquired a machine costing $180,000 by paying $40,000 in cash and
  signing a note payable to the seller for the rest; and it bought other equipment for cash. No other
  equipment was retired. What net cash used in investing activities do these equipment transactions produce
  in Hetton's Year 2 statement of cash flows?
choices:
- id: A
  text: $341,000
  rationale: Correct. Cash purchases $485,000 − proceeds $144,000.
- id: B
  text: $358,000
  rationale: 'Takes the sale proceeds to be the equipment''s $127,000 carrying amount. The $17,000 gain
    means Hetton received more than that: $144,000.'
- id: C
  text: $481,000
  rationale: Treats the whole $180,000 machine as a cash purchase. Only the $40,000 down payment was cash;
    the $140,000 note to the seller is a noncash investing and financing activity.
- id: D
  text: $485,000
  rationale: Leaves out the $144,000 received for the equipment sold. Proceeds from selling equipment
    are an investing inflow; only the gain is removed from operating activities.
answer: A
explanation: Accumulated depreciation removed with the equipment sold = $1,120,000 + $248,000 − $1,205,000
  = $163,000, so its carrying amount was $290,000 − $163,000 = $127,000 and the proceeds were $127,000
  + $17,000 gain = $144,000. Equipment acquired = $3,175,000 − $2,840,000 + $290,000 = $625,000, of which
  the $140,000 financed by the seller's note is noncash, leaving cash purchases of $485,000. Net cash
  used in investing activities = $485,000 − $144,000 = $341,000.
