id: far-ppe-rollforward-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 360-10-30 (cost of property, plant and equipment: sales tax, installation and testing)'
  - ASC 360-10-40 (derecognition at cost with accumulated depreciation)
  - ASC 360-10 (property, plant and equipment; repairs and maintenance)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Threlkeld Co.''s staff prepared this Year 2 rollforward of the equipment account (at cost): January
  1 balance $4,260,000; additions $815,000; disposals ($72,000); December 31 balance $5,003,000. The controller
  reviews the supporting documents. The additions are the capital expenditures report, which includes
  a new press recorded at its $420,000 invoice price, a delivery truck, and $46,000 of routine repair
  and maintenance work on existing machines; the $25,200 of sales tax on the press and the $31,000 paid
  to install and test it before use were charged to expense. The disposal is a machine sold in July for
  $80,000 that had cost $265,000 and had accumulated depreciation of $193,000 at the date of sale. In
  October, Threlkeld scrapped a fully depreciated lathe that had cost $94,000, and no entry was made.
  What equipment balance should the corrected rollforward show at December 31, Year 2?'
choices:
- id: A
  text: $4,726,200
  rationale: Correct. $5,003,000 − $46,000 + $56,200 − $193,000 − $94,000.
- id: B
  text: $4,772,200
  rationale: Keeps the $46,000 of routine repairs in the additions. Ordinary repairs and maintenance that
    don't extend an asset's life or improve it are expensed.
- id: C
  text: $4,820,200
  rationale: Leaves the $94,000 lathe in the equipment account. An asset that is scrapped is removed at
    cost, with its accumulated depreciation, even though it was fully depreciated.
- id: D
  text: $4,919,200
  rationale: Removes only the sold machine's $72,000 carrying amount from gross equipment. The equipment
    account carries cost, so the $265,000 cost comes out (and the $193,000 of accumulated depreciation
    comes out of that account).
answer: A
explanation: 'Additions: the routine repairs are expensed (− $46,000), and the press''s cost includes
  the sales tax and installation and testing (+ $56,200). Disposals at cost: the machine sold comes out
  at $265,000, not its $72,000 carrying amount (− $193,000 more), and the scrapped lathe comes out at
  $94,000. Corrected balance = $5,003,000 − $46,000 + $56,200 − $193,000 − $94,000 = $4,726,200.'
