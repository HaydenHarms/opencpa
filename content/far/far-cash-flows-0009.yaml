id: far-cash-flows-0009
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 230-10-45 (classification of cash receipts and payments, including insurance proceeds)
  - ASC 230-10-50 (noncash investing and financing activities)
  - ASC 230-10-20 (cash equivalents)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: During Year 1, Ingleby Co. sold equipment with a carrying amount of $70,000 for $95,000 in cash;
  bought machinery costing $500,000, paying $260,000 in cash and signing a note payable to the seller
  for the rest; received $120,000 from its insurer for a warehouse destroyed by fire; bought 90-day Treasury
  bills for $50,000; acquired land with a fair value of $200,000 by issuing common shares; received $8,000
  of interest on a note receivable; and paid $40,000 of principal on the machinery note. Ingleby treats
  investments with original maturities of three months or less as cash equivalents. What net cash used
  in investing activities results from these transactions in Ingleby's Year 1 statement of cash flows?
choices:
- id: A
  text: $45,000
  rationale: Correct. $260,000 paid for machinery − $95,000 sale proceeds − $120,000 insurance proceeds.
- id: B
  text: $95,000
  rationale: Treats the $50,000 of 90-day Treasury bills as an investing outflow. Under Ingleby's policy
    they are cash equivalents, so buying them doesn't change cash and cash equivalents.
- id: C
  text: $115,000
  rationale: Counts only the $25,000 gain on the equipment as an investing inflow. The whole $95,000 of
    proceeds is the investing inflow; the gain is subtracted in the operating section under the indirect
    method.
- id: D
  text: $165,000
  rationale: Classifies the $120,000 of insurance proceeds as operating. Proceeds from insurance claims
    are classified by the nature of the loss, and a destroyed building is an investing item.
answer: A
explanation: 'Investing outflow: $260,000 of cash paid for the machinery; the $240,000 financed by the
  seller is disclosed as a noncash activity. Investing inflows: $95,000 of proceeds from the equipment
  sale and $120,000 of insurance proceeds for the destroyed warehouse, which are classified by the nature
  of the loss. Net cash used = $260,000 − $95,000 − $120,000 = $45,000. The Treasury bills are cash equivalents,
  the land-for-shares exchange is noncash, interest received is operating, and principal paid on the note
  is financing.'
