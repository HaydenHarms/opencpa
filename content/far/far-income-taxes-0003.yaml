id: far-income-taxes-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: reviewed
  references:
  - ASC 740-10-25-20
  notes: Batch 01, revised after independent quality review. Adapted from legacy bank; answers re-solved,
    arithmetic checked in code, distractors rebuilt where needed.
stem: A company buys equipment for $500,000 and depreciates it straight-line over 5 years for book purposes
  ($100,000 per year). In Year 1, it deducts $200,000 of tax depreciation. The enacted tax rate for all
  years is 25%. What deferred tax balance exists at the end of Year 1?
choices:
- id: A
  text: $25,000 deferred tax asset
  rationale: Reverses the direction. Book basis above tax basis means higher future taxable income.
- id: B
  text: $25,000 deferred tax liability
  rationale: Correct. Book basis $400,000 exceeds tax basis $300,000 by $100,000; $100,000 × 25%.
- id: C
  text: $50,000 deferred tax liability
  rationale: Applies the rate to the full tax deduction instead of the basis difference.
- id: D
  text: $125,000 deferred tax liability
  rationale: Applies the rate to the equipment's cost.
answer: B
explanation: At year-end, the book basis is $400,000 and the tax basis is $300,000. The $100,000 excess
  is a taxable temporary difference, so the deferred tax liability is $100,000 × 25% = $25,000.
