id: far-nfp-contributed-services-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - 'ASC 958-605-25-16 (contributed services: creating or enhancing a nonfinancial asset; specialized
    skills)'
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: During Year 1, Fenwick Arts Center, a not-for-profit entity, received these donated services. A
  professional piano technician tuned and regulated the center's two concert pianos, work Fenwick would
  otherwise have paid $14,000 for. A group of volunteers assembled a prefabricated storage shed, from
  a kit Fenwick bought, on a slab behind the building, labor worth $9,000 at the rates a handyman service
  would charge. Volunteers stuffed and mailed Fenwick's fundraising letters, time worth $5,000 at local
  wage rates. Other volunteers mowed Fenwick's lawn throughout the year, time worth $4,000 at local wage
  rates. Ignoring depreciation, what amounts should Fenwick recognize for these services in Year 1 as
  contribution revenue and as expense?
choices:
- id: A
  text: $14,000 revenue; $14,000 expense
  rationale: Omits the $9,000 of shed assembly. Services that create or enhance a nonfinancial asset are
    recognized whether or not the people providing them have specialized skills (ASC 958-605-25-16).
- id: B
  text: $23,000 revenue; $14,000 expense
  rationale: 'Correct. Revenue: technician $14,000 + shed $9,000; the shed labor is capitalized, so only
    the technician''s $14,000 is expensed.'
- id: C
  text: $23,000 revenue; $23,000 expense
  rationale: Recognizes the shed assembly as revenue but expenses it. Contributed services that create
    a nonfinancial asset are capitalized as part of that asset (debit property), so only the technician's
    $14,000 is expensed.
- id: D
  text: $28,000 revenue; $19,000 expense
  rationale: Includes the $5,000 of volunteer time stuffing and mailing fundraising letters. That work
    needs no specialized skill and creates no nonfinancial asset, so it isn't recognized.
answer: B
explanation: 'Contributed services are recognized if they (a) create or enhance a nonfinancial asset,
  or (b) require specialized skills, are provided by people with those skills, and would typically need
  to be purchased if not donated (ASC 958-605-25-16). The technician''s work meets (b) and maintains existing
  assets, so it is revenue and expense of $14,000. The shed labor meets (a), whatever the volunteers''
  skills: revenue of $9,000, debited to the shed rather than to expense. Mailing letters and mowing meet
  neither test and aren''t recognized. Revenue = $14,000 + $9,000 = $23,000; expense = $14,000.'
