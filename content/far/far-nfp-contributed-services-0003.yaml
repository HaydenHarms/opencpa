id: far-nfp-contributed-services-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - 'ASC 958-605-25-16 (contributed services: creating or enhancing a nonfinancial asset; specialized
    skills)'
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: During Year 1, Fenwick Arts Center, a not-for-profit entity, received these donated services. A
  volunteer architect designed a new gallery wing, services Fenwick would otherwise have paid $22,000
  for. A group of volunteers with no construction training built a storage shed from a prefabricated kit,
  work worth $9,000 at the rates a handyman service would charge, enhancing Fenwick's property even though
  the volunteers used no specialized skill. A volunteer who is a database consultant spent a day helping
  organize Fenwick's annual raffle, time worth $6,000 at her usual consulting rate, work that didn't call
  on her database expertise. Other volunteers mowed Fenwick's lawn throughout the year, time worth $4,000
  at local wage rates. What amount should Fenwick recognize as contributed services revenue for Year 1?
choices:
- id: A
  text: $22,000
  rationale: Omits the $9,000 shed. Recognizing contributed services that create or enhance a nonfinancial
    asset doesn't require the volunteers who provide them to have specialized skills (ASC 958-605-25-16).
- id: B
  text: $31,000
  rationale: Correct. The architect's design work ($22,000) and the volunteer-built shed, which enhanced
    Fenwick's property ($9,000).
- id: C
  text: $35,000
  rationale: Includes the $4,000 of lawn mowing. Routine upkeep needs no specialized skill and doesn't
    enhance a nonfinancial asset, so it isn't recognized.
- id: D
  text: $37,000
  rationale: Includes the $6,000 of the database consultant's time helping organize the raffle. Her specialized
    skill wasn't used in its specialty that day, so those services aren't recognized.
answer: B
explanation: Contributed services are recognized if they (a) create or enhance a nonfinancial asset, whether
  or not the people providing them have specialized skills, or (b) require specialized skills, are provided
  by people with those skills, and would typically need to be purchased if not donated (ASC 958-605-25-16).
  The architect's design work meets both tests ($22,000); the shed meets only the first, but that is enough
  ($9,000). The consultant's specialized skill wasn't used in its specialty, and routine lawn care needs
  no special skill and creates no asset, so neither is recognized. Contributed services revenue = $31,000.
