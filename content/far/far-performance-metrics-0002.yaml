id: far-performance-metrics-0002
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Financial Statement Ratios and Performance Metrics
  skill: Application
review:
  status: reviewed
  references:
  - 'Financial statement analysis: EBITDA and asset turnover'
  notes: Batch 05. Written from scratch; answers solved and every number and distractor computed in code.
stem: For Year 2, Brand Co. reports revenue of $5,000,000 and net income of $400,000, after interest expense
  of $100,000, income tax expense of $120,000, and depreciation and amortization of $280,000. Total assets
  were $3,800,000 at the start of the year and $4,200,000 at the end. Using average total assets, what
  are Brand's EBITDA and asset turnover?
choices:
- id: A
  text: $620,000 EBITDA; 1.25 asset turnover
  rationale: Leaves out the $280,000 of depreciation and amortization, which EBITDA adds back.
- id: B
  text: $800,000 EBITDA; 1.25 asset turnover
  rationale: Leaves out the $100,000 of interest expense, which EBITDA adds back.
- id: C
  text: $900,000 EBITDA; 1.19 asset turnover
  rationale: Gets EBITDA right but divides revenue by ending total assets instead of the average.
- id: D
  text: $900,000 EBITDA; 1.25 asset turnover
  rationale: Correct. EBITDA = $400,000 + $100,000 + $120,000 + $280,000; asset turnover = $5,000,000
    ÷ $4,000,000.
answer: D
explanation: EBITDA = net income + interest + income taxes + depreciation and amortization = $400,000
  + $100,000 + $120,000 + $280,000 = $900,000. Asset turnover = revenue ÷ average total assets = $5,000,000
  ÷ [($3,800,000 + $4,200,000) ÷ 2] = 1.25.
