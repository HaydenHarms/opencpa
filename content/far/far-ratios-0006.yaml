  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: Brough Corp. computes its times-interest-earned ratio as earnings before interest expense and income
  taxes divided by interest expense. For Year 2, it reports net income of $642,000 after income tax expense
  of $214,000. During Year 2 it incurred $196,000 of interest on its borrowings, of which $46,000 was
  capitalized as part of the cost of a warehouse it was building; it paid $138,000 of interest in cash.
  What is Brough's Year 2 times-interest-earned ratio, rounded to two decimal places?
choices:
- id: A
  text: '4.28'
  rationale: Divides net income by interest expense. The numerator is earnings before interest expense
    and income taxes.
- id: B
  text: '5.13'
  rationale: Divides by the $196,000 of interest incurred. The $46,000 capitalized into the warehouse
    isn't interest expense; the ratio's denominator is the $150,000 expensed.
- id: C
  text: '5.28'
  rationale: Leaves out the $214,000 of income tax expense. Earnings before interest and taxes add back
    both interest expense and income tax expense to net income.
- id: D
  text: '6.71'
  rationale: Correct. ($642,000 + $214,000 + $150,000) ÷ $150,000.
answer: D
explanation: 'Interest expense is the interest incurred less the amount capitalized: $196,000 − $46,000
  = $150,000. Earnings before interest expense and income taxes = $642,000 + $214,000 + $150,000 = $1,006,000.
  Times interest earned = $1,006,000 ÷ $150,000 = 6.71. Cash interest paid doesn''t enter the ratio.'
