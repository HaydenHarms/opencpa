id: far-investments-fair-value-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Investments (Financial assets at fair value)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 320-10 (trading, available-for-sale and held-to-maturity debt securities)
  - ASC 321-10 (equity securities with readily determinable fair values)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Year 2, Kirkby Co. holds four investments: debt securities its treasury desk bought
  in November and turns over within weeks as prices move, with a cost of $150,000 and a fair value of
  $138,000; debt securities that Kirkby may sell before maturity if it needs cash, with an amortized cost
  of $300,000 and a fair value of $345,000; bonds maturing in Year 9 that the board has resolved to keep
  until they mature, which Kirkby''s cash forecasts show it can do, with an amortized cost of $480,000
  and a fair value of $455,000; and 3% of the common shares of a company listed on a national stock exchange,
  bought for $90,000 and worth $125,000. Kirkby has no significant influence over the listed company and
  expects to collect all contractual cash flows on its debt securities. What total carrying amount should
  Kirkby report for these investments on its December 31, Year 2, balance sheet?'
choices:
- id: A
  text: $1,008,000
  rationale: Carries only the trading securities at fair value and everything else at cost. Available-for-sale
    debt securities and equity securities with readily determinable fair values are also carried at fair
    value.
- id: B
  text: $1,043,000
  rationale: Reports the debt securities Kirkby may sell at their $300,000 amortized cost. Available-for-sale
    debt securities are carried at fair value, with unrealized gains and losses in other comprehensive
    income.
- id: C
  text: $1,063,000
  rationale: Reports the bonds Kirkby will hold to maturity at their $455,000 fair value. Held-to-maturity
    debt securities are carried at amortized cost.
- id: D
  text: $1,088,000
  rationale: Correct. $138,000 + $345,000 + $480,000 + $125,000.
answer: D
explanation: The securities bought for short-term resale are trading securities, carried at fair value
  ($138,000). The debt securities that may be sold are available for sale, also carried at fair value
  ($345,000). The board's resolution and the cash forecasts show both the intent and the ability to hold
  the bonds to maturity, so they are held to maturity and carried at amortized cost ($480,000), with no
  allowance because no credit losses are expected. The listed shares have a readily determinable fair
  value and no significant influence, so they are carried at fair value ($125,000). Total = $1,088,000.
