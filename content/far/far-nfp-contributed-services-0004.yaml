id: far-nfp-contributed-services-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - 'ASC 958-605-25-16 (contributed services: creating or enhancing a nonfinancial asset; specialized
    skills)'
  - ASC 958-605 (services received from personnel of an affiliate, ASU 2013-06)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: During Year 1, Brantley Health Outreach, a not-for-profit entity, began building a clinic, which
  it will finish in Year 2. It paid its general contractor $410,000 for work through December 31. A licensed
  architect donated the clinic's design drawings, work her firm would normally bill at $26,000. Brantley's
  affiliate, a regional hospital, assigned one of its construction project managers to oversee the clinic's
  construction part-time from March through December; the hospital kept paying her and charged Brantley
  nothing, and her pay and benefits for that time, $18,000, are about what an outside construction manager
  would have charged. Neighborhood volunteers handed out programs and served refreshments at the groundbreaking
  ceremony, time worth $3,000 at local wage rates. What should Brantley report at December 31, Year 1,
  as construction in progress, and as contribution revenue from contributed services for Year 1?
choices:
- id: A
  text: $410,000 construction in progress; $44,000 revenue
  rationale: Recognizes the donated services as revenue but expenses them, so construction in progress
    holds only the $410,000 paid to the contractor. Contributed services that create a nonfinancial asset
    are capitalized into that asset.
- id: B
  text: $436,000 construction in progress; $26,000 revenue
  rationale: Leaves out the project manager's $18,000. Services from an affiliate's personnel that directly
    benefit Brantley are recognized, and her supervision of the construction also creates a nonfinancial
    asset, so the services are recognized as revenue and capitalized into the building.
- id: C
  text: $436,000 construction in progress; $44,000 revenue
  rationale: Recognizes the project manager's $18,000 as revenue but expenses it instead of capitalizing
    it. Supervising the construction is part of the cost of creating the building, so it is added to construction
    in progress, as the architect's drawings are.
- id: D
  text: $454,000 construction in progress; $44,000 revenue
  rationale: Correct. Construction in progress = $410,000 + $26,000 + $18,000; revenue = $26,000 + $18,000.
answer: D
explanation: 'The architect''s drawings require specialized skills Brantley would otherwise buy, and both
  they and the project manager''s supervision create a nonfinancial asset, the clinic (ASC 958-605-25-16).
  Services that an affiliate''s personnel provide and that directly benefit Brantley are also recognized
  (ASC 958-605-25, as amended by ASU 2013-06), measured here at $18,000, the hospital''s cost, which is
  about their fair value. Each is recognized as contribution revenue and, because it creates the building,
  capitalized: construction in progress = $410,000 + $26,000 + $18,000 = $454,000; revenue = $26,000 +
  $18,000 = $44,000. The ceremony volunteers'' time needs no specialized skill and creates no asset, so
  it isn''t recognized.'
