id: far-nfp-contributed-services-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - 'ASC 958-605-25-16 (contributed services: creating or enhancing a nonfinancial asset; specialized
    skills)'
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: During Year 1, Brantley Health Outreach, a not-for-profit entity, received these donated services.
  A volunteer dentist provided free dental care at Brantley's clinic, care Brantley would otherwise have
  paid a local practice $26,000 for. Volunteer plumbers, tradespeople who normally charge for their work,
  renovated Brantley's community kitchen, replacing its fixtures and layout, labor worth $15,000. A professional
  interpreter translated for non-English-speaking families at Brantley's one-day benefits fair, work Brantley
  would otherwise have hired an agency to do, valued at $5,000 at her usual rate. Other volunteers answered
  phones at Brantley's front desk, time worth $7,000 at local wage rates. A retired engineer who serves
  on Brantley's board spent time reviewing Brantley's financial reports at board meetings, time valued
  at $9,000 at her former consulting rate. What amount should Brantley recognize as contributed services
  revenue for Year 1?
choices:
- id: A
  text: $41,000
  rationale: Leaves out the $5,000 interpreter. Translating for attendees at the fair uses her specialized
    skill, which Brantley would otherwise have paid an agency for, so it meets the second recognition
    test.
- id: B
  text: $46,000
  rationale: Correct. Dentist ($26,000) + kitchen renovation ($15,000) + interpreter ($5,000).
- id: C
  text: $53,000
  rationale: Includes the $7,000 of front-desk volunteers. Answering phones needs no specialized skill
    and creates no nonfinancial asset.
- id: D
  text: $55,000
  rationale: Includes the $9,000 of the board member's time. Reviewing financial reports as a board member
    is governance, not the specialized skill Brantley would otherwise purchase.
answer: B
explanation: Contributed services are recognized if they (a) create or enhance a nonfinancial asset, or
  (b) require specialized skills, are provided by people with those skills, and would typically need to
  be purchased if not donated (ASC 958-605-25-16). The dentist's care meets test (b) ($26,000); the plumbers'
  renovation enhances Brantley's kitchen, meeting test (a) regardless of their skill ($15,000); the interpreter's
  specialized skill is used in its specialty and Brantley would otherwise have hired an agency, meeting
  test (b) ($5,000). Front-desk volunteers need no specialized skill and create no asset, and the engineer
  is exercising board governance, not the specialized skill Brantley would otherwise purchase. Contributed
  services revenue = $46,000.
