    rationale: Spreads the remaining depreciable base over the original remaining life of 6 years. Ashgrove
      now expects only 5 more years of use.
  - id: D
    text: $552,750
    rationale: Spreads the remaining depreciable base over the revised 8-year total life instead of the
      5 years that remain at the date of the change.
