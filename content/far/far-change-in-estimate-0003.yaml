id: far-change-in-estimate-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Application
review:
  status: draft
  references:
  - 'ASC 250-10-45-17 (change in accounting estimate: prospective application)'
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Pelton Fixtures Co. bought equipment for $720,000, estimated a 10-year useful
  life and a $60,000 salvage value, and has depreciated it straight-line. On January 1, Year 5, after
  4 years of use, Pelton determines, based on new information about the equipment's condition, that its
  total useful life will be 8 years rather than 10, and revises the salvage value to $36,000; the depreciation
  method is unchanged. What carrying amount should Pelton report for the equipment at the end of Year
  5, after that year's depreciation?
choices:
- id: A
  text: $292,500
  rationale: Restates depreciation for the 4 years already recorded using the revised 8-year total useful
    life and $36,000 salvage value, as if the revision applied retroactively. A change in estimate is
    applied prospectively.
- id: B
  text: $342,000
  rationale: Ignores the revised $36,000 salvage value, depreciating the whole $456,000 carrying amount
    over the 4 remaining years. Only the carrying amount in excess of salvage value is depreciated.
- id: C
  text: $351,000
  rationale: Correct. Carrying amount $456,000 ($720,000 − 4 × $66,000) less Year 5 depreciation of $105,000
    (($456,000 − $36,000) ÷ 4).
- id: D
  text: $386,000
  rationale: Spreads the remaining depreciable base over the original remaining life of 6 years. Pelton
    now expects only 4 more years of use.
answer: C
explanation: 'A change in the estimated useful life or salvage value of a depreciable asset is a change
  in accounting estimate, applied prospectively from the date of the change (ASC 250-10-45-17). Annual
  depreciation before the change = ($720,000 − $60,000) ÷ 10 = $66,000. Carrying amount at the date of
  change = $720,000 − 4 × $66,000 = $456,000. The remaining depreciable base is spread over the revised
  remaining life of 8 − 4 = 4 years: ($456,000 − $36,000) ÷ 4 = $105,000 for Year 5. Carrying amount at
  the end of Year 5 = $456,000 − $105,000 = $351,000. Years already reported are not restated.'
