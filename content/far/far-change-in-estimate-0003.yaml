    at the end of Year 4, after that year's depreciation?
  choices:
  - id: A
    text: $510,000
    rationale: Correct. Carrying amount $624,000 ($900,000 − 3 × $92,000) less Year 4 depreciation of
      $114,000 (($624,000 − $54,000) ÷ 5).
  - id: B
    text: $513,600
    rationale: Keeps the original $72,000 salvage value when computing the new depreciation. Ashgrove
      revised the salvage estimate to $54,000 along with the useful life, and both revised estimates apply.
  - id: C
