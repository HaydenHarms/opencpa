id: far-lessee-operating-0006
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: reviewed
  references:
  - ASC 842-20-30-3 (private-company risk-free rate practical expedient)
  - ASC 842-10-15 (lease payments exclude a refundable security deposit)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: Antrobus Textiles Co., a private company that has elected the risk-free rate practical expedient
  for all its asset classes (ASC 842-20-30-3), leases warehouse space for 6 years under an operating lease.
  Annual payments of $54,000 are due each January 1, beginning at commencement, and Antrobus made the
  first payment on January 1, Year 1. Antrobus also paid the landlord a refundable security deposit of
  $10,000 at commencement, which isn't rent and will be returned, undamaged space permitting, when the
  lease ends. The risk-free rate for a 6-year lease term is 4.5%, which Antrobus uses instead of determining
  a rate implicit in the lease or its own incremental borrowing rate. What amount should Antrobus initially
  measure as its lease liability, immediately after the first payment?
choices:
- id: A
  text: $237,060
  rationale: Correct. $54,000 × 5.3900 = $291,060, less the $54,000 paid at commencement.
- id: B
  text: $247,060
  rationale: Adds the $10,000 security deposit to the liability. The deposit is refundable and isn't rent,
    so it is a separate deposit asset, not a lease payment (ASC 842-10-15).
- id: C
  text: $278,527
  rationale: Discounts the payments with the ordinary annuity factor, 5.1579, as if each payment were
    due at year end. Payments here are due at the start of each year, including at commencement.
- id: D
  text: $291,060
  rationale: Doesn't deduct the $54,000 payment Antrobus made at commencement. That payment reduces the
    liability at once.
answer: A
explanation: 'As a private company, Antrobus may elect to discount its leases at a risk-free rate instead
  of determining its incremental borrowing rate (ASC 842-20-30-3), which it has done here. The security
  deposit is refundable and isn''t rent, so it is recognized as a separate deposit asset, not part of
  the lease liability. Because payments are due at the start of each period, the liability uses an annuity-due
  factor: $54,000 × 5.3900 = $291,060, less the $54,000 paid at commencement, leaving $237,060.'
