id: far-lessee-operating-0006
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: draft
  references:
  - ASC 842-20-30-3 (discount rate; private-company risk-free rate election by class of asset, as amended
    by ASU 2021-09)
  - ASC 842-10-30-5 (lease payments)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: Antrobus Textiles Co., a private company, leases warehouse space for 6 years under an operating
  lease that begins January 1, Year 1. Rent is $54,000 a year, payable in advance each January 1, and
  Antrobus paid the Year 1 rent when the lease began. At commencement, Antrobus also gave the landlord
  a $10,000 security deposit, which comes back at the end of the lease if the space is returned undamaged.
  The rate implicit in the lease isn't readily determinable. For its real estate leases, Antrobus has
  elected to discount lease payments at a risk-free rate, which for a 6-year term is 4.5%; present value
  factors at 4.5% for 6 periods are 5.3900 for an annuity due and 5.1579 for an ordinary annuity. What
  lease liability should Antrobus report immediately after paying the Year 1 rent?
choices:
- id: A
  text: $237,060
  rationale: Correct. $54,000 × 5.3900 = $291,060, less the $54,000 paid at commencement.
- id: B
  text: $247,060
  rationale: Adds the $10,000 security deposit to the liability. A refundable deposit isn't a lease payment
    (ASC 842-10-30-5); it is a separate receivable from the landlord.
- id: C
  text: $278,527
  rationale: Discounts all 6 payments with the ordinary annuity factor ($54,000 × 5.1579), as if each
    were due at year-end. Rent is paid in advance, and the first payment has already been made.
- id: D
  text: $291,060
  rationale: Doesn't deduct the $54,000 Year 1 rent paid at commencement ($54,000 × 5.3900 = $291,060).
    The lease liability is the present value of payments not yet made.
answer: A
explanation: 'A lessee uses the rate implicit in the lease whenever it is readily determinable; when it
  isn''t, a private company may elect, by class of underlying asset, to use a risk-free rate instead of
  its incremental borrowing rate (ASC 842-20-30-3, as amended by ASU 2021-09). Antrobus made that election
  for real estate, so it discounts at 4.5%. A refundable security deposit isn''t a lease payment (ASC
  842-10-30-5); it is a separate receivable. Rent is paid in advance, so the 6 payments are an annuity
  due: $54,000 × 5.3900 = $291,060, less the $54,000 already paid, leaves $237,060.'
