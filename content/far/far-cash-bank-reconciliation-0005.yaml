id: far-cash-bank-reconciliation-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (outstanding checks carried from the prior month; deposits in transit;
    bank errors; recording errors)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Carrshield Co.''s December 31 bank statement shows a balance of $58,740, and its general ledger
  cash account shows $48,580. The November 30 reconciliation listed a deposit in transit of $4,215, which
  the bank credited on December 1, and two outstanding checks: no. 3306 for $1,875 and no. 3311 for $2,460.
  In December, Carrshield wrote checks no. 3347 for $3,190, no. 3348 for $3,850 (recorded in the cash
  disbursements journal as $8,350), no. 3349 for $2,745 and no. 3350 for $4,380. The checks paid by the
  bank in December were nos. 3306, 3347 and 3348, each for the amount written on it. Carrshield''s December
  31 deposit of $5,230 was credited by the bank on January 2. The December statement also shows a $45
  service charge, which Carrshield hasn''t recorded, and a $1,350 deposit belonging to another company,
  which the bank credited to Carrshield''s account in error. What cash balance should Carrshield report
  at December 31?'
choices:
- id: A
  text: $47,805
  rationale: Leaves out the $5,230 deposit made on December 31. The bank hadn't credited it by year-end,
    so it is a deposit in transit, added to the bank balance.
- id: B
  text: $48,535
  rationale: Works from the books without correcting check no. 3348. It cleared at $3,850, its correct
    amount, but was recorded as $8,350, so the books understate cash by $4,500.
- id: C
  text: $51,160
  rationale: Also deducts check no. 3306, which was outstanding at November 30 but cleared the bank in
    December.
- id: D
  text: $53,035
  rationale: Correct. $58,740 + $5,230 − ($2,460 + $2,745 + $4,380) − $1,350 = $48,580 − $45 + $4,500.
answer: D
explanation: 'Outstanding checks at December 31 are those written and not yet paid: no. 3311 from November
  ($2,460) and nos. 3349 and 3350 ($2,745 and $4,380), $9,585 in all; no. 3306 cleared in December. Bank
  side: $58,740 + $5,230 deposit in transit − $9,585 − $1,350 bank error = $53,035. Book side: $48,580
  − $45 service charge + $4,500 overstatement of check no. 3348 = $53,035. The November deposit in transit
  is already in the bank balance.'
