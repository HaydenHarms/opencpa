id: far-ppe-reconciliation-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 360-10 (depreciation; derecognition; fully depreciated assets)
  - ASC 250-10-45-17 (change in accounting estimate applied prospectively)
  notes: Batch 10. Written from scratch; answers solved and every number and distractor computed in code.
stem: At December 31, Year 3, Eshton Co.'s fixed-asset subledger shows accumulated depreciation of $2,514,000,
  and the general ledger shows $2,446,000. The controller's investigation finds three differences. A machine
  sold for cash on November 30, with accumulated depreciation of $164,000 at that date, was removed from
  the general ledger but is still in the subledger. The general ledger recorded $42,000 of Year 3 depreciation
  on a stamping press that was fully depreciated at the end of Year 2 and is still in use, while the subledger
  recorded none. Delivery trucks bought on January 1, Year 1, for $360,000 were depreciated straight-line
  over five years with no residual value until January 1, Year 3, when management concluded that their
  total useful life would be four years, still with no residual value; the subledger kept depreciating
  them over five years, while the general ledger first recorded an adjustment to bring their accumulated
  depreciation to what a four-year life would have produced and then recorded a year's depreciation over
  four years. What accumulated depreciation should Eshton report at December 31, Year 3?
choices:
- id: A
  text: $2,350,000
  rationale: 'Depreciates the trucks over the original five-year life ($72,000). After the revision, the
    $216,000 carrying amount is depreciated over the two remaining years: $108,000 a year.'
- id: B
  text: $2,386,000
  rationale: Correct. Ledger $2,446,000 − $42,000 − $18,000 = subledger $2,514,000 − $164,000 + $36,000.
- id: C
  text: $2,404,000
  rationale: 'Accepts the general ledger''s catch-up adjustment on the trucks. A change in useful life
    is a change in estimate, applied prospectively: the remaining carrying amount is spread over the remaining
    life, with no catch-up.'
- id: D
  text: $2,428,000
  rationale: Keeps the $42,000 of depreciation on the fully depreciated press. An asset's accumulated
    depreciation can't exceed its depreciable cost, so no further depreciation is recorded while it stays
    in use.
answer: B
explanation: 'The machine sold leaves the subledger: − $164,000. The press was fully depreciated, so the
  general ledger''s $42,000 is reversed. The trucks'' new life is a change in estimate, applied prospectively:
  at January 1, Year 3, their carrying amount was $360,000 − 2 × $72,000 = $216,000, depreciated over
  the two remaining years at $108,000 a year. The subledger recorded $72,000 ($36,000 too little); the
  general ledger recorded a catch-up of $36,000 plus $90,000, $126,000 in all ($18,000 too much). Subledger:
  $2,514,000 − $164,000 + $36,000 = $2,386,000. General ledger: $2,446,000 − $42,000 − $18,000 = $2,386,000.'
