id: far-fair-value-techniques-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Fair value measurements
  skill: Application
review:
  status: reviewed
  references:
  - ASC 820-10-35-5 and 35-5A (principal market; most advantageous market only when there is no principal
    market)
  - ASC 820-10-35-9B and 35-9C (transaction costs not deducted; transport costs deducted when location
    is a characteristic)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: Grampound Civil Co. acquired 24 identical used excavators as part of a group of assets and must
  measure their fair value under ASC 820 to allocate the purchase price. Grampound can access two markets
  for excavators like these at the measurement date. In the dealer market, about 1,900 of them change
  hands each year at $86,000 each; selling costs (commissions) are $4,300 a unit, and transporting them
  there would cost $1,800 a unit. In the online auction market, about 260 change hands each year at $91,000
  each; fees are $2,700 a unit, and transporting them there would cost $3,100 a unit. What is the fair
  value of the 24 excavators?
choices:
- id: A
  text: $1,917,600
  rationale: Deducts the $4,300 of transaction costs a unit. Transaction costs are used to identify the
    most advantageous market but aren't deducted from the price; transport costs are.
- id: B
  text: $2,020,800
  rationale: Correct. 24 × ($86,000 − $1,800).
- id: C
  text: $2,064,000
  rationale: Uses the $86,000 price without deducting the $1,800 a unit to transport the excavators to
    the dealer market. Location is a characteristic of the asset, so transport costs are deducted.
- id: D
  text: $2,109,600
  rationale: Uses the online auction market, where the price net of all costs is highest ($85,200 a unit).
    That is the most advantageous market, which is used only when there is no principal market. The dealer
    market, with far more activity, is the principal market.
answer: B
explanation: Fair value is measured in the principal market, the market with the greatest volume and level
  of activity for the asset, when one exists, even if another market would give a better price. The dealer
  market (1,900 a year) is the principal market. The price there is reduced by transport costs, because
  location is a characteristic of the asset, but not by transaction costs, which belong to the transaction
  rather than the asset (ASC 820-10-35-9B and 35-9C). Fair value = 24 × ($86,000 − $1,800) = $2,020,800.
  The online auction market's higher net price ($85,200 against $79,900) would matter only if there were
  no principal market.
