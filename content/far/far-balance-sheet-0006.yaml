id: far-balance-sheet-0006
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Balance sheet
  skill: Application
review:
  status: reviewed
  references:
  - ASC 210-10 (balance sheet classification)
  - ASC 310-10 (receivables; credit balances reported as liabilities)
  - ASC 505-20 (dividends)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Pellow Co.''s draft December 31, Year 1, balance sheet reports total assets of $2,840,000. The
  controller identifies these errors, none of which has been corrected: (1) on October 1, Pellow paid
  $36,000 for a one-year insurance policy and debited prepaid insurance, and no insurance expense has
  been recorded; (2) Year 1 depreciation of $14,000 on a delivery van bought in March was not recorded;
  (3) accounts receivable are reported net of $7,500 of customer credit balances arising from overpayments;
  (4) a cash dividend of $40,000, declared on December 18 and payable January 12, Year 2, was not recorded;
  and (5) no interest has been accrued on a $60,000, 9% note receivable that Pellow accepted from a customer
  on September 1, Year 1, with principal and interest due August 31, Year 2. What total assets should
  Pellow''s corrected balance sheet report?'
choices:
- id: A
  text: $2,799,300
  rationale: Removes the whole $36,000 premium from prepaid insurance. Only the three months from October
    through December have expired ($9,000); nine months of coverage remain an asset.
- id: B
  text: $2,818,800
  rationale: Leaves receivables net of the $7,500 of customer credit balances. Credit balances are liabilities,
    so receivables are reported at the total of the debit balances.
- id: C
  text: $2,826,300
  rationale: Correct. $2,840,000 − $9,000 expired insurance − $14,000 depreciation + $7,500 credit balances
    reclassified + $1,800 interest receivable.
- id: D
  text: $2,840,300
  rationale: Leaves out the $14,000 of unrecorded depreciation, which reduces the van's carrying amount.
answer: C
explanation: '(1) Three of the policy''s twelve months have expired: prepaid insurance falls by $36,000
  × 3/12 = $9,000. (2) Depreciation reduces the van''s carrying amount by $14,000. (3) Customer credit
  balances are liabilities, not reductions of receivables, so receivables increase by $7,500. (4) The
  declared dividend is a liability and a reduction of retained earnings; total assets don''t change. (5)
  Interest receivable for September–December: $60,000 × 9% × 4/12 = $1,800. Total assets = $2,840,000
  − $9,000 − $14,000 + $7,500 + $1,800 = $2,826,300.'
