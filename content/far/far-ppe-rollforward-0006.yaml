id: far-ppe-rollforward-0006
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Analysis
review:
  status: draft
  references:
  - 'ASC 360-10-30 (cost of property, plant and equipment: costs to bring an asset to its location and
    condition for use)'
  - Land improvements as a separate class of property, plant and equipment
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: The additions line of Indian Queens Fabrication Co.'s Year 2 rollforward of property, plant and
  equipment, at cost, is the capital expenditures report, which totals $640,000. Testing the report, the
  controller finds that Indian Queens paid a $4,800 fine when its own truck was stopped for carrying an
  overweight load while hauling a new press from the port, and added the fine to the press's cost; that
  the $6,500 premium to insure the press during its voyage from the manufacturer was charged to insurance
  expense; that the $11,200 premium for the press's first year of property coverage, which began when
  the press went into service, was added to its cost; and that the $52,000 cost of paving a new parking
  lot at the plant, where there was none before, was added to the buildings account, though Indian Queens
  records land improvements in a separate account depreciated over a shorter life. What total additions
  should the corrected rollforward report for Year 2?
choices:
- id: A
  text: $578,500
  rationale: Removes the $52,000 parking lot from additions because it was posted to buildings. A new
    parking lot is a land improvement, still property, plant and equipment; moving it between accounts
    doesn't change total additions.
- id: B
  text: $624,000
  rationale: Leaves the $6,500 premium for insuring the press in transit in expense. Insurance while the
    asset is being brought to its site is a cost of getting it ready for use and is capitalized.
- id: C
  text: $630,500
  rationale: Correct. $640,000 − $4,800 + $6,500 − $11,200; the parking lot is reclassified within property,
    plant and equipment.
- id: D
  text: $635,300
  rationale: Keeps the $4,800 overweight-load fine in the press's cost. A fine for breaking the law isn't
    a necessary cost of bringing the asset to its location; it is expensed.
answer: C
explanation: The cost of property, plant and equipment includes what is necessary to bring the asset to
  the condition and location for its intended use (ASC 360-10-30). Insurance during transit is such a
  cost, so the $6,500 is capitalized (+ $6,500). A fine for an overweight load is a penalty, not a necessary
  cost, and insurance after the press is in service is a period cost, so both come out (− $4,800 and −
  $11,200). The new parking lot is a land improvement; moving it out of buildings changes the account,
  not total property, plant and equipment, so additions don't change for it. Corrected additions = $640,000
  − $4,800 + $6,500 − $11,200 = $630,500.
