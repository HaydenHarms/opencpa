id: far-inventory-reconciliation-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10 (inventory; write-down to net realizable value)
  - ASC 606-10-55 (consignment arrangements; shipping terms)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Jagger Co.''s perpetual inventory subledger totals $1,311,160, and the general
  ledger inventory account shows $1,297,300. Investigating the difference, the controller finds: the subledger
  extends 1,600 units of part K-14 at $23.40 each, while the purchase invoices show $24.30; an $18,500
  write-down of obsolete goods to net realizable value was recorded in the general ledger but not in the
  subledger; goods costing $12,800 shipped to a customer FOB shipping point on December 31 were removed
  from the subledger, but the cost of goods sold entry was not posted to the general ledger; and the subledger
  includes goods costing $9,600 that a supplier delivered on December 29 for Jagger to sell on consignment.
  What amount should Jagger report as inventory at December 31?'
choices:
- id: A
  text: $1,281,620
  rationale: Subtracts the $1,440 pricing difference. The subledger used $23.40 instead of $24.30, so
    it is understated.
- id: B
  text: $1,284,500
  rationale: Correct. Subledger $1,311,160 + $1,440 − $18,500 − $9,600 = ledger $1,297,300 − $12,800.
- id: C
  text: $1,294,100
  rationale: Leaves the $9,600 of consigned goods in inventory. Jagger holds them for the supplier, which
    still owns them.
- id: D
  text: $1,303,000
  rationale: Treats the $18,500 write-down as a general ledger error. The write-down to net realizable
    value is correct; the subledger needs it too.
answer: B
explanation: 'Subledger: $1,311,160 + $1,440 pricing correction (1,600 × ($24.30 − $23.40)) − $18,500
  write-down − $9,600 consigned goods held for the supplier = $1,284,500. General ledger: $1,297,300 −
  $12,800 goods whose title passed to the customer at shipment = $1,284,500. The records agree at $1,284,500.'
