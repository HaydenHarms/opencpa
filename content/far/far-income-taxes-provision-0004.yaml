id: far-income-taxes-provision-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: reviewed
  references:
  - ASC 740-10-25 (temporary and permanent differences)
  - ASC 740-10-30 (current and deferred tax expense)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
  asOf: U.S. GAAP (ASC 740) and federal tax law in effect for 2026; the rate is as stated in the stem
stem: Oakhurst Corp. must work out both its Year 2 income taxes payable and its Year 2 income tax expense.
  Pretax financial income for the year is $640,000, which includes $50,000 of proceeds from company-owned
  life insurance on an executive's death, a nontaxable amount, and is stated after deducting $18,000 of
  nondeductible country club dues. Oakhurst books the full $120,000 gross profit on an installment sale
  in the year of sale, but on its tax return the gross profit is taxed only as collected under the installment
  method, and only $40,000 was collected (and taxed) this year. The enacted tax rate is 25% for every
  year, Oakhurst anticipates plenty of future taxable income, and during the year it remitted $110,000
  of estimated tax payments, carried on its books as a prepaid asset. Netting those prepayments against
  current tax, what should Oakhurst report as Year 2 income taxes payable, and what is its Year 2 income
  tax expense?
choices:
- id: A
  text: $22,000 payable; $152,000 expense
  rationale: Correct. Current tax $132,000 − $110,000 prepaid = $22,000 payable; expense = taxable income
    adjusted only for permanent differences, ($640,000 − $50,000 + $18,000) × 25% = $152,000.
- id: B
  text: $34,500 payable; $164,500 expense
  rationale: Taxes the $50,000 of life insurance proceeds. Proceeds from life insurance on an executive,
    where Oakhurst is the beneficiary, are a permanent difference excluded from taxable income and from
    tax expense.
- id: C
  text: $42,000 payable; $152,000 expense
  rationale: Taxes the full $120,000 installment sale gross profit currently, as books do, and records
    no deferred tax on it. For tax, Oakhurst uses the installment method and is taxed only on the $40,000
    collected this year; the remaining $80,000 gives rise to a deferred tax liability, which happens to
    leave total expense unchanged but understates current tax payable.
- id: D
  text: $132,000 payable; $152,000 expense
  rationale: Reports the whole $132,000 of current tax as payable, without applying the $110,000 of estimated
    payments Oakhurst already made.
answer: A
explanation: 'Taxable income = $640,000 − $50,000 (nontaxable, permanent) + $18,000 (nondeductible, permanent)
  − $80,000 (installment gross profit not yet taxed) = $528,000; current tax = $132,000, less $110,000
  of estimated payments = $22,000 payable. The installment sale creates a deferred tax liability of $80,000
  × 25%, which exactly offsets the current-tax effect of deferring that gross profit, so total expense
  equals the rate applied to book income adjusted only for the permanent differences: ($640,000 − $50,000
  + $18,000) × 25% = $152,000.'
