id: far-income-taxes-provision-0004
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: draft
  references:
  - ASC 740-10-25 (temporary and permanent differences)
  - ASC 740-10-30 (current and deferred tax expense)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
  asOf: U.S. GAAP (ASC 740) and federal tax law in effect for 2026; the rate is as stated in the stem
stem: Oakhurst Corp. discloses the current and deferred components of its income tax expense. Its pretax
  financial income for Year 2 is $640,000. That amount includes $50,000 of proceeds from company-owned
  life insurance on an executive who died during the year, with Oakhurst as beneficiary, under a policy
  that meets the tax law's requirements for excluding the proceeds, and is after deducting $18,000 of
  country club dues, which the tax law doesn't allow as a deduction. In Year 2, Oakhurst also sold land
  on installment terms and recognized the full $120,000 gain in its books; for tax it reports the gain
  under the installment method, and $40,000 of the gain relates to Year 2 collections. The enacted tax
  rate is 25% for all years. During Year 2, Oakhurst paid $110,000 of estimated tax, recorded as prepaid
  income taxes. What current income tax expense should Oakhurst disclose for Year 2?
choices:
- id: A
  text: $22,000
  rationale: Subtracts the $110,000 of estimated payments. They settle part of the liability (income taxes
    payable), but they don't reduce current tax expense, which is the tax on Year 2 taxable income.
- id: B
  text: $127,500
  rationale: Deducts the $18,000 of club dues for tax as well as for books. The tax law doesn't allow
    them, so they are added back to pretax income in computing taxable income.
- id: C
  text: $132,000
  rationale: Correct. ($640,000 − $50,000 + $18,000 − $80,000) × 25% = $528,000 × 25%.
- id: D
  text: $152,000
  rationale: Taxes the whole $120,000 gain currently, as books recognize it. On the tax return only the
    $40,000 collected is taxed in Year 2; the tax on the other $80,000 is deferred tax expense, not current.
    This figure is total income tax expense.
answer: C
explanation: 'Current tax expense is the tax on the year''s taxable income. Taxable income = $640,000
  − $50,000 (life insurance proceeds, excluded) + $18,000 (club dues, not deductible) − $80,000 (installment
  gain not yet taxed: $120,000 − $40,000) = $528,000. Current tax expense = $528,000 × 25% = $132,000.
  The $110,000 of estimated payments reduces income taxes payable, not expense, and the tax on the uncollected
  gain is deferred tax expense.'
