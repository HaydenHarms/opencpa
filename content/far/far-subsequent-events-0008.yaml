id: far-subsequent-events-0008
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 855-10 (subsequent events; evaluation through the date the statements are available to be issued
    for an entity that is not an SEC filer)
  - ASC 326-20 (allowance for credit losses)
  notes: Batch 08. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Langdale Co. is a private company that is not an SEC filer. Its December 31, Year 1, financial
  statements were available to be issued on April 2, Year 2, and Langdale delivered them to its lender
  on April 20. The draft allowance for credit losses is $64,000. It includes $12,000 for the $90,000 owed
  by Pryce Foods and $14,000 for the $35,000 owed by Ruskin Mills, and nothing specific for the $40,000
  owed by Stainton Traders, which was current and financially sound at year-end. After year-end: on February
  8, Pryce Foods, which had reported losses throughout Year 1, filed for bankruptcy, and Langdale now
  expects to collect 30% of Pryce''s balance; on March 3, a tornado destroyed Stainton''s only warehouse,
  and Langdale now expects to collect nothing from Stainton; and on April 10, Ruskin Mills, whose balance
  was 120 days past due at year-end and which had defaulted on its bank loans in November, Year 1, filed
  for bankruptcy. Langdale has not elected the ASU 2025-05 practical expedient or the related accounting
  policy election for current receivables. The draft''s $14,000 for Ruskin was management''s expected
  credit loss at year-end, based on all information then available, including the past-due balance and
  the loan default. What allowance for credit losses should those statements report at December 31, Year
  1?'
choices:
- id: A
  text: $64,000
  rationale: Makes no adjustment to the draft allowance.
- id: B
  text: $115,000
  rationale: Correct. $64,000 + ($63,000 expected loss on Pryce − $12,000 already provided).
- id: C
  text: $136,000
  rationale: Also raises the allowance for Ruskin Mills to its full $35,000 balance. Ruskin's bankruptcy
    came on April 10, after the statements were available to be issued on April 2, the date through which
    a company that is not an SEC filer evaluates subsequent events.
- id: D
  text: $155,000
  rationale: Also provides for the $40,000 owed by Stainton Traders. Stainton was sound at year-end; the
    March tornado is a condition that arose after year-end.
answer: B
explanation: 'A company that is not an SEC filer evaluates subsequent events through the date its statements
  are available to be issued, here April 2. Pryce''s bankruptcy on February 8 resulted from losses during
  Year 1, so it is evidence about a year-end condition: the expected loss is $90,000 − 30% collected =
  $63,000, and the allowance rises by $63,000 − $12,000 = $51,000. The tornado arose after year-end: disclose
  it, don''t recognize it. Ruskin''s bankruptcy on April 10 came after the available-to-be-issued date,
  so these statements don''t reflect it. Allowance = $64,000 + $51,000 = $115,000.'
