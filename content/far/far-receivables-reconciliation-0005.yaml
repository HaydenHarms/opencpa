id: far-receivables-reconciliation-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 310-10-45 (receivables from officers and employees reported separately from trade receivables)
  - Subsidiary ledger and control account reconciliation practice (finance charges; lockbox receipts;
    misposted payments)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Tracing differences between its records at December 31, Pensilva''s controller finds: in November,
  Pensilva advanced $18,000 to its operations manager for relocation costs, repayable through payroll
  deductions during Year 2, and recorded the advance in the control account and in a subledger account
  opened in the manager''s name; finance charges of $4,275 on overdue customer accounts were added to
  the customers'' subledger accounts in December, but no general ledger entry was made; customer remittances
  of $31,600 received in Pensilva''s bank lockbox on December 31 were recorded in the general ledger from
  the bank''s report but not posted to the customers'' accounts until January 2; and a $7,820 payment
  from Trematon Stores was credited to the account of Millbrook Grocers. Before these items are addressed,
  the accounts receivable subledger totals $986,050 and the general ledger control account shows $950,175.
  What amount should Pensilva report as trade accounts receivable, before any allowance, at December 31?'
choices:
- id: A
  text: $932,175
  rationale: Leaves out the $4,275 of finance charges billed to customers. They are owed by customers
    and are in the subledger; the general ledger entry is missing.
- id: B
  text: $936,450
  rationale: Correct. Control account $950,175 − $18,000 + $4,275; subledger $986,050 − $18,000 − $31,600.
- id: C
  text: $954,450
  rationale: Keeps the $18,000 relocation advance in trade receivables. A loan to an employee, repaid
    through payroll, isn't a receivable from a customer; it is reported separately as another receivable.
- id: D
  text: $968,050
  rationale: Leaves the $31,600 of December 31 lockbox receipts in customer balances. The cash was received
    at year-end and is in the general ledger; the subledger posting was simply late.
answer: B
explanation: 'Work out which record each finding affects. The relocation advance is in both records but
  isn''t a trade receivable, so it comes out of both: − $18,000. The finance charges are owed by customers
  and are missing only from the control account: + $4,275. The lockbox receipts reduce customer balances,
  and only the subledger is missing them: − $31,600 from the subledger. The misposted payment moves an
  amount between two customer accounts and doesn''t change the subledger total. Control account: $950,175
  − $18,000 + $4,275 = $936,450. Subledger: $986,050 − $18,000 − $31,600 = $936,450.'
