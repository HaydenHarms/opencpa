id: far-inventory-reconciliation-0006
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10 (inventory; write-down to net realizable value)
  - ASC 606-10-55-79 to 55-80 (consignment arrangements)
  - ASC 606-10-55-81 to 55-84 (bill-and-hold arrangements)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Year 2, Budleigh Tableware Co.''s perpetual inventory subledger totals $1,063,100,
  and its general ledger inventory account shows $1,068,200. Budleigh reports inventory write-downs in
  cost of goods sold. The controller''s investigation finds: goods costing $41,600 that Budleigh shipped
  in December to Sidmouth Interiors, a retailer that sells them on Budleigh''s behalf and returns any
  it doesn''t sell, were removed from both records and charged to cost of goods sold; goods that a customer
  returned on December 18, which had been sold for $29,400 and cost $18,900, were restored to the subledger
  at cost, but the general ledger entry debited inventory and credited cost of goods sold at the selling
  price; a $17,300 write-down of obsolete goods to net realizable value was recorded in the subledger
  but not in the general ledger; and goods costing $22,700 that a customer bought in December and asked
  Budleigh to hold until its new store opens in February, which are tagged with the customer''s name,
  ready to ship and can''t be used to fill other orders, were removed from the general ledger as sold
  but are still listed in the subledger. What net adjustment to Budleigh''s Year 2 cost of goods sold
  results from these findings?'
choices:
- id: A
  text: $13,800 decrease
  rationale: Correct. − $41,600 consigned goods + $10,500 return error + $17,300 write-down.
- id: B
  text: $24,300 decrease
  rationale: Ignores the return recorded at selling price. The general ledger credited cost of goods sold
    for $29,400 instead of the goods' $18,900 cost, understating it by $10,500.
- id: C
  text: $27,800 increase
  rationale: Leaves the $41,600 of goods at Sidmouth Interiors in cost of goods sold. The dealer sells
    them on Budleigh's behalf and returns any it doesn't sell, so Budleigh still controls them; they go
    back into inventory, reducing cost of goods sold.
- id: D
  text: $31,100 decrease
  rationale: Records the $17,300 write-down in the general ledger without charging cost of goods sold.
    Budleigh reports write-downs in cost of goods sold, so it rises by $17,300.
answer: A
explanation: 'Consigned goods remain Budleigh''s inventory until the dealer sells them, so $41,600 comes
  back into inventory in both records and out of cost of goods sold. The return should have restored the
  goods at cost: the general ledger credited cost of goods sold $10,500 too much, so cost of goods sold
  rises by $10,500 and the general ledger inventory falls by the same amount. The write-down is missing
  from the general ledger and is charged to cost of goods sold: + $17,300. The bill-and-hold sale stands
  (the customer requested it, the goods are identified as the customer''s, ready to ship and can''t be
  redirected), so only the subledger must remove the goods; cost of goods sold is unaffected. Net adjustment
  = − $41,600 + $10,500 + $17,300 = $13,800 decrease.'
