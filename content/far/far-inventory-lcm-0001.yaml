id: far-inventory-lcm-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Application
review:
  status: reviewed
  references:
  - ASC 330-10-35 (lower of cost or market for inventory measured using LIFO or the retail inventory method)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Wadsworth Co. uses the LIFO method and applies its inventory measurement rule to each product separately.
  Its normal profit margin is 20% of selling price. At December 31, its records show: product X: 2,000
  units, LIFO cost $15.00, replacement cost $13.00, selling price $18.00 and cost to complete and sell
  $2.00 per unit; product Y: 1,500 units, LIFO cost $22.00, replacement cost $21.00, selling price $24.00
  and cost to complete and sell $4.00 per unit; product Z: 800 units, LIFO cost $10.00, replacement cost
  $7.00, selling price $14.00 and cost to complete and sell $1.50 per unit. What inventory write-down
  should Wadsworth recognize at December 31?'
choices:
- id: A
  text: $3,000
  rationale: Applies the lower of cost and net realizable value. Wadsworth uses LIFO, so it applies the
    lower of cost or market, with replacement cost limited by the ceiling and floor.
- id: B
  text: $5,740
  rationale: Applies the floor but not the ceiling. Market can't exceed net realizable value.
- id: C
  text: $7,240
  rationale: Correct. X $4,000; Y $3,000; Z $240.
- id: D
  text: $7,900
  rationale: Uses replacement cost as market without applying the ceiling (net realizable value) or the
    floor (net realizable value less a normal profit margin).
answer: C
explanation: 'Inventory measured using LIFO is reported at the lower of cost or market. Market is replacement
  cost, but not more than net realizable value (the ceiling) or less than net realizable value minus a
  normal profit margin (the floor). Product X: ceiling $18.00 − $2.00 = $16.00; floor $16.00 − 20% × $18.00
  = $12.40; replacement cost $13.00 is between the floor and the ceiling, so market is replacement cost,
  $13.00; write-down ($15.00 − $13.00) × 2,000 = $4,000. Product Y: ceiling $24.00 − $4.00 = $20.00; floor
  $20.00 − 20% × $24.00 = $15.20; replacement cost $21.00 is above the ceiling, so market is the ceiling,
  $20.00; write-down ($22.00 − $20.00) × 1,500 = $3,000. Product Z: ceiling $14.00 − $1.50 = $12.50; floor
  $12.50 − 20% × $14.00 = $9.70; replacement cost $7.00 is below the floor, so market is the floor, $9.70;
  write-down ($10.00 − $9.70) × 800 = $240. Total write-down = $7,240.'
