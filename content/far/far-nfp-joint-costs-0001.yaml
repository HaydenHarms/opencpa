id: far-nfp-joint-costs-0001
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: 'General-purpose financial reporting: nongovernmental not-for-profit entities'
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-720-45-29
  - ASC 958-720-45-52
  notes: Batch 01. Adapted from legacy bank; answer re-solved, arithmetic checked in code, distractors
    rebuilt where needed.
stem: Sunrise Health Coalition runs a $200,000 direct-mail campaign combining health education content
  with a fundraising appeal. The activity meets the purpose, audience, and content criteria for joint-cost
  allocation. Using a reasonable allocation method, the coalition determines that 40% of the activity
  relates to program services. How are the costs reported?
choices:
- id: A
  text: $80,000 program services; $120,000 fundraising
  rationale: 'Correct. When all three criteria are met, joint costs are allocated between functions on
    a rational basis: 40% × $200,000 to program.'
- id: B
  text: $200,000 fundraising
  rationale: This is the result when any of the three criteria is not met. Here all three are met.
- id: C
  text: $100,000 program services; $100,000 fundraising
  rationale: Splits evenly with no basis. The allocation must follow a rational, systematic method, which
    produced 40/60.
- id: D
  text: $200,000 program services
  rationale: Ignores the fundraising component. Meeting the criteria permits allocation, not full program
    classification.
answer: A
explanation: If a joint activity meets the purpose, audience, and content criteria, costs are allocated
  between program and fundraising using a reasonable method. Program = 40% × $200,000 = $80,000; fundraising
  = $120,000. If any criterion fails, all costs are fundraising.
