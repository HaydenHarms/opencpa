id: far-consolidated-statements-0005
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Consolidated financial statements
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 810-10 (consolidation procedures: intercompany balances and transactions)'
  notes: Batch 05. Written from scratch; answers solved and every number and distractor computed in code.
stem: On July 1, Year 1, Pym Corp. lent $500,000 at 6% to its wholly owned subsidiary, Tovey Inc., with
  interest due each June 30. Both companies accrued interest at December 31. Pym's draft December 31,
  Year 1, consolidated balance sheet includes the note receivable and accrued interest receivable among
  its assets, and the note payable and accrued interest payable among its liabilities; the draft consolidated
  income statement includes $15,000 of interest revenue and $15,000 of interest expense. After correcting
  the draft, by how much should consolidated total assets decrease?
choices:
- id: A
  text: $0
  rationale: Leaves the balances in because eliminating both sides would not change net assets. Intercompany
    balances are eliminated from both total assets and total liabilities.
- id: B
  text: $500,000
  rationale: Eliminates the note but not the $15,000 of accrued interest receivable.
- id: C
  text: $515,000
  rationale: Correct. The $500,000 note receivable and $15,000 of accrued interest receivable are both
    intercompany.
- id: D
  text: $530,000
  rationale: Eliminates the accrued interest twice, once for each company's accrual.
answer: C
explanation: Consolidated statements present the group as one entity, so balances between parent and subsidiary
  are eliminated. Total assets decrease by the $500,000 note receivable and $15,000 of accrued interest
  receivable ($500,000 × 6% × 6/12); total liabilities decrease by the same $515,000; and the $15,000
  of interest revenue and expense are eliminated.
