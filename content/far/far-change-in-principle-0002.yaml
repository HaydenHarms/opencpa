id: far-change-in-principle-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 250-10-45-5 (retrospective application of a change in accounting principle: cumulative effect
    in opening retained earnings of the earliest period presented)'
  - ASC 250-10-45-23 (correction of an error in previously issued financial statements)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'In Year 3, Alness Hardware Co. changes its inventory method from LIFO to FIFO because FIFO better
  matches its flow of goods, and it can determine the effect on every prior period. Its inventories were:
  December 31, Year 1, LIFO $540,000 and FIFO $660,000; December 31, Year 2, LIFO $575,000 and FIFO $759,000.
  Also in Year 3, Alness found that a $36,000 invoice for repairs made in December, Year 1, had never
  been accrued; Alness paid it in January, Year 2, and charged it to Year 2 repairs expense. Alness''s
  retained earnings at January 1, Year 2, as originally reported, were $2,760,000. Its income tax rate
  is 25% for all years and all effects. In its comparative financial statements for Years 2 and 3, what
  retained earnings should Alness report at January 1, Year 2, as adjusted?'
choices:
- id: A
  text: $2,733,000
  rationale: Applies the change in inventory method prospectively, from Year 3. A change in accounting
    principle is applied retrospectively when its period-specific effects can be determined, so the earliest
    period presented carries the $90,000 cumulative effect.
- id: B
  text: $2,823,000
  rationale: Correct. $2,760,000 + $120,000 × 75% − $36,000 × 75%.
- id: C
  text: $2,850,000
  rationale: 'Leaves out the repairs invoice on the view that the error counterbalanced. It did, but only
    by the end of Year 2: at January 1, Year 2, Year 1 income was still overstated by $36,000 before tax,
    so opening retained earnings fall by $27,000.'
- id: D
  text: $2,871,000
  rationale: Uses the inventory difference at December 31, Year 2, $184,000 × 75%. The adjustment to January
    1, Year 2, retained earnings is the cumulative effect on periods before Year 2, measured by the difference
    at December 31, Year 1.
answer: B
explanation: 'The change to FIFO is applied retrospectively: the Years 2 and 3 statements are presented
  on FIFO, and the cumulative effect on periods before Year 2 adjusts retained earnings at January 1,
  Year 2. That effect is the higher Year 1 ending inventory under FIFO, $120,000, net of tax: + $90,000.
  The repairs error is corrected by restatement: Year 1 income was overstated by $36,000 (Year 2 income
  understated by the same amount, so the error had counterbalanced only by December 31, Year 2), so January
  1, Year 2, retained earnings fall by $27,000 after tax. Adjusted retained earnings = $2,760,000 + $90,000
  − $27,000 = $2,823,000.'
