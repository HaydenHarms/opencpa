id: far-nfp-statement-of-activities-0004
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of activities (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-225-45-14 (investment return reported net of external and direct internal investment expenses)
  - ASC 958-605-25-16 (contributed services)
  - ASC 958-360 (property and equipment of NFPs; depreciation)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Poolewe Food Pantry, a not-for-profit entity, reports total expenses of $1,864,000 in its draft
  Year 2 statement of activities. Reviewing the draft, the controller notes: (1) an accounting firm prepared
  Poolewe''s grant reports at no charge, work Poolewe would otherwise have had to pay for, with a fair
  value of $24,000, and nothing was recorded; (2) $17,500 of fees paid to an outside firm for managing
  Poolewe''s investment portfolio is reported in management and general expenses, and investment return
  is reported before those fees; (3) a delivery van bought for $60,000 on July 1, Year 2, was charged
  to program expenses; the van has a 5-year useful life and no residual value, and Poolewe depreciates
  vans straight-line by month; and (4) volunteers without special skills who staffed a fundraising phone
  bank gave time valued at $31,000, and nothing was recorded. What total expenses should Poolewe''s corrected
  statement of activities report?'
choices:
- id: A
  text: $1,810,500
  rationale: Removes the $60,000 van from expenses without recording depreciation. The van was in service
    for six months of Year 2, so $60,000 ÷ 5 × 6/12 = $6,000 of depreciation is an expense.
- id: B
  text: $1,816,500
  rationale: Correct. $1,864,000 + $24,000 − $17,500 − $60,000 + $6,000.
- id: C
  text: $1,834,000
  rationale: Leaves the $17,500 of external investment management fees in expenses. An NFP reports investment
    return net of external and direct internal investment expenses, so the fees are netted against the
    return.
- id: D
  text: $1,847,500
  rationale: Adds the $31,000 of phone-bank volunteers' time. Contributed services are recognized only
    if they create or enhance a nonfinancial asset or need specialized skills that would otherwise be
    bought; staffing a phone bank does neither.
answer: B
explanation: '(1) Donated services that need specialized skills and would otherwise be bought are recognized
  as revenue and expense: + $24,000. (2) Investment return is reported net of external investment expenses
  (ASC 958-225-45-14), so the fees come out of expenses: − $17,500. (3) The van is capitalized, and six
  months of depreciation are expensed: − $60,000 + $6,000. (4) The phone-bank volunteers'' time needs
  no specialized skills, so it is correctly not recognized. Corrected total expenses = $1,864,000 + $24,000
  − $17,500 − $60,000 + $6,000 = $1,816,500.'
