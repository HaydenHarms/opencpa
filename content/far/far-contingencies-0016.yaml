id: far-contingencies-0016
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: draft
  references:
  - ASC 330-10-35-17 to 35-18 (losses on firm purchase commitments)
  - ASC 606-10-32-25 (consideration payable to a customer)
  - ASC 606-10-32-10 (refund liabilities)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: Harmondsgate Textiles Co. has a noncancelable, unhedged commitment to buy 40,000 pounds of cotton
  yarn next year at a fixed $4.80 a pound; at year-end, the market price for the same delivery is $4.05
  a pound. Harmondsgate also sold 30,000 packs of towels during the year with a $2 mail-in cash rebate,
  claimable through March of next year; from experience with similar offers, Harmondsgate expects 35%
  of buyers to claim it, and it has paid $9,600 of claims so far. What total liability should Harmondsgate
  report at year-end for the purchase commitment and the rebate offer?
choices:
- id: A
  text: $41,400
  rationale: Correct. Commitment loss $30,000 + rebate refund liability $11,400.
- id: B
  text: $51,000
  rationale: Doesn't reduce the expected rebates for the $9,600 already paid; those claims are settled.
- id: C
  text: $80,400
  rationale: Assumes every buyer will claim the rebate. The refund liability is based on the 35% of buyers
    Harmondsgate expects to claim it.
- id: D
  text: $203,400
  rationale: Treats the whole $192,000 contract price as the liability, rather than only the $30,000 by
    which the contract price exceeds the market price.
answer: A
explanation: 'A loss on a noncancelable, unhedged purchase commitment is recognized when the market price
  falls below the contract price (ASC 330-10-35-17 to 35-18): 40,000 × ($4.80 − $4.05) = $30,000. Cash
  rebates are consideration payable to a customer, which reduces revenue (ASC 606-10-32-25); the rebates
  Harmondsgate expects to pay on sales already made are a refund liability (ASC 606-10-32-10): 30,000
  × 35% × $2 = $21,000 expected, less $9,600 paid = $11,400. Total liability = $30,000 + $11,400 = $41,400.'
