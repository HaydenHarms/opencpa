id: far-contingencies-0016
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: draft
  references:
  - ASC 330-10-35-17 to 35-18 (losses on firm purchase commitments, measured like inventory losses, as
    amended by ASU 2015-11)
  - ASC 460-10-25-6 and ASC 450-20-25-2 (assurance-type warranty costs accrued as a loss contingency)
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: Harmondsgate Textiles Co. has a noncancelable, unhedged commitment to buy 40,000 pounds of cotton
  yarn next year at a fixed $4.80 a pound; at year-end, the market price for the same delivery is $4.05
  a pound. Harmondsgate measures inventory at the lower of FIFO cost and net realizable value; the cotton
  yarn's net realizable value is its $4.05 market price, and no firm sales contracts cover the goods Harmondsgate
  will make from it. Harmondsgate also sold 30,000 towel warmers during the year with a warranty, running
  through March of next year, that it will repair any manufacturing defect; from experience, Harmondsgate
  expects 4% of the units to need a repair costing about $24 each, and it has spent $9,600 on repairs
  so far. What total liability should Harmondsgate report at year-end for the purchase commitment and
  the warranty?
choices:
- id: A
  text: $30,000
  rationale: Accrues nothing for warranty repairs not yet made. The cost of repairs expected under assurance-type
    warranties on units already sold is probable and estimable, so it is accrued.
- id: B
  text: $49,200
  rationale: Correct. Commitment loss $30,000 + warranty liability $19,200.
- id: C
  text: $58,800
  rationale: Doesn't reduce the expected warranty cost for the $9,600 already spent on repairs; that part
    is settled.
- id: D
  text: $740,400
  rationale: Assumes every unit sold will need a warranty repair. The accrual is based on the 4% of units
    Harmondsgate expects to need one.
answer: B
explanation: 'A loss on a noncancelable, unhedged purchase commitment is measured the same way as an inventory
  loss, here against net realizable value for a FIFO entity, and is recognized unless firm sales contracts
  protect it (ASC 330-10-35-17 to 35-18): 40,000 × ($4.80 − $4.05) = $30,000. An assurance-type warranty
  is a loss contingency: repair costs on units already sold are probable and can be estimated, so they
  are accrued when the units are sold (ASC 460-10-25-6; ASC 450-20-25-2): 30,000 × 4% × $24 = $28,800
  expected, less $9,600 already spent = $19,200. Total liability = $30,000 + $19,200 = $49,200.'
