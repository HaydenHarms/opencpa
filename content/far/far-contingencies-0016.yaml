id: far-contingencies-0016
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Application
review:
  status: draft
  references:
  - ASC 330-10-35-17 (losses on noncancelable purchase commitments)
  - 'ASC 450-20-25 (premium offers: liability for estimable redemption costs)'
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Harmondsgate Textiles Co. has a noncancelable, unhedged commitment to buy 40,000 units of cotton
  yarn next year at a fixed price of $4.80 each; the year-end market price for the same delivery is $4.05
  each. Separately, Harmondsgate offers a rebate-card premium offer with each unit it sells: 18,000 premiums
  have been issued and are expected to be redeemed, each at a cost to Harmondsgate of $3.50, and 11,000
  have been redeemed so far. What total liability should Harmondsgate report at year-end for the purchase
  commitment and the premium offer?'
choices:
- id: A
  text: $24,500
  rationale: Leaves out the $30,000 loss on the purchase commitment, treating it as executory and unrecognized
    even though it is noncancelable and enforceable and the loss is evident.
- id: B
  text: $30,000
  rationale: Leaves out the $24,500 liability for premiums Harmondsgate expects customers to redeem.
- id: C
  text: $54,500
  rationale: Correct. Commitment loss $30,000 + premium liability $24,500.
- id: D
  text: $216,500
  rationale: Treats the whole $192,000 contract price as a current loss, rather than only the $30,000
    by which the price exceeds the current market price.
answer: C
explanation: 'A noncancelable purchase commitment is recognized as a loss when the fixed price exceeds
  the market price (ASC 330-10-35-17): 40,000 × ($4.80 − $4.05) = $30,000. The premium liability is the
  estimated cost of premiums not yet redeemed: (18,000 − 11,000) × $3.50 = $24,500. Total liability =
  $30,000 + $24,500 = $54,500.'
