id: far-foreign-currency-transactions-0002
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Income statement
  skill: Application
review:
  status: reviewed
  references:
  - ASC 830-20 (foreign currency transactions; remeasurement of monetary items)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: Normanton Co., whose functional currency is the U.S. dollar, has three Year 1 transactions denominated
  in foreign currencies. On October 1, it sold goods to a Swiss customer for 600,000 Swiss francs (CHF),
  due February 15, Year 2. On November 1, it bought equipment from a Canadian supplier for 250,000 Canadian
  dollars (CAD) and paid the invoice on December 15. On December 1, it paid a Swiss supplier a nonrefundable
  advance of CHF 100,000 for goods to be delivered in March, Year 2. The dollar value of one Swiss franc
  was $1.10 on October 1, $1.11 on December 1 and $1.13 on December 31; one Canadian dollar was worth
  $0.72 on November 1 and $0.75 on December 15. What net foreign currency transaction gain or loss should
  Normanton report in its Year 1 income statement?
choices:
- id: A
  text: $7,500 net loss
  rationale: Recognizes only the realized $7,500 loss on the payable settled in December. The $18,000
    gain on the receivable still outstanding at year-end is recognized in Year 1 income too.
- id: B
  text: $10,500 net gain
  rationale: Correct. $18,000 gain on the receivable − $7,500 loss on the payable.
- id: C
  text: $18,000 net gain
  rationale: Leaves out the $7,500 loss on the payable because it was settled within the year. A realized
    exchange loss on settlement is a transaction loss in income.
- id: D
  text: $25,500 net gain
  rationale: 'Treats the $7,500 on the Canadian payable as a gain. The Canadian dollar strengthened before
    Normanton paid, so settling the payable cost more dollars: a loss.'
answer: B
explanation: 'Monetary items denominated in a foreign currency are remeasured at the current rate, and
  the change goes to income. The CHF receivable: 600,000 × ($1.13 − $1.10) = $18,000 gain. The CAD payable,
  settled December 15: 250,000 × ($0.75 − $0.72) = $7,500 more dollars paid, a loss. The equipment and
  the advance to the supplier are nonmonetary and stay at their historical rates. Net = $18,000 − $7,500
  = $10,500 net gain.'
