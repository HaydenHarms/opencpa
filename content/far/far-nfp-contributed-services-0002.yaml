id: far-nfp-contributed-services-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-605 (contributed services)
  notes: Batch 07. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Foxhollow Animal Shelter, a not-for-profit entity, received these volunteer services and gifts
  in Year 1: a licensed veterinarian performed surgeries for which Foxhollow would otherwise have paid
  a local clinic $28,000; a licensed electrician rewired Foxhollow''s kennel building, labor with a fair
  value of $14,000, using wiring and fixtures worth $6,000 donated by a supply store; an attorney answered
  phones at the front desk, time valued at $9,000 at her usual billing rate; a marketing firm ran an advertising
  campaign with a fair value of $22,000, which Foxhollow''s board says it would not have paid for; and
  community volunteers walked dogs, time valued at $17,000 at local wage rates. What contribution revenue
  from contributed services should Foxhollow recognize for Year 1?'
choices:
- id: A
  text: $28,000
  rationale: Recognizes only the veterinarian's services. The electrician's labor enhanced the kennel
    building, a nonfinancial asset, so it is recognized as well.
- id: B
  text: $42,000
  rationale: Correct. Veterinarian $28,000 + electrician $14,000.
- id: C
  text: $51,000
  rationale: Includes the attorney's $9,000. She has specialized skills, but answering phones doesn't
    use them and creates no asset, so the services aren't recognized.
- id: D
  text: $64,000
  rationale: Includes the $22,000 ad campaign. Specialized services are recognized only if the entity
    would typically need to buy them if not donated; Foxhollow would not have paid for the campaign.
answer: B
explanation: Contributed services are recognized only if they create or enhance a nonfinancial asset,
  or require specialized skills, are provided by people with those skills, and would typically need to
  be purchased if not donated. The veterinarian's surgeries meet the second test ($28,000), and the electrician's
  rewiring enhances the kennel building ($14,000). The attorney isn't using her specialized skills, Foxhollow
  would not have bought the ad campaign, and dog walking needs no specialized skills. The donated wiring
  is a gift in kind, not a service. Revenue = $28,000 + $14,000 = $42,000.
