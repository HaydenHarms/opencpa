id: far-cash-bank-reconciliation-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: draft
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (errors by the bank and by the depositor)
  notes: Batch 15. Written from scratch; answers solved and every number and distractor computed in code.
stem: Mevagissey Trawler Co.'s December 31 bank statement shows a balance of $61,200, which includes a
  $610 deposit the bank credited to Mevagissey's account in error; the deposit belongs to another of the
  bank's customers. The statement also shows $85 of interest the bank credited on the account, which Mevagissey
  hasn't recorded. Deposits in transit total $4,300 and outstanding checks total $8,750, including a $940
  check Mevagissey wrote and mailed to a supplier on December 29 that the supplier had not yet cashed
  by December 31. Mevagissey's general ledger cash account shows $56,055. What is Mevagissey's correct
  cash balance at December 31?
choices:
- id: A
  text: $56,055
  rationale: Leaves out the $85 of interest the bank credited on the account, which Mevagissey hasn't
    recorded.
- id: B
  text: $56,140
  rationale: Correct. $61,200 + $4,300 − $8,750 − $610 (bank side) = $56,055 + $85 (book side).
- id: C
  text: $56,750
  rationale: Leaves the $610 deposit that the bank credited to Mevagissey's account in error in the bank
    balance. It belongs to another of the bank's customers and must be removed.
- id: D
  text: $57,080
  rationale: Removes the $940 check Mevagissey wrote and mailed on December 29 from the outstanding list
    because the payee hadn't cashed it by year-end. A check mailed before year-end stays outstanding until
    it clears, however long that takes; no adjustment is needed.
answer: B
explanation: 'Bank side: $61,200 + $4,300 − $8,750 − $610 (removing the bank''s misdirected deposit) =
  $56,140. Book side: $56,055 + $85 (the uncredited interest) = $56,140. The $940 check mailed before
  year-end properly stays on the outstanding list until the bank pays it; the delay in cashing it, by
  itself, calls for no adjustment.'
