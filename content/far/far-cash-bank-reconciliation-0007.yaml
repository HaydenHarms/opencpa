id: far-cash-bank-reconciliation-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: draft
  references:
  - ASC 305-10 (cash; a postdated check is a receivable, not cash)
  - 'Bank reconciliation practice (adjusted balance per bank: deposits in transit, outstanding checks
    and bank errors)'
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: Newlyn Trawler Co.'s December 31 bank statement shows a balance of $61,200. The statement includes
  $420 of interest the bank credited for the quarter and a $2,240 automatic payment to the utility company
  that the bank deducted under Newlyn's standing authorization. It also shows Newlyn's December 27 deposit
  credited at $4,170; the deposit slip and Newlyn's records show $4,710, and the bank has agreed to correct
  the amount in January. Newlyn's list of deposits in transit totals $4,300. It includes a $1,850 check
  that a customer handed over on December 30, dated January 8 of the following year, which Newlyn recorded
  as a December 30 cash receipt and will deposit on its date. Outstanding checks total $8,750, and Newlyn's
  general ledger cash account shows $59,110. What adjusted (correct) balance per bank should Newlyn's
  December 31 bank reconciliation show?
choices:
- id: A
  text: $53,200
  rationale: Subtracts the $2,240 automatic payment on the bank side. The bank has already deducted it,
    so it is in the statement balance; it adjusts only the books.
- id: B
  text: $55,440
  rationale: Correct. $61,200 + ($4,300 − $1,850) − $8,750 + $540 encoding error.
- id: C
  text: $55,860
  rationale: Adds the $420 of interest to the bank side. The bank has already credited it, so it is in
    the $61,200 statement balance; it adjusts only the books.
- id: D
  text: $57,290
  rationale: Leaves the customer's $1,850 postdated check in deposits in transit. A check dated after
    year-end can't be deposited until its date, so it isn't in transit; it is still a receivable at December
    31.
answer: B
explanation: 'The bank side starts from the statement and adjusts for items the bank hasn''t yet recorded
  correctly. The postdated check can''t be deposited until January, so it comes out of deposits in transit:
  $4,300 − $1,850 = $2,450. The bank credited the December 27 deposit at $4,170 instead of $4,710, a bank
  error of $540 that is added back. The interest and the automatic payment are already in the statement
  balance; they adjust only the books. Adjusted balance per bank = $61,200 + $2,450 − $8,750 + $540 =
  $55,440. Check against the books: $59,110 + $420 − $2,240 − $1,850 = $55,440.'
