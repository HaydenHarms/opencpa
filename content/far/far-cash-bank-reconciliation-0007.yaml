id: far-cash-bank-reconciliation-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: draft
  references:
  - ASC 305-10 (cash; a postdated check is a receivable, not cash)
  - Bank reconciliation practice (errors by the bank and by the depositor)
  notes: Batch 15, revision 2 (blind verifier and gate findings applied). Written from scratch; answers
    solved and every number and distractor computed in code.
stem: Newlyn Trawler Co.'s December 31 bank statement shows a balance of $61,200. It includes a $1,460
  deposit that belongs to another of the bank's customers but was credited to Newlyn's account, $420 of
  interest the bank credited for the quarter, and a $2,240 automatic payment to the utility company that
  the bank deducted under Newlyn's standing authorization; Newlyn hasn't recorded the interest or the
  payment. Newlyn's list of deposits in transit totals $4,300. It includes a $1,850 check that a customer
  handed over on December 30, dated January 8 of the following year, which Newlyn recorded as a December
  30 cash receipt and will deposit on its date. Outstanding checks total $8,750, and Newlyn's general
  ledger cash account shows $57,110. What is Newlyn's correct cash balance at December 31?
choices:
- id: A
  text: $53,020
  rationale: Leaves out the $420 of interest the bank credited on the account, which Newlyn hasn't recorded.
- id: B
  text: $53,440
  rationale: 'Correct. Bank side: $61,200 + ($4,300 − $1,850) − $8,750 − $1,460 = $53,440. Book side:
    $57,110 + $420 − $2,240 − $1,850 = $53,440.'
- id: C
  text: $54,900
  rationale: Leaves the $1,460 deposit the bank credited to Newlyn's account in error in the bank balance.
    It belongs to another of the bank's customers and must be removed.
- id: D
  text: $55,290
  rationale: Counts the customer's $1,850 postdated check as cash. A check dated after year-end can't
    be deposited until its date, so it is still a receivable at December 31; it comes out of deposits
    in transit and out of book cash.
answer: B
explanation: 'Bank side: remove the $1,460 deposit the bank credited to Newlyn in error, and take the
  postdated $1,850 check out of deposits in transit, because it can''t be deposited until January: $61,200
  + ($4,300 − $1,850) − $8,750 − $1,460 = $53,440. Book side: add the $420 of interest, subtract the $2,240
  automatic payment, and reverse the $1,850 receipt, since a postdated check is still a receivable at
  year-end: $57,110 + $420 − $2,240 − $1,850 = $53,440. Both sides agree at $53,440.'
