id: far-cash-bank-reconciliation-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: draft
  references:
  - ASC 305-10 (cash; a postdated check is a receivable, not cash)
  - Bank reconciliation practice (errors by the bank are corrected on the bank side; unrecorded items
    adjust the books)
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: Newlyn Trawler Co.'s December 31 bank statement shows a balance of $61,200. It reflects a $1,460
  check drawn by another of the bank's customers that the bank charged to Newlyn's account in error and
  has agreed to reverse, $420 of interest the bank credited for the quarter, and a $2,240 automatic payment
  to the utility company that the bank deducted under Newlyn's standing authorization; Newlyn hasn't recorded
  the interest or the payment. Newlyn's list of deposits in transit totals $4,300. It includes a $1,850
  check that a customer handed over on December 30, dated January 8 of the following year, which Newlyn
  recorded as a December 30 cash receipt and will deposit on its date. Outstanding checks total $8,750,
  and Newlyn's general ledger cash account shows $60,030. What net adjustment should Newlyn make to its
  general ledger cash balance at December 31?
choices:
- id: A
  text: $1,820 decrease
  rationale: Counts the customer's $1,850 postdated check as cash. A check dated after year-end can't
    be deposited until its date, so it is still a receivable at December 31; the December 30 receipt is
    reversed.
- id: B
  text: $3,670 decrease
  rationale: Correct. + $420 interest − $2,240 automatic payment − $1,850 postdated check = $3,670 decrease;
    the bank's error is corrected on the bank side.
- id: C
  text: $4,090 decrease
  rationale: Leaves out the $420 of interest the bank credited on the account, which Newlyn hasn't recorded.
- id: D
  text: $5,130 decrease
  rationale: Also records the $1,460 check the bank charged to Newlyn's account in error. It was drawn
    by another of the bank's customers; the bank will reverse the charge, so it is an addition on the
    bank side, not an entry in Newlyn's books.
answer: B
explanation: 'Book side: record the $420 of interest, record the $2,240 automatic payment, and reverse
  the $1,850 receipt, since a postdated check can''t be deposited until January and is still a receivable
  at year-end: $420 − $2,240 − $1,850 = a decrease of $3,670. The $1,460 check belongs to another depositor;
  the bank will reverse the charge, so it is added back on the bank side and doesn''t touch Newlyn''s
  books. Check against the bank side: $61,200 + ($4,300 − $1,850) − $8,750 + $1,460 = $56,360, and $60,030
  − $3,670 = $56,360.'
