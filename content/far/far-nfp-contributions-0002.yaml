id: far-nfp-contributions-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-605-25 (unconditional promises to give; intentions to give, such as revocable bequests, not
    recognized)
  - ASC 958-605-30 (contributions measured at fair value; promises to give at present value)
  - ASC 958-320 (gains and losses on investments after receipt)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: During Year 1, Gorran Animal Rescue, a not-for-profit entity, received the following. On December
  31, a donor signed an unconditional promise to pay Gorran $60,000 on each December 31 of Years 2, 3
  and 4; Gorran measures such promises at present value using a 5% discount rate, and the present value
  of an ordinary annuity of 1 for three periods at 5% is 2.7232. A local company donated kennel equipment
  that Gorran uses in its programs; the equipment's fair value was $48,000, and its carrying amount in
  the company's records was $21,000. A donor gave Gorran corporate bonds with a fair value of $125,000
  on the date of the gift, which Gorran sold three weeks later for $119,500. A longtime supporter told
  Gorran's director that she has left Gorran $250,000 in her will. What total contribution revenue should
  Gorran recognize for Year 1?
choices:
- id: A
  text: $309,392
  rationale: Records the equipment at the donor's $21,000 carrying amount. Contributed nonfinancial assets
    are measured at their fair value when received, $48,000.
- id: B
  text: $330,892
  rationale: Records the bonds at the $119,500 Gorran received when it sold them. The contribution is
    measured at the bonds' fair value on the date of the gift, $125,000; the later difference is a loss
    on sale, not contribution revenue.
- id: C
  text: $336,392
  rationale: Correct. $60,000 × 2.7232 = $163,392; + $48,000 + $125,000.
- id: D
  text: $353,000
  rationale: Records the pledge at the $180,000 total to be received. An unconditional promise to give
    that will be collected over more than a year is measured at the present value of the future payments,
    $163,392.
answer: C
explanation: 'Contributions are measured at fair value when received (ASC 958-605-30). The pledge is unconditional
  and is measured at the present value of the payments: $60,000 × 2.7232 = $163,392. The equipment is
  recognized at its $48,000 fair value, not the donor''s carrying amount. The bonds are recognized at
  their $125,000 fair value on the date of the gift; the sale three weeks later gives a separate loss
  of $5,500. A bequest in a living person''s will is revocable, so it isn''t a promise to give. Contribution
  revenue = $163,392 + $48,000 + $125,000 = $336,392.'
