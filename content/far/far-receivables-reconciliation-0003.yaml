id: far-receivables-reconciliation-0003
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Trade receivables
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 310-10 (receivables)
  - Subsidiary ledger and control account reconciliation practice
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'At December 31, Barraclough Supply''s accounts receivable subledger totals $742,350, and the general
  ledger control account shows $755,200. The controller''s investigation finds: a $3,850 credit memo for
  a customer''s returned goods was posted to that customer''s subledger account twice; the accounts receivable
  column of the December cash receipts journal was underfooted by $2,700 before the total was posted to
  the control account; a $6,300 customer account written off in December was removed from the subledger,
  but the write-off was never posted to the general ledger; and a $4,100 payment from one customer was
  posted to another customer''s subledger account. Before any allowance for credit losses, what amount
  should Barraclough report as accounts receivable?'
choices:
- id: A
  text: $738,500
  rationale: Subtracts the duplicated $3,850 credit memo from the subledger again instead of adding it
    back.
- id: B
  text: $742,350
  rationale: Uses the subledger as recorded. The $3,850 credit memo was posted twice, so the subledger
    is understated by that amount.
- id: C
  text: $746,200
  rationale: Correct. Subledger $742,350 + $3,850 = control account $755,200 − $2,700 − $6,300.
- id: D
  text: $752,500
  rationale: Doesn't post the $6,300 write-off to the control account. The account was written off, so
    it comes out of the general ledger too.
answer: C
explanation: 'Subledger: $742,350 + $3,850 duplicated credit memo reversed = $746,200. The misposted payment
  moves between two customer accounts and doesn''t change the total. Control account: $755,200 − $2,700
  for the underfooted receipts (receivables were credited too little) − $6,300 write-off not yet posted
  = $746,200. The records agree at $746,200.'
