id: far-income-taxes-provision-0005
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: draft
  references:
  - ASC 740-10-30-5 (measuring deferred tax assets and liabilities; valuation allowance)
  - ASC 740-10-25 (temporary differences)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
  asOf: U.S. GAAP (ASC 740) and federal tax law in effect for 2026; the rate is as stated in the stem
stem: Alresford Corp. records its Year 2 tax provision at December 31, keeping its deferred tax asset,
  deferred tax liability and valuation allowance in separate accounts. Taxable income for Year 2 is $540,000,
  and the enacted tax rate is 25% for all years. Alresford's only temporary differences are prepaid expenses,
  deducted for tax when paid, of $160,000 at January 1 and $210,000 at December 31, and its allowance
  for credit losses, deductible for tax when receivables are written off, of $90,000 at January 1 and
  $70,000 at December 31. The valuation allowance against the deferred tax asset was $5,000 at January
  1; after updating its forecasts, Alresford sets it at $12,000 at December 31. What deferred income tax
  expense should Alresford record for Year 2?
choices:
- id: A
  text: $10,500
  rationale: Treats the $7,000 increase in the valuation allowance as a deferred tax benefit. A larger
    allowance means less of the asset will be realized, which increases expense.
- id: B
  text: $14,500
  rationale: Treats the $5,000 decrease in the deferred tax asset as a benefit. A decrease in a deferred
    tax asset increases deferred tax expense, just as an increase in a deferred tax liability does.
- id: C
  text: $17,500
  rationale: Leaves out the $7,000 increase in the valuation allowance. Raising the allowance against
    a deferred tax asset is deferred tax expense.
- id: D
  text: $24,500
  rationale: Correct. $12,500 increase in the deferred tax liability + $5,000 decrease in the deferred
    tax asset + $7,000 increase in the valuation allowance.
answer: D
explanation: 'Deferred tax expense is the year''s change in the deferred tax accounts. The prepaid expenses
  are a taxable temporary difference: the deferred tax liability rises by ($210,000 − $160,000) × 25%
  = $12,500, an expense. The allowance for credit losses is a deductible temporary difference: the deferred
  tax asset falls by ($90,000 − $70,000) × 25% = $5,000, also an expense. The valuation allowance rises
  by $12,000 − $5,000 = $7,000, an expense, because less of the asset is expected to be realized (ASC
  740-10-30-5(e)). Deferred tax expense = $12,500 + $5,000 + $7,000 = $24,500. The $135,000 of current
  tax ($540,000 × 25%) is recorded in the same entry but isn''t deferred.'
