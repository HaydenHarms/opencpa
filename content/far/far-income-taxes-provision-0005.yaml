id: far-income-taxes-provision-0005
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting for income taxes
  skill: Application
review:
  status: reviewed
  references:
  - ASC 740-10 (current and deferred tax expense)
  - ASC 740-10-30-5 (valuation allowance)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
  asOf: U.S. GAAP (ASC 740) and federal tax law in effect for 2026; the rate is as stated in the stem
stem: Alresford Corp. posts its tax provision as one combined entry at year-end, carrying its deferred
  tax asset, deferred tax liability and the valuation allowance against that asset in separate ledger
  accounts. Taxable income for Year 2 comes to $540,000, taxed at the 25% rate enacted for every year.
  Alresford began the year with cumulative taxable temporary differences of $160,000 and deductible temporary
  differences of $90,000, carrying a $5,000 allowance against the deferred tax asset those create; by
  year-end the temporary differences had grown to $210,000 and $70,000, and a revised forecast calls for
  the allowance to stand at $12,000 instead. For the entry recording this provision, what amount belongs
  on the debit side of income tax expense?
choices:
- id: A
  text: $145,500
  rationale: Credits income tax expense for the $7,000 increase in the valuation allowance. Increasing
    an allowance against a deferred tax asset increases, not decreases, income tax expense.
- id: B
  text: $149,500
  rationale: Debits income tax expense for the $5,000 change in the deferred tax asset in the same direction
    as the change in the deferred tax liability. An increase in a deferred tax asset is a deferred tax
    benefit, which reduces expense; a decrease increases it.
- id: C
  text: $152,500
  rationale: Leaves out the $7,000 increase in the valuation allowance against the deferred tax asset.
    Alresford debits income tax expense for an increase in the allowance, just like an increase in the
    net deferred tax liability.
- id: D
  text: $159,500
  rationale: Correct. Current tax $135,000 + $12,500 increase in the deferred tax liability − ($-5,000)
    change in the deferred tax asset + $7,000 increase in the valuation allowance.
answer: D
explanation: The entry debits income tax expense and credits income taxes payable for current tax, $540,000
  × 25% = $135,000. The deferred tax liability increases by ($210,000 − $160,000) × 25% = $12,500, a credit
  and a debit to expense. The deferred tax asset changes by ($70,000 − $90,000) × 25% = $-5,000; a decrease
  is a debit to expense. The valuation allowance increases by $12,000 − $5,000 = $7,000, also debited
  to expense, because a larger allowance means less of the deferred tax asset will be realized. Total
  debit to income tax expense = $135,000 + $12,500 − ($-5,000) + $7,000 = $159,500.
