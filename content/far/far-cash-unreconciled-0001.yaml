id: far-cash-unreconciled-0001
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (errors by the bank and by the depositor)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Wexford Co.''s June 30 bank reconciliation shows an adjusted bank balance of $48,640 after deposits
  in transit and outstanding checks, and an adjusted book balance of $47,685 after recording the bank''s
  charges and collections, leaving an unreconciled difference of $955. Investigating, the controller finds:
  a customer''s check for $1,450 was recorded in the cash receipts journal as $1,540; check 5120, for
  $1,315, was recorded twice in the cash disbursements journal; and the bank recorded Wexford''s June
  18 deposit of $2,300 as $2,030, an error the bank has agreed to correct. What adjustment should Wexford
  make to its general ledger cash balance?'
choices:
- id: A
  text: $955 increase
  rationale: Books the whole $955 unreconciled difference. Part of it is the bank's error, which the bank
    corrects.
- id: B
  text: $1,225 increase
  rationale: Correct. $1,315 duplicated check added back − $90 receipt overstatement.
- id: C
  text: $1,315 increase
  rationale: Corrects only the duplicated check. The receipt was also recorded $90 too high.
- id: D
  text: $1,405 increase
  rationale: Adds the $90 receipt error instead of subtracting it. The receipt was recorded as $1,540
    instead of $1,450, overstating cash.
answer: B
explanation: 'Book errors: the duplicated check understated cash by $1,315, and the receipt recorded as
  $1,540 instead of $1,450 overstated it by $90. The ledger adjustment is $1,315 − $90 = a $1,225 increase,
  giving $48,910. The bank''s $270 understatement of the deposit is corrected by the bank: $48,640 + $270
  = $48,910, so both sides agree.'
