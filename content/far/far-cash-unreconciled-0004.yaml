id: far-cash-unreconciled-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: draft
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (errors by the bank and by the depositor; unlocated differences)
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'Lerryn Supply Co.''s accountant could not reconcile the November 30 bank statement. Her reconciliation
  shows an adjusted bank balance of $58,900, after adding deposits in transit and subtracting outstanding
  checks, while the general ledger cash account, after recording the bank''s charges and credits, shows
  $62,270. The controller traces the $3,370 difference and finds: the deposits in transit include a $1,240
  deposit made on November 27, which the bank credited on November 28 and which appears on the November
  statement; a $3,400 wire transfer, recorded as received because a customer''s remittance advice said
  it had been sent, was misdirected by the customer''s bank to another company''s account and never reached
  Lerryn; and a $650 check to replenish petty cash was entered twice in the cash disbursements journal.
  No other errors can be found, and Lerryn will write off whatever difference remains as a cash shortage.
  What cash shortage should Lerryn record?'
choices:
- id: A
  text: $620
  rationale: Accepts the reconciliation's $58,900 adjusted bank balance. The $1,240 deposit of November
    27 already appears on the November statement, so counting it again as a deposit in transit overstates
    the bank side by $1,240.
- id: B
  text: $1,860
  rationale: Correct. Corrected book balance $62,270 − $3,400 + $650 = $59,520; corrected bank balance
    $58,900 − $1,240 = $57,660; shortage = $59,520 − $57,660.
- id: C
  text: $3,370
  rationale: Writes off the whole $3,370 difference without first correcting the double-counted deposit,
    the misdirected wire and the duplicate disbursement.
- id: D
  text: $5,260
  rationale: Leaves the $3,400 wire in book cash. The customer's bank sent it to another company's account,
    so Lerryn never received it and the receipt must be reversed (the customer still owes the amount).
answer: B
explanation: 'Correct each side first. Bank side: the $1,240 deposit is already in the statement balance,
  so it isn''t in transit: $58,900 − $1,240 = $57,660, the true cash balance. Book side: reverse the $3,400
  wire that never arrived and reverse the duplicate $650 disbursement: $62,270 − $3,400 + $650 = $59,520.
  The books still show $59,520 − $57,660 = $1,860 more cash than the bank holds, and with no other error
  to be found, that is the cash shortage to write off.'
