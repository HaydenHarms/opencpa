id: far-cash-unreconciled-0004
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice (errors by the bank and by the depositor)
  notes: Batch 15. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Tywardreath Supply Co.''s bank reconciliation, after deposits in transit and outstanding checks,
  shows an adjusted bank balance of $58,900 at November 30. Its general ledger cash account, after recording
  the bank''s service charges and collections already identified, shows $60,330, an unreconciled difference
  of $1,430. Investigating, the controller finds: a $2,300 wire transfer that a customer''s remittance
  advice said was sent to pay its account was actually misdirected by the customer''s bank to another
  company''s account, and was never credited to Tywardreath''s account, though the collections department
  recorded it as received; a $180 fee the bank charged for honoring Tywardreath''s stop-payment request
  on an earlier check has not been recorded; and a $1,050 petty-cash replenishment check was recorded
  twice in the cash disbursements journal. What is Tywardreath''s correct cash balance at November 30?'
choices:
- id: A
  text: $57,850
  rationale: Leaves the $1,050 petty-cash replenishment check recorded twice in the cash disbursements
    journal.
- id: B
  text: $58,900
  rationale: Correct. $60,330 − $2,300 − $180 + $1,050 = $58,900, agreeing with the adjusted bank balance.
- id: C
  text: $59,080
  rationale: Leaves out the $180 fee the bank charged for honoring Tywardreath's stop-payment request,
    which hasn't been recorded.
- id: D
  text: $61,200
  rationale: Keeps the $2,300 wire transfer as a collection. The customer's bank sent it to another company's
    account, so Tywardreath never received it.
answer: B
explanation: 'The adjusted bank balance, after deposits in transit and outstanding checks, is already
  correct at $58,900. On the book side: the $2,300 wire was never actually received, since the customer''s
  bank sent it to the wrong account, so it comes out; the $180 stop-payment fee reduces cash and hasn''t
  been recorded; and the duplicate $1,050 disbursement overstated total disbursements, so it is added
  back: $60,330 − $2,300 − $180 + $1,050 = $58,900.'
