id: far-lessee-operating-0007
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: draft
  references:
  - ASC 842-20-25-6 (operating lease cost; variable payments not based on an index or a rate)
  - ASC 842-10-30-5 (lease payments net of lease incentives)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: 'On January 1, Year 1, Inkberrow Retail Co. leases retail space for 5 years, which it classifies
  as an operating lease. Rent, due each December 31, is $70,000 in Year 1 and falls each year after that:
  $62,000 in Year 2, $54,000 in Year 3, $46,000 in Year 4 and $38,000 in Year 5. At commencement, the
  landlord paid Inkberrow $25,000 in cash as a leasehold improvement allowance. Inkberrow also reimburses
  the landlord each year for its pro-rata share of the property taxes actually assessed on the building;
  the reimbursement for Year 1 is $9,000. What total lease cost should Inkberrow recognize for Year 1?'
choices:
- id: A
  text: $49,000
  rationale: Leaves out the $9,000 of property tax reimbursement. It is a variable payment that isn't
    based on an index or a rate, so it isn't part of the straight-line calculation, but it is still lease
    cost, recognized as incurred.
- id: B
  text: $58,000
  rationale: Correct. ($270,000 total payments − $25,000 incentive) ÷ 5 = $49,000, plus $9,000 of variable
    property tax reimbursement.
- id: C
  text: $63,000
  rationale: Spreads the full $270,000 of payments without deducting the $25,000 leasehold improvement
    allowance. Lease incentives received reduce the lease payments recognized as cost over the term.
- id: D
  text: $79,000
  rationale: Uses the Year 1 cash payment of $70,000 instead of the straight-line average. Operating lease
    cost is recognized straight-line over the term, regardless of the payment schedule.
answer: B
explanation: 'For an operating lease, the fixed payments net of lease incentives received are recognized
  straight-line over the lease term (ASC 842-20-25-6(a)), unless another systematic basis better represents
  the pattern in which the lessee uses the space; nothing suggests one does, and a falling rent schedule
  doesn''t change the straight-line pattern: ($270,000 total payments − $25,000 incentive) ÷ 5 = $49,000.
  The property tax reimbursement doesn''t depend on an index or a rate, so it is excluded from the lease
  payments and recognized as incurred (ASC 842-20-25-6(b)): $9,000. Total lease cost = $49,000 + $9,000
  = $58,000.'
