  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Ashford Corp. reports Year 2 net income of $600,000. Its total stockholders' equity was $5,000,000
  at January 1 and $5,400,000 at December 31. Both amounts include $1,000,000 of 6% cumulative, nonconvertible
  preferred stock that was outstanding all year, and Ashford declared and paid the full year's preferred
  dividend. What was Ashford's return on common stockholders' equity for Year 2, based on average common
  equity?
choices:
- id: A
  text: 10.4%
  rationale: Divides by average total equity, including the $1,000,000 of preferred stock. The denominator
    is common equity only.
- id: B
  text: 12.3%
  rationale: Divides by ending common equity instead of the average for the year.
- id: C
  text: 12.9%
  rationale: Correct. ($600,000 − $60,000) ÷ $4,200,000.
- id: D
  text: 14.3%
  rationale: Doesn't subtract the $60,000 preferred dividend. Return on common equity uses income available
    to common stockholders.
answer: C
explanation: Income available to common stockholders = $600,000 − $60,000 preferred dividend (6% × $1,000,000)
  = $540,000. Average common equity = ($5,000,000 + $5,400,000) ÷ 2 − $1,000,000 preferred = $4,200,000.
  Return on common equity = $540,000 ÷ $4,200,000 = 12.9%.
