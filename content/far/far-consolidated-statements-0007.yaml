id: far-consolidated-statements-0007
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Consolidated financial statements
  skill: Application
review:
  status: reviewed
  references:
  - ASC 810-10-45 (elimination of intercompany profit; wholly owned subsidiaries)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Brandt Corp. owns 100% of Cole Inc. During Year 1, Brandt sold Cole goods for $200,000 at its usual
  price of cost plus 25%, and Cole sold Brandt goods at its usual gross margin of 30% of the selling price.
  At December 31, Year 1, Cole's inventory of $250,000 includes goods bought from Brandt for $60,000,
  and Brandt's inventory of $400,000 includes goods bought from Cole for $50,000. In preparing the consolidated
  balance sheet, what amount should Brandt report as inventory at December 31, Year 1?
choices:
- id: A
  text: $540,000
  rationale: Removes the full intercompany prices. Only the unrealized profit is eliminated; the goods
    stay in consolidated inventory at the selling affiliate's cost.
- id: B
  text: $620,000
  rationale: Computes the profit on Brandt's sales as 25% of the $60,000 selling price. A 25% markup on
    cost is 25/125 of the selling price, or $12,000.
- id: C
  text: $623,000
  rationale: Correct. $650,000 − $12,000 unrealized profit on Brandt's sales − $15,000 on Cole's sales.
- id: D
  text: $635,000
  rationale: Eliminates only the profit on goods Cole sold to Brandt. The unrealized profit on Brandt's
    sales to its subsidiary is eliminated too.
answer: C
explanation: 'Consolidated inventory is carried at the group''s original cost, so the unrealized intercompany
  profit in ending inventory is eliminated, from both directions when the subsidiary is wholly owned.
  Goods from Brandt: a 25% markup on cost is 25/125 of the price, so $60,000 × 25/125 = $12,000. Goods
  from Cole: $50,000 × 30% = $15,000. Inventory = $400,000 + $250,000 − $12,000 − $15,000 = $623,000.
  The $200,000 of intercompany sales affects the elimination of sales and cost of goods sold, not ending
  inventory.'
