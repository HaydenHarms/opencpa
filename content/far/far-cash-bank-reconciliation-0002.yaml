id: far-cash-bank-reconciliation-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Cash and cash equivalents
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 305-10 (cash)
  - Bank reconciliation practice
  notes: Batch 03. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Dunmore Co.''s general ledger cash balance at March 31 is $34,625, and its bank statement shows
  $35,200. The controller finds: deposits in transit of $4,100; outstanding checks of $6,300; a $45 bank
  service charge not yet recorded; a customer''s $1,200 electronic payment received by the bank and not
  yet recorded; a $500 check drawn by another company that the bank charged to Dunmore''s account in error;
  and a $2,280 customer deposit that Dunmore recorded twice in its cash receipts journal. After the reconciliation,
  what adjustment should Dunmore make to its general ledger cash balance?'
choices:
- id: A
  text: $1,125 decrease
  rationale: Correct. −$45 + $1,200 − $2,280 = −$1,125, bringing the ledger to $33,500, which agrees with
    the adjusted bank balance.
- id: B
  text: $1,155 increase
  rationale: Records the service charge and the electronic payment but not the duplicate $2,280 deposit,
    which overstates the ledger.
- id: C
  text: $1,625 decrease
  rationale: Also deducts the $500 bank error in the ledger. The bank's error is corrected by the bank;
    Dunmore's books are right for that item.
- id: D
  text: $3,525 decrease
  rationale: Deducts the $1,200 electronic payment instead of adding it. Cash the bank received for Dunmore
    increases Dunmore's cash.
answer: A
explanation: 'Bank side: $35,200 + $4,100 deposits in transit − $6,300 outstanding checks + $500 bank
  error = $33,500. Book side: $34,625 − $45 service charge + $1,200 electronic payment − $2,280 duplicate
  deposit = $33,500. Only the book-side items need journal entries: a net decrease of $1,125.'
