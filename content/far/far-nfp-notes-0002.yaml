id: far-nfp-notes-0002
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Notes to financial statements (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 958-205-50 (endowment disclosures: net asset composition by type of fund; underwater funds)'
  - ASC 958-205-45 (underwater endowment funds reported in net assets with donor restrictions, as amended
    by ASU 2016-14)
  - 'ASC 958-205-20 (glossary: donor-restricted endowment fund, including term endowments; board-designated
    quasi-endowment)'
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Helston Learning Trust, a not-for-profit entity, is reviewing the draft endowment note for its
  June 30, Year 2, financial statements. The note''s table of endowment net assets by type of fund reports
  donor-restricted endowment funds of $2,805,000 and no board-designated endowment funds. That amount
  is the sum of: the $1,465,000 fair value of the Scholarship Fund, created with gifts of $1,200,000 that
  donors require Helston to hold in perpetuity; the $800,000 of original gifts to the Library Fund, which
  donors also require Helston to hold in perpetuity and whose investments have fallen in value to $712,000;
  and investments of $540,000 that Helston''s board voted to set aside for long-term support and may release
  by a later vote. The draft omits the Music Fund, a gift that its donor requires Helston to invest for
  ten years before spending it, whose investments are worth $250,000 at June 30. What amount should the
  corrected note report as donor-restricted endowment funds?'
choices:
- id: A
  text: $2,427,000
  rationale: Correct. $1,465,000 + $712,000 + $250,000.
- id: B
  text: $2,515,000
  rationale: Reports the Library Fund at its $800,000 of original gifts. Before ASU 2016-14, the shortfall
    of an underwater endowment fund was charged to unrestricted net assets, leaving the original gift
    in restricted net assets; now the fund is reported in net assets with donor restrictions at its $712,000
    fair value, and the shortfall is disclosed.
- id: C
  text: $2,805,000
  rationale: Accepts the draft's $2,805,000, which reports the Library Fund at its original gifts, includes
    the board-designated investments and omits the term endowment.
- id: D
  text: $2,967,000
  rationale: Keeps the $540,000 that the board set aside. A board-designated (quasi-) endowment is without
    donor restrictions, because the board can reverse its own decision; the note shows it separately as
    a board-designated fund.
answer: A
explanation: Donor-restricted endowment funds are funds a donor requires to be invested in perpetuity
  or for a specified term, reported in net assets with donor restrictions (ASC 958-205). The Scholarship
  Fund is included at its $1,465,000 fair value, appreciation included, because returns stay with donor
  restrictions until appropriated. Since ASU 2016-14, an underwater fund is reported at its fair value
  in net assets with donor restrictions, so the Library Fund is $712,000, and the $88,000 shortfall below
  the original gifts is disclosed. The Music Fund is a term endowment ($250,000). The board-designated
  investments are without donor restrictions and are shown as a separate, board-designated fund. Donor-restricted
  endowment funds = $1,465,000 + $712,000 + $250,000 = $2,427,000.
