id: far-income-statement-0005
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Income statement
  skill: Application
review:
  status: reviewed
  references:
  - ASC 360-10 (capitalization and depreciation)
  - ASC 460-10 (assurance-type warranties)
  - ASC 606-10-25 (transfer of control; shipping terms)
  - ASC 250-10 (prior-period adjustments only through retained earnings)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Tunstall Corp.''s draft Year 2 income statement reports income before income taxes of $760,000.
  The controller identifies these errors: (1) equipment costing $90,000, bought and placed in service
  on July 1, Year 2, was charged to repairs and maintenance expense; it has a five-year life and no residual
  value, and Tunstall depreciates equipment straight-line from the month it is placed in service; (2)
  no warranty expense was recorded for the assurance-type warranties on Year 2 sales, whose estimated
  future repair cost is $22,000, and no claims were paid in Year 2; (3) a $31,000 loss on the sale of
  a warehouse in Year 2 was debited directly to retained earnings; and (4) sales include $48,000 for goods
  shipped on December 30 under FOB destination terms and received by the customer on January 4, Year 3,
  and their $30,000 cost was charged to cost of goods sold. Ignoring income taxes, what is Tunstall''s
  corrected income before income taxes?'
choices:
- id: A
  text: $740,000
  rationale: Reverses the $48,000 sale but leaves its $30,000 cost in cost of goods sold. Under FOB destination
    the goods were still Tunstall's inventory at year-end, so their cost comes out of cost of goods sold
    too.
- id: B
  text: $770,000
  rationale: Correct. $760,000 + $90,000 − $9,000 depreciation − $22,000 warranty − $31,000 loss − ($48,000
    − $30,000) on the sale reversed.
- id: C
  text: $779,000
  rationale: Capitalizes the equipment but records no depreciation on it. Six months of depreciation ($9,000)
    belong in Year 2.
- id: D
  text: $801,000
  rationale: Leaves the $31,000 loss in retained earnings. A loss on selling a warehouse is part of income;
    only prior-period error corrections go directly to retained earnings.
answer: B
explanation: '(1) The equipment is capitalized, which removes $90,000 of expense, and depreciated for
  six months: $90,000 ÷ 5 × 6/12 = $9,000. (2) Assurance-type warranty costs are accrued when the goods
  are sold: − $22,000. (3) The loss on the warehouse belongs in income: − $31,000. (4) Under FOB destination,
  control passes when the customer receives the goods, in Year 3, so the $48,000 sale and its $30,000
  cost both come out of Year 2: − $18,000. Corrected income = $760,000 + $90,000 − $9,000 − $22,000 −
  $31,000 − $18,000 = $770,000.'
