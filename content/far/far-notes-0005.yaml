id: far-notes-0005
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Notes to financial statements
  skill: Application
review:
  status: reviewed
  references:
  - ASC 470-10-50 (disclosure of long-term debt maturities)
  - ASC 842-20-50 (lessee maturity analysis)
  - ASC 470-10-45 (short-term obligations expected to be refinanced)
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Quarmby Corp.''s draft note on long-term debt at December 31, Year 1, reports principal maturities
  of $410,000 for Year 2. The controller identifies these errors and omissions in that amount: it includes
  $64,000 of payments due in Year 2 under Quarmby''s operating leases; it omits a $250,000 term loan signed
  on December 1, Year 1, which is repayable in five equal annual principal installments beginning December
  1, Year 2; it leaves out a $120,000 note payable due June 30, Year 2, which the draft lists under Year
  3 because Quarmby intends to refinance it, and it includes $38,000 of interest that Quarmby will pay
  on its debt in Year 2. What principal amount should the corrected note report as maturing in Year 2?'
choices:
- id: A
  text: $358,000
  rationale: Keeps the $120,000 note under Year 3. It is due June 30, Year 2; an intention to refinance
    doesn't change its contractual maturity.
- id: B
  text: $478,000
  rationale: Correct. $410,000 − $64,000 − $38,000 + $50,000 + $120,000.
- id: C
  text: $542,000
  rationale: Leaves the $64,000 of operating lease payments in the debt maturities. Lease payments are
    disclosed in the lease note's maturity analysis, not as debt principal.
- id: D
  text: $678,000
  rationale: Adds the whole $250,000 term loan to Year 2. Only the first of its five annual installments
    ($50,000) matures in Year 2.
answer: B
explanation: The debt note discloses the principal amounts maturing in each of the next five years. Remove
  the $64,000 of operating lease payments, which belong in the lease note's maturity analysis, and the
  $38,000 of interest. Add the first installment of the new term loan, $250,000 ÷ 5 = $50,000, and the
  $120,000 note, which matures on June 30, Year 2, whatever Quarmby intends. $410,000 − $64,000 − $38,000
  + $50,000 + $120,000 = $478,000.
