id: far-nfp-statement-of-activities-0003
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of activities (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - ASC 958-225 (statement of activities)
  - ASC 958-205-45 (net assets released from restrictions; long-lived assets placed in service, as amended
    by ASU 2016-14)
  - ASC 958-605-25 (implied time restrictions; conditional promises to give)
  - ASC 958-205-45 (endowment return with donor restrictions until appropriated)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: During Year 2, Shilbottle Senior Services, a not-for-profit entity, received $240,000 in cash gifts
  restricted by donors to its meals-on-wheels program and spent $185,000 on that program, and received
  a $60,000 cash gift restricted to buying a delivery van, which it bought for $54,000 and placed in service
  in August. Its donor-restricted endowment earned a total return of $96,000; the board appropriated $40,000
  of the endowment's return for the general operating purposes the endowment's donors specified, and Shilbottle
  spent it in Year 2. A donor made an unconditional pledge of $35,000, payable in Year 3, and stated no
  purpose. Another donor promised $50,000 if Shilbottle raises the same amount in new gifts by March,
  Year 3; it has raised very little so far. What is the net change in Shilbottle's net assets with donor
  restrictions for Year 2?
choices:
- id: A
  text: $96,000 increase
  rationale: Reports the $96,000 return on the donor-restricted endowment as without donor restrictions,
    so the $40,000 appropriated and spent is never released from net assets with donor restrictions either.
    Return on a donor-restricted endowment fund is with donor restrictions until the board appropriates
    it for spending.
- id: B
  text: $117,000 increase
  rationale: Reports the $35,000 pledge payable next year as without donor restrictions. An unconditional
    promise payable in a future period carries an implied time restriction, unless the donor says it is
    for the current period's activities.
- id: C
  text: $146,000 increase
  rationale: Reports the $60,000 van gift as without donor restrictions, so neither the gift nor its release
    passes through net assets with donor restrictions. The donor restricted the gift to buying a van,
    so it is with donor restrictions until the van is placed in service, and the $6,000 not spent stays
    restricted.
- id: D
  text: $152,000 increase
  rationale: Correct. $240,000 + $60,000 + $96,000 + $35,000 − $185,000 − $54,000 − $40,000.
answer: D
explanation: 'Increases: program gifts $240,000, the van gift $60,000, the endowment return $96,000 (with
  donor restrictions until appropriated) and the $35,000 pledge, which carries an implied time restriction
  because it is payable in Year 3. Releases: $185,000 spent on the program, $54,000 for the van (the restriction
  is met when the asset is placed in service), and the $40,000 of endowment return appropriated and spent.
  The conditional matching pledge isn''t recognized. Net change = $431,000 − $279,000 = $152,000 increase.'
