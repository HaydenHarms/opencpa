    service in August. Its donor-restricted endowment earned a total return of $72,000; the board appropriated
    $30,000 of the endowment's return for the general operating purposes the endowment's donors specified,
    and Snitter spent it in Year 2. A donor made an unconditional pledge of $26,000, payable in Year 3,
    and stated no purpose. Another donor promised $38,000 if Snitter raises the same amount in new gifts
    by March, Year 3; it has raised very little so far. What is the net change in Snitter's net assets
