  choices:
  - id: A
    text: $115,000 increase
    rationale: Correct. $182,000 + $45,000 + $72,000 + $26,000 − $139,000 − $41,000 − $30,000.
  - id: B
    text: $145,000 increase
    rationale: Leaves out the release of the $30,000 of endowment return that the board appropriated and
      spent. Appropriation and spending for the stated purpose release the amount from restriction.
  - id: C
    text: $153,000 increase
    rationale: 'Includes the $38,000 matching pledge. It is conditional: the donor pays only if Snitter
      raises matching gifts, which hasn''t happened, so no revenue is recognized yet.'
  - id: D
