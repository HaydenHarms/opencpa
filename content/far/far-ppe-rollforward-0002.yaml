id: far-ppe-rollforward-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 360-10 (property, plant and equipment)
  - ASC 230-10-50 (noncash investing and financing activities)
  notes: Batch 06. Written from scratch; answers solved and every number and distractor computed in code.
stem: Ormond Co.'s equipment rollforward for Year 2 shows gross equipment of $2,000,000 at January 1 and
  $2,260,000 at December 31, and accumulated depreciation of $800,000 at January 1 and $870,000 at December
  31. During the year, Ormond sold equipment that cost $180,000, with accumulated depreciation of $140,000,
  for $55,000 in cash, and acquired equipment costing $90,000 by signing a note payable to the seller.
  All other acquisitions were paid in cash. What amount should Ormond report as cash paid to purchase
  equipment in the investing section of its Year 2 statement of cash flows?
choices:
- id: A
  text: $170,000
  rationale: Ignores the equipment sold. Its $180,000 cost left the account, so purchases exceed the net
    increase.
- id: B
  text: $210,000
  rationale: Adds back the carrying amount of the equipment sold ($40,000) instead of its cost. The gross
    equipment account removes cost.
- id: C
  text: $350,000
  rationale: Correct. $2,260,000 − $2,000,000 + $180,000 cost of equipment sold − $90,000 bought with
    a note.
- id: D
  text: $440,000
  rationale: Includes the $90,000 of equipment bought with a note. A noncash acquisition is disclosed,
    not reported as an investing cash outflow.
answer: C
explanation: 'Gross equipment: $2,000,000 + acquisitions − $180,000 cost of equipment sold = $2,260,000,
  so acquisitions were $440,000. Of those, $90,000 was bought with a note, a noncash investing activity
  disclosed separately. Cash paid = $440,000 − $90,000 = $350,000. The accumulated depreciation figures
  aren''t needed for this amount.'
