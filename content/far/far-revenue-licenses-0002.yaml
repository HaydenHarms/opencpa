id: far-revenue-licenses-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - ASC 606-10-55-65 (sales- and usage-based royalties for a license of intellectual property)
  - ASC 606-10-55-58 to 55-63 (right to access versus right to use)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
    Reworked after the 2026-10-05 review gate.
stem: On January 1, Year 1, Kestrel Photonics Co. granted two licenses. The first lets a manufacturer
  use Kestrel's patented sensor-calibration process, mature technology that Kestrel doesn't plan to update,
  for a 6% royalty on the manufacturer's net sales of products using the process, with no fixed fee and
  no minimum; at signing, Kestrel projected those sales at about $1,200,000 for Year 1. The second gives
  a franchisee the use of Kestrel's brand name for Year 1, with marketing support Kestrel provides evenly
  throughout the year, for a fixed $32,000 paid at signing plus a 2% royalty on the franchisee's sales.
  In the first quarter of Year 1, the manufacturer's sales using the process were $250,000 and the franchisee's
  sales were $180,000. How much revenue should Kestrel recognize from the two licenses for the first quarter
  of Year 1?
choices:
- id: A
  text: $18,600
  rationale: Leaves out the $8,000 share of the fixed brand fee earned in the quarter, as if the fee were
    unearned until the year ends.
- id: B
  text: $26,600
  rationale: Correct. (6% × $250,000) + ($32,000 ÷ 4) + (2% × $180,000).
- id: C
  text: $29,600
  rationale: Estimates the patent royalty from one quarter of the projected sales, 6% × $300,000 = $18,000,
    instead of the $250,000 of sales that actually occurred. The royalty is recognized as the sales occur,
    at the actual amount.
- id: D
  text: $50,600
  rationale: 'Recognizes the whole $32,000 brand fee when the license is granted. The brand license gives
    the franchisee access to Kestrel''s brand as Kestrel keeps supporting it over the year, so the fixed
    fee is recognized over the year: $8,000 for the quarter.'
answer: B
explanation: 'A sales- or usage-based royalty for a license of intellectual property is recognized only
  when the later of the sale occurring and the performance obligation being satisfied takes place (ASC
  606-10-55-65), whether the license is a right to use (the patent, functional and not updated) or a right
  to access (the brand, supported by Kestrel through the year); Kestrel doesn''t estimate the royalty
  from its projection. Patent royalty = 6% × $250,000 = $15,000. The brand license is satisfied over the
  year, so the fixed fee is recognized evenly: $32,000 ÷ 4 = $8,000, and its royalty = 2% × $180,000 =
  $3,600. Total revenue = $26,600.'
