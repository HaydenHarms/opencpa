id: far-revenue-licenses-0002
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Revenue recognition
  skill: Application
review:
  status: draft
  references:
  - ASC 606-10-55-65 (sales- and usage-based royalties for a license of intellectual property)
  notes: Batch 16. Written from scratch; answers solved and every number and distractor computed in code.
stem: Kestrel Photonics Co. licenses two pieces of intellectual property for the quarter. It licenses
  a patented sensor-calibration process, mature functional technology Kestrel doesn't plan to update,
  to a manufacturer in exchange for a 6% royalty on the manufacturer's net sales of products using the
  process, with no fixed fee and no minimum guarantee; when the agreement was signed, Kestrel projected
  those sales would be about $1,000,000 for the year, but actual sales using the process were $250,000
  for the quarter. Kestrel also licenses its brand name to a franchisee, together with marketing support
  Kestrel will keep providing, for a fixed $8,000 a quarter plus a 2% royalty on the franchisee's sales;
  franchisee sales for the quarter were $180,000. How much revenue should Kestrel recognize for the quarter
  from these two licenses?
choices:
- id: A
  text: $11,600
  rationale: Leaves out the $15,000 patent royalty entirely.
- id: B
  text: $18,600
  rationale: Leaves out the $8,000 fixed brand license fee for the quarter.
- id: C
  text: $26,600
  rationale: Correct. (6% × $250,000) + $8,000 + (2% × $180,000).
- id: D
  text: $71,600
  rationale: Applies the 6% rate to the $1,000,000 of sales the manufacturer projected for the year when
    the agreement was signed, instead of the $250,000 actually sold this quarter. A sales-based royalty
    for a license of intellectual property is recognized only as the underlying sales occur, never estimated
    in advance (ASC 606-10-55-65).
answer: C
explanation: Consideration in the form of a sales- or usage-based royalty for a license of intellectual
  property is recognized only as the underlying sales occur, regardless of whether the license is a right
  to use (the patent) or a right to access (the brand name, supported by Kestrel's ongoing marketing)
  (ASC 606-10-55-65); Kestrel doesn't estimate the royalty from its sales projection. Patent royalty =
  6% × $250,000 = $15,000. The brand license's fixed fee, $8,000, is earned for the quarter, and its royalty
  = 2% × $180,000 = $3,600. Total revenue = $26,600.
