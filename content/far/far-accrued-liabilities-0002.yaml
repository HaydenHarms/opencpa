id: far-accrued-liabilities-0002
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Payables and accrued liabilities
  skill: Application
review:
  status: reviewed
  references:
  - ASC 405-10 (liabilities, including sales taxes collected for a taxing authority)
  - 'ASC 710-10-25 (compensated absences: vested vacation pay)'
  - Payroll accounting practice (amounts withheld from employees; employer payroll taxes)
  - ASC 835-10 (interest)
  notes: Batch 11. Written from scratch; answers solved and every number and distractor computed in code.
stem: Mickley Hardware Co.'s December, Year 1, records show the following, none of which had been paid
  or remitted at December 31 unless stated. Cash register receipts for December totaled $642,000, including
  the 7% sales tax charged on every sale. The payroll for the last half of December, paid to employees
  on December 31, had gross wages of $186,000, from which Mickley withheld $27,900 of federal income tax
  and $14,229 of employees' social security and Medicare taxes (7.65%); Mickley owes a matching 7.65%
  of gross wages. Employees had earned $41,500 of vacation pay that vests and will be paid in Year 2.
  On August 1, Year 1, Mickley signed a one-year, 8% note payable for $240,000, with principal and interest
  due at maturity. Mickley reports the note's principal separately as a note payable. What total should
  Mickley report at December 31, Year 1, for the other liabilities arising from these items?
choices:
- id: A
  text: $106,358
  rationale: Leaves out the $41,500 of vested vacation pay. Compensation for vested absences that relates
    to services already rendered is accrued when earned.
- id: B
  text: $119,958
  rationale: Leaves out the $27,900 of income tax withheld. Amounts withheld from employees are owed to
    the government until Mickley remits them.
- id: C
  text: $133,629
  rationale: Leaves out Mickley's matching $14,229 of payroll taxes. The employer's share is an expense
    and a liability until it is remitted.
- id: D
  text: $147,858
  rationale: Correct. $42,000 + $27,900 + 2 × $14,229 + $41,500 + $8,000.
answer: D
explanation: 'Sales tax payable = $642,000 × 7/107 = $42,000. Payroll liabilities = $27,900 income tax
  withheld + $14,229 employees'' share + $14,229 employer''s share = $56,358; the net pay was paid. Vacation
  pay that vests and relates to services already rendered is accrued: $41,500. Interest payable = $240,000
  × 8% × 5/12 = $8,000. Total = $147,858.'
