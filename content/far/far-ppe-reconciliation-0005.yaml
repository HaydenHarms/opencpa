id: far-ppe-reconciliation-0005
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Property, plant and equipment
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 360-10-35 (depreciation; temporarily idle assets continue to be depreciated; construction in progress
    not depreciated until ready for its intended use)
  - ASC 835-20 (capitalized interest is part of the asset's cost)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Chagford Metalworks Co.''s fixed-asset subledger shows Year 2 depreciation of $1,278,100, while
  its general ledger shows depreciation expense of $1,288,050. Chagford depreciates its assets straight-line
  by month. The controller''s investigation finds: the subledger recorded $23,500 of depreciation on the
  costs to date of a warehouse wing still under construction at December 31, while the general ledger
  recorded none; $120,000 of interest capitalized during the construction of a machine Chagford built
  for its own use, placed in service on July 1, Year 2, with a 10-year life and no residual value, is
  in the machine''s cost in the general ledger but not in the subledger; the subledger suspended depreciation
  on a press for the 4 months it stood idle during a temporary drop in orders, while the general ledger
  recorded the press''s full annual depreciation of $72,000; and a forklift sold on September 30 was removed
  from the subledger at that date, but the general ledger kept recording its depreciation of $1,150 a
  month through December. What depreciation expense should Chagford report for Year 2?'
choices:
- id: A
  text: $1,260,600
  rationale: 'Suspends depreciation on the press for the 4 idle months. An asset that is temporarily idle
    continues to be depreciated: its full $72,000 is recorded.'
- id: B
  text: $1,278,600
  rationale: Depreciates the machine without the $120,000 of capitalized interest. Interest capitalized
    during construction is part of the asset's cost, adding $6,000 of depreciation for six months.
- id: C
  text: $1,284,600
  rationale: Correct. Subledger $1,278,100 − $23,500 + $6,000 + $24,000; general ledger $1,288,050 − $3,450.
- id: D
  text: $1,308,100
  rationale: Keeps the $23,500 of depreciation on the wing still under construction. Depreciation begins
    when an asset is ready for its intended use; construction in progress isn't depreciated.
answer: C
explanation: 'Subledger: remove the $23,500 on construction in progress, which isn''t depreciated until
  it is ready for use; add depreciation on the capitalized interest, $120,000 ÷ 10 × 6/12 = $6,000; and
  add the 4 idle months on the press, $72,000 × 4/12 = $24,000, because a temporarily idle asset is still
  depreciated: $1,278,100 − $23,500 + $6,000 + $24,000 = $1,284,600. General ledger: remove the forklift''s
  depreciation after the sale, 3 × $1,150 = $3,450: $1,288,050 − $3,450 = $1,284,600.'
