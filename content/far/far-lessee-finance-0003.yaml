id: far-lessee-finance-0003
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 842-10-30-5 (lease payments: variable payments that depend on an index, measured at the commencement-date
    index)'
  - 'ASC 842-10-15-37 (practical expedient: not separating lease and nonlease components)'
  - ASC 842-10-35-5 (remeasurement for index changes only when remeasured for another reason)
  - ASC 842-20-30-1 and 842-20-35-1 (initial and subsequent measurement of the lease liability)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Ludgvan Bakeries Co. leased a commercial oven line for six years and classified
  the lease as a finance lease. Payments are due each January 1, starting at commencement. The first payment
  is $84,000, of which $9,000 is for maintenance the lessor performs; Ludgvan has elected not to separate
  lease and nonlease components for this class of asset. Each later payment is adjusted for the change
  in the consumer price index, and in December, Year 1, the lessor told Ludgvan that the January 1, Year
  2, payment will be $86,100. The rate implicit in the lease isn't readily determinable, and Ludgvan's
  incremental borrowing rate is 6%. Present value factors at 6% for an annuity due are 5.2124 for six
  periods and 4.4651 for five periods. Rounding each computation to the nearest dollar, what carrying
  amount of the lease liability should Ludgvan report at December 31, Year 1?
choices:
- id: A
  text: $334,886
  rationale: Leaves the $9,000 maintenance charge out of the lease payments. Ludgvan elected not to separate
    lease and nonlease components for this class of asset, so the whole $84,000 payment is a lease payment.
- id: B
  text: $353,842
  rationale: 'Deducts the first payment but accrues no interest for Year 1. The liability accretes at
    6% on the $353,842 balance: $21,231.'
- id: C
  text: $375,073
  rationale: Correct. ($437,842 − $84,000) × 1.06.
- id: D
  text: $384,445
  rationale: 'Remeasures the liability for the higher Year 2 payment: $86,100 × 4.4651. A change in a
    payment tied to an index is variable lease cost when it occurs; the liability isn''t remeasured for
    it unless it is remeasured for another reason.'
answer: C
explanation: 'Lease payments include variable payments that depend on an index, measured using the index
  at commencement, and, because Ludgvan combines lease and nonlease components, the maintenance charge:
  $84,000 a year. Initial liability = $84,000 × 5.2124 = $437,842. The first payment, made at commencement,
  reduces it to $353,842. Interest for Year 1 = $353,842 × 6% = $21,231, so the liability at December
  31 is $375,073. The CPI increase to $86,100 is recognized as variable lease cost in Year 2 and doesn''t
  remeasure the liability (ASC 842-10-35-5).'
