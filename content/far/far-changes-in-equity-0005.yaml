id: far-changes-in-equity-0005
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of changes in equity
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 505-20 (property dividends at fair value)
  - ASC 505-30 (retirement of treasury stock)
  - ASC 470-20 (conversion of convertible debt under its original terms)
  - 'ASC 320-10 (trading debt securities: unrealized gains and losses in net income)'
  notes: Batch 09. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Gledhill Inc.''s draft Year 2 statement of changes in equity reports total stockholders'' equity
  of $4,345,000 at December 31, built up as follows: January 1 balance $4,200,000; net income $610,000;
  other comprehensive income $80,000, made up of $52,000 of unrealized holding gains on available-for-sale
  debt securities and $28,000 of unrealized holding gains on trading debt securities; cash dividends ($180,000);
  property dividend ($95,000); purchase of treasury stock ($120,000); and retirement of treasury stock
  ($150,000). Supporting documents show: net income includes all of the year''s fair value changes on
  the trading securities; the property dividend distributed land with a carrying amount of $95,000 and
  a fair value of $140,000 on the declaration date, and net income includes the $45,000 gain from remeasuring
  the land to fair value; the treasury shares retired in June had been bought in Year 1 for $150,000;
  and in September, bondholders converted bonds with a carrying amount of $500,000 into common shares,
  then worth $560,000, under the bonds'' original conversion terms. What total stockholders'' equity should
  Gledhill''s corrected statement report at December 31, Year 2?'
choices:
- id: A
  text: $4,772,000
  rationale: Keeps the $150,000 retirement as a reduction of equity. The treasury shares reduced equity
    when they were bought in Year 1; retiring them only reclassifies amounts within equity.
- id: B
  text: $4,922,000
  rationale: Correct. $4,345,000 − $28,000 − $45,000 + $150,000 + $500,000.
- id: C
  text: $4,950,000
  rationale: Keeps the $28,000 of trading-security gains in other comprehensive income. They are already
    in net income, so the draft counts them twice.
- id: D
  text: $4,967,000
  rationale: Leaves the property dividend at the land's $95,000 carrying amount. Net income already includes
    the $45,000 remeasurement gain, so the dividend is recorded at the $140,000 fair value.
answer: B
explanation: 'The trading-security gains are in net income, so the $28,000 in other comprehensive income
  is a double count: − $28,000. A property dividend is recorded at the property''s fair value; with the
  $45,000 gain already in net income, the dividend should be $140,000, not $95,000: − $45,000. Retiring
  treasury shares that were deducted from equity when bought doesn''t change total equity, so the draft''s
  deduction is reversed: + $150,000. The conversion adds the bonds'' $500,000 carrying amount to equity.
  The cash dividends and the Year 2 treasury purchase are correct. $4,345,000 − $28,000 − $45,000 + $150,000
  + $500,000 = $4,922,000.'
