id: far-accounting-errors-0008
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Accounting changes and error corrections
  skill: Analysis
review:
  status: reviewed
  references:
  - 'ASC 250-10-45-23 (correction of an error in previously issued financial statements: restatement)'
  - 'ASC 835-30-35-2 (interest method: amortization of discount)'
  - ASC 330-10 (inventory; goods in transit)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: On January 1, Year 1, Strathpeffer Corp. issued $2,000,000 face amount of 10-year, 6% bonds, with
  interest paid each December 31, for $1,731,597, a price that gives a yield of 8%. In Year 3, before
  its Year 3 statements are issued, Strathpeffer finds that it has recorded interest expense equal to
  the cash paid each year and has never amortized the discount. It also finds that goods costing $36,000,
  bought on December 29, Year 2, FOB shipping point and in transit at year-end, were recorded as a purchase
  and as inventory only when they arrived on January 4, Year 3; and that its December 31, Year 1, inventory
  had been understated by $52,000 because of a counting error. Strathpeffer presents comparative statements
  for Years 2 and 3; its December 31, Year 2, total stockholders' equity, as originally reported, was
  $5,480,000. Strathpeffer uses the effective interest method, rounded to the nearest dollar. Ignore income
  taxes. What total stockholders' equity should Strathpeffer report at December 31, Year 2, in its comparative
  balance sheet?
choices:
- id: A
  text: $5,441,462
  rationale: Correct. $5,480,000 − ($18,528 + $20,010).
- id: B
  text: $5,459,990
  rationale: Corrects only Year 2's $20,010 of amortization. The discount should have been amortized in
    Year 1 too, so the cumulative $38,538 is corrected at December 31, Year 2.
- id: C
  text: $5,477,462
  rationale: Adds the $36,000 of goods in transit to Year 2 inventory without also recording the purchase,
    raising equity by $36,000. Both the purchase and the inventory were left out, so Year 2 cost of goods
    sold and equity are unaffected.
- id: D
  text: $5,493,462
  rationale: Corrects the Year 1 inventory error, raising equity by $52,000. The understated Year 1 ending
    inventory was Year 2's beginning inventory, so Year 2 income was overstated by the same amount, and
    the error had reversed by December 31, Year 2.
answer: A
explanation: 'Discount amortization omitted: Year 1, $1,731,597 × 8% − $120,000 = $18,528; Year 2, $1,750,125
  × 8% − $120,000 = $20,010; in all $38,538 of extra interest expense, which lowers retained earnings,
  and so equity, at December 31, Year 2 (and raises bonds payable). The goods in transit were left out
  of both purchases and ending inventory, so Year 2 cost of goods sold and equity are unaffected (the
  correction adds the inventory and an account payable). The Year 1 inventory error counterbalanced in
  Year 2. Restated equity = $5,480,000 − $38,538 = $5,441,462.'
