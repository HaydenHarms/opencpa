id: far-inventory-rollforward-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: reviewed
  references:
  - ASC 330-10 (inventory; abnormal costs)
  - ASC 330-10-30 (purchase rebates and cost of inventory)
  notes: Batch 15. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Hayle''s perpetual inventory records show a Year 2 rollforward of beginning inventory $340,000,
  purchases $2,150,000, and cost of goods sold $2,015,000, for a draft December 31 balance of $475,000.
  Reviewing the count, the controller finds: $21,000 of raw materials ruined in an equipment malfunction
  during the year, included in the count at full cost; $38,000 of goods purchased under terms that passed
  title to Hayle at shipment, which were sitting in a customs bonded warehouse awaiting clearance at year-end
  and so weren''t included in the physical count; and a $16,000 volume purchase rebate, for which Hayle
  met the purchase threshold before year-end but which the supplier hadn''t yet billed or recorded. What
  inventory should the corrected rollforward report at December 31, Year 2?'
choices:
- id: A
  text: $438,000
  rationale: Leaves out the $38,000 of goods sitting in the customs bonded warehouse. Title passed to
    Hayle when the goods were shipped, so they are Hayle's inventory even though they hadn't yet cleared
    customs and weren't in the physical count.
- id: B
  text: $476,000
  rationale: Correct. $475,000 − $21,000 + $38,000 − $16,000.
- id: C
  text: $492,000
  rationale: Ignores the $16,000 volume purchase rebate Hayle earned by year-end but hadn't yet billed.
    The rebate reduces the cost of the inventory still on hand.
- id: D
  text: $497,000
  rationale: Keeps the $21,000 of raw materials ruined in an equipment malfunction at full cost. Abnormal
    spoilage is expensed as incurred, not carried in inventory.
answer: B
explanation: Abnormal spoilage from an equipment malfunction is expensed as incurred, not capitalized
  in inventory (ASC 330-10-30), so the $21,000 comes out. The bonded-warehouse goods belong to Hayle once
  title passed at shipment, even though they hadn't cleared customs and weren't physically counted, so
  the $38,000 is added. The $16,000 rebate, earned before year-end, reduces the cost of the inventory
  still on hand even though it hasn't been billed. Corrected inventory = $475,000 − $21,000 + $38,000
  − $16,000 = $476,000.
