id: far-inventory-rollforward-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: draft
  references:
  - ASC 330-10-30-1 (cost of inventory includes freight-in)
  - 'ASC 705-20 (consideration received from a vendor: volume rebates reduce the cost of purchases, allocated
    to goods on hand and goods sold)'
  - 'ASC 606-10-55-79 to 55-80 (consignment arrangements: the consignor keeps the goods in inventory)'
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'Illogan Metals Supply Co.''s staff prepared this Year 2 inventory rollforward from its perpetual
  records: beginning inventory $452,000, purchases $1,860,000, cost of goods sold $1,837,000, ending inventory
  $475,000. Reviewing it, the controller finds that $27,000 of freight charges on incoming shipments from
  suppliers, all for goods sold during Year 2, and $19,000 of freight on shipments to customers were both
  charged to delivery expense; Illogan reports shipping costs to customers as a selling expense. In December,
  Illogan shipped goods costing $38,000 to a dealer that sells them on consignment, and the perpetual
  system recorded them as sold when they left the warehouse; the dealer hadn''t sold any of them by December
  31. And Illogan''s Year 2 purchases of one supplier''s alloy bar, $600,000 in all, reached that supplier''s
  volume threshold for a 5% rebate on the year''s purchases; the supplier issued the credit memo in January,
  and Illogan hasn''t recorded the rebate. Alloy bar costing $240,000 from those purchases is still on
  hand at December 31; the rest has been sold. What cost of goods sold should the corrected rollforward
  report for Year 2?'
choices:
- id: A
  text: $1,781,000
  rationale: Leaves the $27,000 of freight on incoming purchases in delivery expense. Freight-in is part
    of the cost of inventory; those goods have all been sold, so it belongs in cost of goods sold.
- id: B
  text: $1,796,000
  rationale: Takes the whole $30,000 rebate out of cost of goods sold. The rebate reduces the cost of
    all $600,000 of qualifying purchases, so the share on goods still on hand, $12,000, reduces inventory;
    only $18,000 reduces cost of goods sold.
- id: C
  text: $1,808,000
  rationale: Correct. $1,837,000 + $27,000 freight-in − $38,000 consigned goods still on hand − $18,000
    rebate on goods sold.
- id: D
  text: $1,846,000
  rationale: Leaves the $38,000 of goods at the dealer in cost of goods sold. Goods out on consignment
    still belong to Illogan until the dealer sells them, so they go back into inventory.
answer: C
explanation: 'Freight-in is a cost of bringing goods to their location for sale, so it is part of inventory
  cost (ASC 330-10-30-1); the goods it relates to were all sold, so the $27,000 moves from delivery expense
  into cost of goods sold. Freight-out is a selling cost and stays in delivery expense. Goods out on consignment
  remain Illogan''s inventory until the dealer sells them (ASC 606-10-55-79 to 55-80), so the $38,000
  comes out of cost of goods sold and back into inventory. The rebate reduces the cost of the purchases
  that earned it (ASC 705-20): 5% × $600,000 = $30,000 in all. The share on the $240,000 still on hand,
  5% × $240,000 = $12,000, reduces ending inventory, and the remaining $18,000 reduces cost of goods sold.
  Corrected cost of goods sold = $1,837,000 + $27,000 − $38,000 − $18,000 = $1,808,000. (The corrected
  rollforward: $452,000 + ($1,860,000 + $27,000 − $30,000) − $1,808,000 = ending inventory of $501,000.)'
