id: far-inventory-rollforward-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: draft
  references:
  - ASC 330-10-35 (inventory write-downs; goods with no value)
  - 'ASC 705-20 (consideration received from a vendor: volume rebates reduce the cost of purchases, allocated
    to goods on hand and goods sold)'
  - 'ASC 606-10-55-79 to 55-80 (consignment arrangements: the consignor keeps the goods in inventory)'
  notes: Batch 15, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'Illogan Metals Supply Co.''s staff prepared this Year 2 inventory rollforward from its perpetual
  records: beginning inventory $452,000, purchases $1,860,000, cost of goods sold $1,837,000, ending inventory
  $475,000. Reviewing it, the controller finds that steel coils costing $21,000, ruined in August when
  a warehouse sprinkler line burst and with no resale or scrap value, are still carried in inventory at
  full cost; Illogan reports casualty losses separately from cost of goods sold. In December, Illogan
  shipped goods costing $38,000 to a dealer that sells them on consignment, and the perpetual system recorded
  them as sold when they left the warehouse; the dealer hadn''t sold any of them by December 31. And Illogan''s
  Year 2 purchases of one supplier''s alloy bar, $600,000 in all, reached that supplier''s volume threshold
  for a 5% rebate on the year''s purchases; the supplier issued the credit memo in January, and Illogan
  hasn''t recorded the rebate. Alloy bar costing $240,000 from those purchases is still on hand at December
  31; the rest has been sold. What cost of goods sold should the corrected rollforward report for Year
  2?'
choices:
- id: A
  text: $1,769,000
  rationale: Takes the whole $30,000 rebate out of cost of goods sold. The rebate reduces the cost of
    all $600,000 of qualifying purchases, so the share on goods still on hand, $12,000, reduces inventory;
    only $18,000 reduces cost of goods sold.
- id: B
  text: $1,781,000
  rationale: Correct. $1,837,000 − $38,000 (consigned goods still on hand) − $18,000 (rebate on goods
    sold).
- id: C
  text: $1,802,000
  rationale: Adds the $21,000 of ruined coils to cost of goods sold. Illogan reports casualty losses separately,
    so the write-off comes out of inventory as a loss and doesn't pass through cost of goods sold.
- id: D
  text: $1,819,000
  rationale: Leaves the $38,000 of goods at the dealer in cost of goods sold. Goods out on consignment
    still belong to Illogan until the dealer sells them, so they go back into inventory.
answer: B
explanation: 'Goods out on consignment remain Illogan''s inventory until the dealer sells them (ASC 606-10-55-79
  to 55-80), so the $38,000 comes out of cost of goods sold and back into inventory. The rebate reduces
  the cost of the purchases that earned it (ASC 705-20): 5% × $600,000 = $30,000 in all. The share on
  the $240,000 still on hand, 5% × $240,000 = $12,000, reduces ending inventory, and the remaining $18,000
  reduces cost of goods sold. The ruined coils have no value, so their $21,000 cost is written off (ASC
  330-10-35); Illogan reports that as a casualty loss, so it reduces inventory without touching cost of
  goods sold. Corrected cost of goods sold = $1,837,000 − $38,000 − $18,000 = $1,781,000. (The corrected
  rollforward: $452,000 + ($1,860,000 − $30,000) − $21,000 casualty loss − $1,781,000 = ending inventory
  of $480,000.)'
