id: far-inventory-rollforward-0007
type: mcq
blueprint:
  section: FAR
  area: Area II — Select Balance Sheet Accounts
  topic: Inventory
  skill: Analysis
review:
  status: draft
  references:
  - ASC 330-10-35 (inventory write-downs; goods with no value)
  - 'ASC 705-20 (consideration received from a vendor: volume rebates reduce the cost of purchases, allocated
    to goods on hand and goods sold)'
  - 'Inventory ownership: title passing at shipment'
  notes: Batch 15, revision 2 (blind verifier and gate findings applied). Written from scratch; answers
    solved and every number and distractor computed in code.
stem: Before closing Year 2, Illogan Metals Supply Co.'s controller reviews the December 31 perpetual
  inventory balance of $475,000. She finds that steel coils costing $21,000, ruined in August when a warehouse
  sprinkler line burst and with no resale or scrap value, are still carried at full cost; that goods costing
  $38,000, bought on terms that passed title to Illogan when the supplier shipped them in December, were
  in a customs bonded warehouse awaiting clearance at year-end, and the purchase hasn't been recorded
  because the supplier's invoice arrived in January; and that Illogan's Year 2 purchases of one supplier's
  alloy bar, $400,000 in all, reached that supplier's volume threshold for a 4% rebate on the year's purchases.
  The supplier issued the credit memo in January, and Illogan hasn't recorded the rebate. Alloy bar costing
  $150,000 from those purchases is still on hand at December 31; the rest has been sold. What net adjustment
  should the controller make to the perpetual inventory balance?
choices:
- id: A
  text: $27,000 decrease
  rationale: Leaves out the $38,000 of goods in the bonded warehouse. Title passed to Illogan when the
    supplier shipped them, so they are Illogan's inventory and the unrecorded purchase must be added,
    cleared through customs or not.
- id: B
  text: $1,000 increase
  rationale: Takes the whole $16,000 rebate out of inventory. The rebate reduces the cost of all $400,000
    of qualifying purchases, so only the share on goods still on hand, $6,000, reduces inventory; the
    rest reduces cost of goods sold.
- id: C
  text: $11,000 increase
  rationale: Correct. + $38,000 − $21,000 − $6,000 (4% of the $150,000 of rebated goods still on hand).
- id: D
  text: $32,000 increase
  rationale: Leaves the $21,000 of ruined coils in inventory. Goods with no resale or scrap value are
    written off as a loss; they can't be carried at cost.
answer: C
explanation: 'The ruined coils have no value, so their $21,000 cost is written off (ASC 330-10-35). The
  bonded-warehouse goods became Illogan''s when they were shipped, so the $38,000 purchase is recorded
  and added. The rebate reduces the cost of the purchases that earned it (ASC 705-20): 4% × $400,000 =
  $16,000 in all, of which the share on the $150,000 of alloy bar still on hand, 4% × $150,000 = $6,000,
  reduces inventory and the remaining $10,000 reduces cost of goods sold. Net adjustment = $38,000 − $21,000
  − $6,000 = $11,000, an increase.'
