id: far-nfp-cash-flows-0005
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Statement of cash flows (Not-for-Profit)
  skill: Application
review:
  status: reviewed
  references:
  - 'ASC 230-10-45-14 (financing inflows: contributions and investment income restricted to long-lived
    assets or to a donor-restricted endowment)'
  - 'ASC 230-10-45-21A (proceeds from donated financial assets sold almost immediately: operating unless
    restricted to long-term purposes)'
  - ASC 958-230 (not-for-profit statement of cash flows)
  notes: Batch 13. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Mevagissey Health Clinic, a not-for-profit entity, is reviewing its draft Year 2 statement of cash
  flows. The draft reports net cash provided by financing activities of $47,000, made up of: cash gifts
  that donors require Mevagissey to hold as a permanent endowment, $480,000; proceeds from selling shares
  of stock donated without restriction, which Mevagissey sold within a few days of receipt under its policy
  of converting donated securities to cash at once, $72,000; purchases of investments for the endowment,
  ($410,000); and principal payments on its mortgage, ($95,000). The draft''s operating section includes
  a $315,000 cash gift that a donor restricted to constructing a new clinic building, and $38,000 of interest
  and dividends that the endowment''s donors require to be added to the endowment''s principal. What net
  cash provided by financing activities should Mevagissey''s corrected statement report?'
choices:
- id: A
  text: $328,000
  rationale: Leaves the $410,000 paid for endowment investments in financing activities. Buying investments
    is an investing activity, even when the investments are held for an endowment.
- id: B
  text: $423,000
  rationale: Leaves the $315,000 building gift in operating activities. Cash gifts that donors restrict
    to acquiring or constructing long-lived assets are financing inflows.
- id: C
  text: $700,000
  rationale: Leaves the $38,000 of endowment income in operating activities. Investment income that donors
    require to be added to a donor-restricted endowment is a financing inflow, like the endowment gifts
    themselves.
- id: D
  text: $738,000
  rationale: Correct. $480,000 endowment gifts − $95,000 mortgage principal + $315,000 building gift +
    $38,000 endowment income added to principal.
answer: D
explanation: Under ASC 230-10-45-14, financing inflows of a not-for-profit entity include cash contributions,
  and investment income, that donors restrict to acquiring or constructing long-lived assets or to establishing
  or increasing a donor-restricted endowment. So the $480,000 of endowment gifts stays in financing, and
  the $315,000 building gift and the $38,000 of endowment income that must be added to principal move
  in from operating activities. Proceeds from donated securities with no donor restriction that are sold
  almost at once are operating inflows (ASC 230-10-45-21A), so the $72,000 moves out; purchases of investments
  are investing outflows, so the $410,000 moves out. Mortgage principal payments are financing. Corrected
  financing = $480,000 − $95,000 + $315,000 + $38,000 = $738,000.
