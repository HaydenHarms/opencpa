id: far-contingencies-0019
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Analysis
review:
  status: draft
  references:
  - ASC 460-10-35 and ASC 450-20-25-2 (a guarantor's contingent liability once a loss is probable)
  - ASC 450-20-30-1 (accrual at the best estimate within a range when one exists)
  - ASC 450-20-50-3 to 50-5 (disclosure of a reasonably possible loss)
  notes: Batch 17, revision 3 (second-round blind verifier and gate findings applied). Written from scratch;
    answers solved and every number and distractor computed in code.
stem: 'Before its Year 1 statements are issued, Ambersgate Holdings Co.''s files on two matters include
  letters from outside counsel. The first concerns an indemnity in the agreement under which Ambersgate
  sold its packaging division in an earlier year: Ambersgate agreed to reimburse the buyer for 80% of
  any environmental cleanup costs at a site the division used, up to a total of $420,000. The indemnity''s
  fair value when it was given was immaterial, and Ambersgate recognized no liability for it then. In
  September, Year 1, the state ordered the buyer to clean up the site, and the buyer has submitted its
  claim under the indemnity. A consultant''s site assessment puts the total cleanup cost at between $380,000
  and $760,000, most likely $590,000. The second letter concerns a suit a former distributor filed in
  October, claiming $260,000 for wrongful termination; counsel''s letter says Ambersgate will more likely
  than not prevail, though the distributor''s case is not without merit, and estimates that if Ambersgate
  loses, the loss would be about $95,000. What liability should Ambersgate accrue at year-end for these
  two matters?'
choices:
- id: A
  text: $304,000
  rationale: Accrues 80% of the $380,000 low end of the consultant's range. When an amount within the
    range is a better estimate than any other, here the $590,000 most likely cost, that amount is used;
    the minimum is used only when none is.
- id: B
  text: $420,000
  rationale: Correct. 80% × $590,000 = $472,000, limited to the $420,000 cap; nothing for the distributor's
    claim.
- id: C
  text: $472,000
  rationale: Accrues 80% of the $590,000 most likely cost without applying the $420,000 cap. Ambersgate's
    obligation under the indemnity can't exceed the cap.
- id: D
  text: $515,000
  rationale: Also accrues counsel's $95,000 estimate for the distributor's claim. Counsel expects Ambersgate
    more likely than not to prevail, so a loss is reasonably possible, not probable; it is disclosed with
    the estimate, not accrued.
answer: B
explanation: 'Once the cleanup was ordered and the buyer claimed, a loss under the indemnity became probable,
  so Ambersgate recognizes the contingent liability under ASC 450 (ASC 460-10-35; ASC 450-20-25-2). The
  consultant''s most likely amount is a better estimate than any other in the range, so it is used (ASC
  450-20-30-1), and Ambersgate''s share is 80% × $590,000 = $472,000, which exceeds the $420,000 cap,
  so the accrual is limited to $420,000. Counsel expects Ambersgate more likely than not to prevail but
  doesn''t consider the case without merit, so a loss on the distributor''s suit is reasonably possible,
  not probable: nothing is accrued; the nature of the claim and the $95,000 estimate are disclosed (ASC
  450-20-50-3 to 50-5). Liability = $420,000.'
