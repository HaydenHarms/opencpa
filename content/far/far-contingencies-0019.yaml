- stem: 'Before its Year 2 statements are issued, Follyfield Group Co.''s files on two matters include
    letters from outside counsel. The first concerns an indemnity in the agreement under which Follyfield
    sold its logistics division in an earlier year: Follyfield agreed to reimburse the buyer for 60% of
    any environmental cleanup costs at a site the division used, up to a total of $560,000. The indemnity''s
    fair value when it was given was immaterial, and Follyfield recognized no liability for it then. In
    August, Year 2, the state ordered the buyer to clean up the site, and the buyer has submitted its
    claim under the indemnity. A consultant''s site assessment puts the total cleanup cost at between
    $520,000 and $1,150,000, most likely $780,000. The second letter concerns a suit a former distributor
    filed in November, claiming $340,000 for wrongful termination; counsel''s letter says Follyfield will
    more likely than not prevail, though the distributor''s case is not without merit, and estimates that
    if Follyfield loses, the loss would be about $130,000. What liability should Follyfield accrue at
    year-end for these two matters?'
  choices:
  - id: A
    text: $468,000
    rationale: Correct. 60% × $780,000 = $468,000, within the cap; nothing for the distributor's claim.
  - id: B
    text: $560,000
    rationale: Accrues the full $780,000 most likely cost, limited to the cap, as if Follyfield had agreed
      to reimburse all of it. The indemnity covers only 60% of the buyer's costs.
  - id: C
    text: $598,000
    rationale: Also accrues counsel's $130,000 estimate for the distributor's claim. Counsel expects Follyfield
      more likely than not to prevail, so a loss is reasonably possible, not probable; it is disclosed
      with the estimate, not accrued.
  - id: D
    text: $808,000
    rationale: Also accrues the $340,000 the distributor claims. A loss that is only reasonably possible
      isn't accrued, and the amount claimed isn't an estimate of the loss.
  answer: A
  explanation: 'Once the cleanup was ordered and the buyer claimed, a loss under the indemnity became
    probable, so Follyfield recognizes the contingent liability under ASC 450 (ASC 460-10-35; ASC 450-20-25-2).
    The consultant''s most likely amount is a better estimate than any other in the range, so it is used
    (ASC 450-20-30-1), and Follyfield''s share is 60% × $780,000 = $468,000, which is within the $560,000
    cap. Counsel expects Follyfield more likely than not to prevail but doesn''t consider the case without
    merit, so a loss on the distributor''s suit is reasonably possible, not probable: nothing is accrued;
    the nature of the claim and the $130,000 estimate are disclosed (ASC 450-20-50-3 to 50-5). Liability
    = $468,000.'
