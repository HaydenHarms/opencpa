id: far-contingencies-0019
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Contingencies and commitments
  skill: Analysis
review:
  status: draft
  references:
  - ASC 450-20-25-2 and 450-20-30-1 (accrual at the best estimate within a range when one exists)
  - ASC 450-20-50-3 to 50-5 (disclosure when a loss cannot yet be estimated)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Before its Year 1 statements are issued, Ambersgate Holdings Co.''s files on two matters include
  a letter from outside counsel and minutes of its compliance committee. Counsel''s letter concerns an
  indemnity in the agreement under which Ambersgate sold its packaging division in an earlier year: Ambersgate
  agreed to reimburse the buyer for up to $420,000 of environmental cleanup costs at a site the division
  used. The indemnity''s fair value when it was given was immaterial, and Ambersgate recognized no liability
  for it then. In September, Year 1, the state ordered the buyer to clean up the site, and the buyer has
  submitted its claim under the indemnity; counsel, citing a consultant''s site assessment, estimates
  the cost at between $180,000 and $420,000 and names $310,000 as the best estimate within that range.
  The committee''s minutes describe a whistleblower complaint received in October, alleging $95,000 of
  improper payments to a supplier; the outside counsel investigating it told the committee it is too early
  in the inquiry to gauge either the outcome or the exposure. What liability should Ambersgate accrue
  at year-end for these two matters?'
choices:
- id: A
  text: $180,000
  rationale: Accrues the $180,000 low end of the consultant's range. When counsel's letter names $310,000
    as the best estimate within the range, that amount is accrued rather than the minimum.
- id: B
  text: $300,000
  rationale: Accrues the $180,000-to-$420,000 range's midpoint. Counsel's letter names $310,000, not the
    midpoint, as the best estimate.
- id: C
  text: $310,000
  rationale: Correct. Ambersgate accrues counsel's stated best estimate for the indemnity, $310,000, and
    nothing for the whistleblower matter.
- id: D
  text: $405,000
  rationale: Also accrues the $95,000 the complaint alleges. Counsel told the committee it is too early
    to gauge the outcome or the exposure, so the matter isn't accrued; an allegation isn't an estimate
    of loss.
answer: C
explanation: 'With the cleanup ordered and the buyer''s claim submitted, payment under the indemnity is
  probable, and counsel''s letter names a best estimate within the range, $310,000, which Ambersgate accrues
  (ASC 450-20-25-2; ASC 450-20-30-1); the minimum or midpoint is used only when no amount in the range
  is a better estimate than another. The whistleblower matter has reached no conclusion: counsel can''t
  yet assess the outcome or the exposure, so no amount is accrued, and the $95,000 the complaint alleges
  is not an estimate of loss; the matter is considered for disclosure (ASC 450-20-50-3 to 50-5). Liability
  = $310,000.'
