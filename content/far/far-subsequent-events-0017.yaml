id: far-subsequent-events-0017
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: draft
  references:
  - ASC 855-10-25 (correction of a count error found before issuance) versus ASC 855-10-50 (nonrecognized
    events disclosed only)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Longstone Materials Co.''s draft December 31, 1, balance sheet reports total assets of $8,460,000.
  The statements will be issued on March 14, 2. Before issuance: in January, Longstone found that one
  storage area had been counted twice in the December 31 physical inventory, overstating the count by
  $54,000; in February, a broad decline in equity markets cut $72,000 from the fair value of Longstone''s
  portfolio of listed securities; and also in February, Longstone issued bonds for $900,000 in cash. What
  total assets should Longstone report at December 31, 1?'
choices:
- id: A
  text: $8,334,000
  rationale: Also writes down the $72,000 drop in the fair value of Longstone's equity securities. The
    decline followed a general market move after year-end and doesn't reflect conditions that existed
    at December 31.
- id: B
  text: $8,406,000
  rationale: Correct. $8,460,000 − $54,000 count correction.
- id: C
  text: $8,460,000
  rationale: Leaves the $54,000 inventory count error uncorrected, even though it was found before the
    statements were issued.
- id: D
  text: $9,288,000
  rationale: Leaves the count error uncorrected while also deducting the equity securities decline and
    adding the bond proceeds, the two events that don't affect the December 31 balance.
answer: B
explanation: 'The double-counted storage area is an error in the December 31 count, found before the statements
  were issued, and is corrected in the December 31 balance: $8,460,000 − $54,000 = $8,406,000. The equity
  market decline and the bond issuance both reflect conditions arising after year-end; they are disclosed
  but don''t change the assets reported at December 31.'
