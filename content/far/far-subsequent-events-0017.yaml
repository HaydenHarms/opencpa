id: far-subsequent-events-0017
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Subsequent events
  skill: Analysis
review:
  status: draft
  references:
  - ASC 855-10-25-1 (recognized subsequent events)
  - ASC 855-10-25-3 and 855-10-55-2 (nonrecognized subsequent events)
  - ASC 450-30-25-1 (gain contingencies not recognized before realization)
  notes: Batch 17. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Longstone Materials Co.''s draft December 31, Year 1, balance sheet reports total assets of $8,460,000.
  In December, a hailstorm damaged Longstone''s delivery vans; Longstone wrote them down and recorded
  a $96,000 receivable for the insurance recovery it expected. The statements will be issued on March
  14, Year 2. Before then: in January, the insurer completed its assessment under the policy in force
  at the time of the storm and paid $58,000 in full settlement of the claim; in February, a court awarded
  Longstone $150,000 in its suit against a former supplier, and the supplier has appealed; and also in
  February, a broad decline in equity markets cut $120,000 from the fair value of Longstone''s portfolio
  of listed securities. What total assets should Longstone report at December 31, Year 1?'
choices:
- id: A
  text: $8,302,000
  rationale: Also writes down the securities for the $120,000 decline in February. The fall in prices
    came from a market move after year-end and doesn't reflect conditions at December 31.
- id: B
  text: $8,364,000
  rationale: Removes the whole $96,000 receivable, as if an insurance recovery could be recognized only
    when paid. The $58,000 the insurer paid was recoverable at year-end.
- id: C
  text: $8,422,000
  rationale: Correct. $8,460,000 − ($96,000 − $58,000) insurance shortfall.
- id: D
  text: $8,460,000
  rationale: Leaves the $96,000 insurance receivable as recorded. The insurer's assessment shows how much
    of the December loss was recoverable at year-end, so the receivable is reduced to the $58,000 it paid.
answer: C
explanation: 'The insurer''s assessment applies the policy in force at the time of the December storm,
  so it is evidence of the amount recoverable at year-end and is recognized: the receivable falls from
  $96,000 to $58,000, a $38,000 reduction (ASC 855-10-25-1). The court award is a gain contingency, still
  under appeal; it isn''t recognized until realized (ASC 450-30-25-1) and is disclosed. The market decline
  reflects conditions that arose after year-end and is disclosed, not recognized (ASC 855-10-25-3, 855-10-55-2).
  Total assets = $8,460,000 − $38,000 = $8,422,000.'
