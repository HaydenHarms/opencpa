id: far-balance-sheet-0009
type: mcq
blueprint:
  section: FAR
  area: Area I — Financial Reporting
  topic: Balance sheet
  skill: Application
review:
  status: reviewed
  references:
  - ASC 210-10-45 (current assets and current liabilities; current maturities of long-term debt)
  - 'ASC 210-20 (offsetting: bank overdrafts at different banks)'
  - ASC 505-30 (treasury stock is a deduction from equity)
  - ASC 606-10-45 (contract liabilities)
  notes: Batch 12. Written from scratch; answers solved and every number and distractor computed in code.
stem: 'Achnasheen Supply Co.''s draft December 31, Year 1, balance sheet reports total current assets
  of $1,846,000 and total current liabilities of $968,000. The controller identifies these errors, none
  of which has been corrected: (1) interest of $14,400 that had accrued on a note payable by December
  31 has not been recorded; (2) a $36,000 deposit that a customer paid on December 19 for goods to be
  delivered in February, Year 2, was credited to sales revenue; (3) the $125,000 principal installment
  of a long-term bank loan that falls due on June 30, Year 2, is included in long-term debt; (4) cash
  is reported net of a $22,500 overdraft in Achnasheen''s account at a second bank, which has no right
  to offset it against Achnasheen''s other accounts; and (5) the $58,000 that Achnasheen paid in November
  to reacquire some of its own common shares, which it holds for reissue, is included in short-term investments.
  What working capital should Achnasheen''s corrected balance sheet report?'
choices:
- id: A
  text: $622,100
  rationale: 'Adds the $22,500 overdraft to current liabilities but leaves cash net of it: $1,788,000
    − $1,165,900. Reporting the overdraft separately also raises cash by $22,500, so this correction leaves
    working capital unchanged.'
- id: B
  text: $644,600
  rationale: Correct. ($1,846,000 − $58,000 + $22,500) − ($968,000 + $14,400 + $36,000 + $125,000 + $22,500)
    = $1,810,500 − $1,165,900.
- id: C
  text: $702,600
  rationale: Leaves the $58,000 of reacquired shares in short-term investments. Treasury stock is a deduction
    from stockholders' equity, not an asset, so current assets fall by $58,000.
- id: D
  text: $769,600
  rationale: Leaves the $125,000 installment in long-term debt. The part of long-term debt due within
    a year of the balance sheet date is a current liability.
answer: B
explanation: 'Current assets: the reacquired shares are treasury stock, a deduction from equity, so they
  come out of short-term investments (− $58,000); and the overdraft at the second bank can''t be netted
  against cash at another bank, so cash is reported gross (+ $22,500). Corrected current assets = $1,810,500.
  Current liabilities: accrued interest (+ $14,400), the customer deposit, a contract liability until
  the goods are delivered (+ $36,000), the installment due within a year (+ $125,000) and the overdraft
  (+ $22,500). Corrected current liabilities = $1,165,900. Working capital = $1,810,500 − $1,165,900 =
  $644,600. The overdraft raises both sides equally, so it doesn''t change working capital.'
