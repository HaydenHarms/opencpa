id: far-lessee-operating-0001
type: mcq
blueprint:
  section: FAR
  area: Area III — Select Transactions
  topic: Lessee accounting
  skill: Application
review:
  status: reviewed
  references:
  - ASC 842-20-30-1
  notes: Batch 01, revised after independent quality review. Adapted from legacy bank; answers re-solved,
    arithmetic checked in code, distractors rebuilt where needed.
stem: On January 1, Calloway Corp. commences a 4-year operating lease with annual payments of $120,000
  due at the end of each year. Calloway's incremental borrowing rate is 6%, and the present value factor
  for an ordinary annuity of 4 periods at 6% is 3.4651. What lease liability does Calloway record at commencement?
choices:
- id: A
  text: $120,000
  rationale: Records only one payment.
- id: B
  text: $415,812
  rationale: Correct. $120,000 × 3.4651.
- id: C
  text: $440,761
  rationale: Discounts the payments as an annuity due, but the payments are made at the end of each year.
- id: D
  text: $480,000
  rationale: Uses the undiscounted payments and ignores the time value of money.
answer: B
explanation: 'For both operating and finance leases, the lessee measures the liability at the present
  value of the remaining lease payments: $120,000 × 3.4651 = $415,812. Because the payments are in arrears,
  the ordinary annuity factor applies.'
